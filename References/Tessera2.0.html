<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TESSERA · Vector Pattern Studio</title>
<style>
:root{
  --bg:#0a0a0b; --panel:#121214; --panel2:#1a1a1d; --panel3:#232327; --line:#2b2b31;
  --txt:#eaeaee; --dim:#8a8a94; --dim2:#5f5f68; --accent:#7c5cff; --accent2:#00d3a7;
  --thumb:#ffffff; --track:#2e2e33; --trackfill:#8b8b93; --rad:12px; --rad2:8px;
  --toolw:58px; --sidew:268px;
}
[data-theme="light"]{
  --bg:#ececed; --panel:#ffffff; --panel2:#f4f4f6; --panel3:#e8e8ec; --line:#dcdce2;
  --txt:#1a1a1e; --dim:#6c6c76; --dim2:#9a9aa4; --track:#dcdce2; --trackfill:#b9b9c2; --thumb:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
/* ---------- header ---------- */
header{height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.14em;font-size:12px}
.logo i{width:16px;height:16px;display:block;background:conic-gradient(from 0deg,var(--accent),var(--accent2),#ff3d7f,var(--accent));border-radius:5px}
.hbtn{padding:5px 10px;border-radius:8px;color:var(--dim);font-size:12px}
.hbtn:hover{background:var(--panel3);color:var(--txt)}
.hsep{width:1px;height:20px;background:var(--line)}
.badge{font-size:10px;letter-spacing:.08em;padding:3px 7px;border-radius:6px;background:var(--panel3);color:var(--dim)}
.badge.ok{color:#0a0a0b;background:var(--accent2);font-weight:700}
.grow{flex:1}
/* ---------- layout ---------- */
main{flex:1;display:flex;min-height:0}
#left{display:flex;min-width:320px;background:var(--panel);border-right:1px solid var(--line)}
#right{flex:1;position:relative;min-width:280px;background:#0e0e10;overflow:hidden}
#divider{width:5px;cursor:col-resize;background:var(--line);flex:0 0 auto}
#divider:hover{background:var(--accent)}
/* ---------- tool rail ---------- */
#rail{width:var(--toolw);flex:0 0 auto;background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;padding:8px 0;gap:4px;align-items:center}
#rail::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:8px;height:8px}
#rail::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:8px}
.tool{width:40px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--dim);position:relative}
.tool:hover{background:var(--panel3);color:var(--txt)}
.tool.on{background:var(--accent);color:#fff}
.tool svg{width:19px;height:19px;fill:currentColor}
.raillbl{font-size:9px;letter-spacing:.1em;color:var(--dim2);margin:8px 0 2px}
.shapegrid{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:0 5px}
.shapegrid .tool{width:100%;height:30px}
.shapegrid .tool svg{width:15px;height:15px}
/* ---------- editor ---------- */
#edwrap{flex:1;position:relative;min-width:120px;background:var(--panel)}
#editor{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.edbar{position:absolute;left:10px;top:10px;display:flex;gap:6px;align-items:center;background:rgba(18,18,20,.86);border:1px solid var(--line);border-radius:10px;padding:5px 8px;backdrop-filter:blur(8px);font-size:11px;color:var(--dim)}
[data-theme="light"] .edbar,[data-theme="light"] .vbar,[data-theme="light"] #gpanel{background:rgba(255,255,255,.9)}
.edbar button{padding:3px 7px;border-radius:6px}
.edbar button:hover{background:var(--panel3);color:var(--txt)}
.edbar button.on{background:var(--accent);color:#fff}
.hint{position:absolute;left:10px;bottom:10px;font-size:11px;color:var(--dim2);pointer-events:none}
/* ---------- side ---------- */
#side{width:var(--sidew);flex:0 0 auto;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-width:200px}
.phead{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:10px;letter-spacing:.13em;color:var(--dim);border-bottom:1px solid var(--line);background:var(--panel2)}
.phead .grow{flex:1}
.phead button{width:22px;height:20px;border-radius:5px;color:var(--dim);font-size:14px;line-height:1}
.phead button:hover{background:var(--panel3);color:var(--txt)}
#outliner{max-height:34%;min-height:100px;overflow:auto;padding:5px}
#props{flex:1;overflow:auto;padding:6px 8px 40px}
.scroll{overflow:auto}
.lrow{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px;margin-bottom:2px;cursor:pointer;border:1px solid transparent}
.lrow:hover{background:var(--panel2)}
.lrow.sel{background:color-mix(in srgb,var(--accent) 24%,transparent);border-color:var(--accent)}
.lrow .ico{width:18px;height:18px;flex:0 0 auto;color:var(--dim)}
.lrow.sel .ico{color:var(--txt)}
.lrow .ico svg{width:16px;height:16px;fill:currentColor}
.lrow .nm{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm input{width:100%;background:var(--panel3);border:1px solid var(--accent);border-radius:4px;padding:1px 3px}
.lrow .mini{width:20px;height:20px;border-radius:5px;color:var(--dim2);display:flex;align-items:center;justify-content:center}
.lrow .mini:hover{background:var(--panel3);color:var(--txt)}
.lrow .mini svg{width:13px;height:13px;fill:currentColor}
.lrow.drop{border-top:2px solid var(--accent)}
/* ---------- controls ---------- */
.group{background:var(--panel2);border-radius:var(--rad);padding:8px;margin-bottom:8px}
.gtitle{font-size:10px;letter-spacing:.12em;color:var(--dim);margin:2px 2px 8px;display:flex;align-items:center;gap:6px}
.gtitle .grow{flex:1}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;min-height:26px}
.row>label{width:74px;flex:0 0 auto;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{display:flex;align-items:center;background:var(--panel3);border-radius:9px;padding:3px 7px;min-width:70px;gap:3px;flex:0 0 auto}
.num input{width:44px;background:none;border:none;outline:none;font-size:13px;font-weight:600;text-align:left;padding:0}
.num .u{color:var(--dim2);font-size:11px}
.num.wide input{width:100%}
.trk{position:relative;flex:1;height:22px;min-width:52px;border-radius:7px;background:var(--track);overflow:hidden;cursor:ew-resize}
.trk .fl{position:absolute;left:0;top:0;bottom:0;background:var(--trackfill);border-radius:7px 0 0 7px}
.trk .th{position:absolute;top:3px;width:9px;height:16px;border-radius:4px;background:var(--thumb);transform:translateX(-50%);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.sel2{background:var(--panel3);border:none;border-radius:9px;padding:5px 8px;flex:1;outline:none;font-size:12px;cursor:pointer}
.tog{width:38px;height:22px;border-radius:11px;background:var(--panel3);position:relative;flex:0 0 auto;transition:background .16s}
.tog i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#8a8a94;transition:.16s}
.tog.on{background:color-mix(in srgb,var(--accent) 65%,transparent)}
.tog.on i{left:19px;background:var(--accent)}
.seg{display:flex;gap:4px;align-items:center;flex:1;justify-content:flex-end}
.seg button{min-width:26px;height:26px;border-radius:13px;color:var(--dim);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.seg button.dot{width:8px;height:8px;min-width:8px;border-radius:50%;background:var(--panel3)}
.seg button.on{background:#fff;color:#111;padding:0 10px}
.sw{width:36px;height:22px;border-radius:7px;border:1px solid var(--line);cursor:pointer;position:relative;overflow:hidden;flex:0 0 auto}
.sw i{position:absolute;inset:0;background-image:linear-gradient(45deg,#555 25%,transparent 25%),linear-gradient(-45deg,#555 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#555 75%),linear-gradient(-45deg,transparent 75%,#555 75%);background-size:8px 8px;background-position:0 0,0 4px,4px -4px,-4px 0}
.sw b{position:absolute;inset:0}
.btn{background:var(--panel3);border-radius:9px;padding:6px 10px;font-size:12px;color:var(--txt)}
.btn:hover{background:var(--line)}
.btn.acc{background:var(--accent);color:#fff}
.btn.full{width:100%;text-align:center;margin-top:6px}
.two{display:flex;gap:6px}
.two>*{flex:1}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:6px;border-radius:8px;font-size:11px;letter-spacing:.06em;color:var(--dim)}
.tabs button.on{background:var(--panel3);color:var(--txt)}
/* ---------- viewport ---------- */
#view{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#view.drag{cursor:grabbing}
.vbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:rgba(18,18,20,.88);border:1px solid var(--line);border-radius:12px;padding:6px 8px;backdrop-filter:blur(8px)}
.vbar button{padding:4px 8px;border-radius:7px;color:var(--dim);font-size:12px}
.vbar button:hover{background:var(--panel3);color:var(--txt)}
.vbar .zv{font-size:11px;color:var(--dim);min-width:44px;text-align:center}
#gpanel{position:absolute;right:12px;top:12px;bottom:12px;width:290px;background:rgba(18,18,20,.92);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
#gpanel.hid{transform:translateX(calc(100% + 20px))}
#gbody{flex:1;overflow:auto;padding:8px}
#gtoggle{position:absolute;right:12px;top:12px;z-index:5;background:rgba(18,18,20,.9);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11px;color:var(--dim)}
/* ---------- swatches / picker ---------- */
.swatches{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:2px}
.swatches .s{width:22px;height:22px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.swatches .s.add{background:var(--panel3);color:var(--dim);display:flex;align-items:center;justify-content:center;font-size:14px}
#picker{position:fixed;z-index:200;width:246px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.6);display:none}
#svbox{position:relative;height:132px;border-radius:10px;overflow:hidden;cursor:crosshair;margin-bottom:9px}
#svbox .l1,#svbox .l2{position:absolute;inset:0}
#svbox .l1{background:linear-gradient(to right,#fff,rgba(255,255,255,0))}
#svbox .l2{background:linear-gradient(to top,#000,rgba(0,0,0,0))}
#svdot{position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none}
.pbar{position:relative;height:22px;border-radius:8px;margin-bottom:8px;cursor:ew-resize;overflow:hidden}
.pbar .th{position:absolute;top:2px;width:8px;height:18px;border-radius:4px;background:#fff;border:1px solid rgba(0,0,0,.35);transform:translateX(-50%);pointer-events:none}
#hueBar{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#alphaBar i{position:absolute;inset:0;background-image:linear-gradient(45deg,#666 25%,transparent 25%),linear-gradient(-45deg,#666 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#666 75%),linear-gradient(-45deg,transparent 75%,#666 75%);background-size:8px 8px;background-position:0 0,0 4px,4px -4px,-4px 0}
#alphaBar b{position:absolute;inset:0}
#hexin{width:100%;background:var(--panel3);border:none;border-radius:8px;padding:6px 8px;outline:none;font-family:ui-monospace,monospace;letter-spacing:.06em}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;color:#fff;padding:9px 15px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:999;border:1px solid var(--line)}
#toast.on{opacity:1}
.kv{font-size:11px;color:var(--dim2);margin:4px 2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><i></i><span>TESSERA</span></div>
    <span class="badge" id="gpuBadge">…</span>
    <div class="hsep"></div>
    <button class="hbtn" id="btnUndo">Undo</button>
    <button class="hbtn" id="btnRedo">Redo</button>
    <div class="hsep"></div>
    <button class="hbtn" id="btnSave">Save</button>
    <button class="hbtn" id="btnLoad">Load</button>
    <button class="hbtn" id="btnJSON">Export JSON</button>
    <button class="hbtn" id="btnSVG">Export SVG</button>
    <div class="grow"></div>
    <button class="hbtn" id="btnPreset">Presets</button>
    <button class="hbtn" id="btnTheme">◑</button>
  </header>
  <main>
    <section id="left">
      <div id="rail"></div>
      <div id="edwrap">
        <canvas id="editor"></canvas>
        <div class="edbar">
          <button id="tgGhost" class="on">Tiling preview</button>
          <button id="tgGrid" class="on">Grid</button>
          <button id="tgSnap">Snap</button>
          <button id="edFit">Fit</button>
          <span id="edInfo"></span>
        </div>
        <div class="hint" id="edHint"></div>
      </div>
      <aside id="side">
        <div class="phead"><span>OUTLINER</span><div class="grow"></div>
          <button id="lyUp" title="Raise">↑</button><button id="lyDn" title="Lower">↓</button>
          <button id="lyDup" title="Duplicate">⧉</button><button id="lyDel" title="Delete">✕</button>
        </div>
        <div id="outliner" class="scroll"></div>
        <div class="phead"><span>PROPERTIES</span></div>
        <div id="props" class="scroll"></div>
      </aside>
    </section>
    <div id="divider"></div>
    <section id="right">
      <canvas id="view"></canvas>
      <button id="gtoggle">PATTERN ▸</button>
      <aside id="gpanel">
        <div class="tabs" id="gtabs">
          <button data-t="pattern" class="on">PATTERN</button>
          <button data-t="effects">EFFECTS</button>
          <button data-t="colors">COLORS</button>
          <button data-t="export">EXPORT</button>
        </div>
        <div id="gbody"></div>
      </aside>
      <div class="vbar">
        <button id="vzo">−</button><span class="zv" id="vzv">100%</span><button id="vzi">+</button>
        <button id="vfit">Fit</button><button id="vpng">PNG</button><button id="vtile">Tile</button>
      </div>
    </section>
  </main>
</div>
<div id="picker">
  <div class="swatches" id="pkSw" style="margin-bottom:9px"></div>
  <div id="svbox"><div class="l1"></div><div class="l2"></div><div id="svdot"></div></div>
  <div class="pbar" id="hueBar"><div class="th"></div></div>
  <div class="pbar" id="alphaBar"><i></i><b></b><div class="th"></div></div>
  <input id="hexin" spellcheck="false"/>
</div>
<div id="toast"></div>
<input type="file" id="fileImg" accept="image/*" style="display:none"/>
<input type="file" id="fileJSON" accept=".json" style="display:none"/>
<script>
"use strict";
/* ==========================================================================
   0. UTILITIES
   ========================================================================== */
const $=(s,p=document)=>p.querySelector(s), $$=(s,p=document)=>[...p.querySelectorAll(s)];
const TAU=Math.PI*2, D2R=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const uid=()=>Math.random().toString(36).slice(2,9);
const lerp=(a,b,t)=>a+(b-a)*t;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1900);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* colors: stored as #rrggbbaa */
function parseColor(h){h=(h||'#000000ff').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');if(h.length===6)h+='ff';
  return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16),a:parseInt(h.slice(6,8),16)/255};}
const h2=(n)=>clamp(Math.round(n),0,255).toString(16).padStart(2,'0');
function toHex(r,g,b,a=1){return '#'+h2(r)+h2(g)+h2(b)+h2(a*255);}
function cssColor(h){const c=parseColor(h);return `rgba(${c.r},${c.g},${c.b},${c.a})`;}
function colVec(h){const c=parseColor(h);return[c.r/255,c.g/255,c.b/255,c.a];}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
  return{h,s:mx?d/mx:0,v:mx};}
function hsv2rgb(h,s,v){h=((h%360)+360)%360;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
  return{r:(r+m)*255,g:(g+m)*255,b:(b+m)*255};}

/* affine matrices [a,b,c,d,e,f] : x'=a*x+c*y+e ; y'=b*x+d*y+f */
const M={
  id:()=>[1,0,0,1,0,0],
  mul:(m,n)=>[m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3],
              m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]],
  ap:(m,x,y)=>[m[0]*x+m[2]*y+m[4], m[1]*x+m[3]*y+m[5]],
  t:(x,y)=>[1,0,0,1,x,y],
  s:(x,y)=>[x,0,0,y===undefined?x:y,0,0],
  r:(a)=>[Math.cos(a),Math.sin(a),-Math.sin(a),Math.cos(a),0,0],
  inv:(m)=>{const d=m[0]*m[3]-m[1]*m[2]||1e-9;return[m[3]/d,-m[1]/d,-m[2]/d,m[0]/d,(m[2]*m[5]-m[3]*m[4])/d,(m[1]*m[4]-m[0]*m[5])/d];}
};

/* ==========================================================================
   1. GEOMETRY PRIMITIVES  (node = {x,y,ix,iy,ox,oy} absolute bezier handles)
   ========================================================================== */
const K=0.5523;
const cn=(x,y)=>({x,y,ix:x,iy:y,ox:x,oy:y});
function poly(pts,closed=true,r=0){
  if(r>0.01) return roundPoly(pts,r,closed);
  return {closed,n:pts.map(p=>cn(p[0],p[1]))};
}
function roundPoly(pts,r,closed=true){
  const n=pts.length,out=[];
  for(let i=0;i<n;i++){
    const p1=pts[i];
    if(!closed&&(i===0||i===n-1)){out.push(cn(p1[0],p1[1]));continue;}
    const p0=pts[(i-1+n)%n],p2=pts[(i+1)%n];
    let d1=[p0[0]-p1[0],p0[1]-p1[1]],d2=[p2[0]-p1[0],p2[1]-p1[1]];
    const l1=Math.hypot(d1[0],d1[1])||1,l2=Math.hypot(d2[0],d2[1])||1;
    const rr=Math.min(r,l1*0.5,l2*0.5);
    if(rr<0.02){out.push(cn(p1[0],p1[1]));continue;}
    const a=[p1[0]+d1[0]/l1*rr,p1[1]+d1[1]/l1*rr], b=[p1[0]+d2[0]/l2*rr,p1[1]+d2[1]/l2*rr];
    out.push({x:a[0],y:a[1],ix:a[0],iy:a[1],ox:a[0]+(p1[0]-a[0])*K,oy:a[1]+(p1[1]-a[1])*K});
    out.push({x:b[0],y:b[1],ix:b[0]+(p1[0]-b[0])*K,iy:b[1]+(p1[1]-b[1])*K,ox:b[0],oy:b[1]});
  }
  return {closed,n:out};
}
function smoothPts(pts,closed=true,t=1){
  const n=pts.length,out=[];
  for(let i=0;i<n;i++){
    const p=pts[i];
    const pv=pts[closed?(i-1+n)%n:Math.max(0,i-1)], nx=pts[closed?(i+1)%n:Math.min(n-1,i+1)];
    const dx=(nx[0]-pv[0])/6*t, dy=(nx[1]-pv[1])/6*t;
    out.push({x:p[0],y:p[1],ix:p[0]-dx,iy:p[1]-dy,ox:p[0]+dx,oy:p[1]+dy});
  }
  if(!closed&&out.length){const f=out[0],l=out[out.length-1];f.ix=f.x;f.iy=f.y;l.ox=l.x;l.oy=l.y;}
  return {closed,n:out};
}
function arcNodes(cx,cy,rx,ry,a0,a1){
  const span=a1-a0, segs=Math.max(1,Math.ceil(Math.abs(span)/(Math.PI/2))), da=span/segs, k=4/3*Math.tan(da/4);
  const out=[];
  for(let i=0;i<=segs;i++){
    const a=a0+da*i,x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry;
    const tx=-Math.sin(a)*rx*k, ty=Math.cos(a)*ry*k;
    out.push({x,y,ix:x-tx,iy:y-ty,ox:x+tx,oy:y+ty});
  }
  return out;
}
const circleSub=(cx,cy,rx,ry)=>({closed:true,n:arcNodes(cx,cy,rx,ry,0,TAU).slice(0,4)});
function polarSub(fn,samples,rx,ry,smooth=true,rot=0){
  const pts=[];
  for(let i=0;i<samples;i++){const a=i/samples*TAU+rot,r=fn(a);pts.push([Math.cos(a)*r*rx,Math.sin(a)*r*ry]);}
  return smooth?smoothPts(pts,true,1):poly(pts,true,0);
}
function subsToPath(subs){
  const p=new Path2D();
  for(const s of subs){const N=s.n;if(!N||N.length<2)continue;
    p.moveTo(N[0].x,N[0].y);
    for(let i=1;i<N.length;i++){const a=N[i-1],b=N[i];p.bezierCurveTo(a.ox,a.oy,b.ix,b.iy,b.x,b.y);}
    if(s.closed){const a=N[N.length-1],b=N[0];p.bezierCurveTo(a.ox,a.oy,b.ix,b.iy,b.x,b.y);p.closePath();}
  }
  return p;
}
function subsToD(subs,f=2){
  const r=v=>(+v).toFixed(f);let d='';
  for(const s of subs){const N=s.n;if(!N||N.length<2)continue;
    d+=`M${r(N[0].x)},${r(N[0].y)}`;
    for(let i=1;i<N.length;i++){const a=N[i-1],b=N[i];d+=`C${r(a.ox)},${r(a.oy)} ${r(b.ix)},${r(b.iy)} ${r(b.x)},${r(b.y)}`;}
    if(s.closed){const a=N[N.length-1],b=N[0];d+=`C${r(a.ox)},${r(a.oy)} ${r(b.ix)},${r(b.iy)} ${r(b.x)},${r(b.y)}Z`;}
  }
  return d;
}
function subsBounds(subs){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const add=(x,y)=>{if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y;};
  for(const s of subs){const N=s.n;const L=s.closed?N.length:N.length-1;
    for(let i=0;i<L;i++){const a=N[i],b=N[(i+1)%N.length];
      for(let t=0;t<=1.0001;t+=0.125){const mt=1-t;
        add(mt*mt*mt*a.x+3*mt*mt*t*a.ox+3*mt*t*t*b.ix+t*t*t*b.x,
            mt*mt*mt*a.y+3*mt*mt*t*a.oy+3*mt*t*t*b.iy+t*t*t*b.y);}}
    if(!N.length)continue; add(N[0].x,N[0].y);
  }
  if(x0>x1)return{x:0,y:0,w:0,h:0};
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}

function geom(L){
  const key=L.type+'|'+L.w.toFixed(2)+'|'+L.h.toFixed(2)+'|'+JSON.stringify(L.p)+'|'+(L._rev||0);
  if(L._ck===key)return L._sub;
  let sub;
  try{sub=SH[L.type].make(L.w,L.h,L.p,L)||[];}catch(e){sub=[];}
  L._ck=key;L._sub=sub;L._path=subsToPath(sub);L._bb=subsBounds(sub);
  return sub;
}
function pathOf(L){geom(L);return L._path;}
function boundsOf(L){
  if(L.type==='image'||L.type==='text')return{x:-L.w/2,y:-L.h/2,w:L.w,h:L.h};
  geom(L);const b=L._bb;
  if(!b.w&&!b.h)return{x:-L.w/2,y:-L.h/2,w:L.w,h:L.h};return b;
}
function shapeMatrix(L){
  let m=M.t(L.x,L.y);
  m=M.mul(m,M.r(L.rot*D2R));
  const k=Math.tan((L.skew||0)*D2R); m=M.mul(m,[1,0,k,1,0,0]);
  m=M.mul(m,M.s(L.sx||1,L.sy||1));
  return m;
}
function repeatMatrices(L){
  const r=L.rep;if(!r||!r.on||r.count<2)return[M.id()];
  const out=[];const n=clamp(Math.round(r.count),1,120);
  for(let i=0;i<n;i++){
    if(r.mode==='radial'){
      const a=(r.angle*i)*D2R,sc=Math.pow(r.scale,i);
      let m=M.mul(M.t(r.cx,r.cy),M.r(a));m=M.mul(m,M.s(sc,sc));m=M.mul(m,M.t(-r.cx,-r.cy));
      out.push(m);
    }else{
      const sc=Math.pow(r.scale,i);
      let m=M.t(r.dx*i,r.dy*i);m=M.mul(m,M.r(r.rot*i*D2R));m=M.mul(m,M.s(sc,sc));
      out.push(m);
    }
  }
  return out;
}

/* ==========================================================================
   5. PAINTING
   ========================================================================== */
function makeFill(ctx,L){
  const b=boundsOf(L);
  if(L.fill.type==='linear'){
    const a=L.fill.angle*D2R,cx=b.x+b.w/2,cy=b.y+b.h/2,r=Math.max(b.w,b.h)/2;
    const g=ctx.createLinearGradient(cx-Math.cos(a)*r,cy-Math.sin(a)*r,cx+Math.cos(a)*r,cy+Math.sin(a)*r);
    g.addColorStop(0,cssColor(L.fill.c1));g.addColorStop(1,cssColor(L.fill.c2));return g;
  }
  if(L.fill.type==='radial'){
    const cx=b.x+b.w/2,cy=b.y+b.h/2,r=Math.max(b.w,b.h)/2||1;
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,cssColor(L.fill.c1));g.addColorStop(1,cssColor(L.fill.c2));return g;
  }
  return cssColor(L.fill.c1);
}
function paintLayer(ctx,L){
  if(L.type==='image'){
    if(L._img&&L._img.complete)try{ctx.drawImage(L._img,-L.w/2,-L.h/2,L.w,L.h);}catch(e){}
    return;
  }
  if(L.type==='text'){
    ctx.font=`${L.p.weight} ${L.p.size}px ${L.p.font}, sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(L.fill.on){ctx.fillStyle=cssColor(L.fill.c1);ctx.fillText(L.p.txt,0,0);}
    if(L.stroke.on){ctx.lineWidth=L.stroke.w;ctx.strokeStyle=cssColor(L.stroke.c);ctx.strokeText(L.p.txt,0,0);}
    return;
  }
  const p=pathOf(L);
  if(L.fill.on){ctx.fillStyle=makeFill(ctx,L);ctx.fill(p,L.evenodd?'evenodd':'nonzero');}
  if(L.stroke.on&&L.stroke.w>0){
    ctx.lineWidth=L.stroke.w;ctx.strokeStyle=cssColor(L.stroke.c);
    ctx.lineCap=L.stroke.cap;ctx.lineJoin=L.stroke.join;
    ctx.setLineDash(L.stroke.dash>0?[L.stroke.dash,L.stroke.dash*0.9]:[]);
    ctx.stroke(p);ctx.setLineDash([]);
  }
}
function hitsRect(L,m,R){
  const b=boundsOf(L),pad=(L.stroke.on?L.stroke.w:0)+2;
  const cs=[[b.x-pad,b.y-pad],[b.x+b.w+pad,b.y-pad],[b.x+b.w+pad,b.y+b.h+pad],[b.x-pad,b.y+b.h+pad]].map(c=>M.ap(m,c[0],c[1]));
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const c of cs){x0=Math.min(x0,c[0]);y0=Math.min(y0,c[1]);x1=Math.max(x1,c[0]);y1=Math.max(y1,c[1]);}
  return !(x1<R.x||x0>R.x+R.w||y1<R.y||y0>R.y+R.h);
}
/* draws all layers with `root` as absolute base matrix */
function drawDesign(ctx,root,opt={}){
  const cull=opt.cull;
  for(const L of state.doc.layers){
    if(!L.visible)continue;
    const sm=shapeMatrix(L),reps=repeatMatrices(L);
    ctx.globalAlpha=(opt.alpha!==undefined?opt.alpha:1)*L.opacity;
    ctx.globalCompositeOperation=opt.forceNormal?'source-over':L.blend;
    for(const rm of reps){
      const m=M.mul(M.mul(root,rm),sm);
      if(cull&&!hitsRect(L,m,cull))continue;
      ctx.setTransform(m[0],m[1],m[2],m[3],m[4],m[5]);
      paintLayer(ctx,L);
    }
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

/* ==========================================================================
   6. LATTICE
   ========================================================================== */
function lattice(){
  const P=state.doc.pattern,g=GROUPS[P.group]||GROUPS.p1;
  const w=P.cellW;let e1,e2;
  if(g.lat==='hex'){e1=[w,0];e2=[w*0.5,w*Math.sqrt(3)/2];}
  else if(g.lat==='square'){e1=[w,0];e2=[0,w];}
  else{e1=[w,0];e2=[P.shear*w,P.cellH];}
  const corner=[P.offX,P.offY];
  const O=[corner[0]+(e1[0]+e2[0])/2,corner[1]+(e1[1]+e2[1])/2];
  const pts=[[0,0],e1,e2,[e1[0]+e2[0],e1[1]+e2[1]]].map(p=>[p[0]+corner[0],p[1]+corner[1]]);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  const ops=g.ops.map(o=>{
    let m=M.mul(M.t(O[0],O[1]),[o.m[0],o.m[1],o.m[2],o.m[3],0,0]);
    m=M.mul(m,M.t(-O[0],-O[1]));
    m=M.mul(M.t(o.t[0]*e1[0]+o.t[1]*e2[0],o.t[0]*e1[1]+o.t[1]*e2[1]),m);
    return m;
  });
  return {e1,e2,corner,O,ops,bbox:{x:x0,y:y0,w:x1-x0,h:y1-y0},lat:g.lat,poly:pts};
}
function contentExtent(){
  let r=1;
  for(const L of state.doc.layers){
    if(!L.visible)continue;
    const b=boundsOf(L),sm=shapeMatrix(L);
    for(const rm of repeatMatrices(L)){
      const m=M.mul(rm,sm);
      for(const c of [[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]]){
        const p=M.ap(m,c[0],c[1]);r=Math.max(r,Math.abs(p[0]),Math.abs(p[1]),
          Math.abs(p[0]-state.doc.pattern.cellW),Math.abs(p[1]-state.doc.pattern.cellH));
      }
    }
  }
  return r;
}

/* ---- cell texture ---- */
const cellCv=document.createElement('canvas');
const cellCtx=cellCv.getContext('2d',{willReadFrequently:false});
let cellInfo={scale:1,bbox:{x:0,y:0,w:1,h:1}};
function renderCell(){
  const L=lattice(),P=state.doc.pattern;
  const pad=18;
  const bb={x:L.bbox.x-pad,y:L.bbox.y-pad,w:L.bbox.w+pad*2,h:L.bbox.h+pad*2};
  const q=clamp(P.quality,0.4,3);
  let tw=Math.round(bb.w*q),th=Math.round(bb.h*q);
  const mx=2048,f=Math.min(1,mx/Math.max(tw,th));
  tw=th=0;
  const db=designBounds(L.ops);
  if(db){
    const lim=Math.max(L.bbox.w,L.bbox.h)*2.5;
    const nx0=Math.max(Math.min(bb.x,db.x-2),L.bbox.x-lim);
    const ny0=Math.max(Math.min(bb.y,db.y-2),L.bbox.y-lim);
    const nx1=Math.min(Math.max(bb.x+bb.w,db.x+db.w+2),L.bbox.x+L.bbox.w+lim);
    const ny1=Math.min(Math.max(bb.y+bb.h,db.y+db.h+2),L.bbox.y+L.bbox.h+lim);
    bb.x=nx0;bb.y=ny0;bb.w=Math.max(4,nx1-nx0);bb.h=Math.max(4,ny1-ny0);
  }
  let sc=Math.min(q,2048/Math.max(bb.w,bb.h));
  tw=Math.max(8,Math.round(bb.w*sc));th=Math.max(8,Math.round(bb.h*sc));
  sc=tw/bb.w;
  cellCv.width=tw;cellCv.height=th;
  const c=cellCtx;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,tw,th);
  const base=M.mul(M.s(sc,sc),M.t(-bb.x,-bb.y));
  for(const op of L.ops)drawDesign(c,M.mul(base,op),{});
  c.setTransform(1,0,0,1,0,0);
  cellInfo={scale:sc,bbox:bb,tw,th,e1:L.e1,e2:L.e2,lat:L};
  texDirty=true;
  return cellInfo;
}
function designBounds(ops){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,any=false;
  for(const L of state.doc.layers){
    if(!L.visible)continue;
    const b=boundsOf(L),sm=shapeMatrix(L),pd=(L.stroke.on?L.stroke.w:0)+1;
    const cs=[[b.x-pd,b.y-pd],[b.x+b.w+pd,b.y-pd],[b.x+b.w+pd,b.y+b.h+pd],[b.x-pd,b.y+b.h+pd]];
    for(const rm of repeatMatrices(L))for(const op of ops){
      const m=M.mul(M.mul(op,rm),sm);
      for(const q of cs){const p=M.ap(m,q[0],q[1]);any=true;
        if(p[0]<x0)x0=p[0];if(p[1]<y0)y0=p[1];if(p[0]>x1)x1=p[0];if(p[1]>y1)y1=p[1];}
    }
  }
  return any?{x:x0,y:y0,w:x1-x0,h:y1-y0}:null;
}
function tileRange(rect,bb,e1,e2){
  const det=e1[0]*e2[1]-e1[1]*e2[0]||1e-9;
  const inv=(x,y)=>[(x*e2[1]-y*e2[0])/det,(y*e1[0]-x*e1[1])/det];
  let i0=1e9,i1=-1e9,j0=1e9,j1=-1e9;
  for(const q of [[rect.x,rect.y],[rect.x+rect.w,rect.y],[rect.x+rect.w,rect.y+rect.h],[rect.x,rect.y+rect.h]]){
    const uv=inv(q[0]-bb.x,q[1]-bb.y);
    i0=Math.min(i0,uv[0]);i1=Math.max(i1,uv[0]);j0=Math.min(j0,uv[1]);j1=Math.max(j1,uv[1]);
  }
  const a=inv(bb.w,0),b2=inv(0,bb.h);
  const mx=Math.ceil(Math.max(Math.abs(a[0]),Math.abs(b2[0])))+1;
  const my=Math.ceil(Math.max(Math.abs(a[1]),Math.abs(b2[1])))+1;
  return [Math.floor(i0)-mx,Math.ceil(i1)+1,Math.floor(j0)-my,Math.ceil(j1)+1,mx,my];
}

/* ==========================================================================
   7. WEBGPU RENDERER
   ========================================================================== */
const WGSL=`
struct U{res:vec4f,e:vec4f,bb:vec4f,view:vec4f,nbr:vec4f,bg:vec4f,adj:vec4f,f1:vec4f,f2:vec4f,f3:vec4f,
gA:vec4f,gB:vec4f,gC:vec4f,nz:vec4f,ht:vec4f,duo:vec4f,dA:vec4f,dB:vec4f,fl:vec4f};
@group(0) @binding(0) var<uniform> u:U;
@group(0) @binding(1) var samp:sampler;
@group(0) @binding(2) var tex:texture_2d<f32>;
@vertex fn vs(@builtin(vertex_index) i:u32)->@builtin(position) vec4f{
  var p=array<vec2f,3>(vec2f(-1.0,-3.0),vec2f(-1.0,1.0),vec2f(3.0,1.0));
  return vec4f(p[i],0.0,1.0);
}
fn lum(c:vec3f)->f32{return dot(c,vec3f(0.2126,0.7152,0.0722));}
fn hash(p:vec2f)->f32{return fract(sin(dot(p,vec2f(127.1,311.7)))*43758.5453);}
fn vnoise(p:vec2f)->f32{let i=floor(p);let f=fract(p);let w=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2f(1.0,0.0)),w.x),mix(hash(i+vec2f(0.0,1.0)),hash(i+vec2f(1.0,1.0)),w.x),w.y);}
fn fbm(p:vec2f)->f32{var s=0.0;var a=0.5;var q=p;
  for(var k=0;k<5;k=k+1){s=s+a*vnoise(q);q=q*2.03;a=a*0.5;}return s;}
fn bl1(b:f32,s:f32,m:i32)->f32{

  if(m==2){return b+s-b*s;}
  if(m==3){if(b<0.5){return 2.0*b*s;}return 1.0-2.0*(1.0-b)*(1.0-s);}

  if(m==7){if(s<=0.0){return 0.0;}return 1.0-min(1.0,(1.0-b)/s);}
  if(m==8){if(s<0.5){return b-(1.0-2.0*s)*b*(1.0-b);}
    var d=0.0; if(b<0.25){d=((16.0*b-12.0)*b+4.0)*b;}else{d=sqrt(b);}
    return b+(2.0*s-1.0)*(d-b);}

  if(m==10){return abs(b-s);}
  if(m==11){return b+s-2.0*b*s;}
  return s;}
@fragment fn fs(@builtin(position) fc:vec4f)->@location(0) vec4f{
  let res=u.res.xy;
  let z=max(0.0001,u.view.x);
  let ca=cos(u.view.w); let sa=sin(u.view.w);
  let d=(fc.xy-res*0.5)/z;
  let wp=vec2f(d.x*ca+d.y*sa,-d.x*sa+d.y*ca)+vec2f(u.view.y,u.view.z);
  let e1=u.e.xy; let e2=u.e.zw;

  for(var j=-ny;j<=ny;j=j+1){
    for(var i=-nx;i<=nx;i=i+1){
      let p=wp-(f32(i)*e1+f32(j)*e2);
      let uv=(p-u.bb.xy)/u.bb.zw;
      if(uv.x>=0.0 && uv.x<=1.0 && uv.y>=0.0 && uv.y<=1.0){
        let s=textureSampleLevel(tex,samp,uv,0.0);
        col=s+col*(1.0-s.a);
      }
    }
  }
  var c=col.rgb+u.bg.rgb*(1.0-col.a);

    c=(c-0.5)*u.adj.y+0.5+u.adj.x;
    let l=lum(c); c=mix(vec3f(l),c,u.adj.z);
    if(abs(u.adj.w)>0.001){
      let cs=cos(u.adj.w); let sn=sin(u.adj.w);
      let m0=vec3f(0.213+cs*0.787-sn*0.213,0.715-cs*0.715-sn*0.715,0.072-cs*0.072+sn*0.928);
      let m1=vec3f(0.213-cs*0.213+sn*0.143,0.715+cs*0.285+sn*0.140,0.072-cs*0.072-sn*0.283);
      let m2=vec3f(0.213-cs*0.213-sn*0.787,0.715-cs*0.715+sn*0.715,0.072+cs*0.928+sn*0.072);
      c=vec3f(dot(c,m0),dot(c,m1),dot(c,m2));

    var n=fbm(fc.xy/max(1.0,u.nz.x));

    c=clamp(c+(n-0.5)*u.nz.y*2.0,vec3f(0.0),vec3f(1.0));

  if(u.fl.y>0.5){c=mix(c,vec3f(lum(c)),u.f1.x);}
  if(u.ht.w>0.5){
    let cc=cos(u.ht.y); let ss=sin(u.ht.y);
    let q=vec2f(fc.x*cc+fc.y*ss,-fc.x*ss+fc.y*cc)/max(2.0,u.ht.x);
    let cell=fract(q)-0.5;
    let l=clamp(lum(c),0.0,1.0);

    c=mix(c,hc,u.ht.z);
  }
  if(u.duo.y>0.5){let l=clamp(lum(c),0.0,1.0);c=mix(c,mix(u.dA.rgb,u.dB.rgb,l),u.duo.x);}
  if(u.f3.w>1.5){let n=u.f3.w;c=floor(c*n)/max(1.0,n-1.0);}
  if(u.fl.z>0.5){
    let p2=(fc.xy/res-0.5)*vec2f(res.x/res.y,1.0)*2.0;
    let d2=length(p2)/max(0.05,u.f1.z*2.0);
    c=c*(1.0-smoothstep(1.0-u.f1.w,1.0+u.f1.w,d2)*u.f1.y);
  }
  return vec4f(clamp(c,vec3f(0.0),vec3f(1.0)),1.0);
}`;
let GPU={ok:false},texDirty=true;
async function initGPU(){
  if(!navigator.gpu)return false;
  try{
    const adapter=await navigator.gpu.requestAdapter();if(!adapter)return false;
    const device=await adapter.requestDevice();
    const ctx=$('#view').getContext('webgpu');if(!ctx)return false;
    const format=navigator.gpu.getPreferredCanvasFormat();
    ctx.configure({device,format,alphaMode:'opaque'});
    const mod=device.createShaderModule({code:WGSL});
    const pipeline=device.createRenderPipeline({layout:'auto',
      vertex:{module:mod,entryPoint:'vs'},
      fragment:{module:mod,entryPoint:'fs',targets:[{format}]},
      primitive:{topology:'triangle-list'}});
    const ubuf=device.createBuffer({size:19*16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
    const sampler=device.createSampler({magFilter:'linear',minFilter:'linear',addressModeU:'clamp-to-edge',addressModeV:'clamp-to-edge'});
    GPU={ok:true,device,ctx,pipeline,ubuf,sampler,tex:null,bind:null,u:new Float32Array(19*4),tw:0,th:0};
    device.lost.then(()=>{GPU.ok=false;});
    return true;
  }catch(e){console.warn(e);return false;}
}
function gpuTex(){
  const d=GPU.device;
  if(!GPU.tex||GPU.tw!==cellCv.width||GPU.th!==cellCv.height){
    if(GPU.tex)GPU.tex.destroy();
    GPU.tex=d.createTexture({size:[cellCv.width,cellCv.height],format:'rgba8unorm',
      usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST|GPUTextureUsage.RENDER_ATTACHMENT});
    GPU.tw=cellCv.width;GPU.th=cellCv.height;
    GPU.bind=d.createBindGroup({layout:GPU.pipeline.getBindGroupLayout(0),
      entries:[{binding:0,resource:{buffer:GPU.ubuf}},{binding:1,resource:GPU.sampler},{binding:2,resource:GPU.tex.createView()}]});
    texDirty=true;
  }
  if(texDirty){
    d.queue.copyExternalImageToTexture({source:cellCv},{texture:GPU.tex,premultipliedAlpha:true},[cellCv.width,cellCv.height]);
    texDirty=false;
  }
}
function fxUniforms(u,o,W,H){
  const F=state.doc.fx,P=state.doc.pattern;
  const set=(i,a,b,c,d)=>{u[i*4]=a;u[i*4+1]=b;u[i*4+2]=c;u[i*4+3]=d;};
  const ci=cellInfo;
  set(0,W,H,1/W,1/H);
  set(1,ci.e1[0],ci.e1[1],ci.e2[0],ci.e2[1]);
  set(2,ci.bbox.x,ci.bbox.y,ci.bbox.w,ci.bbox.h);
  set(3,P.zoom,P.panX,P.panY,P.rot*D2R);
  set(4,o.nx,o.ny,0,0);
  const bg=colVec(P.bg);set(5,bg[0],bg[1],bg[2],1);
  set(6,F.bright,F.contrast,F.sat,F.hue*D2R);
  set(7,F.bw,F.vigAmt,F.vigRad,F.vigSoft);
  set(8,F.gradType,F.gradAngle*D2R,F.gradAmt,F.gradMode);
  set(9,F.gradUseC,F.gradScale,F.gradOff,F.poster);
  const a=colVec(F.gradA),b=colVec(F.gradB),c=colVec(F.gradC);
  set(10,a[0],a[1],a[2],a[3]);set(11,b[0],b[1],b[2],b[3]);set(12,c[0],c[1],c[2],c[3]);
  set(13,F.noiseOn?F.noiseScale:0,F.noiseAmt,F.noiseType,0);
  set(14,F.htSize,F.htAngle*D2R,F.htAmt,F.htOn?1:0);
  set(15,F.duoAmt,F.duoOn?1:0,0,0);
  const da=colVec(F.duoA),dbb=colVec(F.duoB);
  set(16,da[0],da[1],da[2],1);set(17,dbb[0],dbb[1],dbb[2],1);
  set(18,F.adjOn?1:0,F.bwOn?1:0,F.vigOn?1:0,F.gradOn?1:0);

function renderGPU(){
  const cv=$('#view'),dpr=Math.min(devicePixelRatio||1,2);
  const W=Math.max(1,Math.round(cv.clientWidth*dpr)),H=Math.max(1,Math.round(cv.clientHeight*dpr));
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  gpuTex();
  const P=state.doc.pattern,ci=cellInfo;
  const world={x:P.panX-cv.clientWidth/P.zoom,y:P.panY-cv.clientHeight/P.zoom,
               w:cv.clientWidth*2/P.zoom,h:cv.clientHeight*2/P.zoom};
  const tr=tileRange(world,ci.bbox,ci.e1,ci.e2);
  const nx=clamp(Math.ceil((tr[1]-tr[0])/2)+1,1,40),ny=clamp(Math.ceil((tr[3]-tr[2])/2)+1,1,40);
  fxUniforms(GPU.u,{nx,ny},W,H);
  GPU.device.queue.writeBuffer(GPU.ubuf,0,GPU.u);
  const enc=GPU.device.createCommandEncoder();
  const pass=enc.beginRenderPass({colorAttachments:[{view:GPU.ctx.getCurrentTexture().createView(),
    clearValue:{r:0,g:0,b:0,a:1},loadOp:'clear',storeOp:'store'}]});
  pass.setPipeline(GPU.pipeline);pass.setBindGroup(0,GPU.bind);pass.draw(3);pass.end();
  GPU.device.queue.submit([enc.finish()]);
}

/* ==========================================================================
   8. CANVAS2D RENDERER (fallback + export)
   ========================================================================== */
const BLENDS=['source-over','multiply','screen','overlay','darken','lighten','color-dodge','color-burn','soft-light','hard-light','difference','exclusion'];
const BLEND_LABELS=['Normal','Multiply','Screen','Overlay','Darken','Lighten','Color Dodge','Color Burn','Soft Light','Hard Light','Difference','Exclusion'];
let noiseTile=null;
function getNoiseTile(){
  if(noiseTile)return noiseTile;
  const c=document.createElement('canvas');c.width=c.height=180;
  const x=c.getContext('2d'),d=x.createImageData(180,180);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  x.putImageData(d,0,0);noiseTile=c;return c;
}
function paintPattern2D(ctx,W,H,view){
  const P=state.doc.pattern,ci=cellInfo;
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=cssColor(P.bg);ctx.fillRect(0,0,W,H);
  ctx.translate(W/2,H/2);ctx.rotate(view.rot*D2R);ctx.scale(view.zoom,view.zoom);ctx.translate(-view.panX,-view.panY);
  const inv=M.inv(M.mul(M.mul(M.t(W/2,H/2),M.mul(M.r(view.rot*D2R),M.s(view.zoom,view.zoom))),M.t(-view.panX,-view.panY)));
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const q of [[0,0],[W,0],[W,H],[0,H]]){const p=M.ap(inv,q[0],q[1]);
    x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  const rect={x:x0,y:y0,w:x1-x0,h:y1-y0};
  const tr=tileRange(rect,ci.bbox,ci.e1,ci.e2);
  let n=0;
  for(let j=tr[2];j<=tr[3];j++)for(let i=tr[0];i<=tr[1];i++){
    if(++n>9000)break;
    const tx=ci.bbox.x+i*ci.e1[0]+j*ci.e2[0], ty=ci.bbox.y+i*ci.e1[1]+j*ci.e2[1];
    ctx.drawImage(cellCv,tx,ty,ci.bbox.w,ci.bbox.h);
  }
  ctx.restore();
}
function halftone2D(ctx,W,H){
  const F=state.doc.fx,s=Math.max(3,F.htSize);
  const sw=Math.max(1,Math.ceil(W/s)),sh=Math.max(1,Math.ceil(H/s));
  const t=document.createElement('canvas');t.width=sw;t.height=sh;
  const tc=t.getContext('2d');tc.drawImage(ctx.canvas,0,0,sw,sh);
  const d=tc.getImageData(0,0,sw,sh).data;
  const o=document.createElement('canvas');o.width=W;o.height=H;
  const oc=o.getContext('2d');oc.fillStyle='#fff';oc.fillRect(0,0,W,H);
  oc.save();oc.translate(W/2,H/2);oc.rotate(F.htAngle*D2R);oc.translate(-W/2,-H/2);
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){
    const i=(y*sw+x)*4,l=(d[i]*0.2126+d[i+1]*0.7152+d[i+2]*0.0722)/255;
    const r=Math.sqrt(1-clamp(l,0,1))*s*0.62;
    if(r<0.3)continue;
    oc.fillStyle=`rgb(${d[i]*0.85|0},${d[i+1]*0.85|0},${d[i+2]*0.85|0})`;
    oc.beginPath();oc.arc(x*s+s/2,y*s+s/2,r,0,TAU);oc.fill();
  }
  oc.restore();
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=F.htAmt;ctx.drawImage(o,0,0);ctx.restore();
}
function duotone2D(ctx,W,H){
  const F=state.doc.fx,a=parseColor(F.duoA),b=parseColor(F.duoB),amt=F.duoAmt;
  const img=ctx.getImageData(0,0,W,H),d=img.data;
  for(let i=0;i<d.length;i+=4){
    const l=(d[i]*0.2126+d[i+1]*0.7152+d[i+2]*0.0722)/255;
    d[i]=lerp(d[i],lerp(a.r,b.r,l),amt);
    d[i+1]=lerp(d[i+1],lerp(a.g,b.g,l),amt);
    d[i+2]=lerp(d[i+2],lerp(a.b,b.b,l),amt);
  }
  ctx.putImageData(img,0,0);
}
function render2DTo(ctx,W,H,view){
  const F=state.doc.fx;
  const buf=document.createElement('canvas');buf.width=W;buf.height=H;
  paintPattern2D(buf.getContext('2d'),W,H,view);
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  let flt=[];
  if(F.adjOn){flt.push(`brightness(${1+F.bright})`,`contrast(${F.contrast})`,`saturate(${F.sat})`,`hue-rotate(${F.hue}deg)`);}
  if(F.bwOn)flt.push(`grayscale(${F.bw})`);
  ctx.filter=flt.length?flt.join(' '):'none';
  ctx.drawImage(buf,0,0);ctx.filter='none';
  if(F.gradOn&&F.gradAmt>0.001){
    const a=F.gradAngle*D2R,r=Math.max(W,H)*0.75*F.gradScale;
    let g;
    if(F.gradType===1)g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,r);
    else g=ctx.createLinearGradient(W/2-Math.cos(a)*r,H/2-Math.sin(a)*r,W/2+Math.cos(a)*r,H/2+Math.sin(a)*r);
    g.addColorStop(0,cssColor(F.gradA));
    if(F.gradUseC)g.addColorStop(0.5,cssColor(F.gradB));
    g.addColorStop(1,cssColor(F.gradUseC?F.gradC:F.gradB));
    ctx.save();ctx.globalAlpha=F.gradAmt;ctx.globalCompositeOperation=BLENDS[F.gradMode]||'source-over';
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
  }
  if(F.noiseOn&&F.noiseAmt>0.001){
    ctx.save();ctx.globalAlpha=clamp(F.noiseAmt,0,1);ctx.globalCompositeOperation='overlay';
    const p=ctx.createPattern(getNoiseTile(),'repeat');ctx.fillStyle=p;ctx.fillRect(0,0,W,H);ctx.restore();
  }
  if(F.htOn)halftone2D(ctx,W,H);
  if(F.duoOn)duotone2D(ctx,W,H);
  if(F.vigOn){
    const r=Math.max(W,H)*F.vigRad;
    const g=ctx.createRadialGradient(W/2,H/2,r*(1-F.vigSoft),W/2,H/2,r*1.35);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${F.vigAmt})`);
    ctx.save();ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
  }
}
function render2D(){
  const cv=$('#view'),dpr=Math.min(devicePixelRatio||1,2);
  const W=Math.max(1,Math.round(cv.clientWidth*dpr)),H=Math.max(1,Math.round(cv.clientHeight*dpr));
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  const P=state.doc.pattern;
  render2DTo(cv.getContext('2d'),W,H,{zoom:P.zoom*dpr,panX:P.panX,panY:P.panY,rot:P.rot});
}

const ovl=document.createElement('canvas');
ovl.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
$('#right').insertBefore(ovl,$('#gtoggle'));
let showTileGuides=false;
function drawOverlay(){
  const dpr=Math.min(devicePixelRatio||1,2);
  const W=Math.max(1,Math.round(ovl.clientWidth*dpr)),H=Math.max(1,Math.round(ovl.clientHeight*dpr));
  if(ovl.width!==W||ovl.height!==H){ovl.width=W;ovl.height=H;}
  const c=ovl.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);
  if(!showTileGuides)return;
  const P=state.doc.pattern,L=lattice();
  c.save();c.translate(W/2,H/2);c.rotate(P.rot*D2R);c.scale(P.zoom*dpr,P.zoom*dpr);c.translate(-P.panX,-P.panY);
  c.strokeStyle='rgba(124,92,255,.85)';c.lineWidth=1.5/(P.zoom*dpr);
  for(let j=-3;j<=3;j++)for(let i=-3;i<=3;i++){
    const ox=i*L.e1[0]+j*L.e2[0],oy=i*L.e1[1]+j*L.e2[1];
    c.beginPath();
    c.moveTo(L.corner[0]+ox,L.corner[1]+oy);
    c.lineTo(L.corner[0]+L.e1[0]+ox,L.corner[1]+L.e1[1]+oy);
    c.lineTo(L.corner[0]+L.e1[0]+L.e2[0]+ox,L.corner[1]+L.e1[1]+L.e2[1]+oy);
    c.lineTo(L.corner[0]+L.e2[0]+ox,L.corner[1]+L.e2[1]+oy);

   10. RENDER SCHEDULER
   ========================================================================== */
let needCell=true,needView=true,needEd=true,raf=0;
function invalidate(cell){if(cell!==false)needCell=true;needView=true;needEd=true;schedule();}
function invalidateView(){needView=true;schedule();}
function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;frame();});}
function frame(){
  if(needCell){renderCell();needCell=false;}
  if(needView){
    try{ if(GPU.ok)renderGPU(); else render2D(); }catch(e){ GPU.ok=false; }
    drawOverlay();needView=false;
  }
  if(needEd){drawEditor();needEd=false;}
}

const edCv=$('#editor'),edCtx=edCv.getContext('2d');
const hitCv=document.createElement('canvas'),hitCtx=hitCv.getContext('2d');
function edSize(){const dpr=Math.min(devicePixelRatio||1,2);
  const W=Math.max(1,Math.round(edCv.clientWidth*dpr)),H=Math.max(1,Math.round(edCv.clientHeight*dpr));
  if(edCv.width!==W||edCv.height!==H){edCv.width=W;edCv.height=H;}return{W,H,dpr};}
function edMatrix(dpr){
  const W=edCv.width,H=edCv.height,z=state.ed.zoom*dpr;
  return M.mul(M.mul(M.t(W/2,H/2),M.s(z,z)),M.t(-state.ed.x,-state.ed.y));
}
function edToWorld(e){
  const r=edCv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);

}
function snapV(v){return state.snap?Math.round(v/state.snapStep)*state.snapStep:v;}
function drawEditor(){
  const {W,H,dpr}=edSize(),c=edCtx,P=state.doc.pattern;
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle=getComputedStyle(document.body).getPropertyValue('--panel')||'#121214';
  c.fillRect(0,0,W,H);
  const m=edMatrix(dpr),z=state.ed.zoom*dpr;
  const L=lattice();
  if(state.showGrid){
    c.save();c.setTransform(m[0],m[1],m[2],m[3],m[4],m[5]);
    c.lineWidth=1/z;c.strokeStyle='rgba(128,128,140,.18)';
    const step=Math.max(10,P.cellW/8);
    const ext=Math.max(P.cellW,P.cellH)*2.2;
    c.beginPath();
    for(let x=-ext;x<=ext;x+=step){c.moveTo(x,-ext);c.lineTo(x,ext);}
    for(let y=-ext;y<=ext;y+=step){c.moveTo(-ext,y);c.lineTo(ext,y);}
    c.stroke();c.restore();
  }
  if(state.showGhost){
    for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)for(let k=0;k<L.ops.length;k++){
      if(i===0&&j===0&&k===0)continue;
      const t=M.t(i*L.e1[0]+j*L.e2[0],i*L.e1[1]+j*L.e2[1]);
      drawDesign(c,M.mul(m,M.mul(t,L.ops[k])),{alpha:0.28,forceNormal:true});
    }
  }
  drawDesign(c,m,{});
  c.setTransform(1,0,0,1,0,0);
  /* cell outline */
  c.save();c.setTransform(m[0],m[1],m[2],m[3],m[4],m[5]);
  c.lineWidth=1.6/z;c.strokeStyle='rgba(124,92,255,.9)';c.setLineDash([6/z,4/z]);
  c.beginPath();c.moveTo(L.poly[0][0],L.poly[0][1]);c.lineTo(L.poly[1][0],L.poly[1][1]);
  c.lineTo(L.poly[3][0],L.poly[3][1]);c.lineTo(L.poly[2][0],L.poly[2][1]);c.closePath();c.stroke();
  c.setLineDash([]);c.restore();

  c.setTransform(1,0,0,1,0,0);
  for(const id of state.sel){
    const Ly=layer(id);if(!Ly)continue;
    const sm=M.mul(m,shapeMatrix(Ly)),b=boundsOf(Ly);
    const cs=[[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]].map(q=>M.ap(sm,q[0],q[1]));
    c.strokeStyle='#7c5cff';c.lineWidth=1.4;
    c.beginPath();c.moveTo(cs[0][0],cs[0][1]);for(let i=1;i<4;i++)c.lineTo(cs[i][0],cs[i][1]);c.closePath();c.stroke();
    if(state.sel.length===1&&state.tool==='select'){
      const hs=handlePts(Ly,m);
      c.fillStyle='#fff';c.strokeStyle='#7c5cff';
      for(const h of hs){c.beginPath();c.rect(h[0]-4,h[1]-4,8,8);c.fill();c.stroke();}
      const rp=rotHandle(Ly,m);
      c.beginPath();c.moveTo((cs[0][0]+cs[1][0])/2,(cs[0][1]+cs[1][1])/2);c.lineTo(rp[0],rp[1]);c.stroke();
      c.beginPath();c.arc(rp[0],rp[1],5,0,TAU);c.fill();c.stroke();
    }
    if(state.tool==='node'&&Ly.type==='path')drawNodes(c,Ly,m);
  }
  if(state.pen)drawPen(c,m);
  if(state.marquee){const r=state.marquee;c.strokeStyle='#7c5cff';c.setLineDash([4,3]);
    c.strokeRect(r.x,r.y,r.w,r.h);c.setLineDash([]);
    c.fillStyle='rgba(124,92,255,.12)';c.fillRect(r.x,r.y,r.w,r.h);}
  $('#edInfo').textContent=`${Math.round(state.ed.zoom*100)}% · ${state.doc.layers.length} shapes`;
  $('#edHint').textContent=state.tool==='pen'?'Pen: click to add · drag for curve · click first point or Enter to close · Esc cancel'
    :state.tool==='node'?'Node: drag points & handles · Alt+click point to delete · dbl-click segment to add'
    :'Drag to move · handles to scale/rotate · Space+drag pan · scroll zoom';
}
function handlePts(L,m){
  const b=boundsOf(L),sm=M.mul(m,shapeMatrix(L));
  const p=[[b.x,b.y],[b.x+b.w/2,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h/2],
           [b.x+b.w,b.y+b.h],[b.x+b.w/2,b.y+b.h],[b.x,b.y+b.h],[b.x,b.y+b.h/2]];
  return p.map(q=>M.ap(sm,q[0],q[1]));

function rotHandle(L,m){
  const b=boundsOf(L),sm=M.mul(m,shapeMatrix(L));
  const a=M.ap(sm,b.x+b.w/2,b.y),cen=M.ap(sm,b.x+b.w/2,b.y+b.h/2);
  const dx=a[0]-cen[0],dy=a[1]-cen[1],l=Math.hypot(dx,dy)||1;
  return [a[0]+dx/l*28,a[1]+dy/l*28];

function drawNodes(c,L,m){
  const sm=M.mul(m,shapeMatrix(L));

    for(const n of s.n){
      const P0=M.ap(sm,n.x,n.y),Pi=M.ap(sm,n.ix,n.iy),Po=M.ap(sm,n.ox,n.oy);
      c.strokeStyle='rgba(124,92,255,.6)';
      c.beginPath();c.moveTo(Pi[0],Pi[1]);c.lineTo(P0[0],P0[1]);c.lineTo(Po[0],Po[1]);c.stroke();
      c.fillStyle='#00d3a7';
      for(const H of [Pi,Po]){c.beginPath();c.arc(H[0],H[1],3.2,0,TAU);c.fill();}
      const sel=state.nodeSel&&state.nodeSel.n===n;
      c.fillStyle=sel?'#7c5cff':'#fff';c.strokeStyle='#7c5cff';
      c.beginPath();c.rect(P0[0]-4,P0[1]-4,8,8);c.fill();c.stroke();
    }
  }
}
function drawPen(c,m){
  const p=state.pen;if(!p.pts.length)return;
  const sub={closed:false,n:p.pts};
  c.save();c.setTransform(m[0],m[1],m[2],m[3],m[4],m[5]);
  c.lineWidth=2/(state.ed.zoom*Math.min(devicePixelRatio||1,2));
  c.strokeStyle='#7c5cff';c.stroke(subsToPath([sub]));c.restore();
  for(const n of p.pts){const q=M.ap(m,n.x,n.y);
    c.fillStyle='#fff';c.strokeStyle='#7c5cff';c.beginPath();c.rect(q[0]-3.5,q[1]-3.5,7,7);c.fill();c.stroke();}

function layer(id){return state.doc.layers.find(l=>l.id===id);}
function selLayer(){return state.sel.length?layer(state.sel[state.sel.length-1]):null;}
function hitTest(wx,wy){
  const ls=state.doc.layers;
  for(let i=ls.length-1;i>=0;i--){
    const L=ls[i];if(!L.visible||L.locked)continue;
    const sm=shapeMatrix(L);
    for(const rm of repeatMatrices(L)){
      const inv=M.inv(M.mul(rm,sm)),p=M.ap(inv,wx,wy);
      if(L.type==='image'||L.type==='text'){
        if(Math.abs(p[0])<=L.w/2&&Math.abs(p[1])<=L.h/2)return L;
        continue;
      }
      const path=pathOf(L);
      hitCtx.setTransform(1,0,0,1,0,0);
      if(L.fill.on&&hitCtx.isPointInPath(path,p[0],p[1],L.evenodd?'evenodd':'nonzero'))return L;
      if(L.stroke.on){hitCtx.lineWidth=Math.max(6,L.stroke.w);if(hitCtx.isPointInStroke(path,p[0],p[1]))return L;}
      const b=boundsOf(L);
      if(!L.fill.on&&!L.stroke.on&&p[0]>=b.x&&p[0]<=b.x+b.w&&p[1]>=b.y&&p[1]<=b.y+b.h)return L;
    }

}
/* --- editor pointer --- */

function buildOutliner(){
  const o=$('#outliner');o.innerHTML='';
  const ls=state.doc.layers;
  for(let i=ls.length-1;i>=0;i--){
    const L=ls[i],r=el('div','lrow'+(state.sel.includes(L.id)?' sel':''));
    r.draggable=true;r.dataset.id=L.id;
    const ic=el('div','ico');ic.innerHTML=SH[L.type]?shapeIcon(L.type==='path'||L.type==='text'||L.type==='image'?'rect':L.type):'';
    if(L.type==='path')ic.innerHTML=ICONS.pen;if(L.type==='text')ic.innerHTML=ICONS.text;if(L.type==='image')ic.innerHTML=ICONS.image;
    const nm=el('div','nm',L.name);
    nm.ondblclick=()=>{
      const i2=el('input');i2.value=L.name;nm.textContent='';nm.appendChild(i2);i2.focus();i2.select();
      const fin=()=>{L.name=i2.value||L.name;buildOutliner();pushHistory();};
      i2.onblur=fin;i2.onkeydown=e=>{if(e.key==='Enter')fin();};
    };
    const v=el('button','mini');v.innerHTML=L.visible?EYE:EYEOFF;
    v.onclick=e=>{e.stopPropagation();L.visible=!L.visible;buildOutliner();pushHistory();invalidate();};
    const k=el('button','mini');k.innerHTML=L.locked?LOCK:UNLOCK;
    k.onclick=e=>{e.stopPropagation();L.locked=!L.locked;buildOutliner();};
    r.append(ic,nm,v,k);
    r.onclick=e=>{
      if(e.shiftKey){state.sel.includes(L.id)?state.sel=state.sel.filter(x=>x!==L.id):state.sel.push(L.id);}
      else state.sel=[L.id];
      buildOutliner();buildProps();needEd=true;schedule();
    };
    r.ondragstart=e=>{e.dataTransfer.setData('text/plain',L.id);};
    r.ondragover=e=>{e.preventDefault();r.classList.add('drop');};
    r.ondragleave=()=>r.classList.remove('drop');
    r.ondrop=e=>{
      e.preventDefault();r.classList.remove('drop');
      const src=e.dataTransfer.getData('text/plain');if(src===L.id)return;
      const si=ls.findIndex(x=>x.id===src),ti=ls.findIndex(x=>x.id===L.id);

}
function dupSel(){
  const add=[];
  for(const id of state.sel){const L=layer(id);if(!L)continue;

  state.doc.layers=state.doc.layers.filter(L=>!state.sel.includes(L.id));

function moveSel(dir){
  const ls=state.doc.layers;
  const idx=ls.map((l,i)=>state.sel.includes(l.id)?i:-1).filter(i=>i>=0);

    g2.appendChild(btn('Export project JSON',exportJSON,'full'));
    g2.appendChild(btn('Copy CSS background',()=>{

/* ==========================================================================
   20. HISTORY / IO
   ========================================================================== */
function stripLayer(L){
  const o={};for(const k in L)if(!k.startsWith('_'))o[k]=L[k];
  if(L._subs)o.subs=L._subs;if(L._src)o.src=L._src;return o;
}
function serialize(){
  return JSON.stringify({v:1,pattern:state.doc.pattern,fx:state.doc.fx,swatches:state.doc.swatches,
    layers:state.doc.layers.map(stripLayer)});
}
function deserialize(str){
  const d=JSON.parse(str);
  state.doc.pattern=Object.assign(newDoc().pattern,d.pattern||{});
  state.doc.fx=Object.assign(newDoc().fx,d.fx||{});
  state.doc.swatches=d.swatches||PALETTE.slice();
  state.doc.layers=(d.layers||[]).map(l=>{
    const L=Object.assign(newLayer(l.type||'rect',0,0,100,100),l);
    L.id=l.id||uid();
    if(l.subs){L._subs=l.subs;L._rev=1;}
    if(l.src){const im=new Image();im.onload=()=>invalidate();im.src=l.src;L._img=im;L._src=l.src;}
    delete L.subs;delete L.src;
    return L;});
  state.sel=[];
}
let hTimer=0;
function pushHistory(){
  clearTimeout(hTimer);
  hTimer=setTimeout(()=>{
    const s=serialize();
    if(state.history[state.hi]===s)return;
    state.history=state.history.slice(0,state.hi+1);
    state.history.push(s);
    if(state.history.length>60)state.history.shift();
    state.hi=state.history.length-1;
  },160);
}
function undo(){if(state.hi<=0)return;state.hi--;deserialize(state.history[state.hi]);afterLoad();toast('Undo');}
function redo(){if(state.hi>=state.history.length-1)return;state.hi++;deserialize(state.history[state.hi]);afterLoad();toast('Redo');}
function afterLoad(){buildOutliner();buildProps();buildGlobal();invalidate();}
$('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;
$('#btnSave').onclick=()=>{localStorage.setItem('tessera.doc',serialize());toast('Saved to browser');};
$('#btnLoad').onclick=()=>{
  const s=localStorage.getItem('tessera.doc');
  if(!s){$('#fileJSON').click();return;}
  deserialize(s);afterLoad();toast('Loaded');
};

function download(name,url){const a=document.createElement('a');a.href=url;a.download=name;a.click();}

  const b=new Blob([serialize()],{type:'application/json'});
  download('tessera-pattern.json',URL.createObjectURL(b));
}
$('#fileJSON').onchange=e=>{

  r.readAsText(f);e.target.value='';
};
$('#fileImg').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const la=lattice();
      const sc=Math.min(la.bbox.w/im.width,la.bbox.h/im.height);
      const L=newLayer('image',la.O[0],la.O[1],im.width*sc,im.height*sc);
      L._img=im;L._src=r.result;L.name='Image';
      state.doc.layers.push(L);state.sel=[L.id];
      buildOutliner();buildProps();pushHistory();invalidate();
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);e.target.value='';
};
function tileDataURL(){renderCell();return cellCv.toDataURL('image/png');}
function exportPNG(W,H,seamless){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  if(seamless){
    const L=lattice();
    const view={zoom:Math.min(W/L.bbox.w,H/L.bbox.h),panX:L.corner[0]+L.bbox.w/2,panY:L.corner[1]+L.bbox.h/2,rot:0};
    render2DTo(ctx,W,H,view);
  }else{
    const P=state.doc.pattern,cv=$('#view');
    const k=W/Math.max(1,cv.clientWidth);
    render2DTo(ctx,W,H,{zoom:P.zoom*k,panX:P.panX,panY:P.panY,rot:P.rot});
  }
  c.toBlob(b=>{download(seamless?'tessera-tile.png':'tessera-view.png',URL.createObjectURL(b));toast('PNG exported');});
}
function svgPaintDefs(L,i){
  let defs='',fill='none';
  if(L.fill.on){
    if(L.fill.type==='solid')fill=cssColor(L.fill.c1);
    else{
      const id='g'+i;
      const b=boundsOf(L);
      if(L.fill.type==='linear'){
        const a=L.fill.angle*D2R,r=Math.max(b.w,b.h)/2,cx=b.x+b.w/2,cy=b.y+b.h/2;
        defs=`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${cx-Math.cos(a)*r}" y1="${cy-Math.sin(a)*r}" x2="${cx+Math.cos(a)*r}" y2="${cy+Math.sin(a)*r}">
          <stop offset="0" stop-color="${cssColor(L.fill.c1)}"/><stop offset="1" stop-color="${cssColor(L.fill.c2)}"/></linearGradient>`;
      }else{
        const cx=b.x+b.w/2,cy=b.y+b.h/2,r=Math.max(b.w,b.h)/2;
        defs=`<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${cx}" cy="${cy}" r="${r}">
          <stop offset="0" stop-color="${cssColor(L.fill.c1)}"/><stop offset="1" stop-color="${cssColor(L.fill.c2)}"/></radialGradient>`;
      }
      fill=`url(#${id})`;
    }
  }
  return {defs,fill};
}
function exportSVG(){
  renderCell();
  const L=lattice(),P=state.doc.pattern;
  const N=4;
  const w=L.bbox.w*N,h=L.bbox.h*N;
  let defs='',cell='';
  state.doc.layers.forEach((Ly,i)=>{
    if(!Ly.visible)return;
    const {defs:d0,fill}=svgPaintDefs(Ly,i);defs+=d0;
    const stroke=Ly.stroke.on?` stroke="${cssColor(Ly.stroke.c)}" stroke-width="${Ly.stroke.w}" stroke-linecap="${Ly.stroke.cap}" stroke-linejoin="${Ly.stroke.join}"${Ly.stroke.dash?` stroke-dasharray="${Ly.stroke.dash} ${Ly.stroke.dash*0.9}"`:''}`:'';
    let inner='';
    if(Ly.type==='text'){
      inner=`<text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="${Ly.p.font}" font-size="${Ly.p.size}" font-weight="${Ly.p.weight}" fill="${fill}"${stroke}>${(Ly.p.txt||'').replace(/[<&>]/g,'')}</text>`;
    }else if(Ly.type==='image'&&Ly._src){
      inner=`<image href="${Ly._src}" x="${-Ly.w/2}" y="${-Ly.h/2}" width="${Ly.w}" height="${Ly.h}"/>`;
    }else{
      geom(Ly);const d=subsToD(Ly._sub);if(!d)return;
      inner=`<path d="${d}" fill="${fill}" fill-rule="${Ly.evenodd?'evenodd':'nonzero'}"${stroke}/>`;
    }
    const sm=shapeMatrix(Ly);
    for(const rm of repeatMatrices(Ly)){
      const m=M.mul(rm,sm);
      cell+=`<g opacity="${Ly.opacity}" transform="matrix(${m.map(v=>v.toFixed(4)).join(' ')})">${inner}</g>`;
    }
  });
  let body='';
  for(let j=-1;j<=N;j++)for(let i=-1;i<=N;i++)for(const op of L.ops){
    const t=M.mul(M.t(i*L.e1[0]+j*L.e2[0],i*L.e1[1]+j*L.e2[1]),op);
    body+=`<g transform="matrix(${t.map(v=>v.toFixed(4)).join(' ')})">${cell}</g>`;
  }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(w)}" height="${Math.round(h)}" viewBox="${L.corner[0]} ${L.corner[1]} ${w} ${h}">
<defs>${defs}</defs><rect x="${L.corner[0]}" y="${L.corner[1]}" width="${w}" height="${h}" fill="${cssColor(P.bg)}"/>
<g clip-path="none">${body}</g></svg>`;
  download('tessera-pattern.svg',URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})));
  toast('SVG exported');
}

function addShape(type,o){
  const la=lattice();
  const L=newLayer(type,la.O[0],la.O[1],200,200);
  Object.assign(L,o||{});
  if(o&&o.p)L.p=Object.assign({},SH[type].def,o.p);
  state.doc.layers.push(L);return L;
}
