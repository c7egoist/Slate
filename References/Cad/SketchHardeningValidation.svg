  <text x="30" y="430" fill="#d1d5db" font-size="12">✓ ordinary horizontal constraint flattens endpoint</text><text x="30" y="446" fill="#d1d5db" font-size="12">✓ ordinary vertical constraint aligns endpoint</text><text x="30" y="462" fill="#d1d5db" font-size="12">✓ ordinary intersection snap resolves crossing lines</text><text x="30" y="478" fill="#d1d5db" font-size="12">✓ edge parallel lines do not produce an intersection snap</text><text x="30" y="494" fill="#d1d5db" font-size="12">✓ ordinary fallback grid snap rounds to lattice</text><text x="30" y="510" fill="#d1d5db" font-size="12">✓ ordinary perpendicular solve rotates secondary line</text><text x="30" y="526" fill="#d1d5db" font-size="12">✓ ordinary tangent solve creates tangent direction</text><text x="30" y="542" fill="#d1d5db" font-size="12">✓ edge arc/line tangent projects to nearest curve contact</text><text x="30" y="558" fill="#d1d5db" font-size="12">✓ ordinary circle-circle tangent moves secondary centre externally</text><text x="30" y="574" fill="#d1d5db" font-size="12">✓ edge collinear arc points are rejected</text><text x="30" y="590" fill="#d1d5db" font-size="12">✓ ordinary ellipse centre/corner radii are stable</text><text x="30" y="606" fill="#d1d5db" font-size="12">✓ ordinary Bezier preview preserves endpoints</text><text x="30" y="622" fill="#d1d5db" font-size="12">✓ edge explicit point marker stays tiny</text><text x="30" y="638" fill="#d1d5db" font-size="12">✓ ordinary profile area classifies outer loops and holes</text><text x="30" y="654" fill="#d1d5db" font-size="12">✓ edge profile area marks self-intersections</text><text x="30" y="670" fill="#d1d5db" font-size="12">✓ edge profile area highlights open-loop gaps</text><text x="30" y="686" fill="#d1d5db" font-size="12">✓ ordinary three-point circle resolves centre and radius</text><text x="30" y="702" fill="#d1d5db" font-size="12">✓ ordinary polygon tool emits closed profile area</text><text x="30" y="718" fill="#d1d5db" font-size="12">✓ 