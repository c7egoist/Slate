<body>
<div id="app">
<header id="top" class="surface">
  <div class="brand"><div class="brand-mark" id="brand-icon"></div><div class="brand-copy"><strong>SLATE</strong><small>ASSET DECK</small></div></div>
  <div class="switcher" id="sources"></div>
  <button class="icon-button mobile-only" id="open-locations" aria-label="Open locations"></button>
  <div class="search"><span id="search-icon"></span><input id="search" placeholder="Find assets, formats, tags…"><span class="key">⌘K</span></div>
  <div class="spacer"></div>
  <button class="icon-button mobile-only" id="open-detail" aria-label="Open inspector"></button>
  <button class="tool-button" id="create"></button>
  <button class="tool-button primary" id="import"></button>
