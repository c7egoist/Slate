<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harbor Asset Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    body { background:#000; color:#fff; margin:0; font-family: ui-sans-serif, system-ui, sans-serif; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#333; border-radius:4px; }
    .aspect-4-3 { aspect-ratio:4/3; }
    #preview-container { min-height:220px; height:220px; }
    #preview-container canvas { display:block; width:100% !important; height:100% !important; }
  </style>
</head>
<body class="h-screen w-full flex overflow-hidden text-sm bg-black antialiased">
  <div class="w-60 flex-none border-r border-[#1f1f1f] bg-[#0a0a0a] flex flex-col overflow-hidden">
    <div class="p-4 pb-2"><span class="text-[10px] tracking-widest uppercase text-neutral-500 font-medium">Sources</span></div>
    <div class="flex-1 overflow-y-auto px-2 pb-4 space-y-4 mt-2" id="sidebar-content"></div>
    <div class="border-t border-[#1f1f1f] p-4">
      <div class="flex justify-between text-[10px] text-neutral-500"><span>Library cache</span><span class="font-mono text-white">12.4 GB</span></div>
    </div>
  </div>
  <div class="flex-1 flex flex-col min-w-0">
    <div class="h-14 flex-none border-b border-[#1f1f1f] bg-[#0a0a0a] flex items-center gap-3 px-4">
      <div class="flex-1 max-w-md h-8 flex items-center gap-2 px-3 bg-[#111] border border-[#1f1f1f] rounded-full">
        <i data-lucide="search" class="w-3.5 h-3.5 text-neutral-500"></i>
        <input type="text" id="search-input" placeholder="Search assets..." class="flex-1 bg-transparent text-xs text-white outline-none" />
      </div>
      <div class="ml-auto relative">
        <button id="settings-btn" type="button" class="w-8 h-8 rounded-md border border-[#1f1f1f] bg-[#111] text-neutral-300 hover:text-white hover:border-white/20 flex items-center justify-center" title="Preview settings">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
        <div id="settings-panel" class="hidden absolute right-0 top-10 z-50 w-72 p-3 rounded-lg border border-[#1f1f1f] bg-[#0c0c0e] shadow-xl space-y-2 text-[10px] text-neutral-400">
          <div class="text-[10px] uppercase tracking-widest text-neutral-500 font-medium mb-1">Preview</div>
          <div class="flex items-center gap-2">
            <span class="w-12 shrink-0 uppercase tracking-wider">HDRI</span>
            <select id="hdri-select" class="flex-1 bg-[#111] border border-[#1f1f1f] rounded px-1.5 py-1 text-white text-[11px] outline-none"></select>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-12 shrink-0 uppercase tracking-wider">Exp</span>
            <input id="hdri-exposure" type="range" min="0.2" max="2.4" step="0.05" value="1.1" class="flex-1" />
            <span id="hdri-exposure-val" class="w-8 font-mono text-white">1.10</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-12 shrink-0 uppercase tracking-wider">Env</span>
            <input id="hdri-rot" type="range" min="0" max="360" step="1" value="0" class="flex-1" />
          </div>
          <div class="flex items-center gap-2">
            <span class="w-12 shrink-0 uppercase tracking-wider">Turn</span>
            <input id="obj-rot" type="range" min="0" max="360" step="1" value="0" class="flex-1" />
          </div>
          <div class="flex flex-wrap items-center gap-3 pt-1 text-white">
            <label class="flex items-center gap-1"><input id="hdri-bg" type="checkbox" checked /> BG</label>
            <label class="flex items-center gap-1"><input id="key-light" type="checkbox" checked /> Key</label>
            <label class="flex items-center gap-1"><input id="auto-rotate" type="checkbox" checked /> Spin</label>
          </div>
        </div>
      </div>
    </div>
    <div class="flex-1 flex overflow-hidden">
      <div class="flex-1 flex flex-col min-w-0 overflow-y-auto bg-black">
        <div class="p-4 pb-2 border-b border-[#1f1f1f] bg-[#0c0c0e] sticky top-0 z-10">
          <div class="flex items-center gap-2 text-xs text-neutral-500" id="breadcrumb"></div>
        </div>
        <div class="flex-1 p-4">
          <div id="asset-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3"></div>
        </div>
      </div>
      <div class="w-[22rem] flex-none border-l border-[#1f1f1f] bg-[#0a0a0a] flex flex-col overflow-hidden">
        <div class="p-4 pb-2 border-b border-[#1f1f1f] bg-[#0c0c0e]">
          <div class="flex items-center gap-2 text-xs text-neutral-500" id="inspector-title">Inspector</div>
        </div>
        <div class="flex-1 overflow-y-auto flex flex-col">
          <div class="h-52 border-b border-[#1f1f1f] flex-none relative bg-black" id="preview-container"></div>
          <div id="inspector-content" class="flex flex-col flex-1"></div>
        </div>
      </div>
    </div>
  </div>

function metalAsset(v) {
  const e = ELEMENTS[v.parent];
  const density = v.density ?? e.density;
  const p = {
    kind:'metal', ...e, variant:v.grade, finish:v.finish, composition:v.composition, notes:v.notes,
    density, meltingC:v.meltingC??e.meltingC, conductivity:v.conductivity??e.conductivity,
    resistivity:v.resistivity??e.resistivity, youngs:v.youngs??e.youngs, hardnessHV:v.hardnessHV??e.hardnessHV,
    color:v.color, roughness:v.roughness, massKgPerM3:density*1000, molarVolume:e.mass/density,
    parentName:e.name, parentSymbol:e.symbol
  };
  return { id:v.id, name:v.name, ext:'mat', size:0.9*1048576,
    tags:['metal', e.symbol.toLowerCase(), e.name.toLowerCase()],
    cat:'material', subcat:e.name, source:'library',
    color:v.color, metalness:v.metalness??1, roughness:v.roughness, ior:1.5, clearcoat:0, transmission:0, props:p };
}

function extraDielectric(v, kind, subcat) {
  const a = dielectricAsset(v, kind, subcat);
  a.sheen = v.sheen || 0;
  a.sheenRoughness = v.sheenRoughness != null ? v.sheenRoughness : (v.fuzz != null ? v.fuzz : 0.5);
  a.sheenColor = v.sheenColor || v.color;
  a.fuzz = v.fuzz || a.sheenRoughness;
  a.iridescence = v.iridescence || 0;
  a.iridescenceIOR = v.iridescenceIOR || 1.3;
  a.iridescenceThickness = v.iridescenceThickness || 400;
  a.props.sheen = a.sheen; a.props.sheenRoughness = a.sheenRoughness; a.props.fuzz = a.fuzz;
  a.props.iridescence = a.iridescence;
  return a;
}

/* ---------- Noise generator (GPU fragment shader, no maps) ---------- */
const NOISE_GLSL = `
float nhash(vec2 p){
  p += uNSeed * 17.13;
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}
float nvnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0-2.0*f);
  float a = nhash(i), b = nhash(i+vec2(1.0,0.0));
  float c = nhash(i+vec2(0.0,1.0)), d = nhash(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float nfbm(vec2 p){
  float s = 0.0, a = 1.0, n = 0.0;
  for(int i=0;i<8;i++){
    float on = step(float(i), uNOct - 0.5);
    s += a * nvnoise(p) * on;
    n += a * on;
    p *= uNLac;
    a *= uNPers;
  }
  return s / max(n, 0.0001);
}
vec2 nvoronoi(vec2 p){
  vec2 n = floor(p), f = fract(p);
  float f1 = 8.0, f2 = 8.0;
  for(int j=-1;j<=1;j++)
  for(int i=-1;i<=1;i++){
    vec2 g = vec2(float(i), float(j));
    vec2 o = vec2(nhash(n+g), nhash(n+g+19.1));
    vec2 r = g + o - f;
    float d = dot(r,r);
    if(d < f1){ f2 = f1; f1 = d; }

      '#include <map_fragment>\nfloat gN = gField();\nvec3 gAlb = mix(uGColA, uGColB, gN);\ndiffuseColor.rgb = mix(diffuseColor.rgb, gAlb, clamp(uGShow, 0.0, 1.0));\n'
    );
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <roughnessmap_fragment>',
      '#include <roughnessmap_fragment>\nroughnessFactor = clamp(uGRough + (gField() - 0.5) * uGRoughAmt * 2.0, 0.0, 1.0);\n'
    );
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <normal_fragment_maps>',
      '#include <normal_fragment_maps>\n{\n  float gH = gField();\n  normal = normalize(normal - vec3(dFdx(gH), dFdy(gH), 0.0) * uGBump * 0.22);\n}\n'
    );
  };
  mat.customProgramCacheKey = () => 'harbor-grain-infinite-v11';
  mat.userData.grainU = u;
  mat.userData.noiseU = u;
  return mat;
}

function makeGradientEnv(c0, c1, extras) {
  const scn = new THREE.Scene();
  const geo = new THREE.SphereGeometry(12, 32, 32);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      col0: { value: new THREE.Color(c0) },
      col1: { value: new THREE.Color(c1) }
    },
    vertexShader: 'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'varying vec3 vP; uniform vec3 col0; uniform vec3 col1; void main(){ float h=normalize(vP).y*0.5+0.5; gl_FragColor=vec4(mix(col1,col0,h),1.0); }'
  });
  scn.add(new THREE.Mesh(geo, mat));
  (extras||[]).forEach(e => scn.add(e));
  const tex = pmrem.fromScene(scn, 0.04).texture;
  geo.dispose(); mat.dispose();
  return tex;
}

function makeStudioEnv(warmth) {
  const scn = new THREE.Scene();
  scn.add(new RoomEnvironment());
  if (warmth) {
    const l = new THREE.DirectionalLight(warmth, 4);
    l.position.set(4, 6, 2);
    scn.add(l);
  }
  return pmrem.fromScene(scn, 0.04).texture;
}

function syncMeshEnv() {
  if (!currentMesh || !scene.environment) return;
  const mats = Array.isArray(currentMesh.material) ? currentMesh.material : [currentMesh.material];
  mats.forEach(m => {
    m.envMap = scene.environment;
    m.envMapIntensity = 1.35;
    m.needsUpdate = true;
  });
}

function applyLights() {
  if (!renderer || !scene) return;
  renderer.toneMappingExposure = lightState.exposure;
  if (keyLight) keyLight.visible = !!lightState.key;
  if (fillLight) fillLight.visible = !!lightState.key;
  if (rimLight) rimLight.visible = !!lightState.key;
  if (envPivot) envPivot.rotation.y = lightState.rot * Math.PI / 180;
  if (lightState.showBg && scene.environment) scene.background = scene.environment;
  else scene.background = new THREE.Color(0x111214);
  if (controls) controls.autoRotate = !!lightState.autoRotate;
  if (currentMesh) currentMesh.rotation.y = lightState.objRot * Math.PI / 180;
  syncMeshEnv();
}

function ensureLocalEnv(id) {
  if (envCache[id]) return envCache[id];
  if (id === 'studio') envCache[id] = makeStudioEnv(null);
  else if (id === 'warm') envCache[id] = makeGradientEnv('#ffd9a8', '#3a2218', []);
  else if (id === 'cool') envCache[id] = makeGradientEnv('#d8ecff', '#1a2a44', []);
  else if (id === 'highcon') envCache[id] = makeGradientEnv('#ffffff', '#050505', []);
  else envCache[id] = makeStudioEnv(null);
  return envCache[id];
}

function setHdri(id) {
  lightState.hdri = id;
  const spec = HDRIS.find(h => h.id === id) || HDRIS[0];
  if (!renderer) return;
  if (!spec.url) {
    scene.environment = ensureLocalEnv(id);
    applyLights();
    return;
  }
  if (envCache[id]) { scene.environment = envCache[id]; applyLights(); return; }
  scene.environment = ensureLocalEnv('studio');
  applyLights();
  new RGBELoader().load(spec.url, (hdr) => {
    envCache[id] = pmrem.fromEquirectangular(hdr).texture;
    hdr.dispose();
    if (lightState.hdri === id) { scene.environment = envCache[id]; applyLights(); }
  }, undefined, () => {
    if (lightState.hdri === id) { scene.environment = ensureLocalEnv('studio'); applyLights(); }
  });
}

  document.getElementById('hdri-rot').addEventListener('input', (e) => { initThree(); lightState.rot = parseFloat(e.target.value); applyLights(); });

  document.getElementById('key-light').addEventListener('change', (e) => { initThree(); lightState.key = e.target.checked; applyLights(); });
  document.getElementById('auto-rotate').addEventListener('change', (e) => { initThree(); lightState.autoRotate = e.target.checked; applyLights(); });

function initThree() {
  if (renderer) return;
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111214);
  camera = new THREE.PerspectiveCamera(40, Math.max(els.preview.clientWidth,1)/Math.max(els.preview.clientHeight,1), 0.1, 100);
  camera.position.set(0, 0.12, 2.2);
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(Math.max(els.preview.clientWidth, 1), Math.max(els.preview.clientHeight, 1));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = lightState.exposure;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  keyLight = new THREE.DirectionalLight(0xfff4e8, 0.85); keyLight.position.set(3.2,4.4,2.6); scene.add(keyLight);
  fillLight = new THREE.DirectionalLight(0xb8d4ff, 0.22); fillLight.position.set(-3.5,1.2,-2); scene.add(fillLight);
  rimLight = new THREE.DirectionalLight(0xffffff, 0.35); rimLight.position.set(-1.2,2.8,-3.4); scene.add(rimLight);
  const chTex = document.createElement('canvas');
  chTex.width = 8; chTex.height = 8;
  const ctx = chTex.getContext('2d');
  ctx.fillStyle = '#2a2a2e'; ctx.fillRect(0,0,8,8);
  ctx.fillStyle = '#3a3a40'; ctx.fillRect(0,0,4,4); ctx.fillRect(4,4,4,4);
  const map = new THREE.CanvasTexture(chTex);
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.repeat.set(8, 8);
  map.colorSpace = THREE.SRGBColorSpace;
  checkerPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(6, 6),
    new THREE.MeshStandardMaterial({ map, roughness: 0.85, metalness: 0, color: 0xffffff })
  );
  checkerPlane.rotation.x = -Math.PI / 2;
  checkerPlane.position.y = -0.72;
  scene.add(checkerPlane);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.3;
  controls.enablePan = false; controls.minDistance = 1.35; controls.maxDistance = 5;
  window.addEventListener('resize', resizePreview);
  setHdri(lightState.hdri);
  (function animate(){
    requestAnimationFrame(animate);
    if (controls) controls.update();
    if (renderer && renderer.domElement.parentNode) renderer.render(scene, camera);
  })();
}
function resizePreview() {
  if (!renderer || !els.preview.clientWidth) return;

}
function clearMesh() {
  if (!currentMesh) return;
  scene.remove(currentMesh);
  currentMesh.geometry.dispose();
  const mats = Array.isArray(currentMesh.material) ? currentMesh.material : [currentMesh.material];
  mats.forEach(m => {
    ['map','roughnessMap','bumpMap','normalMap'].forEach(k => { if (m[k] && m[k].dispose) m[k].dispose(); });
    m.dispose();
  });
  currentMesh = null;
}
function mountCanvas() {
  Array.from(els.preview.children).forEach(c => { if (c !== renderer.domElement) c.remove(); });
  if (renderer.domElement.parentNode !== els.preview) els.preview.appendChild(renderer.domElement);
  resizePreview();
}
function showPlaceholder(html) {

function updatePreview(asset) {
  initThree();
  if (!asset) { showPlaceholder('<div class="w-full h-full flex items-center justify-center text-neutral-600 text-xs">No preview available</div>'); return; }
  if (asset.cat === 'font') { showPlaceholder('<div class="w-full h-full flex items-center justify-center text-8xl">Aa</div>'); return; }
  if (asset.cat === 'svg') { showPlaceholder(`<div class="w-full h-full flex items-center justify-center p-12 text-white">${asset.content}</div>`); return; }
  mountCanvas(); clearMesh();
  let geo;
  if (asset.cat === 'cad') geo = new THREE.CylinderGeometry(0.5,0.5,1,64);
  else if (asset.cat === 'material' || asset.cat === 'generator') geo = new THREE.SphereGeometry(0.72, 128, 128);
  else if (asset.cat === 'mesh') geo = new THREE.TorusGeometry(0.5,0.2,48,128);
  else geo = new THREE.BoxGeometry(1,1,1);
  geo.computeVertexNormals();

  const kind = asset.props && asset.props.kind;
  const isGlass = kind === 'glass' || kind === 'gem' || kind === 'water' || kind === 'ice';
  const isFabric = kind === 'fabric';
  const trans = isGlass ? Math.max(asset.transmission ?? 1, 0.05) : (asset.transmission || 0);
  const ior = asset.ior ?? (isGlass ? 1.52 : 1.5);
  const sheenAmt = isFabric ? (asset.sheen ?? 0.7) : (asset.sheen || (asset.sss ? Math.min(1, asset.sss) : 0));
  const fuzz = asset.fuzz != null ? asset.fuzz : (asset.sheenRoughness != null ? asset.sheenRoughness : 0.55);
  let mat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(asset.color || 0xffffff),
    metalness: isGlass || isFabric ? 0 : (asset.metalness ?? 0.1),
    roughness: Math.max(0.0, asset.roughness ?? 0.2),
    ior: ior,
    specularIntensity: 1,
    specularColor: new THREE.Color(0xffffff),
    clearcoat: isGlass ? Math.max(asset.clearcoat || 0, 0.7) : (asset.clearcoat || 0),
    clearcoatRoughness: asset.clearcoatRoughness ?? (isGlass ? 0.04 : 0.15),
    transmission: trans,
    thickness: trans > 0.01 ? (asset.thickness || 1.5) : 0,
    attenuationColor: asset.atten ? new THREE.Color(asset.atten) : new THREE.Color(0xffffff),
    attenuationDistance: asset.attenDist || (isGlass ? 4 : 1),
    sheen: sheenAmt,
    sheenRoughness: fuzz,
    sheenColor: new THREE.Color(asset.sheenColor || asset.color || 0xffffff),
    iridescence: asset.iridescence || 0,
    iridescenceIOR: asset.iridescenceIOR || 1.3,
    iridescenceThicknessRange: [100, asset.iridescenceThickness || 400],
    envMap: scene.environment || null,
    envMapIntensity: isGlass ? 1.6 : 1.3,
    flatShading: false,
    transparent: trans > 0.02,
    opacity: 1
  });
  if (asset.noiseGen || (asset.props && asset.props.kind === 'noisegen')) {
    mat = createNoiseMaterial();
  }
  if (checkerPlane) checkerPlane.visible = trans > 0.15 && !(asset.noiseGen || asset.grainType);
  currentMesh = new THREE.Mesh(geo, mat);
  currentMesh.rotation.y = lightState.objRot * Math.PI / 180;
  scene.add(currentMesh);
  applyLights();
  resizePreview();
}

function renderBreadcrumb() {

  if (state.cat) {
    const info = CAT_INFO[state.cat] || {name:state.cat};
    html += state.subcat
      ? `<span class="cursor-pointer hover:text-white" onclick="window.nav('library','${state.cat}',null)">${info.name}</span> / <span class="text-white font-medium">${state.subcat}</span>`
      : `<span class="text-white font-medium">${info.name}</span>`;
  } else html += `<span class="text-white font-medium">Project Library</span>`;
  els.breadcrumb.innerHTML = html;

window.nav = (root, cat, subcat) => { state.root=root; state.cat=cat; state.subcat=subcat; state.selectedId=null; updateAll(); };
window.setNoise = (k, val) => {
  if (k === 'colA' || k === 'colB') noiseState[k] = val;
  else noiseState[k] = parseFloat(val);
  if (currentMesh && currentMesh.material && currentMesh.material.userData.grainU) {
    syncGrainUniforms(currentMesh.material.userData.grainU);
    currentMesh.material.clearcoat = noiseState.gloss;
    currentMesh.material.roughness = noiseState.rough;
  } else {
    const asset = ASSETS.find(a => a.id === state.selectedId);
    try { updatePreview(asset); } catch (err) { console.error(err); }
  }
};
window.selectAsset = (id) => {
  state.selectedId = id;
  const a = ASSETS.find(x => x.id === id);
  if (a && a.noiseGen) {
    noiseState.type = a.noiseType != null ? a.noiseType : 0;
    if (noiseState.type === 5) {
      noiseState.scale = 8; noiseState.warp = 3.2; noiseState.peel = 1.8;
      noiseState.speckle = 1.2; noiseState.show = 0.85; noiseState.bump = 5; noiseState.irreg = 0.4;
    } else if (noiseState.type === 4) {
      noiseState.scale = 10; noiseState.warp = 2.4; noiseState.show = 0.85; noiseState.bump = 5;
    }
  }
  renderGrid();
  try { renderInspector(); } catch (err) { console.error(err); }
};
els.grid.addEventListener('click', (e) => {
  const card = e.target.closest('[data-asset-id]');
  if (!card) return;
  window.selectAsset(card.getAttribute('data-asset-id'));
});
els.search.addEventListener('input', e => { state.search=e.target.value; renderGrid(); });
