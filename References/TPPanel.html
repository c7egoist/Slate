<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Texture Paint Studio · Layer Stack</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-black: #000000;
      --bg-header: #0a0a0a;
      --bg-panel: #0e0e0e;
      --bg-card: #141414;
      --bg-elevated: #1a1a1a;
      --bg-hover: #1f1f1f;
      --border-subtle: #1c1c1c;
      --border-medium: #2a2a30;
      --border-bright: #3a3a44;
      --text-main: #ededed;
      --text-muted: #8a8a8a;
      --text-dim: #6a6a6a;
      --accent-blue: #3b82f6;
      --accent-gold: #f59e0b;
      --accent-yellow: #ffd24a;
      --accent-green: #10b981;
      --accent-purple: #8b5cf6;
      --accent-red: #e05a5a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-black);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      user-select: none;
      -webkit-user-select: none;
      font-size: 12px;
      line-height: 1.4;
      overflow: hidden;
    }

    .studio-shell {
      width: 100%;
      max-width: 480px;
      height: 820px;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ── APPLICATION TOP HEADER ── */
    .app-header {
      height: 42px;
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
      z-index: 30;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      width: 22px;
      height: 22px;
      background: #ffffff;
      color: #000000;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 800;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .nav-breadcrumb {
      display: flex;
      align-items: center;
      gap: 4px;
      background-color: var(--bg-card);
      padding: 2px 6px;
      border-radius: 9999px;
      border: 1px solid var(--border-subtle);
      font-size: 11px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      color: var(--text-main);
    }

    .nav-btn.active-layers {
      background-color: #ffffff;
      color: #000000;
      font-weight: 600;
    }

    .nav-btn.active-channels {
      background-color: var(--accent-blue);
      color: #ffffff;
      font-weight: 600;
    }

    .nav-btn.active-mask {
      background-color: var(--accent-gold);
      color: #000000;
      font-weight: 600;
    }

    .nav-divider {
      color: var(--text-dim);
      font-size: 10px;
    }

    .shortcut-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      color: var(--text-dim);
      background: rgba(0, 0, 0, 0.4);
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid var(--border-medium);
      margin-left: 2px;
    }

    /* ── CAROUSEL STAGE & SLIDES ── */
    .carousel-stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      width: 100%;
      height: calc(100% - 42px);
    }

    .carousel-track {
      display: flex;
      width: 300%;
      height: 100%;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .carousel-slide {
      width: 33.333333%;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-panel);
      overflow: hidden;
    }

    /* ── LAYER STACK HEADER & TOOLBAR ── */
    .panel-header {
      height: 44px;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
    }

    .panel-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-box {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .count-pill {
      padding: 2px 6px;
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border-radius: 9999px;
      background: var(--bg-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border-medium);
    }

    .solo-indicator {
      padding: 2px 7px;
      font-size: 9.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      border-radius: 9999px;
      background: var(--accent-yellow);
      color: #000000;
      cursor: pointer;
      border: none;
    }

    .panel-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .inspect-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 9999px;
      background: var(--bg-hover);
      color: var(--text-main);
      border: 1px solid var(--border-medium);
      cursor: pointer;
      transition: all 0.15s;
    }

    .inspect-btn:hover {
      background: #282830;
    }

    .icon-circle-btn {
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-medium);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .icon-circle-btn:hover {
      background: var(--bg-hover);
      color: #ffffff;
    }

    .icon-circle-btn:disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    /* ── FILTER & TOOLBAR ── */
    .filter-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
      background-color: #0a0a0a;
      flex-shrink: 0;
    }

    .search-input-box {
      flex: 1;
      height: 28px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      border-radius: 9999px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
    }

    .search-input-box:focus-within {
      border-color: var(--border-medium);
    }

    .search-input-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-size: 11.5px;
      color: var(--text-main);
      margin-left: 6px;
    }

    .search-input-box input::placeholder {
      color: var(--text-dim);
    }

    /* ── LAYER LIST (STRICTLY RECTANGULAR, NO ROUNDING) ── */
    .layer-list-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0;
      background: var(--bg-panel);
    }

    .layer-list-container::-webkit-scrollbar {
      width: 5px;
    }
    .layer-list-container::-webkit-scrollbar-thumb {
      background: var(--border-medium);
      border-radius: 3px;
    }

    /* Strict requirement: entries in layer stack must be rectangles with NO ROUNDING */
    .layer-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 46px;
      padding-right: 10px;
      border-radius: 0px !important;
      cursor: pointer;
      transition: background-color 0.12s ease;
      border-left: 3px solid transparent;
      background-color: #0d0d0d;
      color: var(--text-main);
      border-bottom: 1px solid #181818;
    }

    .layer-row.is-folder {
      background-color: #121215;
    }

    .layer-row:hover {
      background-color: #141414;
    }

    .layer-row.is-folder:hover {
      background-color: #18181c;
    }

    .layer-row.selected {
      background-color: #1f1f1f !important;
      border-left-color: #ffffff !important;
    }

    .layer-row.is-folder.selected {
      background-color: #222225 !important;
      border-left-color: #ffffff !important;
    }

    .layer-row.is-hidden {
      opacity: 0.4;
    }

    .layer-row.is-dimmed {
      opacity: 0.25;
    }

    .tree-guide-line {
      position: absolute;
      top: 0;
      bottom: 0;
      border-left: 1px solid var(--border-medium);
      pointer-events: none;
    }

    .row-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0;
      transition: color 0.1s;
    }

    .row-btn:hover {
      color: var(--text-main);
    }

    .layer-thumb-box {
      width: 32px;
      height: 32px;
      border-radius: 0px !important;
      border: 1px solid var(--border-medium);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .layer-meta-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .layer-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .layer-name-label {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .layer-row.is-folder .layer-name-label {
      font-weight: 600;
    }

    .layer-info-subtitle {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-muted);
      line-height: 1;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .layer-actions-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .channel-count-pill {
      padding: 2px 6px;
      font-size: 9.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border-radius: 4px;
      background: #141414;
      color: var(--text-muted);
      border: 1px solid #222222;
      cursor: pointer;
      transition: all 0.15s;
    }

    .channel-count-pill:hover {
      background: var(--border-medium);
      color: var(--text-main);
    }

    .mask-attached-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      font-size: 9.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-gold);
      border: 1px solid rgba(245, 158, 11, 0.3);
      cursor: pointer;
      transition: all 0.15s;
    }

    .mask-attached-pill:hover {
      background: rgba(245, 158, 11, 0.3);
    }

    /* ── MASK SUB-ROW (STRICT RECTANGULAR, INDENTED) ── */
    .mask-sub-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding-right: 10px;
      border-radius: 0px !important;
      cursor: pointer;
      background-color: #090909;
      color: var(--text-muted);
      border-left: 3px solid transparent;
      border-bottom: 1px solid #181818;
      transition: background-color 0.12s ease;
    }

    .mask-sub-row:hover {
      background-color: #121212;
    }

    .mask-sub-row.selected {
      background-color: #1a1815 !important;
      border-left-color: var(--accent-gold) !important;
      color: var(--text-main);
    }

    .mask-branch-connector {
      position: absolute;
      top: 0;
      bottom: 50%;
      width: 10px;
      border-left: 1px solid var(--border-medium);
      border-bottom: 1px solid var(--border-medium);
      pointer-events: none;
    }

    /* ── STACK FOOTER CONTROLS ── */
    .stack-footer {
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      border-top: 1px solid var(--border-subtle);
      background-color: #0a0a0a;
      gap: 8px;
      flex-shrink: 0;
    }

    .footer-meta-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-dim);
    }

    .footer-meta-line strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .footer-controls-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dropdown-trigger-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 26px;
      padding: 0 10px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border-radius: 9999px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      cursor: pointer;
    }

    .dropdown-trigger-btn:hover {
      background: var(--bg-elevated);
    }

    .opacity-slider-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-track-input {
      flex: 1;
      height: 4px;
      background: var(--border-subtle);
      border-radius: 4px;
      appearance: none;
      outline: none;
      cursor: pointer;
    }

    .slider-track-input::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    .slider-val-tag {
      width: 36px;
      text-align: right;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      color: var(--text-muted);
    }

    .reorder-btns {
      display: flex;
      align-items: center;
      gap: 2px;
      border-left: 1px solid var(--border-subtle);
      padding-left: 8px;
    }

    /* ── PROPERTY INSPECTORS (CHANNELS & MASK) ── */
    .inspector-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: var(--bg-panel);
    }

    .inspector-body::-webkit-scrollbar {
      width: 5px;
    }
    .inspector-body::-webkit-scrollbar-thumb {
      background: var(--border-medium);
      border-radius: 3px;
    }

    .inspector-card {
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background-color: var(--bg-panel);
      overflow: hidden;
    }

    .inspector-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 10px;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background-color 0.12s;
    }

    .inspector-card-header:hover {
      background-color: var(--bg-card);
    }

    .inspector-card-content {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: rgba(10, 10, 10, 0.5);
    }

    .chips-box {
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background-color: var(--bg-panel);
      padding: 10px;
    }

    .chips-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .chips-flex-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .channel-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 8px;
      border-radius: 9999px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      font-size: 11.5px;
      color: var(--text-main);
    }

    .channel-chip .remove-chip-btn {
      background: var(--bg-hover);
      border: none;
      color: var(--text-muted);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-left: 2px;
    }

    .channel-chip .remove-chip-btn:hover {
      background: var(--accent-red);
      color: #ffffff;
    }

    .source-segmented-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .segmented-control {
      display: flex;
      height: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 2px;
    }

    .seg-btn {
      background: transparent;
      border: none;
      padding: 0 10px;
      font-size: 10.5px;
      font-weight: 500;
      border-radius: 9999px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.12s;
    }

    .seg-btn.active {
      background: #ededed;
      color: #111111;
      font-weight: 600;
    }

    .prop-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prop-label {
      width: 52px;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .tabular-num-box {
      display: flex;
      align-items: center;
      height: 26px;
      background: #000000;
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .tabular-num-box input {
      width: 48px;
      text-align: center;
      background: transparent;
      border: none;
      outline: none;
      font-size: 11.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      color: #ffffff;
    }

    .tabular-num-box .unit-tag {
      height: 100%;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-muted);
      border-left: 1px solid var(--border-subtle);
    }

    .color-swatch-picker-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 28px;
      padding: 0 8px;
      border-radius: 9999px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
    }

    .color-swatch-picker-btn:hover {
      background: var(--bg-elevated);
    }

    .swatch-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .hex-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #ffffff;
    }

    /* Popover menus */
    .popover-menu {
      position: absolute;
      z-index: 100;
      background: #141416;
      border: 1px solid var(--border-medium);
      border-radius: 10px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .popover-menu button {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 11.5px;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s;
    }

    .popover-menu button:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    /* Color picker modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(2px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      width: 280px;

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .palette-cell {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: transform 0.12s;
    }

    .palette-cell:hover {
      transform: scale(1.1);
    }

    /* SVG Icon utility */
    svg {
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

</head>

  <script>

    /* ══════════════════════════════════════════════════════════════════
       TREE UTILITIES
    ══════════════════════════════════════════════════════════════════ */
    function findLayerById(layers, id) {
      for (const l of layers) {
        if (l.id === id) return l;
        if (l.children) {
          const found = findLayerById(l.children, id);
          if (found) return found;
        }
      }
      return null;
    }

    function findParentFolder(layers, childId) {
      for (const l of layers) {
        if (l.children) {
          const idx = l.children.findIndex(c => c.id === childId);
          if (idx !== -1) return { folder: l, index: idx };
          const found = findParentFolder(l.children, childId);
          if (found) return found;
        }
      }
      return null;
    }

    function flattenLayers(layers) {
      const res = [];
      function trav(items) {
        for (const it of items) {
          res.push(it);
          if (it.children) trav(it.children);
        }
      }
      trav(layers);
      return res;
    }

    function updateLayerInTree(layers, id, updater) {
      return layers.map(l => {
        if (l.id === id) return updater(l);
        if (l.children) {
          return { ...l, children: updateLayerInTree(l.children, id, updater) };
        }
        return l;
      });
    }

    function deleteLayerFromTree(layers, id) {
      return layers.filter(l => l.id !== id).map(l => {
        if (l.children) {
          return { ...l, children: deleteLayerFromTree(l.children, id) };
        }
        return l;
      });
    }

    /* ══════════════════════════════════════════════════════════════════
       CAROUSEL NAVIGATION
    ══════════════════════════════════════════════════════════════════ */
    function navigateToPage(page) {
      const selected = findLayerById(layersState, selectedId);
      
      // Auto-provision mask if switching to mask without one
      if (page === 'mask' && selected && !selected.mask) {
        selected.mask = {
          visible: true,
          source: 'Generator',
          generatorKey: 'CurvatureEdges',
          generatorParams: { Balance: 0.5, Contrast: 0.7, Radius: 0.25, Blur: 0.1 },
          density: 100,
          blend: 'Multiply',
          invert: false,
          channels: ['baseColour', 'roughness', 'height']
        };
        selectedIsMask = true;
      } else if (page === 'mask') {
        selectedIsMask = true;
      } else if (page === 'channels') {
        selectedIsMask = false;
      }

      currentPage = page;

      // Update carousel track translation
      const track = document.getElementById('carousel-track');
      if (page === 'layers') track.style.transform = 'translateX(0%)';
      else if (page === 'channels') track.style.transform = 'translateX(-33.333333%)';
      else if (page === 'mask') track.style.transform = 'translateX(-66.666666%)';

      // Update header nav buttons
      document.getElementById('nav-btn-layers').className = 'nav-btn' + (page === 'layers' ? ' active-layers' : '');
      document.getElementById('nav-btn-channels').className = 'nav-btn' + (page === 'channels' ? ' active-channels' : '');
      document.getElementById('nav-btn-mask').className = 'nav-btn' + (page === 'mask' ? ' active-mask' : '');

      renderAll();
    }

    function inspectCurrentSelection() {
      const selected = findLayerById(layersState, selectedId);
      if (!selected) return;
      if (selectedIsMask && selected.mask) {
        navigateToPage('mask');
      } else {
        navigateToPage('channels');
      }
    }

    /* Keyboard navigation */
    window.addEventListener('keydown', (e) => {
      if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;

      if (e.key === 'Tab') {
        e.preventDefault();
        if (currentPage === 'layers') {
          inspectCurrentSelection();
        } else {
          navigateToPage('layers');
        }
      } else if (e.key === 'Escape') {
        if (currentPage !== 'layers') {
          e.preventDefault();
          navigateToPage('layers');
        }
      } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'g') {
        e.preventDefault();
        groupSelectedLayer();
      } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'd') {
        e.preventDefault();
        duplicateSelectedLayer();
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        deleteSelectedLayer();
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        const flat = flattenLayers(layersState);
        const currIdx = flat.findIndex(l => l.id === selectedId);
        if (currIdx === -1) return;
        const nextIdx = e.key === 'ArrowUp' ? Math.max(0, currIdx - 1) : Math.min(flat.length - 1, currIdx + 1);
        selectLayer(flat[nextIdx].id, false);
      }
    });

    function selectLayer(id, isMask = false) {
      selectedId = id;
      selectedIsMask = isMask;
      renderAll();
    }

    function toggleLayerVisibility(id, e) {
      e.stopPropagation();
      if (e.altKey) {
        soloId = soloId === id ? null : id;
      } else {
        layersState = updateLayerInTree(layersState, id, l => ({ ...l, visible: !l.visible }));
      }
      renderAll();
    }

    function clearSolo() {
      soloId = null;
      renderAll();
    }

    function toggleFolderOpen(id, e) {
      e.stopPropagation();
      layersState = updateLayerInTree(layersState, id, l => ({ ...l, open: !l.open }));
      renderAll();
    }

    function toggleSelectedMask() {
      const selected = findLayerById(layersState, selectedId);
      if (!selected) return;
      if (selected.mask) {
        selected.mask = null;
        selectedIsMask = false;
      } else {
        selected.mask = {
          visible: true,
          source: 'Generator',
          generatorKey: 'CurvatureEdges',
          generatorParams: { Balance: 0.5, Contrast: 0.7, Radius: 0.25, Blur: 0.1 },
          density: 100,
          blend: 'Multiply',
          invert: false,
          channels: ['baseColour', 'roughness', 'height']
        };
        selectedIsMask = true;
      }
      renderAll();
    }

    function groupSelectedLayer() {
      const selected = findLayerById(layersState, selectedId);
      const newFolderId = 'f_' + Date.now();
      const newFolder = {
        id: newFolderId,
        name: selected ? 'Group (' + selected.name + ')' : 'New Folder Group',
        type: 'folder',
        classification: 'Material',
        color: '#ffd24a',
        visible: true,
        locked: false,
        opacity: 100,
        blend: 'Passthrough',
        open: true,
        children: selected ? [JSON.parse(JSON.stringify(selected))] : [],
        channels: { baseColour: { enabled: true, mode: 'Value', value: 1, colour: '#ffffff' } }
      };

      if (selected) {
        layersState = deleteLayerFromTree(layersState, selectedId);
      }
      layersState.unshift(newFolder);
      selectedId = newFolderId;
      selectedIsMask = false;
      renderAll();
    }

    function ungroupSelected() {
      const selected = findLayerById(layersState, selectedId);
      if (!selected || selected.type !== 'folder') return;
      const children = selected.children || [];
      const parent = findParentFolder(layersState, selectedId);
      
      layersState = deleteLayerFromTree(layersState, selectedId);
      if (parent) {
        parent.folder.children.splice(parent.index, 0, ...children);
      } else {
        layersState.unshift(...children);
      }
      if (children.length > 0) selectedId = children[0].id;
      renderAll();
    }

    function duplicateSelectedLayer() {
      const selected = findLayerById(layersState, selectedId);
      if (!selected) return;
      const clone = JSON.parse(JSON.stringify(selected));
      clone.id = 'l_' + Date.now();
      clone.name = selected.name + ' Copy';
      layersState.unshift(clone);
      selectedId = clone.id;
      renderAll();
    }

    function deleteSelectedLayer() {
      const selected = findLayerById(layersState, selectedId);
      if (!selected || selected.locked) return;
      if (selectedIsMask && selected.mask) {
        selected.mask = null;
        selectedIsMask = false;
      } else {
        layersState = deleteLayerFromTree(layersState, selectedId);
        const flat = flattenLayers(layersState);
        if (flat.length > 0) selectedId = flat[0].id;
      }
      renderAll();
    }

    function moveSelectedLayer(dir) {
      const flat = flattenLayers(layersState);
      const idx = layersState.findIndex(l => l.id === selectedId);
      if (idx === -1) return;
      const targetIdx = dir === 'up' ? idx - 1 : idx + 1;
      if (targetIdx < 0 || targetIdx >= layersState.length) return;
      const item = layersState.splice(idx, 1)[0];
      layersState.splice(targetIdx, 0, item);
      renderAll();
    }

      const menu = document.getElementById('add-layer-menu');
      menu.style.display = menu.style.display === 'none' ? 'flex' : 'none';

                <div class="layer-name-row">
                  <span style="font-size: 11px; font-family: monospace; font-weight: 600; color: var(--accent-gold);">MASK</span>
                  <span style="font-size: 11px; color: var(--text-main);">${layer.mask.source === 'Generator' ? layer.mask.generatorKey : layer.mask.source}</span>
                </div>
                <div class="layer-info-subtitle">
                  <span>${layer.mask.density}% Density · ${layer.mask.blend}</span>
                </div>
              </div>

              <button class="channel-count-pill" onclick="event.stopPropagation(); selectLayer('${layer.id}', true); navigateToPage('mask');">
                Props &rarr;
              </button>
            </div>
          `;
        }

        // Children recursion
        if (isFolder && isOpen && layer.children) {
          for (const child of layer.children) {
            rowHtml += renderNode(child, depth + 1);
          }
        }

        return rowHtml;
      }

      for (const rootLayer of layersState) {
        html += renderNode(rootLayer, 0);
      }

      container.innerHTML = html;
      updateFooterState();
    }

    function updateFooterState() {
      const selected = findLayerById(layersState, selectedId);
      if (!selected) return;

      document.getElementById('footer-selected-name').innerText = selected.name + (selectedIsMask ? ' / Mask' : '');
      document.getElementById('ungroup-btn').style.display = selected.type === 'folder' ? 'inline-block' : 'none';

      const blend = selectedIsMask && selected.mask ? selected.mask.blend : selected.blend;
      const opacity = selectedIsMask && selected.mask ? selected.mask.density : selected.opacity;

      document.getElementById('footer-blend-label').innerText = blend;
      document.getElementById('footer-opacity-slider').value = opacity;
      document.getElementById('footer-opacity-label').innerText = opacity + '%';

      // Inspect Button in Header
      const inspectLabel = document.getElementById('inspect-btn-label');
      const inspectIcon = document.getElementById('inspect-btn-icon');
      if (selectedIsMask) {
        inspectLabel.innerText = 'Mask Props';
        inspectIcon.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M2 12a5 5 0 0 0 5 5 8 8 0 0 1 5 2 8 8 0 0 1 5-2 5 5 0 0 0 5-5V7h-2.5a6 6 0 0 0-4.5 2 6 6 0 0 0-4.5-2H2v5Z"/></svg>`;
      } else {
        inspectLabel.innerText = selected.type === 'folder' ? 'Folder Props' : 'Channels';
        inspectIcon.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4a90e2" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>`;
      }

      // Blend Mode Menu options
      const blendMenu = document.getElementById('blend-menu');
      let bHtml = '';
      for (const b of BLEND_MODES) {
        bHtml += `<button onclick="setLayerBlend('${b}')">${b}</button>`;
      }
      blendMenu.innerHTML = bHtml;
    }

    function setLayerBlend(b) {
      const selected = findLayerById(layersState, selectedId);
      if (!selected) return;
      if (selectedIsMask && selected.mask) {
        selected.mask.blend = b;
      } else {
        selected.blend = b;
      }
      document.getElementById('blend-menu').style.display = 'none';
      renderAll();
    }

    /* ══════════════════════════════════════════════════════════════════
       RENDER CHANNEL PROPERTIES VIEW
    ══════════════════════════════════════════════════════════════════ */
    function renderChannelProperties() {
      const container = document.getElementById('channel-inspector-body');
      const selected = findLayerById(layersState, selectedId) || layersState[0];
      if (!selected) return;

      document.getElementById('channel-layer-name').innerText = selected.name;
      document.getElementById('channel-layer-sub').innerText = selected.classification + ' · ' + selected.blend;
      document.getElementById('channel-layer-dot').style.backgroundColor = selected.color || '#8b5cf6';

      const enabledKeys = CHANNEL_ORDER.filter(k => selected.channels && selected.channels[k] && selected.channels[k].enabled);

      let html = '';

      // Chips region
      html += `
        <div class="chips-box">
          <div class="chips-box-header">
            <div style="display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-dim);">
              <span>Channels</span>
              <span class="count-pill" style="background: #ededed; color: #111; font-weight: 700;">${enabledKeys.length}</span>
            </div>
            ${enabledKeys.length > 1 ? `<button onclick="clearAllChannels()" style="background: none; border: none; color: var(--text-dim); font-size: 10px; cursor: pointer;">Clear all</button>` : ''}
          </div>

          <div class="chips-flex-wrap">
            ${enabledKeys.map(k => {
              const slot = CHANNEL_SLOTS[k];
              const isLocked = k === 'baseColour';
              return `
                <div class="channel-chip">
                  <span style="width: 8px; height: 8px; border-radius: 50%; background-color: ${slot.hue};"></span>
                  <span style="font-size: 11px; font-weight: 500;">${slot.label}</span>
                  ${!isLocked ? `<button class="remove-chip-btn" onclick="toggleChannelEnabled('${k}')">&times;</button>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      // Accordion Channel Cards
      for (const k of enabledKeys) {
        const slot = CHANNEL_SLOTS[k];
        const ch = selected.channels[k] || { enabled: true, mode: 'Value', value: 0.5, colour: slot.hue };
        const isFolded = collapsedChannels.has(k);
        const mode = slot.edit === 'derived' ? 'Derived' : (ch.mode || 'Value');

        html += `
          <div class="inspector-card" id="card-${k}">
            <div class="inspector-card-header" onclick="toggleChannelFold('${k}')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="2" style="transform: ${isFolded ? 'rotate(-90deg)' : 'rotate(0deg)'}; transition: transform 0.15s;">
                <path d="m6 9 6 6 6-6"/>
              </svg>
              <span style="width: 6px; height: 6px; border-radius: 50%; background-color: ${slot.hue};"></span>
              <span style="font-size: 11.5px; font-weight: 600; flex: 1;">${slot.label}</span>
              <span style="font-size: 9.5px; font-family: monospace; text-transform: uppercase; color: var(--text-dim);">${mode}</span>
            </div>

            ${!isFolded ? `
              <div class="inspector-card-content">
                ${slot.edit === 'derived' ? `
                  <div style="padding: 8px; border-radius: 6px; background: var(--bg-card); border: 1px solid var(--border-subtle); font-size: 11px; color: var(--text-muted);">
                    <div>Derived from height normals in real-time.</div>
                  </div>
                ` : `
                  <div class="source-segmented-row">
                    <span style="font-size: 11px; color: var(--text-muted);">Source</span>
                    <div class="segmented-control">
                      <button class="seg-btn ${mode === 'Value' ? 'active' : ''}" onclick="setChannelSourceMode('${k}', 'Value')">Value</button>
                      <button class="seg-btn ${mode === 'Texture' ? 'active' : ''}" onclick="setChannelSourceMode('${k}', 'Texture')">Texture</button>
                      <button class="seg-btn ${mode === 'Generator' ? 'active' : ''}" onclick="setChannelSourceMode('${k}', 'Generator')">Generator</button>
                    </div>
                  </div>

                  ${mode === 'Value' ? `
                    ${slot.edit === 'colour' ? `
                      <div class="prop-row" style="justify-content: space-between;">
                        <span class="prop-label">Colour</span>
                        <div class="color-swatch-picker-btn" onclick="openColorPicker('${k}', '${ch.colour || slot.hue}')">
                          <span class="swatch-dot" style="background-color: ${ch.colour || slot.hue};"></span>
                          <span class="hex-code">${ch.colour || slot.hue}</span>
                          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                        </div>
                      </div>
                    ` : `
                      <div class="prop-row">
                        <span class="prop-label">Amount</span>
                        <div class="tabular-num-box">
                          <input type="number" step="${slot.step || 0.01}" min="${slot.min ?? 0}" max="${slot.max ?? 1}" value="${ch.value}" onchange="setChannelScalarValue('${k}', Number(this.value))" />
                          <div class="unit-tag">${slot.unit || '–'}</div>
                        </div>
                        <input type="range" class="slider-track-input" min="${slot.min ?? 0}" max="${slot.max ?? 1}" step="${slot.step || 0.01}" value="${ch.value}" oninput="setChannelScalarValue('${k}', Number(this.value))" />
                      </div>
                    `}
                  ` : ''}

                  ${mode === 'Generator' ? `
                    <div style="padding: 8px; border-radius: 6px; background: var(--bg-card); border: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 8px;">
                      <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span style="font-size: 11px; font-weight: 600;">Procedural Edge Wear</span>
                        <span class="count-pill">Baked</span>
                      </div>
                      <div class="prop-row">
                        <span class="prop-label">Contrast</span>
                        <input type="range" class="slider-track-input" min="0" max="1" step="0.01" value="0.7" />
                      </div>
                    </div>
                  ` : ''}
                `}
              </div>
            ` : ''}
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function toggleChannelFold(k) {
      if (collapsedChannels.has(k)) collapsedChannels.delete(k);
      else collapsedChannels.add(k);
      renderChannelProperties();
    }

    function toggleChannelEnabled(k) {
      if (k === 'baseColour') return;
      const selected = findLayerById(layersState, selectedId);
      if (!selected) return;
      if (!selected.channels) selected.channels = {};
      const current = selected.channels[k];
      const isEnabled = current?.enabled ?? false;
      selected.channels[k] = {
        ...current,
        enabled: !isEnabled,
        mode: current?.mode || 'Value',
        value: current?.value ?? 0.5,
        colour: current?.colour ?? CHANNEL_SLOTS[k].hue
      };
      renderAll();
    }

    function clearAllChannels() {
      const selected = findLayerById(layersState, selectedId);
      if (!selected || !selected.channels) return;
      for (const k of CHANNEL_ORDER) {
        if (k !== 'baseColour' && selected.channels[k]) {
          selected.channels[k].enabled = false;
        }
      }
      renderAll();
    }

    function setChannelSourceMode(k, mode) {
      const selected = findLayerById(layersState, selectedId);
      if (!selected || !selected.channels[k]) return;
      selected.channels[k].mode = mode;
      renderChannelProperties();
    }

    function setChannelScalarValue(k, val) {
      const selected = findLayerById(layersState, selectedId);
      if (!selected || !selected.channels[k]) return;
      selected.channels[k].value = val;
      renderChannelProperties();
    }

    /* ══════════════════════════════════════════════════════════════════
       RENDER MASK PROPERTIES VIEW
    ══════════════════════════════════════════════════════════════════ */
    function renderMaskProperties() {
      const container = document.getElementById('mask-inspector-body');
      const selected = findLayerById(layersState, selectedId) || layersState[0];
      if (!selected || !selected.mask) {
        container.innerHTML = `
          <div style="padding: 30px; text-align: center; color: var(--text-dim);">
            <div>No mask attached to this layer.</div>
            <button class="inspect-btn" style="margin: 12px auto 0;" onclick="toggleSelectedMask()">Create Mask</button>
          </div>
        `;
        return;
      }

      const mask = selected.mask;
      document.getElementById('mask-clips-name').innerText = 'Clips to: ' + selected.name;

      let html = `
        <div class="inspector-card">
          <div class="inspector-card-content">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <div style="display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M2 12a5 5 0 0 0 5 5 8 8 0 0 1 5 2 8 8 0 0 1 5-2 5 5 0 0 0 5-5V7h-2.5a6 6 0 0 0-4.5 2 6 6 0 0 0-4.5-2H2v5Z"/></svg>
                <span>Mask Configuration</span>
              </div>
              <div style="display: flex; align-items: center; gap: 6px;">
                <button class="inspect-btn" style="padding: 2px 8px; font-size: 10px; ${mask.invert ? 'background: #fff; color: #000;' : ''}" onclick="mask.invert = !mask.invert; renderMaskProperties();">Invert</button>
                <button class="row-btn" onclick="mask.visible = !mask.visible; renderMaskProperties();">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    ${mask.visible ? '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>' : '<path d="m2 2 20 20M9.88 9.88a3 3 0 1 0 4.24 4.24"/>'}
                  </svg>
                </button>
              </div>
            </div>

            <!-- Density slider -->
            <div class="prop-row">
              <span class="prop-label">Density</span>
              <div class="tabular-num-box">
                <input type="number" min="0" max="100" value="${mask.density}" onchange="mask.density = Number(this.value); renderMaskProperties();" />
                <div class="unit-tag">%</div>
              </div>
              <input type="range" class="slider-track-input" min="0" max="100" value="${mask.density}" oninput="mask.density = Number(this.value); renderMaskProperties();" />
            </div>

            <!-- Mask Blend Mode -->
            <div class="prop-row" style="justify-content: space-between;">
              <span class="prop-label">Blend Mode</span>
              <select style="background: var(--bg-card); border: 1px solid var(--border-subtle); color: #fff; padding: 4px 8px; border-radius: 6px; font-family: monospace; font-size: 11px;" onchange="mask.blend = this.value; renderMaskProperties();">
                <option value="Multiply" ${mask.blend === 'Multiply' ? 'selected' : ''}>Multiply</option>
                <option value="Replace" ${mask.blend === 'Replace' ? 'selected' : ''}>Replace</option>
                <option value="Linear Dodge (Add)" ${mask.blend === 'Linear Dodge (Add)' ? 'selected' : ''}>Linear Dodge (Add)</option>
                <option value="Subtract" ${mask.blend === 'Subtract' ? 'selected' : ''}>Subtract</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Mask Source Preset -->
        <div class="inspector-card">
          <div class="inspector-card-header">
            <span style="font-size: 11.5px; font-weight: 600;">Procedural Generator</span>
          </div>
          <div class="inspector-card-content">
            <div class="prop-row" style="justify-content: space-between;">
              <span class="prop-label">Preset</span>
              <select style="background: var(--bg-card); border: 1px solid var(--border-subtle); color: #fff; padding: 4px 8px; border-radius: 6px; font-family: monospace; font-size: 11px;" onchange="mask.generatorKey = this.value; renderMaskProperties();">
                ${GENERATOR_CATALOGUE.map(g => `<option value="${g.key}" ${mask.generatorKey === g.key ? 'selected' : ''}>${g.label}</option>`).join('')}
              </select>
            </div>

            <div class="prop-row">
              <span class="prop-label">Balance</span>
              <input type="range" class="slider-track-input" min="0" max="1" step="0.01" value="0.5" />
            </div>
            <div class="prop-row">
              <span class="prop-label">Contrast</span>
              <input type="range" class="slider-track-input" min="0" max="1" step="0.01" value="0.75" />
            </div>
            <div class="prop-row">
              <span class="prop-label">Radius</span>
              <input type="range" class="slider-track-input" min="0" max="1" step="0.01" value="0.25" />
            </div>
          </div>
        </div>

        <!-- Target Channels -->
        <div class="chips-box">
          <div class="chips-box-header">
            <span style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-dim);">Applies to Channels</span>
          </div>
          <div class="chips-flex-wrap">
            ${['baseColour', 'metallic', 'roughness', 'height'].map(k => {
              const active = mask.channels.includes(k);
              return `
                <button class="channel-chip" style="${active ? 'border-color: var(--accent-gold); color: #fff;' : 'opacity: 0.5;'}" onclick="toggleMaskTargetChannel('${k}')">
                  <span style="width: 8px; height: 8px; border-radius: 50%; background-color: ${CHANNEL_SLOTS[k].hue};"></span>
                  <span>${CHANNEL_SLOTS[k].label}</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function toggleMaskTargetChannel(k) {
      const selected = findLayerById(layersState, selectedId);
      if (!selected || !selected.mask) return;
      const idx = selected.mask.channels.indexOf(k);
      if (idx !== -1) selected.mask.channels.splice(idx, 1);
      else selected.mask.channels.push(k);
      renderMaskProperties();
    }

    /* ══════════════════════════════════════════════════════════════════
       COLOR PICKER MODAL
    ══════════════════════════════════════════════════════════════════ */
    function openColorPicker(chKey, currentHex) {
      colorPickerTarget = { channelKey: chKey, hex: currentHex };
      const modal = document.getElementById('color-picker-modal');
      const grid = document.getElementById('palette-grid');
      document.getElementById('custom-hex-input').value = currentHex;

      grid.innerHTML = SWATCH_PALETTE.map(hex => `
        <div class="palette-cell" style="background-color: ${hex};" onclick="selectColorSwatch('${hex}')"></div>
      `).join('');

      modal.style.display = 'flex';
    }

    function selectColorSwatch(hex) {
      if (!colorPickerTarget) return;
      const selected = findLayerById(layersState, selectedId);
      if (selected && selected.channels && selected.channels[colorPickerTarget.channelKey]) {
        selected.channels[colorPickerTarget.channelKey].colour = hex;
      }
      closeColorPicker();
      renderAll();
    }

    function applyCustomHex() {
      const hex = document.getElementById('custom-hex-input').value;
      if (hex) selectColorSwatch(hex);
    }

    function closeColorPicker() {
      document.getElementById('color-picker-modal').style.display = 'none';
      colorPickerTarget = null;
    }

    /* ══════════════════════════════════════════════════════════════════
       INITIAL MOUNT & RENDER ALL
    ══════════════════════════════════════════════════════════════════ */
    function renderAll() {
      renderLayerList();
      renderChannelProperties();
      renderMaskProperties();
    }

    // Initialize on load
    renderAll();
  </script>
</body>
</html>
