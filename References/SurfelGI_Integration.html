<script type="module">
/* =========================================================================
   SURFEL GI — PHASE 3
   Cone tracing the surfel hierarchy, MSME temporal filtering, ray guiding,
   radial depth moments, irradiance sharing, hierarchy propagation.
   ========================================================================= */

const canvas = document.getElementById('gfx');
const errEl  = document.getElementById('err');
function fatal(msg){ errEl.style.display='grid'; errEl.textContent = msg; throw new Error(msg); }

/* ------------------------------------------------------------------ math */
const V3 = {
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  scale:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]),
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}
};
function m4id(){ const m=new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
function m4mul(a,b,out){ // column-major, out = a*b
  const o = out||new Float32Array(16);
  for(let c=0;c<4;c++) for(let r=0;r<4;r++){
    o[c*4+r]=a[0*4+r]*b[c*4+0]+a[1*4+r]*b[c*4+1]+a[2*4+r]*b[c*4+2]+a[3*4+r]*b[c*4+3];
  }
  return o;
}
function m4persp(fovy,aspect,n,f){
  const m=new Float32Array(16), t=1/Math.tan(fovy/2);
  m[0]=t/aspect; m[5]=t; m[10]=f/(n-f); m[11]=-1; m[14]=(n*f)/(n-f);
  return m;
}
function m4ortho(l,r,b,t,n,f){
  const m=m4id();
  m[0]=2/(r-l); m[5]=2/(t-b); m[10]=1/(n-f);
  m[12]=-(r+l)/(r-l); m[13]=-(t+b)/(t-b); m[14]=n/(n-f);
  return m;
}
function m4look(eye,center,up){
  const z=V3.norm(V3.sub(eye,center));
  const x=V3.norm(V3.cross(up,z));
  const y=V3.cross(z,x);
  const m=m4id();
  m[0]=x[0];m[4]=x[1];m[8]=x[2];
  m[1]=y[0];m[5]=y[1];m[9]=y[2];
  m[2]=z[0];m[6]=z[1];m[10]=z[2];
  m[12]=-V3.dot(x,eye); m[13]=-V3.dot(y,eye); m[14]=-V3.dot(z,eye);
  return m;
}
function m4inv(m){
  const o=new Float32Array(16);
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3], a10=m[4],a11=m[5],a12=m[6],a13=m[7],
        a20=m[8],a21=m[9],a22=m[10],a23=m[11], a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10,
        b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12,
        b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30,
        b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
  let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if(!det) return m4id(); det=1/det;
  o[0]=(a11*b11-a12*b10+a13*b09)*det; o[1]=(a02*b10-a01*b11-a03*b09)*det;
  o[2]=(a31*b05-a32*b04+a33*b03)*det; o[3]=(a22*b04-a21*b05-a23*b03)*det;
  o[4]=(a12*b08-a10*b11-a13*b07)*det; o[5]=(a00*b11-a02*b08+a03*b07)*det;
  o[6]=(a32*b02-a30*b05-a33*b01)*det; o[7]=(a20*b05-a22*b02+a23*b01)*det;
  o[8]=(a10*b10-a11*b08+a13*b06)*det; o[9]=(a01*b08-a00*b10-a03*b06)*det;
  o[10]=(a30*b04-a31*b02+a33*b00)*det; o[11]=(a21*b02-a20*b04-a23*b00)*det;
  o[12]=(a11*b07-a10*b09-a12*b06)*det; o[13]=(a00*b09-a01*b07+a02*b06)*det;
  o[14]=(a31*b01-a30*b03-a32*b00)*det; o[15]=(a20*b03-a21*b01+a22*b00)*det;
  return o;
}
function m4transpose(m){
  const o=new Float32Array(16);
  for(let c=0;c<4;c++)for(let r=0;r<4;r++) o[c*4+r]=m[r*4+c];
  return o;
}
function compose(pos, ry, rx, s){
  const cy=Math.cos(ry), sy=Math.sin(ry), cx=Math.cos(rx), sx=Math.sin(rx);
  // R = Ry * Rx
  const r00=cy,        r01=sy*sx,  r02=sy*cx;
  const r10=0,         r11=cx,     r12=-sx;
  const r20=-sy,       r21=cy*sx,  r22=cy*cx;
  const m=new Float32Array(16);
  m[0]=r00*s; m[1]=r10*s; m[2]=r20*s;  m[3]=0;
  m[4]=r01*s; m[5]=r11*s; m[6]=r21*s;  m[7]=0;
  m[8]=r02*s; m[9]=r12*s; m[10]=r22*s; m[11]=0;
  m[12]=pos[0]; m[13]=pos[1]; m[14]=pos[2]; m[15]=1;
  return m;
}

/* --------------------------------------------------------- mesh builders */
function mkMesh(pos, nrm, idx){ return {pos:new Float32Array(pos), nrm:new Float32Array(nrm), idx:new Uint32Array(idx)}; }

function planeMesh(size, seg){
  const p=[],n=[],i=[], h=size/2;
  for(let z=0;z<=seg;z++) for(let x=0;x<=seg;x++){
    p.push(-h + size*x/seg, 0, -h + size*z/seg); n.push(0,1,0);
  }
  for(let z=0;z<seg;z++) for(let x=0;x<seg;x++){
    const a=z*(seg+1)+x, b=a+1, c=a+seg+1, d=c+1;
    i.push(a,c,b, b,c,d);
  }
  return mkMesh(p,n,i);
}
function sphereMesh(r, su, sv){
  const p=[],n=[],i=[];
  for(let y=0;y<=sv;y++){ const v=y/sv, th=v*Math.PI;
    for(let x=0;x<=su;x++){ const u=x/su, ph=u*Math.PI*2;
      const nx=Math.sin(th)*Math.cos(ph), ny=Math.cos(th), nz=Math.sin(th)*Math.sin(ph);
      n.push(nx,ny,nz); p.push(nx*r,ny*r,nz*r);
    }}
  for(let y=0;y<sv;y++) for(let x=0;x<su;x++){
    const a=y*(su+1)+x,b=a+1,c=a+su+1,d=c+1; i.push(a,c,b, b,c,d);
  }
  return mkMesh(p,n,i);
}
function boxMesh(sx,sy,sz,seg){
  const p=[],n=[],i=[];
  const faces=[
    [[1,0,0],[0,1,0],[0,0,1]], [[-1,0,0],[0,1,0],[0,0,-1]],
    [[0,1,0],[0,0,1],[1,0,0]], [[0,-1,0],[0,0,-1],[1,0,0]],
    [[0,0,1],[0,1,0],[-1,0,0]],[[0,0,-1],[0,1,0],[1,0,0]]
  ];
  const half=[sx/2,sy/2,sz/2];
  for(const [nr,uA,vA] of faces){
    const base=p.length/3;
    for(let b=0;b<=seg;b++) for(let a=0;a<=seg;a++){
      const fu=(a/seg)*2-1, fv=(b/seg)*2-1;
      const px=(nr[0]+uA[0]*fu+vA[0]*fv)*half[0];
      const py=(nr[1]+uA[1]*fu+vA[1]*fv)*half[1];
      const pz=(nr[2]+uA[2]*fu+vA[2]*fv)*half[2];
      p.push(px,py,pz); n.push(nr[0],nr[1],nr[2]);
    }
    for(let b=0;b<seg;b++) for(let a=0;a<seg;a++){
      const q=base+b*(seg+1)+a; i.push(q,q+seg+1,q+1, q+1,q+seg+1,q+seg+2);
    }
  }
  return mkMesh(p,n,i);
}
function cylinderMesh(r,h,su,capSeg){
  const p=[],n=[],i=[], hh=h/2;
  for(let y=0;y<=1;y++) for(let x=0;x<=su;x++){
    const a=x/su*Math.PI*2, cx=Math.cos(a), cz=Math.sin(a);
    p.push(cx*r, -hh+y*h, cz*r); n.push(cx,0,cz);
  }
  for(let x=0;x<su;x++){ const a=x,b=a+1,c=a+su+1,d=c+1; i.push(a,c,b, b,c,d); }
  for(const sgn of [1,-1]){
    const base=p.length/3;
    p.push(0,sgn*hh,0); n.push(0,sgn,0);
    for(let x=0;x<=su;x++){ const a=x/su*Math.PI*2;
      p.push(Math.cos(a)*r, sgn*hh, Math.sin(a)*r); n.push(0,sgn,0); }
    for(let x=0;x<su;x++){
      if(sgn>0) i.push(base, base+1+x, base+2+x); else i.push(base, base+2+x, base+1+x);
    }
  }
  return mkMesh(p,n,i);
}
function coneMesh(r,h,su){
  const p=[],n=[],i=[], hh=h/2;
  const sl=Math.hypot(r,h);
  for(let x=0;x<=su;x++){
    const a=x/su*Math.PI*2, cx=Math.cos(a), cz=Math.sin(a);
    const nx=cx*h/sl, ny=r/sl, nz=cz*h/sl;
    p.push(cx*r,-hh,cz*r); n.push(nx,ny,nz);
    p.push(0,hh,0);        n.push(nx,ny,nz);
  }
  for(let x=0;x<su;x++){ const a=x*2; i.push(a,a+2,a+1); }
  const base=p.length/3;
  p.push(0,-hh,0); n.push(0,-1,0);
  for(let x=0;x<=su;x++){ const a=x/su*Math.PI*2; p.push(Math.cos(a)*r,-hh,Math.sin(a)*r); n.push(0,-1,0); }
  for(let x=0;x<su;x++) i.push(base, base+2+x, base+1+x);
  return mkMesh(p,n,i);
}
function torusMesh(R,r,su,sv){
  const p=[],n=[],i=[];
  for(let u=0;u<=su;u++){ const a=u/su*Math.PI*2, ca=Math.cos(a), sa=Math.sin(a);
    for(let v=0;v<=sv;v++){ const b=v/sv*Math.PI*2, cb=Math.cos(b), sb=Math.sin(b);
      const nx=ca*cb, ny=sb, nz=sa*cb;
      p.push(ca*(R+r*cb), r*sb, sa*(R+r*cb)); n.push(nx,ny,nz);
    }}
  for(let u=0;u<su;u++) for(let v=0;v<sv;v++){
    const a=u*(sv+1)+v,b=a+1,c=a+sv+1,d=c+1; i.push(a,c,b, b,c,d);
  }
  return mkMesh(p,n,i);
}
function capsuleMesh(r,cyl,su,sv){
  const p=[],n=[],i=[], hh=cyl/2;
  const rings=[];
  for(let y=0;y<=sv;y++){ // top hemi
    const th=(y/sv)*Math.PI/2;
    rings.push({y:hh+Math.cos(th)*r, rad:Math.sin(th)*r, ny:Math.cos(th), off:hh});
  }
  rings.push({y:-hh, rad:r, ny:0, off:-hh});
  for(let y=1;y<=sv;y++){
    const th=Math.PI/2+(y/sv)*Math.PI/2;
    rings.push({y:-hh+Math.cos(th)*r, rad:Math.sin(th)*r, ny:Math.cos(th), off:-hh});
  }
  for(const R of rings){
    for(let x=0;x<=su;x++){ const a=x/su*Math.PI*2, cx=Math.cos(a), cz=Math.sin(a);
      p.push(cx*R.rad, R.y, cz*R.rad);
      const nn=V3.norm([cx*R.rad, R.y-R.off, cz*R.rad]);
      n.push(nn[0],nn[1],nn[2]);
    }}
  for(let ri=0;ri<rings.length-1;ri++) for(let x=0;x<su;x++){
    const a=ri*(su+1)+x,b=a+1,c=a+su+1,d=c+1; i.push(a,c,b, b,c,d);
  }
  return mkMesh(p,n,i);
}

/* =========================================================================
   OFFLINE BAKE  (§3 of the plan)
   1. curvature-adaptive target radius per vertex
   2. area-weighted candidate generation
   3. weighted sample elimination (Yuksel 2015) -> blue-noise leaf surfels
   4. Morton + normal-octant sort, bottom-up 4-ary hierarchy w/ normal cones
   ========================================================================= */

const NODE_FLOATS = 24; // 6 * vec4f, 96 bytes (added child/parent links)

function computeCurvature(mesh){
  const {pos,nrm,idx}=mesh, vc=pos.length/3;
  // weld by quantised position
  const map=new Map(), rep=new Int32Array(vc);
  const Q=1e4;
  for(let v=0;v<vc;v++){
    const k=`${Math.round(pos[v*3]*Q)},${Math.round(pos[v*3+1]*Q)},${Math.round(pos[v*3+2]*Q)}`;
    let r=map.get(k); if(r===undefined){ r=v; map.set(k,v); }
    rep[v]=r;
  }
  // welded averaged normals
  const wn=new Float32Array(vc*3), wc=new Float32Array(vc);
  for(let v=0;v<vc;v++){ const r=rep[v];
    wn[r*3]+=nrm[v*3]; wn[r*3+1]+=nrm[v*3+1]; wn[r*3+2]+=nrm[v*3+2]; wc[r]++; }
  for(let v=0;v<vc;v++){ if(wc[v]>0){
    const l=Math.hypot(wn[v*3],wn[v*3+1],wn[v*3+2])||1;
    wn[v*3]/=l; wn[v*3+1]/=l; wn[v*3+2]/=l; } }
  // adjacency (welded)
  const adj=new Map();
  const addE=(a,b)=>{ let s=adj.get(a); if(!s){s=new Set();adj.set(a,s);} s.add(b); };
  for(let t=0;t<idx.length;t+=3){
    const a=rep[idx[t]],b=rep[idx[t+1]],c=rep[idx[t+2]];
    addE(a,b);addE(b,a);addE(b,c);addE(c,b);addE(c,a);addE(a,c);
  }
  // kappa = max over neighbours of angle(n_v,n_j)/dist   [1/m]
  const kap=new Float32Array(vc);
  for(const [v,ns] of adj){
    let k=0;
    for(const j of ns){
      const d=Math.hypot(pos[v*3]-pos[j*3],pos[v*3+1]-pos[j*3+1],pos[v*3+2]-pos[j*3+2]);
      if(d<1e-6) continue;
      let c=wn[v*3]*wn[j*3]+wn[v*3+1]*wn[j*3+1]+wn[v*3+2]*wn[j*3+2];
      c=Math.max(-1,Math.min(1,c));
      k=Math.max(k, Math.acos(c)/d);
    }
    kap[v]=k;
  }
  const out=new Float32Array(vc);
  for(let v=0;v<vc;v++) out[v]=kap[rep[v]];
  return out;
}

class MaxHeap{
  constructor(){ this.w=[]; this.i=[]; }
  get size(){ return this.w.length; }
  push(w,i){
    const W=this.w,I=this.i; let n=W.length; W.push(w); I.push(i);
    while(n>0){ const p=(n-1)>>1; if(W[p]>=W[n])break;
      [W[p],W[n]]=[W[n],W[p]]; [I[p],I[n]]=[I[n],I[p]]; n=p; }
  }
  pop(){
    const W=this.w,I=this.i; const rw=W[0],ri=I[0];
    const lw=W.pop(), li=I.pop();
    if(W.length){ W[0]=lw; I[0]=li; let n=0;
      for(;;){ const l=2*n+1,r=l+1; let m=n;
        if(l<W.length&&W[l]>W[m])m=l; if(r<W.length&&W[r]>W[m])m=r;
        if(m===n)break; [W[m],W[n]]=[W[n],W[m]]; [I[m],I[n]]=[I[n],I[m]]; n=m; }
    }
    return [rw,ri];
  }
}

function bakeLeafSurfels(mesh, spacing, curvGain, rng){
  const {pos,nrm,idx}=mesh;
  const kap = computeCurvature(mesh);
  const nTri = idx.length/3;
  const cum = new Float64Array(nTri+1);
  let area=0;
  for(let t=0;t<nTri;t++){
    const a=idx[t*3],b=idx[t*3+1],c=idx[t*3+2];
    const e1=[pos[b*3]-pos[a*3],pos[b*3+1]-pos[a*3+1],pos[b*3+2]-pos[a*3+2]];
    const e2=[pos[c*3]-pos[a*3],pos[c*3+1]-pos[a*3+1],pos[c*3+2]-pos[a*3+2]];
    const cr=V3.cross(e1,e2); area += 0.5*V3.len(cr); cum[t+1]=area;
  }
  const rTarget = k => {
    const r = spacing/(1 + curvGain*k*spacing);
    return Math.max(spacing*0.15, Math.min(spacing, r));
  };
  // pilot pass -> estimate N
  const PILOT=512; let dens=0;
  for(let s=0;s<PILOT;s++){
    const t=pickTri(cum,nTri,rng()); const bc=baryc(rng(),rng());
    const k=interp3(kap,idx,t,bc); const r=rTarget(k);
    dens += 1/(0.9*r*r);
  }
  let N = Math.round(area * dens/PILOT);
  N = Math.max(48, Math.min(90000, N));
  const M = Math.max(N+32, Math.round(N*3.2));

  // candidates
  const cx=new Float64Array(M),cy=new Float64Array(M),cz=new Float64Array(M);
  const nx=new Float64Array(M),ny=new Float64Array(M),nz=new Float64Array(M);
  const cr=new Float64Array(M);
  let rmax=0;
  for(let s=0;s<M;s++){
    const t=pickTri(cum,nTri,rng()); const bc=baryc(rng(),rng());
    const a=idx[t*3],b=idx[t*3+1],c=idx[t*3+2];
    cx[s]=pos[a*3]*bc[0]+pos[b*3]*bc[1]+pos[c*3]*bc[2];
    cy[s]=pos[a*3+1]*bc[0]+pos[b*3+1]*bc[1]+pos[c*3+1]*bc[2];
    cz[s]=pos[a*3+2]*bc[0]+pos[b*3+2]*bc[1]+pos[c*3+2]*bc[2];
    let vx=nrm[a*3]*bc[0]+nrm[b*3]*bc[1]+nrm[c*3]*bc[2];
    let vy=nrm[a*3+1]*bc[0]+nrm[b*3+1]*bc[1]+nrm[c*3+1]*bc[2];
    let vz=nrm[a*3+2]*bc[0]+nrm[b*3+2]*bc[1]+nrm[c*3+2]*bc[2];
    const l=Math.hypot(vx,vy,vz)||1; nx[s]=vx/l; ny[s]=vy/l; nz[s]=vz/l;
    cr[s]=rTarget(interp3(kap,idx,t,bc));
    if(cr[s]>rmax) rmax=cr[s];
  }

  // spatial hash
  const cs = 2*rmax;
  const CO=1024, CSD=2048;
  const ck=(i,j,k)=>((i+CO)*CSD+(j+CO))*CSD+(k+CO);
  const grid=new Map();
  const bi=new Int32Array(M),bj=new Int32Array(M),bk=new Int32Array(M);
  for(let s=0;s<M;s++){
    bi[s]=Math.floor(cx[s]/cs); bj[s]=Math.floor(cy[s]/cs); bk[s]=Math.floor(cz[s]/cs);
    const key=ck(bi[s],bj[s],bk[s]);
    let arr=grid.get(key); if(!arr){arr=[];grid.set(key,arr);} arr.push(s);
  }
  const removed=new Uint8Array(M);
  const wt=new Float64Array(M);
  const kern=(i,j)=>{
    const dx=cx[i]-cx[j],dy=cy[i]-cy[j],dz=cz[i]-cz[j];
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
    const r=0.5*(cr[i]+cr[j]), lim=2*r;
    if(d>=lim) return 0;
    const t=1-d/lim; const t2=t*t, t4=t2*t2; return t4*t4; // ^8
  };
  const forEachNb=(s,fn)=>{
    for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++)for(let dk=-1;dk<=1;dk++){
      const arr=grid.get(ck(bi[s]+di,bj[s]+dj,bk[s]+dk)); if(!arr) continue;
      for(let q=0;q<arr.length;q++){ const j=arr[q]; if(j!==s && !removed[j]) fn(j); }
    }
  };
  for(let s=0;s<M;s++){ let w=0; forEachNb(s,j=>{ w+=kern(s,j); }); wt[s]=w; }
  const heap=new MaxHeap();
  for(let s=0;s<M;s++) heap.push(wt[s],s);
  let alive=M;
  while(alive>N && heap.size>0){
    const [w,s]=heap.pop();
    if(removed[s]) continue;
    if(w!==wt[s]) { heap.push(wt[s],s); continue; }
    removed[s]=1; alive--;
    forEachNb(s,j=>{ wt[j]-=kern(s,j); heap.push(wt[j],j); });
  }
  // area-equivalent disc radius: pi*r^2 = 0.9*ri^2  ->  r = 0.535*ri
  const K=Math.sqrt(0.9/Math.PI);
  const out=[];
  for(let s=0;s<M;s++) if(!removed[s])
    out.push({p:[cx[s],cy[s],cz[s]], n:[nx[s],ny[s],nz[s]], r:cr[s]*K});
  return {leaves:out, area, requested:N};
}
function pickTri(cum,n,u){
  const target=u*cum[n]; let lo=0,hi=n;
  while(lo<hi){ const m=(lo+hi)>>1; if(cum[m+1]<target) lo=m+1; else hi=m; }
  return Math.min(lo,n-1);
}
function baryc(u,v){ const s=Math.sqrt(u); return [1-s, s*(1-v), s*v]; }
function interp3(arr,idx,t,bc){
  return arr[idx[t*3]]*bc[0]+arr[idx[t*3+1]]*bc[1]+arr[idx[t*3+2]]*bc[2];
}

const BRANCH = 4;
function buildHierarchy(leaves){
  const L=leaves.length;
  // bbox
  let mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
  for(const s of leaves) for(let a=0;a<3;a++){ mn[a]=Math.min(mn[a],s.p[a]); mx[a]=Math.max(mx[a],s.p[a]); }
  const ext=[Math.max(1e-4,mx[0]-mn[0]),Math.max(1e-4,mx[1]-mn[1]),Math.max(1e-4,mx[2]-mn[2])];
  const part=v=>{ let x=Math.max(0,Math.min(1023,Math.floor(v*1024)));
    x=(x|(x<<16))&0x030000FF; x=(x|(x<<8))&0x0300F00F; x=(x|(x<<4))&0x030C30C3; x=(x|(x<<2))&0x09249249; return x; };
  for(const s of leaves){
    const m = part((s.p[0]-mn[0])/ext[0]) | (part((s.p[1]-mn[1])/ext[1])<<1) | (part((s.p[2]-mn[2])/ext[2])<<2);
    const oct=(s.n[0]>0?1:0)|(s.n[1]>0?2:0)|(s.n[2]>0?4:0);
    s.key = oct*1073741824 + m;         // normal octant is the high field
  }
  leaves.sort((a,b)=>a.key-b.key);

  // flat node array; leaves first
  const nodes=[];
  for(const s of leaves){
    nodes.push({p:s.p.slice(), n:s.n.slice(), r:s.r, area:Math.PI*s.r*s.r,
                bc:s.p.slice(), br:s.r, halfAng:0, level:0, leaf:1, kids:[], parent:-1});
  }
  let start=0, count=L, level=0;
  while(count>1){
    const nStart=nodes.length;
    for(let g=start; g<start+count; g+=BRANCH){
      const kids=[]; for(let q=g;q<Math.min(g+BRANCH,start+count);q++) kids.push(q);
      let A=0, px=0,py=0,pz=0, ax=0,ay=0,az=0, r2=0;
      for(const k of kids){ const c=nodes[k]; A+=c.area;
        px+=c.p[0]*c.area; py+=c.p[1]*c.area; pz+=c.p[2]*c.area;
        ax+=c.n[0]*c.area; ay+=c.n[1]*c.area; az+=c.n[2]*c.area;
        r2+=c.r*c.r; }
      const P=[px/A,py/A,pz/A];
      let ax2=[ax,ay,az]; const al=Math.hypot(ax,ay,az);
      const axis = al>1e-8 ? [ax/al,ay/al,az/al] : nodes[kids[0]].n.slice();
      let half=0;
      for(const k of kids){ const c=nodes[k];
        let d=Math.max(-1,Math.min(1,V3.dot(axis,c.n)));
        half=Math.max(half, Math.acos(d)+c.halfAng);
      }
      half=Math.min(half, Math.PI);
      // bounding sphere over children
      let bx=0,by=0,bz=0;
      for(const k of kids){ bx+=nodes[k].bc[0]; by+=nodes[k].bc[1]; bz+=nodes[k].bc[2]; }
      const BC=[bx/kids.length,by/kids.length,bz/kids.length];
      let BR=0;
      for(const k of kids){ const c=nodes[k];
        BR=Math.max(BR, Math.hypot(BC[0]-c.bc[0],BC[1]-c.bc[1],BC[2]-c.bc[2])+c.br); }
      const R=Math.sqrt(r2);
      nodes.push({p:P, n:axis, r:R, area:A, bc:BC, br:Math.max(BR,R),
                  halfAng:half, level:level+1, leaf:0, kids, parent:-1});
      const pi=nodes.length-1;
      for(const k of kids) nodes[k].parent=pi;
    }
    start=nStart; count=nodes.length-nStart; level++;
  }
  const root=nodes.length-1;
  nodes[root].parent=-1;

  // pack
  const buf=new Float32Array(nodes.length*NODE_FLOATS);
  for(let i=0;i<nodes.length;i++){
    const nd=nodes[i], o=i*NODE_FLOATS;
    buf[o+0]=nd.p[0]; buf[o+1]=nd.p[1]; buf[o+2]=nd.p[2]; buf[o+3]=nd.r;
    buf[o+4]=nd.n[0]; buf[o+5]=nd.n[1]; buf[o+6]=nd.n[2]; buf[o+7]=Math.cos(nd.halfAng);
    buf[o+8]=nd.bc[0]; buf[o+9]=nd.bc[1]; buf[o+10]=nd.bc[2]; buf[o+11]=nd.br;
    if(nd.parent>=0){ const P=nodes[nd.parent];
      buf[o+12]=P.bc[0]; buf[o+13]=P.bc[1]; buf[o+14]=P.bc[2]; buf[o+15]=P.br;
    } else { buf[o+12]=0;buf[o+13]=0;buf[o+14]=0;buf[o+15]=-1; }
    buf[o+16]=nd.level; buf[o+17]=nd.leaf; buf[o+18]=nd.area; buf[o+19]=0;
    // links: children are contiguous by construction (bottom-up 4-ary build)
    buf[o+20]=nd.kids.length? nd.kids[0] : 0;
    buf[o+21]=nd.kids.length;
    buf[o+22]=nd.parent; // local index, -1 at root
    buf[o+23]=i;
  }
  return {buf, count:nodes.length, leafCount:L, levels:level+1};
}

function mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

const PI : f32 = 3.14159265359;

fn skyBase(d: vec3f) -> vec3f {
  let up = clamp(d.y, -1.0, 1.0);
  let horizon = vec3f(0.72, 0.81, 0.93);
  let zenith  = vec3f(0.17, 0.34, 0.72);
  let ground  = vec3f(0.21, 0.20, 0.19);
  var c = mix(horizon, zenith, pow(max(up, 0.0), 0.5));
  c = mix(c, ground, clamp(-up * 4.0, 0.0, 1.0));
  let cd = max(dot(d, G.sunDir.xyz), 0.0);
  c += G.sunCol.rgb * pow(cd, 8.0) * 0.14;
  return c * G.sky.x;
}
fn skyWithSun(d: vec3f) -> vec3f {
  var c = skyBase(d);
  let cd = max(dot(d, G.sunDir.xyz), 0.0);
  c += G.sunCol.rgb * G.sunDir.w * pow(cd, 2200.0) * 8.0;
  return c;
}
fn skyAmbient(n: vec3f) -> vec3f {
  let a = skyBase(n);
  let b = skyBase(normalize(n + vec3f(0.0, 1.0, 0.0) * 0.95));
  let c = skyBase(normalize(n - vec3f(0.0, 1.0, 0.0) * 0.95));
  return (a * 0.5 + b * 0.32 + c * 0.18) * G.sky.z;
}

fn aces(x: vec3f) -> vec3f {
  let a = 2.51; let b = 0.03; let c = 2.43; let d = 0.59; let e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), vec3f(0.0), vec3f(1.0));
}
fn tonemap(c: vec3f) -> vec3f { return pow(aces(c * G.sunCol.w), vec3f(1.0 / 2.2)); }

fn F_Schlick(f0: vec3f, u: f32) -> vec3f { return f0 + (vec3f(1.0) - f0) * pow(1.0 - u, 5.0); }
fn D_GGX(NoH: f32, a: f32) -> f32 {
  let a2 = a * a; let d = NoH * NoH * (a2 - 1.0) + 1.0;
  return a2 / max(PI * d * d, 1e-7);
}
fn V_Smith(NoV: f32, NoL: f32, a: f32) -> f32 {
  let a2 = a * a;
  let gv = NoL * sqrt(NoV * NoV * (1.0 - a2) + a2);
  let gl = NoV * sqrt(NoL * NoL * (1.0 - a2) + a2);
  return 0.5 / max(gv + gl, 1e-5);
}
fn envDFG(f0: vec3f, rough: f32, NoV: f32) -> vec3f {
  let c0 = vec4f(-1.0, -0.0275, -0.572, 0.022);
  let c1 = vec4f( 1.0,  0.0425,  1.04,  -0.04);
  let r  = vec4f(rough) * c0 + c1;
  let a004 = min(r.x  *r.x, exp2(-9.28*  NoV)) * r.x + r.y;
  return f0  *(-1.04*  a004 + r.z) + vec3f(1.04 * a004 + r.w);
}

fn vhash(p: vec3f) -> f32 {
  var q = fract(p * 0.3183099 + vec3f(0.11, 0.27, 0.39));
  q += dot(q, q.yzx + 19.19);
  return fract((q.x + q.y) * q.z);
}
fn vnoise(p: vec3f) -> f32 {
  let i = floor(p); let f = fract(p);
  let u = f * f * (3.0 - 2.0 * f);
  let x00 = mix(vhash(i + vec3f(0.0,0.0,0.0)), vhash(i + vec3f(1.0,0.0,0.0)), u.x);
  let x10 = mix(vhash(i + vec3f(0.0,1.0,0.0)), vhash(i + vec3f(1.0,1.0,0.0)), u.x);
  let x01 = mix(vhash(i + vec3f(0.0,0.0,1.0)), vhash(i + vec3f(1.0,0.0,1.0)), u.x);
  let x11 = mix(vhash(i + vec3f(0.0,1.0,1.0)), vhash(i + vec3f(1.0,1.0,1.0)), u.x);
  return mix(mix(x00, x10, u.y), mix(x01, x11, u.y), u.z);
}
fn bumpH(p: vec3f, pattern: u32) -> f32 {
  if (pattern == 1u) { return sin(p.x * 16.0) * sin(p.y * 16.0) * sin(p.z * 16.0); }
  if (pattern == 2u) { return sin((p.x + p.y + p.z) * 24.0) * 0.6 + sin(p.y * 47.0) * 0.2; }
  if (pattern == 3u) { return vnoise(p * 11.0) + 0.5 * vnoise(p * 26.0); }
  return 0.0;
}
fn perturbNormal(n: vec3f, op: vec3f, strength: f32, pattern: u32) -> vec3f {
  if (strength <= 0.0 || pattern == 0u) { return n; }
  let e = 0.006;
  let h0 = bumpH(op, pattern);
  let g = vec3f(bumpH(op + vec3f(e,0.0,0.0), pattern) - h0,
                bumpH(op + vec3f(0.0,e,0.0), pattern) - h0,
                bumpH(op + vec3f(0.0,0.0,e), pattern) - h0) / e;
  let sg = g - n * dot(n, g);
  return normalize(n - strength * 0.06 * sg);
}
fn hsv(h: f32) -> vec3f {
  let k = fract(vec3f(h) + vec3f(1.0, 2.0/3.0, 1.0/3.0)) * 6.0 - vec3f(3.0);
  return clamp(abs(k) - vec3f(1.0), vec3f(0.0), vec3f(1.0));
}

/* ---- hemi-octahedral basis (guiding + radial depth parameterisation) --- */
fn hemiOctEncode(v: vec3f) -> vec2f {
  let p = v.xy / (abs(v.x) + abs(v.y) + max(v.z, 0.0) + 1e-6);
  return vec2f(p.x + p.y, p.x - p.y) * 0.5 + vec2f(0.5);
}
fn hemiOctDecode(u: vec2f) -> vec3f {
  let f = u * 2.0 - vec2f(1.0);
  let g = vec2f(f.x + f.y, f.x - f.y) * 0.5;
  return normalize(vec3f(g, max(1.0 - abs(g.x) - abs(g.y), 1e-4)));
}
fn onb(n: vec3f) -> mat3x3f { // Duff et al. branchless ONB
  let s = select(-1.0, 1.0, n.z >= 0.0);
  let a = -1.0 / (s + n.z);
  let b = n.x * n.y * a;
  return mat3x3f(vec3f(1.0 + s*n.x*n.x*a, s*b, -s*n.x), vec3f(b, s + n.y*n.y*a, -n.y), n);
}
fn binOf(local: vec3f, res: u32) -> u32 {
  let uv = clamp(hemiOctEncode(local), vec2f(0.0), vec2f(0.99999));
  let c = vec2u(uv * f32(res));
  return c.y * res + c.x;
}
fn octEnc(v: vec3f) -> vec2f {
  let n = v / max(abs(v.x) + abs(v.y) + abs(v.z), 1e-6);
  if (n.z >= 0.0) { return n.xy; }
  return (vec2f(1.0) - abs(vec2f(n.y, n.x))) *
         vec2f(select(-1.0, 1.0, n.x >= 0.0), select(-1.0, 1.0, n.y >= 0.0));
}
fn octDec(e: vec2f) -> vec3f {
  var v = vec3f(e, 1.0 - abs(e.x) - abs(e.y));
  if (v.z < 0.0) {
    let s = vec2f(select(-1.0, 1.0, v.x >= 0.0), select(-1.0, 1.0, v.y >= 0.0));
    v = vec3f((vec2f(1.0) - abs(vec2f(v.y, v.x))) * s, v.z);
  }
  return normalize(v);
}
/* ---- cascaded hash grid ------------------------------------------------ */
fn cascadeOf(camDist: f32) -> u32 {
  return clamp(u32(max(log2(max(camDist, 1e-3) / 6.0), 0.0)), 0u, 3u);
}
fn cellOf(c: u32) -> f32 { return max(G.gi.x, 0.2) * 2.0 * exp2(f32(c)); }
fn hashCell(ci: vec3i, c: u32) -> u32 {
  let u = bitcast<vec3u>(ci);
  var h = (u.x * 73856093u) ^ (u.y * 19349663u) ^ (u.z * 83492791u) ^ ((c + 1u) * 2654435761u);
  h ^= h >> 15u; h = h * 2246822519u; h ^= h >> 13u; h = h * 3266489917u; h ^= h >> 16u;
  return h & ${GRID_BUCKETS - 1}u;
}
/* ---- rng --------------------------------------------------------------- */
fn pcg(v: u32) -> u32 {
  let s = v * 747796405u + 2891336453u;
  let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
  return (w >> 22u) ^ w;
}
fn rnd(st: ptr<function, u32>) -> f32 {
  *st = pcg(*st); return f32(*st) * 2.3283064365e-10;
}
fn heat(x: f32) -> vec3f {
  let t = clamp(x, 0.0, 1.0);
  return clamp(vec3f(3.0*t - 0.6, 1.6 - abs(3.0*t - 1.5), 1.2 - 3.0*t), vec3f(0.0), vec3f(1.0));
}
`;

const WGSL_CUT = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read>       nodes   : array<Node>;
@group(0) @binding(2) var<storage, read>       insts   : array<Inst>;
@group(0) @binding(3) var<storage, read_write> surfels : array<Surfel>;
@group(0) @binding(4) var<storage, read_write> ctr     : Counter;
` + shadowSnippet(5,6) + /* wgsl */`
@group(0) @binding(7) var<storage, read_write> cache : array<Cache>;

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  let ii = gid.y;
  if (ii >= G.misc.x) { return; }
  let I = insts[ii];
  if (gid.x >= I.ids.y) { return; }
  let nd = nodes[I.ids.x + gid.x];

  let smax = max(length(I.model[0].xyz), max(length(I.model[1].xyz), length(I.model[2].xyz)));
  let bc = (I.model * vec4f(nd.bnd.xyz, 1.0)).xyz;
  let br = nd.bnd.w * smax;

  // frustum cull with off-screen shell already folded into the planes
  if ((G.misc.z & 1u) != 0u) {
    for (var i = 0u; i < 6u; i = i + 1u) {
      let pl = G.planes[i];
      if (dot(pl.xyz, bc) + pl.w < -br) { return; }
    }
  }

  let dist = max(length(bc - G.camPos.xyz), 1e-3);
  let projSelf = br * G.camPos.w / dist;

  let isRoot = nd.pbnd.w <= 0.0;
  let isLeaf = nd.misc.y > 0.5;

  var projPar = 1e9;
  if (!isRoot) {
    let pc = (I.model * vec4f(nd.pbnd.xyz, 1.0)).xyz;
    let pr = nd.pbnd.w * smax;
    projPar = pr * G.camPos.w / max(length(pc - G.camPos.xyz), 1e-3);
  }

  // exact partition of the tree into a cut, with a smooth cross-fade band
  var selfF = 1.0 - smoothstep(G.cut.x, G.cut.y, projSelf);
  if (isLeaf) { selfF = 1.0; }
  var parF = 1.0;
  if (!isRoot) { parF = smoothstep(G.cut.x, G.cut.y, projPar); }
  let fade = selfF * parF;
  if (fade <= 0.004) { return; }

  let nm = mat3x3f(I.nmat[0].xyz, I.nmat[1].xyz, I.nmat[2].xyz);
  let nW = normalize(nm * nd.nrmC.xyz);
  let pW = (I.model * vec4f(nd.posR.xyz, 1.0)).xyz;
  let rW = nd.posR.w * smax;

  // normal-cone backface rejection of whole subtrees
  if ((G.misc.z & 2u) != 0u && nd.nrmC.w > 0.0) {
    let sinA = sqrt(max(0.0, 1.0 - nd.nrmC.w * nd.nrmC.w));
    let v = normalize(G.camPos.xyz - bc);
    let slack = G.cut.w + br / dist;
    if (dot(nW, v) < -sinA - slack) { return; }
  }

  // ---- direct lighting is analytic (shadow map), the cache only holds bounce ----
  let alb = I.base.rgb;
  let ndl = max(dot(nW, G.sunDir.xyz), 0.0);
  let sh = shadowFactor(pW, nW);
  let dirL = G.sunCol.rgb * G.sunDir.w * ndl * sh;

  let slot = I.ids.z + gid.x;
  let par = select(slot, I.ids.z + u32(max(nd.link.z, 0.0)), nd.link.z >= 0.0);

  // cold start / re-entry from the off-screen shell: seed with sky so nothing is black
  let seen = cache[slot].sVar.w;
  let dormant = (f32(G.misc.w) - seen) > 90.0;
  if (cache[slot].outR.w < 0.5) {
    let sa = skyAmbient(nW);
    cache[slot].lMean = vec4f(sa, 0.0);
    cache[slot].sMean = vec4f(sa, 1.0);
    cache[slot].sVar = vec4f(vec3f(0.0), f32(G.misc.w));
    cache[slot].outR = vec4f(alb * (dirL + sa) + I.emis.rgb, 1.0);
    cache[slot].stat = vec4f(1.0, 0.0, 0.0, 0.0);
  } else if (dormant) {
    cache[slot].lMean.w = min(cache[slot].lMean.w, 4.0);
  }
  cache[slot].dirL = vec4f(dirL, cache[slot].dirL.w);
  cache[slot].sVar.w = f32(G.misc.w); // lastSeen -> propagate pass skips live nodes

  // ---- invalidation: the geometry is exact under rigid motion, but the light
  // it *received* is stale. Clamping age re-opens the MSME long-term blend. ----
  let motion = I.emis.w;
  if (motion > 0.0015) {
    let k = clamp(motion * 25.0, 0.0, 1.0);
    cache[slot].lMean.w = min(cache[slot].lMean.w, mix(48.0, 2.0, k));
  }
  if ((G.misc.z & 16u) != 0u) {           // sun / sky changed this frame
    cache[slot].lMean.w = min(cache[slot].lMean.w, 3.0);
  }

  let idx = atomicAdd(&ctr.n, 1u);
  if (idx >= G.misc.y) { return; }
  surfels[idx].posR = vec4f(pW, rW);
  surfels[idx].nrmW = vec4f(nW, fade);
  surfels[idx].alb = vec4f(alb, nd.misc.x);
  surfels[idx].rad = vec4f(dirL, f32(ii));
  surfels[idx].aux = vec4f(f32(slot), f32(par), dist, projSelf);
}
`;

@group(0) @binding(1) var<storage, read> surfels : array<Surfel>;
@group(0) @binding(2) var<storage, read_write> gcount : array<atomic<u32>>;
@group(0) @binding(3) var<storage, read_write> gdata : array<u32>;
@group(0) @binding(4) var<storage, read> cnt : array<u32>;
@group(0) @binding(5) var<storage, read> insts : array<Inst>;
@group(0) @binding(6) var<storage, read_write> gdirty : array<u32>;

fn insertAt(p: vec3f, c: u32, i: u32, moving: bool) {
  let cs = cellOf(c);
  let ci = vec3i(floor(p / cs));
  let h = hashCell(ci, c);
  // frame-stamped, never cleared: stamps age out on their own
  if (moving) { gdirty[h] = G.misc.w + 1u; }
  let k = atomicAdd(&gcount[h], 1u);
  if (k < ${CELL_CAP}u) { gdata[h * ${CELL_CAP}u + k] = i; }
}
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  let n = min(cnt[0], G.misc.y);
  if (gid.x >= n) { return; }
  let p = surfels[gid.x].posR.xyz;
  let moving = insts[u32(surfels[gid.x].rad.w)].emis.w > 0.0015;
  // insert into the neighbouring cascades too, so a cascade boundary can never
  // open a coverage hole between the surfel and the pixel that wants it
  let c0 = cascadeOf(distance(p, G.camPos.xyz));
  let lo = select(c0 - 1u, 0u, c0 == 0u);
  let hi = min(c0 + 1u, 3u);
  for (var c = lo; c <= hi; c = c + 1u) { insertAt(p, c, gid.x, moving); }
}
`;

const WGSL_INTEGRATE = WGSL_COMMON + shadowSnippet(9,10) + /* wgsl */`
@group(0) @binding(1) var<storage, read> surfels : array<Surfel>;
@group(0) @binding(2) var<storage, read_write> cache : array<Cache>;
@group(0) @binding(3) var<storage, read> nodes : array<Node>;
@group(0) @binding(4) var<storage, read> insts : array<Inst>;
@group(0) @binding(5) var<storage, read_write> guide : array<f32>;
@group(0) @binding(6) var<storage, read_write> mom : array<f32>;
@group(0) @binding(7) var<storage, read> cnt : array<u32>;
@group(0) @binding(8) var<storage, read_write> req : array<f32>;

struct Cone { rad: vec3f, alpha: f32, tHit: f32 };
const KHIT : u32 = 6u;

/* Tier-0 tracer: cone-trace the surfel hierarchy itself. No triangles, no BLAS,
   no SDF. Alpha accumulation front-to-back gives occlusion for free (plan §6). */
fn traceCone(o: vec3f, dir: vec3f, tanHalf: f32, tMin: f32, tMax: f32, seed: u32) -> Cone {
  var ht : array<f32, 6>;
  var hc : array<f32, 6>;
  var hr : array<vec3f,6>;
  var nh = 0u;
  var ovCov = 0.0; var ovRad = vec3f(0.0);
  var totCov = 0.0;
  var budget = 192 + 16 * i32(G.misc.x);
  var stack : array<u32, 24>;
  let sinAp = tanHalf * inverseSqrt(1.0 + tanHalf * tanHalf);

  // Stable rotation, keyed on the SURFEL not the frame. A frame-varying start
  // index hands the shared node budget to a different subset of instances every
  // frame -- a real change in the estimator, which MSME cannot filter away.
  let ofs = seed % G.misc.x;
  for (var q = 0u; q < G.misc.x; q = q + 1u) {
    if (budget <= 0 || totCov > 3.0) { break; }
    var ii = q + ofs; if (ii >= G.misc.x) { ii = ii - G.misc.x; }
    let I = insts[ii];
    let base = I.ids.x;
    let smax = max(length(I.model[0].xyz), max(length(I.model[1].xyz), length(I.model[2].xyz)));
    let nm = mat3x3f(I.nmat[0].xyz, I.nmat[1].xyz, I.nmat[2].xyz);

    let root = nodes[base + I.ids.y - 1u];
    let rbc = (I.model * vec4f(root.bnd.xyz, 1.0)).xyz;
    let rbr = root.bnd.w * smax;
    let toRoot = rbc - o;
    let tRoot  = dot(toRoot, dir);
    if (tRoot + rbr < tMin || tRoot - rbr > tMax) { continue; }
    if (length(toRoot - dir * tRoot) > tanHalf * max(tRoot, 0.0) + rbr) { continue; }

    var sp = 0u;
    stack[0] = I.ids.y - 1u; sp = 1u;

    loop {
      if (sp == 0u || budget <= 0 || totCov > 3.0) { break; }
      sp = sp - 1u;
      let li = stack[sp];
      let nd = nodes[base + li];
      budget = budget - 1;

      let bcW = (I.model * vec4f(nd.bnd.xyz, 1.0)).xyz;
      let brW = nd.bnd.w * smax;
      let toC = bcW - o;
      let t   = dot(toC, dir);
      if (t + brW < tMin || t - brW > tMax) { continue; }
      let perp = length(toC - dir * t);
      let cr   = max(tanHalf * max(t, 0.0), 1e-4);
      if (perp > cr + brW) { continue; }

      // cos(halfAngle) goes negative for aggregate nodes on closed objects.
      // sqrt(1-c*c) then reports sin of the supplement and understates slack;
      // a cone wider than pi/2 covers every direction, so its slack is 1.
      let cosHalf = nd.nrmC.w;
      let sinHalf = select(sqrt(max(1.0 - cosHalf * cosHalf, 0.0)), 1.0, cosHalf <= 0.0);
      let wide    = cosHalf < 0.55;
      let nW      = normalize(nm * nd.nrmC.xyz);
      let facing  = dot(nW, -dir);

      // whole-subtree backface rejection BEFORE spending budget on children
      if (facing + sinHalf + sinAp <= 0.0) { continue; }

      let rW  = nd.posR.w * smax;
      let erT = rW * sqrt(max(facing, 0.02));      // never sqrt(negative)
      let kids = u32(nd.link.y);
      // Descend on the AREA-EQUIVALENT radius, not the bounding radius. The disc
      // we resolve to has radius rW, which is 1.3-2x smaller than brW at every
      // interior level, so a brW-based stop systematically under-covers the cone
      // and the trace returns mostly sky. That is the missing-bounce bug.
      let mustSplit = (erT > cr * 0.5) || (brW > cr * 1.6) || (wide && brW > cr * 0.3);
      if (kids > 0u && mustSplit && sp + kids < 24u) {
        let fc = u32(nd.link.x);
        for (var k = 0u; k < kids; k = k + 1u) { stack[sp] = fc + k; sp = sp + 1u; }
        continue;
      }

      if (facing <= 0.02) { continue; }

      let pW  = (I.model * vec4f(nd.posR.xyz, 1.0)).xyz;
      let toP = pW - o;
      let tp  = dot(toP, dir);
      if (tp < tMin || tp > tMax) { continue; }
      let pp  = length(toP - dir * tp);
      let crp = max(tanHalf * tp, 1e-4);
      let er  = rW * sqrt(facing);
      if (pp > crp + er) { continue; }
      var cov = (er * er) / (crp * crp);
      cov = cov * clamp((crp + er - pp) / (2.0 * er + 1e-4), 0.0, 1.0);
      cov = clamp(cov, 0.0, 1.0);
      if (cov < 0.002) { continue; }
      totCov = totCov + cov;

      let slot = I.ids.z + li;
      let Cn = cache[slot];
      var rad : vec3f;
      if (Cn.outR.w >= 0.5) {
        rad = Cn.outR.rgb;
      } else {
        let ndl = max(dot(nW, G.sunDir.xyz), 0.0);
        let dl  = G.sunCol.rgb * G.sunDir.w * ndl * shadowFast(pW, nW);
        rad = I.base.rgb * (dl + skyAmbient(nW)) + I.emis.rgb;
      }

      var pos = nh;
      if (nh < KHIT) { nh = nh + 1u; } else {
        if (tp >= ht[KHIT - 1u]) { ovCov = ovCov + cov; ovRad = ovRad + rad * cov; continue; }
        ovCov = ovCov + hc[KHIT-1u]; ovRad = ovRad + hr[KHIT-1u] * hc[KHIT-1u];
        pos = KHIT - 1u;
      }
      loop {
        if (pos == 0u) { break; }
        if (ht[pos - 1u] <= tp) { break; }
        ht[pos] = ht[pos-1u]; hc[pos] = hc[pos-1u]; hr[pos] = hr[pos-1u];
        pos = pos - 1u;
      }
      ht[pos] = tp; hc[pos] = cov; hr[pos] = rad;
    }
  }

  var acc = vec3f(0.0); var a = 0.0; var first = tMax;
  for (var i = 0u; i < nh; i = i + 1u) {
    let w = hc[i] * (1.0 - a);
    if (i == 0u) { first = ht[0]; }
    acc = acc + w * hr[i];
    a = a + w;
    if (a > 0.995) { break; }
  }
  if (ovCov > 0.0 && a < 0.995) {
    let w = min(ovCov, 1.0) * (1.0 - a);
    acc = acc + w * (ovRad / ovCov);
    a = a + w;
  }

  var r: Cone; r.rad = acc; r.alpha = clamp(a, 0.0, 1.0); r.tHit = select(tMax, first, nh > 0u);
  return r;
}

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  let n = min(cnt[0], G.misc.y);
  if (gid.x >= n) { return; }
  let s = surfels[gid.x];
  let slot = u32(s.aux.x);

  // ---- Phase 4: cone count comes from the global budget allocator ----------
  let alloc = req[${MAX_SURFELS}u];                 // rays per unit request
  let maxC = max(u32(G.gi2.z), 1u);
  var nC = u32(floor(req[gid.x] * alloc + 0.5));
  let hb = max(u32(G.gi4.y), 1u);
  if (nC == 0u) {
    // dormant: one heartbeat ray every hb frames, purely to detect change
    if (((slot + G.misc.w) % hb) != 0u) { req[gid.x] = 0.0; return; }
    nC = 1u;
  }
  nC = min(nC, maxC);
  req[gid.x] = f32(nC);                             // debug view + stats

  let inst = u32(s.rad.w);
  let I = insts[inst];
  let P = s.posR.xyz;
  let N = s.nrmW.xyz;
  let T = onb(N);
  var C = cache[slot];
  
  let age = C.lMean.w;
  // aperture tiles the hemisphere: solidAngle = 2*PI/nCones
  let apertureN = max(u32(G.gi2.z), 4u);              // UI "cones/surfel" = aperture
  let cosH = clamp(1.0 - 1.0 / f32(apertureN), 0.75, 0.985);
  let tanH = sqrt(max(1.0 - cosH*cosH, 1e-6)) / max(cosH, 1e-3);
  let tMin = max(s.posR.w * 0.20, 0.008);
  let tMax = G.gi3.x;
  
  var st = pcg(slot * 9781u + G.misc.w * 6271u);
  
  // ---- load the 8x8 guiding grid and turn it into a CDF in place ----------
  let gbase = slot * ${GUIDE_BINS}u;
  var cdf : array<f32, ${GUIDE_BINS}>;
  var gsum = 0.0;
  let pgAmt = G.gi3.y;
  if (pgAmt > 0.001) {
    for (var i = 0u; i < ${GUIDE_BINS}u; i = i + 1u) {
      gsum = gsum + max(guide[gbase + i], 0.02);
      cdf[i] = gsum;
    }
  }
  
  let pg = select(0.0, pgAmt * clamp(age / 12.0, 0.0, 1.0), gsum > 0.0);
  var Esum = vec3f(0.0);
  var visSum = 0.0;
  var dSum = vec3f(0.0);
  var dLum = 0.0;
  
  for (var c = 0u; c < nC; c = c + 1u) {
    var local : vec3f;
    var bin = 0u;
    let guided = rnd(&st) < pg;
    if (guided) {
      let tgt = rnd(&st) * gsum;
      var lo = 0u; var hi = ${GUIDE_BINS - 1}u;
      loop { if (lo >= hi) { break; }
             let mid = (lo + hi) / 2u;
             if (cdf[mid] < tgt) { lo = mid + 1u; } else { hi = mid; } }
      bin = lo;
      let uv = (vec2f(f32(bin % 8u), f32(bin / 8u)) + vec2f(rnd(&st), rnd(&st))) / 8.0;
      local = hemiOctDecode(uv);
    } else {
      let u1 = (f32(c) + rnd(&st)) / f32(nC);
      let u2 = rnd(&st) * 6.28318530718;
      let r  = sqrt(u1);
      local = vec3f(r * cos(u2), r * sin(u2), sqrt(max(1.0 - u1, 1e-4)));
      bin = binOf(local, 8u);
    }
    let dir  = normalize(T * local);
    let cosT = max(local.z, 1e-3);
    
    // MIS between cosine and guided sampling keeps the estimator unbiased
    let pdfCos = cosT / PI;
    var pdfG = 0.0;
    if (gsum > 0.0) {
      let w = cdf[bin] - select(0.0, cdf[max(bin, 1u) - 1u], bin > 0u);
      pdfG = (w / gsum) / (6.28318530718 / f32(${GUIDE_BINS}u));
    }
    let mixPdf = max(mix(pdfCos, pdfG, pg), 1e-4);
    
    let res = traceCone(P + N * (s.posR.w * 0.5), dir, tanH, tMin, tMax, slot * 13u + c);
    let sky = skyBase(dir) * (1.0 - res.alpha);
    let L   = res.rad + sky;
    
    Esum = Esum + L * cosT / mixPdf;
    visSum = visSum + (1.0 - res.alpha);
    
    // ---- ray guiding: learn where the light is (GIBS 6x6, Triglav 8x8) ----
    let lum = dot(L, vec3f(0.2126, 0.7152, 0.0722));
    let wgt = lum * cosT / mixPdf;
    dSum = dSum + dir * wgt;
    dLum = dLum + wgt;
    if (pgAmt > 0.001) { let gi_ = gbase + bin; guide[gi_] = max(mix(guide[gi_], lum, 0.15), 0.02); }

    // ---- radial depth moments: 4x4 E[z], E[z^2] for Chebyshev visibility ---
    let db = binOf(local, 4u);
    let mi = (slot * ${MOM_BINS}u + db) * 2u;
    let z = res.tHit;
    let m1o = mom[mi]; let m2o = mom[mi + 1u];
    let a0 = select(0.2, 1.0, m1o <= 0.0);
    mom[mi]      = mix(m1o, z,     a0);
    mom[mi + 1u] = mix(m2o, z * z, a0);
  }
  
  var meanL = Esum / (f32(nC) * PI);
  meanL = clamp(select(meanL, vec3f(0.0), meanL != meanL), vec3f(0.0), vec3f(64.0));
  let vis = visSum / f32(nC);
  
  /* ---- MSME (RTG ch.25): the denoiser lives in the cache, in object space,
     on a stable ID. No reprojection, no disocclusion, no history rejection. */
  let nAge = age + 1.0;
  let aS = max(1.0 / min(nAge, 8.0), 0.15);
  let sM = mix(C.sMean.rgb, meanL, aS);
  let dv = meanL - sM;
  let sV = mix(C.sVar.rgb, dv * dv, aS);
  let sd = sqrt(max(sV, vec3f(0.0)));
  let df = abs(sM - C.lMean.rgb);
  
  // The disagreement test must be scale-relative. With a fixed 0.02 epsilon a
  // dark surfel reports sig >> 4 for a difference that is pure sampling noise,
  // the long-term blend unlatches every frame, and the cache pumps.
  let lumS = dot(max(sM, vec3f(0.0)), vec3f(0.2126, 0.7152, 0.0722));
  let eps  = 0.02 + 0.35 * lumS;
  let sig  = max(df.r / (sd.r + eps), max(df.g / (sd.g + eps), df.b / (sd.b + eps)));
  
  let aFloor = clamp(G.gi2.x, 0.02, 1.0);
  let aL = clamp((1.0 / min(nAge, 1.0 / aFloor)) * (1.0 + 5.0 * smoothstep(1.5, 5.0, sig)),
                 aFloor * 0.25, 0.55);
  var lM = mix(C.lMean.rgb, sM, aL);
  if (any(lM != lM)) { lM = C.lMean.rgb; }        // persistent slot: never poison it
  lM = min(lM, vec3f(64.0));
  let ao = mix(C.sMean.w, vis, aS);

  let dLen = length(dSum);
  var dDir = select(N, dSum / max(dLen, 1e-6), dLen > 1e-6);
  if (C.dirL.w > 0.0) { dDir = normalize(mix(octDec(vec2f(C.stat.z, C.stat.w)), dDir, aS) + N * 1e-4); }
  let dStr = clamp(dLen / max(dLum, 1e-6), 0.0, 1.0);
  let de = octEnc(dDir);

  cache[slot].lMean = vec4f(lM, min(nAge, 4096.0));
  cache[slot].sMean = vec4f(sM, ao);
  cache[slot].sVar  = vec4f(sV, C.sVar.w);
  cache[slot].outR  = vec4f(I.base.rgb * (C.dirL.rgb + lM * G.gi2.y) + I.emis.rgb, 1.0);
  cache[slot].dirL  = vec4f(C.dirL.rgb, mix(max(C.dirL.w, 0.0), dStr, aS));
  cache[slot].stat  = vec4f(sig, f32(nC), de.x, de.y);
}
`;

const WGSL_REQUEST = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> surfels : array<Surfel>;
@group(0) @binding(2) var<storage, read> cache : array<Cache>;
@group(0) @binding(3) var<storage, read> insts : array<Inst>;
@group(0) @binding(4) var<storage, read> gdirty : array<u32>;
@group(0) @binding(5) var<storage, read_write> budget : array<atomic<u32>>;
@group(0) @binding(6) var<storage, read_write> req : array<f32>;
@group(0) @binding(7) var<storage, read> cnt : array<u32>;

/* Pass one of the two-pass global ray budget: every surfel states what it
   wants. Nothing is allocated here, so the sum is exact and order-independent. */
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  let n = min(cnt[0], G.misc.y);
  if (gid.x >= n) { return; }
  let s = surfels[gid.x];
  let slot = u32(s.aux.x);
  let C = cache[slot];
  let P = s.posR.xyz;

  let age = C.lMean.w;
  let sig = C.stat.x;
  let mo  = insts[u32(s.rad.w)].emis.w;

  var w = 0.25 + clamp(sig, 0.0, 4.0);                    // variance driven
  w = w * (1.0 + 6.0 * exp(-age * 0.35));                 // young surfels explore
  w = w * mix(0.30, 1.0, clamp(s.nrmW.w, 0.0, 1.0));      // shell / fading = cheap
  w = w * (0.40 + 0.60 * clamp(s.aux.w / max(G.cut.y, 1.0), 0.0, 1.0)); // screen size

  w = w * (1.0 + G.gi4.z * clamp(mo * 30.0, 0.0, 3.0));   // this surfel moved

  // something moved *near* this surfel: dirty-cell invalidation
  let casc = cascadeOf(distance(P, G.camPos.xyz));
  let stamp = gdirty[hashCell(vec3i(floor(P / cellOf(casc))), casc)];
  if (stamp != 0u && (G.misc.w + 1u - stamp) < 8u) { w = w * (1.0 + G.gi4.z); }

  if ((G.misc.z & 16u) != 0u) { w = w * 4.0; }            // light changed

  // dormancy: converged, quiet, static -> heartbeat only
  if (sig < 0.35 && age > 24.0 && mo < 1e-4) { w = min(w, 0.05); }

  w = clamp(w, 0.0, 64.0);
  req[gid.x] = w;
  atomicAdd(&budget[0], u32(w * 64.0));
  atomicAdd(&budget[3], 1u);
  if (sig < 0.5 && age > 16.0) { atomicAdd(&budget[2], 1u); }
}
`;

const WGSL_ALLOC = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read_write> budget : array<atomic<u32>>;
@group(0) @binding(2) var<storage, read_write> req : array<f32>;

/* Pass two: one thread turns the global sum into a scale factor. Total rays
   per frame is then bounded by construction, which is what makes the frame
   time flat instead of proportional to how much of the scene is on screen. */
@compute @workgroup_size(1)
fn main() {
  let total = f32(atomicLoad(&budget[0])) / 64.0;
  let scale = select(0.0, max(G.gi4.x, 1.0) / max(total, 1e-3), total > 1e-4);
  req[${MAX_SURFELS}u] = scale;
  atomicStore(&budget[1], bitcast<u32>(scale));
}
`;

const WGSL_SHARE = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> surfels : array<Surfel>;
@group(0) @binding(2) var<storage, read_write> cache : array<Cache>;
@group(0) @binding(3) var<storage, read> gcount : array<u32>;
@group(0) @binding(4) var<storage, read> gdata : array<u32>;
@group(0) @binding(5) var<storage, read> cnt : array<u32>;

/* The spatial half of the "no denoiser" claim: blend with geometrically
   coherent neighbours from the hash grid, weighted by variance (GIBS §sharing). */
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  let amt = G.gi3.z;
  if (amt <= 0.001) { return; }
  let n = min(cnt[0], G.misc.y);
  if (gid.x >= n) { return; }
  let s = surfels[gid.x];
  let slot = u32(s.aux.x);
  
  let P = s.posR.xyz; let N = s.nrmW.xyz;
  let casc = cascadeOf(distance(P, G.camPos.xyz));
  let cs = cellOf(casc);
  let R = min(max(s.posR.w * 3.0, G.gi.x * 0.5), cs * 0.5);
  
  var acc = vec3f(0.0); var w = 0.0;
  let b = vec3i(floor((P - vec3f(R)) / cs));
  
  for (var o = 0u; o < 8u; o = o + 1u) {
    let ci = b + vec3i(i32(o & 1u), i32((o >> 1u) & 1u), i32((o >> 2u) & 1u));
    let h = hashCell(ci, casc);
    let k = min(gcount[h], ${CELL_CAP}u);
    for (var j = 0u; j < k; j = j + 1u) {
      let si = gdata[h * ${CELL_CAP}u + j];
      if (si == gid.x) { continue; }
      let t = surfels[si];
      let d = t.posR.xyz - P;
      let dd = dot(d, d);
      if (dd > R * R) { continue; }
      let wn = clamp((dot(N, t.nrmW.xyz) - 0.6) / 0.4, 0.0, 1.0);
      if (wn <= 0.0) { continue; }
      let wp = clamp(1.0 - abs(dot(d, N)) / (R * 0.4 + 1e-3), 0.0, 1.0);
      let ws = wn * wp * (1.0 - sqrt(dd) / R);
      let ts = u32(t.aux.x);
      acc = acc + cache[ts].lMean.rgb * ws;
      w = w + ws;
    }
  }
  
  if (w <= 1e-4) { return; }
  
  let C = cache[slot];
  let conf = clamp(C.stat.x * 0.5, 0.0, 1.0); // share more when unconverged
  let k = amt * mix(0.35, 1.0, conf) * clamp(8.0 / max(C.lMean.w, 1.0), 0.15, 1.0);
  cache[slot].lMean = vec4f(mix(C.lMean.rgb, acc / w, k), C.lMean.w);
}
`;

const WGSL_PROPAGATE = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> nodes : array<Node>;
@group(0) @binding(2) var<storage, read> insts : array<Inst>;
@group(0) @binding(3) var<storage, read_write> cache : array<Cache>;

/* Interior nodes carry area-weighted aggregate radiance, so the hierarchy is
   simultaneously the cache, the LOD structure and the acceleration structure. */
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  let ii = gid.y;
  if (ii >= G.misc.x) { return; }
  let I = insts[ii];
  if (gid.x >= I.ids.y) { return; }
  let nd = nodes[I.ids.x + gid.x];
  
  let nk = u32(nd.link.y);
  if (nk == 0u) { return; }
  let slot = I.ids.z + gid.x;
  if (abs(cache[slot].sVar.w - f32(G.misc.w)) < 0.5) { return; } // live in the cut
  
  var A = 0.0; var o = vec3f(0.0); var l = vec3f(0.0); var ao = 0.0;
  let fc = u32(nd.link.x);
  
  for (var k = 0u; k < nk; k = k + 1u) {
    let cs = cache[I.ids.z + fc + k];
    if (cs.outR.w < 0.5) { continue; }
    let a = max(nodes[I.ids.x + fc + k].misc.z, 1e-6);
    o = o + cs.outR.rgb * a; l = l + cs.lMean.rgb * a; ao = ao + cs.sMean.w * a; A = A + a;
  }
  
  if (A <= 0.0) { return; }
  cache[slot].outR = vec4f(o / A, 1.0);
  cache[slot].lMean = vec4f(l / A, cache[slot].lMean.w);
  cache[slot].sMean = vec4f(cache[slot].sMean.rgb, ao / A);
  cache[slot].sVar.w = f32(G.misc.w);
}

const WGSL_GIPRE = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> insts : array<Inst>;
@group(0) @binding(2) var<storage, read> surfels : array<Surfel>;
@group(0) @binding(3) var<storage, read> cache : array<Cache>;
@group(0) @binding(4) var<storage, read> gcount : array<u32>;
@group(0) @binding(5) var<storage, read> gdata : array<u32>;
@group(0) @binding(6) var<storage, read> mom : array<f32>;

fn chebyshev(slot: u32, sp: vec3f, sn: vec3f, sr: f32, P: vec3f) -> f32 {
  let d = P - sp; let dist = length(d);
  if (dist < sr * 1.2) { return 1.0; }
  let l = transpose(onb(sn)) * (d / dist);
  if (l.z <= 0.02) { return 1.0; }
  let mi = (slot * ${MOM_BINS}u + binOf(l, 4u)) * 2u;
  let m1 = mom[mi];
  if (m1 <= 0.0) { return 1.0; }
  if (dist <= m1 + sr) { return 1.0; }
  let v = max(mom[mi + 1u] - m1 * m1, 2e-3);
  let dd = dist - m1;
  return clamp(v / (v + dd * dd), 0.0, 1.0);
}

/* per-pixel gather: anisotropic distance + normal alignment + Chebyshev,
   with a guaranteed parent-node fallback instead of a probe clipmap */
fn resolveGI(P: vec3f, N: vec3f) -> vec4f {
  let casc = cascadeOf(distance(P, G.camPos.xyz));
  let cs = cellOf(casc);
  let R = cs * 0.5;
  var acc = vec3f(0.0); var aoA = 0.0; var wsum = 0.0; var taps = 0.0;
  var bestW = 0.0; var fb = 0xffffffffu;
  let rs = G.gi2.w;
  let b = vec3i(floor((P - vec3f(R)) / cs));
  
  for (var o = 0u; o < 8u; o = o + 1u) {
    let ci = b + vec3i(i32(o & 1u), i32((o >> 1u) & 1u), i32((o >> 2u) & 1u));
    let h = hashCell(ci, casc);
    let k = min(gcount[h], ${CELL_CAP}u);
    for (var j = 0u; j < k; j = j + 1u) {
      let s = surfels[gdata[h * ${CELL_CAP}u + j]];
      let d = P - s.posR.xyz;
      let rad = min(s.posR.w * rs, R);
      let along = dot(d, s.nrmW.xyz);
      let perp2 = max(dot(d, d) - along * along, 0.0);
      if (perp2 > rad * rad) { continue; }
      let wn = (dot(N, s.nrmW.xyz) - 0.30) / 0.70;
      if (wn <= 0.0) { continue; }
      taps = taps + 1.0;
      let slot = u32(s.aux.x);
      if (wn > bestW) { bestW = wn; fb = u32(s.aux.y); }
      let wp = 1.0 - abs(along) / (rad * 0.55 + 1e-3);   // squashed along the normal
      if (wp <= 0.0) { continue; }
      let wr = 1.0 - perp2 / (rad * rad);
      let age = clamp(cache[slot].lMean.w / 8.0, 0.0, 1.0);
      var w = wr * wr * wn * wp * s.nrmW.w * age;
      w = w * chebyshev(slot, s.posR.xyz, s.nrmW.xyz, s.posR.w, P);
      if (w <= 1e-5) { continue; }
      acc = acc + cache[slot].lMean.rgb * w;
      aoA = aoA + cache[slot].sMean.w * w;
      wsum = wsum + w;
    }
  }
  
  var fbIrr = skyAmbient(N);
  if (fb != 0xffffffffu) { fbIrr = cache[fb].lMean.rgb; } // always a parent to fall back to
  var irr = fbIrr; var ao = 1.0;
  
  if (wsum > 1e-4) {
    let wc = clamp(wsum, 0.0, 1.0);
    irr = mix(fbIrr, acc / wsum, wc);
    ao  = mix(1.0, aoA / wsum, wc);
  }
  if (u32(G.gi.w + 0.5) == 3u) { irr = heat(taps / 12.0); ao = 1.0; }
  return vec4f(irr, ao);
}

struct VO { @builtin(position) pos: vec4f, @location(0) wp: vec3f, @location(1) wn: vec3f };
@vertex fn vs(@location(0) p: vec3f, @location(1) n: vec3f,
              @builtin(instance_index) ii: u32) -> VO {
  let I = insts[ii];
  let wp = (I.model * vec4f(p, 1.0)).xyz;
  let nm = mat3x3f(I.nmat[0].xyz, I.nmat[1].xyz, I.nmat[2].xyz);
  var o: VO; o.pos = G.viewProj * vec4f(wp, 1.0); o.wp = wp; o.wn = normalize(nm * n);
  return o;
}
struct FO { @location(0) gi: vec4f, @location(1) gn: vec4f };
@fragment fn fs(i: VO) -> FO {
  let N = normalize(i.wn);
  var o: FO;
  o.gi = resolveGI(i.wp + N * 0.004, N);
  o.gn = vec4f(N, distance(i.wp, G.camPos.xyz));
  return o;
}
`;

const WGSL_SKY = WGSL_COMMON + /* wgsl */`
struct VO { @builtin(position) pos: vec4f, @location(0) ndc: vec2f };
@vertex fn vs(@builtin(vertex_index) vi: u32) -> VO {
  var p = array<vec2f,3>(vec2f(-1.0,-1.0), vec2f(3.0,-1.0), vec2f(-1.0,3.0));
  var o: VO; o.ndc = p[vi]; o.pos = vec4f(p[vi], 0.0, 1.0); return o;
}
@fragment fn fs(i: VO) -> @location(0) vec4f {
  let w = G.invViewProj * vec4f(i.ndc, 1.0, 1.0);
  let d = normalize(w.xyz / w.w - G.camPos.xyz);
  return vec4f(tonemap(skyWithSun(d)), 1.0);
}
`;

/* ------------------------------------------------------------- mesh pass */
const WGSL_MESH = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> insts : array<Inst>;
` + shadowSnippet(2,3) + /* wgsl */`
@group(0) @binding(4) var giTex : texture_2d<f32>;
@group(0) @binding(5) var gnTex : texture_2d<f32>;
fn upsampleGI(fragXY: vec2f, P: vec3f, N: vec3f) -> vec4f {
  let dims = vec2i(textureDimensions(giTex));
  let hc = fragXY * 0.5 - vec2f(0.5);
  let b = floor(hc); let f = hc - b;
  let vz = distance(P, G.camPos.xyz);
  var acc = vec4f(0.0); var wsum = 0.0;
  for (var i = 0u; i < 4u; i = i + 1u) {
    let off = vec2f(f32(i & 1u), f32((i >> 1u) & 1u));
    let c = clamp(vec2i(b + off), vec2i(0), dims - vec2i(1));
    let gn = textureLoad(gnTex, c, 0);
    if (gn.w < 0.0) { continue; }
    let bw = mix(1.0 - f.x, f.x, off.x) * mix(1.0 - f.y, f.y, off.y);
    let wn = pow(max(dot(gn.xyz, N), 0.0), 8.0);
    let wz = exp(-abs(gn.w - vz) * 6.0 / max(vz, 1.0));
    let w = bw * wn * wz;
    if (w <= 1e-5) { continue; }
    acc = acc + textureLoad(giTex, c, 0) * w; wsum = wsum + w;
  }
  if (wsum < 1e-4) { return vec4f(skyAmbient(N), 1.0); }
  return acc / wsum;
}
struct VO {
  @builtin(position) pos : vec4f,
  @location(0) wp : vec3f,
  @location(1) wn : vec3f,
  @location(2) op : vec3f,
  @location(3) @interpolate(flat) id : u32,
};
@vertex fn vs(@location(0) p: vec3f, @location(1) n: vec3f,
              @builtin(instance_index) ii: u32) -> VO {
  let I = insts[ii];
  let wp = (I.model * vec4f(p, 1.0)).xyz;
  let nm = mat3x3f(I.nmat[0].xyz, I.nmat[1].xyz, I.nmat[2].xyz);
  var o: VO;
  o.pos = G.viewProj * vec4f(wp, 1.0);
  o.wp = wp; o.wn = normalize(nm * n); o.op = p; o.id = ii;
  return o;
}
@fragment fn fs(i: VO) -> @location(0) vec4f {
  let I = insts[i.id];
  let albedo = I.base.rgb;
  let metal  = I.base.w;
  let rough  = clamp(I.parm.x, 0.035, 1.0);
  let spec   = I.parm.y;
  var N = normalize(i.wn);
  N = perturbNormal(N, i.op, I.parm.z, u32(I.parm.w + 0.5));
  let V = normalize(G.camPos.xyz - i.wp);
  let L = G.sunDir.xyz;
  let H = normalize(V + L);
  let NoV = max(dot(N, V), 1e-4);
  let NoL = max(dot(N, L), 0.0);
  let NoH = max(dot(N, H), 0.0);
  let VoH = max(dot(V, H), 0.0);
  let f0 = mix(vec3f(0.08 * spec), albedo, metal);
  let kd = albedo * (1.0 - metal);

  let sh = shadowFactor(i.wp, N);
  let sunE = G.sunCol.rgb * G.sunDir.w * NoL * sh;

  let a = rough * rough;
  let specTerm = D_GGX(NoH, a) * V_Smith(NoV, NoL, a) * F_Schlick(f0, VoH);

  // ---- indirect diffuse from the object-space surfel cache ----
  var indirect = skyAmbient(N);
  var ao = 1.0;
  let dbg = u32(G.gi.w + 0.5);
  if ((G.misc.z & 8u) != 0u) {
    let g = upsampleGI(i.pos.xy, i.wp, normalize(i.wn));
    indirect = g.rgb * G.gi.y;
    ao = mix(1.0, clamp(g.a, 0.0, 1.0), G.gi.z);
  }
  indirect = indirect * ao;

  let R = reflect(-V, N);
  let envS = mix(skyBase(R), indirect, rough) * envDFG(f0, rough, NoV) * ao;

  var col = kd * (sunE + indirect) + specTerm * sunE * PI + envS + I.emis.rgb;
  
  if ((G.misc.z & 8u) != 0u) {
    if (dbg == 1u) { col = indirect; }
    if (dbg == 2u) { col = vec3f(ao); }
    if (dbg == 3u) { col = indirect / max(G.gi.y, 1e-3); }
  }
  
  var outc = tonemap(col);
  let g = dot(outc, vec3f(0.299, 0.587, 0.114));
  outc = mix(vec3f(g) * 0.30, outc, G.misc2.y);
  return vec4f(outc, 1.0);
}
`;

/* ----------------------------------------------------------- shadow pass */
const WGSL_SHADOW = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> insts : array<Inst>;
@vertex fn vs(@location(0) p: vec3f, @location(1) n: vec3f,
              @builtin(instance_index) ii: u32) -> @builtin(position) vec4f {
  let wp = (insts[ii].model * vec4f(p, 1.0)).xyz;
  return G.lightVP * vec4f(wp, 1.0);
}
`;

/* ------------------------------------------------------- surfel disc pass */
const WGSL_DISC = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> surfels : array<Surfel>;
@group(0) @binding(2) var<storage, read> cache : array<Cache>;
@group(0) @binding(3) var<storage, read> req : array<f32>;
struct VO {
  @builtin(position) pos : vec4f,
  @location(0) uv : vec2f,
  @location(1) @interpolate(flat) sid : u32,
  @location(2) wn : vec3f,
  @location(3) @interpolate(flat) fade : f32,
};
@vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VO {
  var quad = array<vec2f,6>(vec2f(-1.0,-1.0), vec2f(1.0,-1.0), vec2f(-1.0,1.0),
                            vec2f(-1.0, 1.0), vec2f(1.0,-1.0), vec2f( 1.0,1.0));
  let s = surfels[ii];
  let n = s.nrmW.xyz;
  var up = vec3f(0.0, 1.0, 0.0);
  if (abs(n.y) > 0.9) { up = vec3f(1.0, 0.0, 0.0); }
  let t = normalize(cross(up, n));
  let b = cross(n, t);
  let q = quad[vi];
  let rad = s.posR.w * G.cut.z;
  let p = s.posR.xyz + n * (s.posR.w * 0.25 + 0.004) + (t * q.x + b * q.y) * rad;
  var o: VO;
  o.pos = G.viewProj * vec4f(p, 1.0);
  o.uv = q; o.sid = ii; o.wn = n; o.fade = s.nrmW.w;
  return o;
}
fn dith(p: vec2f, seed: f32) -> f32 {
  return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715)) + seed * 0.6180339887));
}
@fragment fn fs(i: VO) -> @location(0) vec4f {
  if (dot(i.uv, i.uv) > 1.0) { discard; }
  let s = surfels[i.sid];
  // i.sid is the atomic compaction index and is nondeterministic across frames.
  // Seeding the stipple with it reseeds every cross-faded disc every frame.
  if (i.fade < 0.999 && i.fade < dith(i.pos.xy, f32(u32(s.aux.x) % 977u))) { discard; }
  let mode = u32(G.misc2.x + 0.5);
  var c = vec3f(0.5);
  if (mode == 0u) {
    let ndl = max(dot(i.wn, G.sunDir.xyz), 0.0);
    c = tonemap(s.alb.rgb * (G.sunCol.rgb * G.sunDir.w * ndl + skyAmbient(i.wn)));
  } else if (mode == 1u) { c = pow(s.alb.rgb, vec3f(1.0/2.2)); }
  else if (mode == 2u) { c = tonemap(s.rad.rgb); }
  else if (mode == 3u) { c = hsv(fract(s.alb.w * 0.135 + 0.05)); }
  else if (mode == 4u) { c = hsv(clamp(1.0 - s.posR.w * 3.0, 0.0, 0.85)); }
  else if (mode == 5u) { c = i.wn * 0.5 + vec3f(0.5); }
  else if (mode == 6u) {
    let ca = clamp(s.nrmW.w, 0.0, 1.0);
    c = hsv(fract(f32(i.sid % 1u) + 0.0)) * 0.0 + vec3f(1.0 - ca, ca * 0.6, ca);
  }
  else if (mode == 7u) { c = hsv(fract(s.rad.w * 0.1737)); }
  else if (mode == 8u) { c = vec3f(i.fade); }
  else if (mode == 9u) {
    let C = cache[u32(s.aux.x)];
    c = tonemap(C.lMean.rgb);
    if (u32(G.gi.w + 0.5) == 4u) { c = heat(C.stat.x * 0.35); }
  }
  else if (mode == 10u) { c = heat(req[i.sid] / max(G.gi2.z, 1.0)); }
  // slight rim so individual discs stay legible
  let r = length(i.uv);
  c *= (1.0 - 0.35 * smoothstep(0.75, 1.0, r));
  return vec4f(c, 1.0);
}
`;

    inter[i*6]=m.pos[i*3]; inter[i*6+1]=m.pos[i*3+1]; inter[i*6+2]=m.pos[i*3+2];
    inter[i*6+3]=m.nrm[i*3]; inter[i*6+4]=m.nrm[i*3+1]; inter[i*6+5]=m.nrm[i*3+2];
  }
  const vb = device.createBuffer({size:inter.byteLength, usage:GPUBufferUsage.VERTEX|GPUBufferUsage.COPY_DST});
  device.queue.writeBuffer(vb,0,inter);
  const ibSrc = m.idx;
  const ib = device.createBuffer({size:(ibSrc.byteLength+3)&~3, usage:GPUBufferUsage.INDEX|GPUBufferUsage.COPY_DST});
  device.queue.writeBuffer(ib,0,ibSrc);
  return {vb, ib, indexCount:ibSrc.length};
});

{

function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(canvas.clientWidth  * dpr));
  const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
  if (w === cw && h === ch) return;
  cw = w; ch = h; canvas.width = w; canvas.height = h;
  if (colorTex) colorTex.destroy();
  if (depthTex) depthTex.destroy();
  colorTex = device.createTexture({ size:[w,h], format:FMT, sampleCount:SAMPLES,
                                    usage: GPUTextureUsage.RENDER_ATTACHMENT });
  depthTex = device.createTexture({ size:[w,h], format:'depth24plus', sampleCount:SAMPLES,
                                    usage: GPUTextureUsage.RENDER_ATTACHMENT });
  colorView = colorTex.createView(); depthView = depthTex.createView();

  const hw = Math.max(1, w >> 1), hh = Math.max(1, h >> 1);
  if (giTex) { giTex.destroy(); gnTex.destroy(); giDepth.destroy(); }
  giTex = device.createTexture({size:[hw,hh], format:'rgba16float',
           usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.TEXTURE_BINDING});
  gnTex = device.createTexture({size:[hw,hh], format:'rgba16float',
           usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.TEXTURE_BINDING});
  giDepth = device.createTexture({size:[hw,hh], format:'depth24plus',
           usage:GPUTextureUsage.RENDER_ATTACHMENT});
  giView = giTex.createView(); gnView = gnTex.createView(); giDepthView = giDepth.createView();

  rebuildScreenBindGroups();
}

  let nodeCursor = 0, totalLeaves = 0, maxNodes = 1, maxLevels = 1;
  for (let pi = 0; pi < PROTOS.length; pi++){
    const pr = PROTOS[pi];
    // shapes are small; give them a finer effective spacing than the floor
    const sp = spacing * pr.spacingMul * (pr.big ? 1.0 : 0.40);
    const rng = mulberry32(0x9E37 + pi * 7919);
    const { leaves } = bakeLeafSurfels(pr.mesh, sp, curvGain, rng);
    const h = buildHierarchy(leaves);
    pr.nodeOffset = nodeCursor;
    pr.nodeCount  = h.count;
    pr.leafCount  = h.leafCount;
    pr.levels     = h.levels;
    maxLevels = Math.max(maxLevels, h.levels);
    chunks.push(h.buf);
    nodeCursor += h.count;
    totalLeaves += h.leafCount;
    maxNodes = Math.max(maxNodes, h.count);
  }
  const all = new Float32Array(nodeCursor * NODE_FLOATS);
  let o = 0;
  for (const c of chunks){ all.set(c, o); o += c.length; }

  const old = nodeBuf;
  if (old) device.queue.onSubmittedWorkDone().then(()=>old.destroy());
  nodeBuf = device.createBuffer({ size: all.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(nodeBuf, 0, all);

  // ---- stable persistent identity: one cache slot per (instance, node) ----
  let cursor = 0;
  for (const I of INSTANCES){ I.cacheBase = cursor; cursor += PROTOS[I.proto].nodeCount; }
  TOTAL_CACHE = Math.max(cursor, 1);
  for (const b of [cacheBuf, guideBuf, momBuf]) if (b) { const x=b; device.queue.onSubmittedWorkDone().then(()=>x.destroy()); }
  const CU = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST;
  cacheBuf = device.createBuffer({size: TOTAL_CACHE * CACHE_FLOATS * 4, usage:CU});
  guideBuf = device.createBuffer({size: TOTAL_CACHE * GUIDE_BINS * 4, usage:CU});
  momBuf = device.createBuffer({size: TOTAL_CACHE * MOM_BINS * 2 * 4, usage:CU});
  bakeInfo = { leaves: totalLeaves, nodes: nodeCursor, ms: performance.now() - t0, maxNodes, levels: maxLevels, cache: TOTAL_CACHE };

  rebuildDataBindGroups();
}

/* --------------------------------------------------------------- camera */
const cam = { target:[0, 0.9, 0], dist:17, yaw:0.72, pitch:0.38, fov: 55*Math.PI/180 };
let dragL=false, dragR=false, lx=0, ly=0;
canvas.addEventListener('contextmenu', e=>e.preventDefault());
canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  if (e.button===0 && !e.shiftKey) dragL=true; else dragR=true;
  lx=e.clientX; ly=e.clientY;
});
addEventListener('pointerup', e=>{ dragL=false; dragR=false; });
addEventListener('pointermove', e=>{
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  if (dragL){ cam.yaw -= dx*0.006; cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch - dy*0.006)); }
  else if (dragR){
    const s = cam.dist*0.0016;
    const r=[Math.cos(cam.yaw),0,-Math.sin(cam.yaw)];
    const f=[Math.sin(cam.yaw),0, Math.cos(cam.yaw)];
    cam.target[0]+= -r[0]*dx*s + f[0]*dy*s;
    cam.target[1]+= dy*s*Math.cos(cam.pitch)*0.0 + dy*s*0.0;
    cam.target[2]+= -r[2]*dx*s + f[2]*dy*s;
    cam.target[1] = Math.max(-2, Math.min(12, cam.target[1] + dy*s*Math.sin(cam.pitch)));
  }
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  cam.dist = Math.max(0.5, Math.min(320, cam.dist * Math.exp(e.deltaY*0.0012)));
}, {passive:false});

/* ------------------------------------------------------------------- UI */
const $ = id => document.getElementById(id);
const UI = {};
function bindRange(id, fmt=(v)=>v.toFixed(2)){
  const el=$(id), out=$(id+'V');
  const upd=()=>{ UI[id]=parseFloat(el.value); if(out) out.textContent=fmt(UI[id]); };
  el.addEventListener('input', upd); upd();
}
['targetPx','fadeBand','discScale','shell','spacing','curvGain','sunAz','sunEl','sunI','skyI','ambI','expo','sceneAlpha']
  .concat(['giR','giStr','aoStr','bounce','tAlpha','cones','traceDist','guideAmt','shareAmt','radScale'])
  .concat(['rayBudget','heartbeat','motionBoost'])
  .forEach(id=>bindRange(id, v => (Math.abs(v)>=10 ? v.toFixed(0) : v.toFixed(2))));
function bindCheck(id){ const el=$(id); const upd=()=>UI[id]=el.checked; el.addEventListener('change',upd); upd(); }
['fcull','ccull','freeze','shadows','animate','giOn','freezeGI','autoFreeze'].forEach(bindCheck);
function bindSel(id){ const el=$(id); const upd=()=>UI[id]=parseInt(el.value,10); el.addEventListener('change',upd); upd(); }
['viewMode','colorMode','giDebug'].forEach(bindSel);

$('rebake').addEventListener('click', ()=>{
  $('rebake').textContent='BAKING…';
  setTimeout(()=>{ bakeAll(UI.spacing, UI.curvGain); $('rebake').textContent='REBAKE SURFELS'; }, 16);
});

/* any UI interaction breaks the auto-freeze latch */
let settled = 0;
$('ui').addEventListener('input', ()=>{ settled = 0; });
$('ui').addEventListener('change', ()=>{ settled = 0; });

addEventListener('keydown', e=>{
  if (e.key==='1'){ $('viewMode').value='0'; UI.viewMode=0; }
  if (e.key==='2'){ $('viewMode').value='1'; UI.viewMode=1; }
  if (e.key==='3'){ $('viewMode').value='2'; UI.viewMode=2; }
  if (e.code==='Space'){ e.preventDefault(); $('animate').checked=!$('animate').checked; UI.animate=$('animate').checked; }
});

/* ----------------------------------------------------------- first bake */
bakeAll(UI.spacing, UI.curvGain);

/* ------------------------------------------------------- per-frame data */
let sceneMotion = 0;
function updateInstances(t){
  sceneMotion = 0;
  for (let i=0;i<INST_COUNT;i++){
    const I = INSTANCES[i];
    let pos = I.pos, ry = I.ry, rx = I.rx, sc = I.scale;
    if (I.anim && UI.animate){
      const a = I.anim, ph = t*a.spd + a.phase;
      if (a.type===0){ pos = [a.base[0], a.base[1] + Math.abs(Math.sin(ph))*a.amp*1.6, a.base[2]]; ry = I.ry + ph*0.7; }
      else if (a.type===1){ pos = [a.base[0]+Math.cos(ph)*a.amp*2.0, a.base[1], a.base[2]+Math.sin(ph)*a.amp*2.0]; ry = I.ry - ph; }
      else { pos = [a.base[0], a.base[1]+Math.sin(ph*1.3)*a.amp*0.7, a.base[2]]; ry = I.ry+ph*1.4; rx = Math.sin(ph*0.8)*0.9; }
    }
    const M = compose(pos, ry, rx, sc);
    const NM = m4transpose(m4inv(M));
    // rigid surfels are exact under transform -- no refit, no drift. Motion is
    // only used to invalidate the *cached* radiance and to bias the budget.
    let mo = 0;
    if (I._prev){
      const q = I._prev;
      mo = Math.hypot(M[12]-q[12], M[13]-q[13], M[14]-q[14]);
      for (let c=0;c<3;c++)
        mo += 0.5*Math.hypot(M[c*4]-q[c*4], M[c*4+1]-q[c*4+1], M[c*4+2]-q[c*4+2]);
    } else { I._prev = new Float32Array(16); }
    I._prev.set(M);
    if (mo > sceneMotion) sceneMotion = mo;
    const o = i*INST_FLOATS;
    instData.set(M, o); instData.set(NM, o+16);
    instData[o+32]=I.color[0]; instData[o+33]=I.color[1]; instData[o+34]=I.color[2]; instData[o+35]=I.metallic;
    instData[o+36]=I.rough;    instData[o+37]=I.spec;     instData[o+38]=I.bump;     instData[o+39]=I.pattern;
    instData[o+40]=I.emis[0];  instData[o+41]=I.emis[1];  instData[o+42]=I.emis[2];  instData[o+43]=mo;
    const P = PROTOS[I.proto];
    instU32[o+44]=P.nodeOffset; instU32[o+45]=P.nodeCount; instU32[o+46]=I.cacheBase; instU32[o+47]=i;
  }
  device.queue.writeBuffer(instBuf, 0, instData);
}

function extractPlanes(vp, shell, out, off){
  const row = r => [vp[0*4+r], vp[1*4+r], vp[2*4+r], vp[3*4+r]];
  const r0=row(0), r1=row(1), r2=row(2), r3=row(3);
  const pl = [
    [r3[0]+r0[0], r3[1]+r0[1], r3[2]+r0[2], r3[3]+r0[3]],
    [r3[0]-r0[0], r3[1]-r0[1], r3[2]-r0[2], r3[3]-r0[3]],
    [r3[0]+r1[0], r3[1]+r1[1], r3[2]+r1[2], r3[3]+r1[3]],
    [r3[0]-r1[0], r3[1]-r1[1], r3[2]-r1[2], r3[3]-r1[3]],
    [r2[0], r2[1], r2[2], r2[3]],
    [r3[0]-r2[0], r3[1]-r2[1], r3[2]-r2[2], r3[3]-r2[3]]
  ];
  for (let i=0;i<6;i++){
    const p=pl[i], l=Math.hypot(p[0],p[1],p[2])||1;
    out[off+i*4+0]=p[0]/l; out[off+i*4+1]=p[1]/l; out[off+i*4+2]=p[2]/l;
    out[off+i*4+3]=p[3]/l + shell;      // push outward -> off-screen shell
  }
}

/* ------------------------------------------------------------ main loop */
let statsPending=false, liveSurfels=0, requested=0, frame=0;
let fpsAcc=0, fpsN=0, fpsShown=0, lastT=performance.now();
let lastLightKey='', lastCamKey='', convFrac=0, raysIssued=0, autoFrozen=false;
const zeroBudget = new Uint32Array(4);

function render(now){
  const dt = Math.min(0.05, (now-lastT)/1000); lastT=now;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.35){ fpsShown = fpsN/fpsAcc; fpsAcc=0; fpsN=0; }
  const t = now*0.001;

  /* camera */
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const eye = [ cam.target[0] + cam.dist*cp*Math.sin(cam.yaw),
                cam.target[1] + cam.dist*sp,
                cam.target[2] + cam.dist*cp*Math.cos(cam.yaw) ];
  const view = m4look(eye, cam.target, [0,1,0]);
  const proj = m4persp(cam.fov, cw/ch, 0.06, 900);
  const vp   = m4mul(proj, view);
  const ivp  = m4inv(vp);

  /* sun */
  const az = UI.sunAz*Math.PI/180, el = UI.sunEl*Math.PI/180;
  const sun = V3.norm([Math.cos(el)*Math.sin(az), Math.sin(el), Math.cos(el)*Math.cos(az)]);
  const lEye = V3.add([0,0.5,0], V3.scale(sun, 40));
  const lUp = Math.abs(sun[1]) > 0.98 ? [0,0,1] : [0,1,0];
  const lView = m4look(lEye, [0,0.5,0], lUp);
  const lProj = m4ortho(-17,17,-17,17, 8, 78);
  const lightVP = m4mul(lProj, lView);

  /* globals */
  gF.set(vp, 0); gF.set(ivp, 16); gF.set(lightVP, 32);
  const projScale = (ch*0.5) / Math.tan(cam.fov*0.5);
  gF[48]=eye[0]; gF[49]=eye[1]; gF[50]=eye[2]; gF[51]=projScale;
  gF[52]=sun[0]; gF[53]=sun[1]; gF[54]=sun[2]; gF[55]=UI.sunI;
  gF[56]=1.0; gF[57]=0.96; gF[58]=0.88; gF[59]=UI.expo;
  gF[60]=UI.skyI; gF[61]=0; gF[62]=UI.ambI; gF[63]=0;
  gF[64]=UI.targetPx; gF[65]=UI.targetPx*UI.fadeBand; gF[66]=UI.discScale; gF[67]=0.05;
  gU[68]=INST_COUNT; gU[69]=MAX_SURFELS;
  const lightKey = `${UI.sunAz},${UI.sunEl},${UI.sunI},${UI.skyI},${UI.ambI}`;
  const lightMoved = lightKey !== lastLightKey; lastLightKey = lightKey;
  const camKey = `${eye[0].toFixed(3)},${eye[1].toFixed(3)},${eye[2].toFixed(3)},${cam.yaw.toFixed(4)},${cam.pitch.toFixed(4)}`;
  const camMoved = camKey !== lastCamKey; lastCamKey = camKey;
  gU[70]=(UI.fcull?1:0) | (UI.ccull?2:0) | (UI.shadows?4:0) | (UI.giOn?8:0) | (lightMoved?16:0);
  gU[71]=frame;
  gF[72]=UI.colorMode; gF[73]=(UI.viewMode===0) ? 1.0 : UI.sceneAlpha; gF[74]=t; gF[75]=1/SHADOW_RES;
  extractPlanes(vp, UI.shell, gF, 76);
  gF[100]=UI.giR; gF[101]=UI.giStr; gF[102]=UI.aoStr; gF[103]=UI.giDebug;
  gF[104]=UI.tAlpha; gF[105]=UI.bounce; gF[106]=UI.cones; gF[107]=UI.radScale;
  gF[108]=UI.traceDist; gF[109]=UI.guideAmt; gF[110]=UI.shareAmt;
  gF[111]=0;
  gF[112]=UI.rayBudget*1000; gF[113]=UI.heartbeat; gF[114]=UI.motionBoost; gF[115]=0;
  device.queue.writeBuffer(gBuf, 0, gArr);

  updateInstances(t);
  if (!UI.freeze) device.queue.writeBuffer(ctrBuf, 0, zero4);
  device.queue.writeBuffer(budgetBuf, 0, zeroBudget);

  // auto-freeze latch: converged, static scene, still camera -> stop integrating
  const quiet = sceneMotion < 1e-4 && !lightMoved && !camMoved && !UI.animate;
  if (quiet && convFrac > 0.98) { settled++; } else { settled = 0; }
  autoFrozen = UI.autoFreeze && settled > 45;

  const enc = device.createCommandEncoder();

  /* --- shadow map --- */
  {
    const p = enc.beginRenderPass({ colorAttachments:[], depthStencilAttachment:{
      view: shadowView, depthClearValue:1.0, depthLoadOp:'clear', depthStoreOp:'store' }});
    p.setPipeline(shadowPipe); p.setBindGroup(0, shadowBG);
    for (const b of batches){
      const g = protoGPU[b.proto];
      p.setVertexBuffer(0, g.vb); p.setIndexBuffer(g.ib, 'uint32');
      p.drawIndexed(g.indexCount, b.count, 0, 0, b.first);
    }
    p.end();
  }

  /* --- cut selection (Nanite-for-surfels) --- */
  if (!UI.freeze){
    const c = enc.beginComputePass();
    c.setPipeline(cutPipe); c.setBindGroup(0, cutBG);
    c.dispatchWorkgroups(Math.ceil(bakeInfo.maxNodes/64), INST_COUNT, 1);
    c.end();
    const a = enc.beginComputePass();
    a.setPipeline(argsPipe); a.setBindGroup(0, argsBG);
    a.dispatchWorkgroups(1); a.end();
  }

  /* --- hash grid rebuild --- */
  if (!UI.freeze){
    const c = enc.beginComputePass();
    c.setPipeline(gclearPipe); c.setBindGroup(0, gclearBG);
    c.dispatchWorkgroups(GRID_BUCKETS/256);
    c.setPipeline(gbuildPipe); c.setBindGroup(0, gbuildBG);
    c.dispatchWorkgroupsIndirect(argsBuf, 16);
    c.end();
  }

  /* --- phase 4: budget request/allocate, then phase-3 integration --------- */
  if (!UI.freeze && UI.giOn){
    const c = enc.beginComputePass();
    // request + allocate always run, even when frozen: this is how the latch
    // notices new or invalidated surfels and lets go again.
    c.setPipeline(reqPipe);   c.setBindGroup(0, reqBG);
    c.dispatchWorkgroupsIndirect(argsBuf, 16);
    c.setPipeline(allocPipe); c.setBindGroup(0, allocBG);
    c.dispatchWorkgroups(1);
    if (!UI.freezeGI && !autoFrozen){
      c.setPipeline(integPipe); c.setBindGroup(0, integBG);
      c.dispatchWorkgroupsIndirect(argsBuf, 16);
      c.setPipeline(sharePipe); c.setBindGroup(0, shareBG);
      c.dispatchWorkgroupsIndirect(argsBuf, 16);
      c.setPipeline(propPipe);  c.setBindGroup(0, propBG);
      for (let lv = 0; lv < bakeInfo.levels; lv++)
        c.dispatchWorkgroups(Math.ceil(bakeInfo.maxNodes/64), INST_COUNT, 1);
    }
    c.end();
  }

  /* --- half-res resolve --- */
  if (UI.giOn){
    const p = enc.beginRenderPass({
      colorAttachments:[
        {view:giView, clearValue:{r:0,g:0,b:0,a:1}, loadOp:'clear', storeOp:'store'},
        {view:gnView, clearValue:{r:0,g:0,b:0,a:-1}, loadOp:'clear', storeOp:'store'}],
      depthStencilAttachment:{view:giDepthView, depthClearValue:1.0,
        depthLoadOp:'clear', depthStoreOp:'store'}
    });
    p.setPipeline(giPrePipe); p.setBindGroup(0, giPreBG);
    for (const b of batches){
      const g = protoGPU[b.proto];
      p.setVertexBuffer(0, g.vb); p.setIndexBuffer(g.ib, 'uint32');
      p.drawIndexed(g.indexCount, b.count, 0, 0, b.first);
    }
    p.end();
  }

  /* --- main pass --- */
  {
    const p = enc.beginRenderPass({
      colorAttachments:[{ view: colorView, resolveTarget: ctx.getCurrentTexture().createView(),
        clearValue:{r:0.03,g:0.04,b:0.05,a:1}, loadOp:'clear', storeOp:'store' }],
      depthStencilAttachment:{ view: depthView, depthClearValue:1.0,
        depthLoadOp:'clear', depthStoreOp:'store' }
    });
    p.setPipeline(skyPipe); p.setBindGroup(0, skyBG); p.draw(3);

    if (UI.viewMode !== 1){
      p.setPipeline(meshPipe); p.setBindGroup(0, meshBG);
      for (const b of batches){
        const g = protoGPU[b.proto];
        p.setVertexBuffer(0, g.vb); p.setIndexBuffer(g.ib, 'uint32');
        p.drawIndexed(g.indexCount, b.count, 0, 0, b.first);
      }
    }
    if (UI.viewMode !== 0){
      p.setPipeline(discPipe); p.setBindGroup(0, discBG);
      p.drawIndirect(argsBuf, 0);
    }
    p.end();
  }

  const doStats = !statsPending;
  if (doStats){
    enc.copyBufferToBuffer(argsBuf, 0, readBuf, 0, 48);
    enc.copyBufferToBuffer(budgetBuf, 0, readBuf, 48, 16);
  }
  device.queue.submit([enc.finish()]);

  if (doStats){
    statsPending = true;
    readBuf.mapAsync(GPUMapMode.READ).then(()=>{
      const u = new Uint32Array(readBuf.getMappedRange().slice(0));
      liveSurfels = u[8]; requested = u[9];
      const totalReq = u[12] / 64, active = Math.max(u[15], 1);
      const scale = new Float32Array(new Uint32Array([u[13]]).buffer)[0];
      convFrac = u[14] / active;
      raysIssued = Math.min(totalReq * scale, UI.rayBudget * 1000);
      readBuf.unmap(); statsPending = false;
    }).catch(()=>{ statsPending = false; });
  }

  if ((frame & 7) === 0){
    const pct = bakeInfo.nodes ? (100*liveSurfels/bakeInfo.nodes).toFixed(1) : '0';
    $('stats').textContent =
      `${fpsShown.toFixed(0)} fps   ${(1000/Math.max(fpsShown,1e-3)).toFixed(2)} ms\n` +
      `baked leaves : ${bakeInfo.leaves}\n` +
      `baked nodes  : ${bakeInfo.nodes}  (${bakeInfo.ms.toFixed(0)} ms)\n` +
      `active cut   : ${liveSurfels}  (${pct}% of tree)\n` +
      `cache slots  : ${bakeInfo.cache||0}   max cones ${UI.cones}\n` +
      `rays/frame   : ${(raysIssued/1000).toFixed(1)}k / ${UI.rayBudget}k` +
        `   ${(convFrac*100).toFixed(1)}% conv${autoFrozen?'  [FROZEN]':''}\n` +
      `req/frame    : ${requested}\n` +
      `instances    : ${INST_COUNT}   cam d=${cam.dist.toFixed(1)}m`;
  }

  frame++;
  requestAnimationFrame(render);
}

/* ---- converged-cache serialisation (stable (instance,node) identity) ---- */
function bakeKey(){
  return ((Math.round(UI.spacing*1000)*131) ^ (Math.round(UI.curvGain*100)*17)
          ^ (TOTAL_CACHE*2654435761)) >>> 0;
}
async function saveCache(){
  const secs = [[cacheBuf, TOTAL_CACHE*CACHE_FLOATS*4],
                [guideBuf, TOTAL_CACHE*GUIDE_BINS*4],
                [momBuf,   TOTAL_CACHE*MOM_BINS*2*4]];
  const total = secs.reduce((a,s)=>a+s[1],0);
  const stg = device.createBuffer({size:total,
    usage:GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST});
  const e = device.createCommandEncoder();
  let off=0; for(const [b,n] of secs){ e.copyBufferToBuffer(b,0,stg,off,n); off+=n; }
  device.queue.submit([e.finish()]);
  await stg.mapAsync(GPUMapMode.READ);
  const body = new Uint8Array(stg.getMappedRange().slice(0));
  stg.unmap(); stg.destroy();
  const hdr = new Uint32Array([0x34494753, 1, TOTAL_CACHE, bakeKey(),
                               secs[0][1], secs[1][1], secs[2][1], 0]);
  const url = URL.createObjectURL(new Blob([hdr, body], {type:'application/octet-stream'}));
  const a = document.createElement('a');
  a.href = url; a.download = `surfel_cache_${TOTAL_CACHE}.sgi`; a.click();
  URL.revokeObjectURL(url);
}
async function loadCacheFile(file){
  const ab = await file.arrayBuffer();
  const h = new Uint32Array(ab, 0, 8);
  if (h[0] !== 0x34494753){ alert('Not a surfel cache file.'); return; }
  if (h[2] !== TOTAL_CACHE || h[3] !== bakeKey()){
    alert(`Cache/bake mismatch (file ${h[2]} slots, scene ${TOTAL_CACHE}). Rebake with the same settings first.`);
    return;
  }
  let off = 32;
  for (const [b,n] of [[cacheBuf,h[4]],[guideBuf,h[5]],[momBuf,h[6]]]){
    device.queue.writeBuffer(b, 0, ab, off, n); off += n;
  }
  settled = 0;
}
$('saveCache').addEventListener('click', ()=>saveCache());
$('loadCache').addEventListener('click', ()=>$('cacheFile').click());
$('cacheFile').addEventListener('change', e=>{
  if (e.target.files[0]) loadCacheFile(e.target.files[0]);
  e.target.value='';
});

requestAnimationFrame(render);
</script>
