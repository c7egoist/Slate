<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Engine Icon Set — Realistic SVG</title>
<style>
  :root{ --acc:#5fe3a1; --bg:#000; }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:#e7e9ec;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(900px 500px at 50% -10%,#151922 0%,#000 62%);
    min-height:100vh;
  }
  header{padding:44px 32px 22px;max-width:1400px;margin:0 auto}
  h1{margin:0 0 6px;font-size:26px;letter-spacing:-.4px;font-weight:650}
  h1 span{color:var(--acc)}
  .sub{color:#7d848f;font-size:13.5px;margin:0}
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
  input[type=search]{
    flex:1 1 240px;max-width:340px;background:#0d1015;border:1px solid #23262d;color:#e7e9ec;
    padding:10px 14px;border-radius:11px;outline:none;font-size:13.5px;
  }
  input[type=search]:focus{border-color:#39414d;box-shadow:0 0 0 3px rgba(95,227,161,.10)}
  .btn{
    background:#0d1015;border:1px solid #23262d;color:#c9ced6;padding:10px 15px;border-radius:11px;
    cursor:pointer;font-size:13px;transition:.18s;
  }
  .btn:hover{border-color:#3a424e;color:#fff;background:#11151b}
  .count{color:#5d646e;font-size:12.5px;margin-left:auto}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:16px;
    max-width:1400px;margin:0 auto;padding:14px 32px 90px;
  }
  .card{
    position:relative;background:#0a0c0f;border:1px solid #1a1e24;border-radius:20px;
    padding:20px 10px 14px;text-align:center;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s,background .18s;
    user-select:none;
  }
  .card:hover{transform:translateY(-4px);border-color:#333b46;background:#0e1116;box-shadow:0 16px 34px -18px #000,0 0 0 1px #1f242c inset}
  .card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 28px -6px rgba(95,227,161,.35)}
  .card svg{width:76px;height:76px;display:block;margin:0 auto;pointer-events:none}
  .nm{margin-top:12px;font-size:11.5px;color:#8a919b;letter-spacing:.2px;line-height:1.35}
  .card:hover .nm{color:#dfe3e9}
  .dl{
    position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:8px;border:1px solid #262b33;
    background:#12161c;color:#8f97a2;font-size:12px;line-height:22px;opacity:0;transition:.15s;
  }
  .card:hover .dl{opacity:1}
  .dl:hover{color:#fff;border-color:#49525f}
  .toast{
    position:fixed;left:50%;bottom:30px;transform:translate(-50%,26px);opacity:0;pointer-events:none;
    background:#12161c;border:1px solid #2b333d;color:#eaeef3;padding:11px 20px;border-radius:12px;
    font-size:13px;transition:.25s;box-shadow:0 18px 40px -14px #000;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  footer{color:#4c525b;font-size:12px;text-align:center;padding:0 20px 50px}
</style>
</head>
<body>

<header>
  <h1>Game Engine <span>Icon Set</span></h1>
  <p class="sub">36 realistic, fully-vector SVG icons — gradients, bevels, specular highlights. Click an icon to copy its SVG.</p>
  <div class="bar">
    <input type="search" id="q" placeholder="Search icons… (mesh, audio, physics)">
    <button class="btn" id="copyAll">Copy all SVG</button>
    <button class="btn" id="dlAll">Download sprite</button>
    <span class="count" id="count"></span>
  </div>
</header>

<div class="grid" id="grid"></div>
<div class="toast" id="toast">Copied</div>
<footer>Each icon is a standalone 120×120 SVG with its own defs — safe to paste anywhere.</footer>

/* ---------- render ---------- */
const grid=document.getElementById('grid'), toast=document.getElementById('toast');
let sel=null;
function pretty(s){ return s.replace(/></g,'>\n<'); }
function say(m){ toast.textContent=m; toast.classList.add('on'); clearTimeout(say._t); say._t=setTimeout(()=>toast.classList.remove('on'),1500); }
function copy(t){
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(t).catch(()=>fallback(t)); }
  else fallback(t);
}
function fallback(t){ const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity=0; document.body.appendChild(a); a.select(); try{document.execCommand('copy')}catch(e){} a.remove(); }
function download(name,svg){
  const b=new Blob([pretty(svg)],{type:'image/svg+xml'}), u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.svg'; a.click(); URL.revokeObjectURL(u);
}
function build(list){
  grid.innerHTML='';
  list.forEach(ic=>{
    const svg=wrap(ic.s);
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=svg+`<div class="nm">${ic.n}</div><button class="dl" title="Download SVG">↓</button>`;
    card.addEventListener('click',e=>{
      if(e.target.classList.contains('dl')){ download(ic.n,svg); say('Downloaded '+ic.n+'.svg'); return; }
      if(sel) sel.classList.remove('sel');
      card.classList.add('sel'); sel=card;
      copy(pretty(svg)); say('Copied “'+ic.n+'” SVG to clipboard');
    });
    grid.appendChild(card);
  });
  document.getElementById('count').textContent=list.length+' icons';
}
build(ICONS);
document.getElementById('q').addEventListener('input',e=>{
  const v=e.target.value.trim().toLowerCase();
  build(!v?ICONS:ICONS.filter(i=>(i.n+' '+i.k).toLowerCase().includes(v)));
});
document.getElementById('copyAll').addEventListener('click',()=>{
  copy(ICONS.map(i=>'<!-- '+i.n+' -->\n'+pretty(wrap(i.s))).join('\n\n')); say('Copied all '+ICONS.length+' icons');
});
document.getElementById('dlAll').addEventListener('click',()=>{
  const body=ICONS.map((i,x)=>`<symbol id="ge-${i.n.toLowerCase().replace(/[^a-z0-9]+/g,'-')}" viewBox="0 0 120 120">${i.s}</symbol>`).join('\n');
  const b=new Blob([`<svg xmlns="http://www.w3.org/2000/svg" style="display:none">\n${body}\n</svg>`],{type:'image/svg+xml'});
  const u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download='game-engine-icons-sprite.svg'; a.click(); URL.revokeObjectURL(u);
  say('Sprite sheet downloaded');
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sel){sel.classList.remove('sel');sel=null;} });
</script>
