<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TESSERA — WebGPU Pattern Studio</title>
<style>
:root{
  --bg:#0d0d0f; --panel:#151517; --panel2:#1b1b1e; --field:#262629; --line:#2b2b30;
  --tx:#e8e8ea; --tx2:#9a9aa2; --tx3:#6a6a73; --acc:#8b5cf6; --acc2:#a78bfa; --ok:#22c55e;
  --knob:#ffffff; --rad:10px;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font:12px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- top bar ---------- */
#topbar{height:42px;flex:0 0 42px;display:flex;align-items:center;gap:14px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.14em;font-size:11px}
.logo i{width:14px;height:14px;background:conic-gradient(from 45deg,var(--acc),#ec4899,#f97316,var(--acc));
  border-radius:3px;display:block}
#projname{background:var(--field);border:1px solid var(--line);border-radius:7px;padding:4px 9px;
  color:var(--tx);width:190px;outline:none}
.modes{display:flex;gap:2px;margin:0 auto}
.modes button{padding:5px 14px;border-radius:7px;color:var(--tx3);letter-spacing:.1em;font-size:10.5px;font-weight:700}
.modes button.on{color:var(--tx);background:var(--field);box-shadow:inset 0 -2px 0 var(--acc)}
.tb-right{display:flex;gap:6px;align-items:center}
.iconbtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--tx2)}
.iconbtn:hover{background:var(--field);color:var(--tx)}
.iconbtn.on{background:var(--acc);color:#fff}
#gpubadge{font-size:9.5px;letter-spacing:.08em;padding:3px 8px;border-radius:20px;background:var(--field);color:var(--tx2)}
#gpubadge.ok{color:#c4b5fd}

/* ---------- layout ---------- */
#main{flex:1;display:flex;min-height:0}
#left{display:flex;min-width:340px;background:var(--panel)}
#right{display:flex;min-width:320px;flex:1;background:#0b0b0d}
#divider{width:5px;cursor:col-resize;background:var(--line);flex:0 0 5px}
#divider:hover{background:var(--acc)}
body.mode-preview #left,body.mode-preview #divider{display:none}
body.mode-preview #right{flex:1}

/* tools */
#tools{width:44px;flex:0 0 44px;background:var(--panel2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;overflow-y:auto;scrollbar-width:thin}
#tools::-webkit-scrollbar{width:5px}#tools::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.tool{width:32px;height:32px;flex:0 0 32px;border-radius:8px;display:grid;place-items:center;color:var(--tx2);position:relative}
.tool:hover{background:#2a2a2e;color:var(--tx)}
.tool.on{background:var(--acc);color:#fff}
.tool svg{width:17px;height:17px;fill:currentColor}
.tool[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:38px;top:50%;transform:translateY(-50%);
  background:#000;border:1px solid var(--line);padding:3px 7px;border-radius:6px;white-space:nowrap;z-index:99;color:var(--tx);font-size:10.5px}
.tsep{width:22px;height:1px;background:var(--line);margin:4px 0;flex:0 0 1px}

/* stage */
#stagewrap{flex:1;position:relative;min-width:120px;background:
  linear-gradient(45deg,#141416 25%,transparent 25%,transparent 75%,#141416 75%),
  linear-gradient(45deg,#141416 25%,#101012 25%,#101012 75%,#141416 75%);
  background-size:18px 18px;background-position:0 0,9px 9px}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;align-items:center;
  background:#000a;border:1px solid var(--line);border-radius:8px;padding:3px 8px;color:var(--tx2);font-size:10.5px}
.hud button{color:var(--tx2);padding:2px 5px;border-radius:5px}
.hud button:hover{background:#ffffff18;color:#fff}

/* panels */
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
#side{width:270px;flex:0 0 270px}
#ppanel{width:288px;flex:0 0 288px}
.tabs{display:flex;flex:0 0 34px;height:34px;border-bottom:1px solid var(--line);background:var(--panel2)}
.tabs button{flex:1;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--tx3)}
.tabs button.on{color:var(--tx);box-shadow:inset 0 -2px 0 var(--acc)}
.pane{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px;scrollbar-width:thin}
.pane::-webkit-scrollbar{width:7px}.pane::-webkit-scrollbar-thumb{background:#2f2f35;border-radius:4px}
.sec{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);margin-bottom:9px;overflow:hidden}
.sec>h4{margin:0;padding:8px 10px;font-size:10px;letter-spacing:.11em;color:var(--tx2);font-weight:700;
  display:flex;align-items:center;gap:7px;cursor:pointer}
.sec>h4 .cv{margin-left:auto;color:var(--tx3);transition:.15s}
.sec.closed>.body{display:none}.sec.closed>h4 .cv{transform:rotate(-90deg)}
.body{padding:4px 10px 10px}

/* controls */
.row{display:flex;align-items:center;gap:8px;margin:5px 0;min-height:26px}
.row>.lab{flex:0 0 74px;color:var(--tx2);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:flex;align-items:center;background:var(--field);border-radius:8px;padding:0 7px;height:26px;flex:0 0 64px}
.field input{width:100%;background:none;border:0;outline:none;color:var(--tx);font-size:11.5px;text-align:left;
  -webkit-user-select:text;user-select:text}
.field .u{color:var(--tx3);font-size:10px;padding-left:2px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:18px;background:none;outline:none;min-width:40px}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:#3a3a40}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:15px;border-radius:4px;
  background:var(--knob);margin-top:-5px;box-shadow:0 1px 3px #000a;cursor:grab}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:#3a3a40}
input[type=range]::-moz-range-thumb{width:11px;height:15px;border:0;border-radius:4px;background:var(--knob)}
select{background:var(--field);border:0;border-radius:8px;color:var(--tx);height:26px;padding:0 6px;flex:1;outline:none;min-width:0}
.sw{width:32px;height:22px;border-radius:6px;border:1px solid #ffffff22;cursor:pointer;
  background-image:linear-gradient(45deg,#555 25%,transparent 25%,transparent 75%,#555 75%),linear-gradient(45deg,#555 25%,#333 25%,#333 75%,#555 75%);
  background-size:8px 8px;background-position:0 0,4px 4px;position:relative;overflow:hidden}
.sw i{position:absolute;inset:0;display:block}
.tog{width:34px;height:19px;border-radius:11px;background:#3a3a40;position:relative;flex:0 0 34px;transition:.15s;cursor:pointer}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}
.tog.on{background:var(--acc)}.tog.on::after{transform:translateX(15px)}
.togrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line)}
.togrow .t{font-size:11.5px}
.seg{display:flex;gap:4px;flex:1;background:var(--field);border-radius:9px;padding:3px}
.seg button{flex:1;height:22px;border-radius:7px;color:var(--tx3);font-size:10.5px}
.seg button.on{background:#fff;color:#111;font-weight:700}
.btn{background:var(--field);border-radius:8px;padding:6px 10px;color:var(--tx);flex:1;text-align:center;font-size:11px}
.btn:hover{background:#33333a}
.btn.p{background:var(--acc);color:#fff}.btn.p:hover{background:var(--acc2)}
.btnrow{display:flex;gap:6px;margin-top:7px}
.chk{display:flex;align-items:center;gap:7px;color:var(--tx2);cursor:pointer;margin:6px 0}
.chk i{width:14px;height:14px;border-radius:4px;border:1px solid #4a4a52;display:grid;place-items:center;font-style:normal;font-size:10px;color:#fff}
.chk.on i{background:var(--acc);border-color:var(--acc)}

/* outliner */
#olist{display:flex;flex-direction:column;gap:2px}
.ol{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:8px;background:var(--panel2);
  border:1px solid transparent;cursor:pointer}
.ol:hover{background:#232328}
.ol.sel{border-color:var(--acc);background:#2a2440}
.ol .ico{width:20px;height:20px;flex:0 0 20px;display:grid;place-items:center;color:var(--tx2)}
.ol .ico svg{width:16px;height:16px}
.ol .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.ol .nm[contenteditable=true]{-webkit-user-select:text;user-select:text;outline:1px solid var(--acc);border-radius:4px;padding:0 2px}
.ol .mini{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--tx3);opacity:.75}
.ol .mini:hover{background:#ffffff18;color:#fff;opacity:1}
.ol.hid{opacity:.42}
.ol.drop{box-shadow:0 -2px 0 var(--acc)}
.empty{color:var(--tx3);text-align:center;padding:22px 8px;font-size:11px}

/* viewport */
#vp{flex:1;position:relative;min-width:0;overflow:hidden}
#gpu{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vpbar{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
#vpbar button{width:30px;height:30px;border-radius:8px;background:#000b;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--tx2)}
#vpbar button:hover{color:#fff;border-color:var(--acc)}
#vpinfo{position:absolute;left:10px;top:10px;background:#000a;border:1px solid var(--line);border-radius:8px;
  padding:4px 9px;color:var(--tx3);font-size:10px;letter-spacing:.05em}

/* color picker */
#cp{position:fixed;z-index:200;width:238px;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:10px;box-shadow:0 18px 50px #000c;display:none}
#cp.open{display:block}
#sv{width:100%;height:130px;border-radius:8px;cursor:crosshair;display:block}
.strip{height:16px;border-radius:9px;margin-top:9px;position:relative;cursor:pointer}
#hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#alp{background-image:linear-gradient(90deg,transparent,#fff),linear-gradient(45deg,#555 25%,transparent 25%,transparent 75%,#555 75%),linear-gradient(45deg,#555 25%,#333 25%,#333 75%,#555 75%);
  background-size:100% 100%,8px 8px,8px 8px;background-position:0 0,0 0,4px 4px}
.knob{position:absolute;top:50%;width:12px;height:20px;border-radius:5px;background:#fff;border:1px solid #0007;
  transform:translate(-50%,-50%);pointer-events:none}
#svknob{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0008;transform:translate(-50%,-50%);pointer-events:none}
.swrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.swrow b{width:16px;height:16px;border-radius:50%;cursor:pointer;border:1px solid #ffffff22}
#hex{margin-top:9px;width:100%;background:var(--field);border:0;border-radius:8px;height:26px;color:var(--tx);
  padding:0 8px;outline:none;-webkit-user-select:text;user-select:text;text-transform:uppercase}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);
  padding:8px 14px;border-radius:10px;color:var(--tx);z-index:300;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo"><i></i>TESSERA</div>
    <input id="projname" value="DEMO PROJECT #1"/>
    <div class="modes">
      <button data-m="design" class="on">DESIGN</button>
      <button data-m="preview">PREVIEW</button>
      <button data-m="export">EXPORT</button>
    </div>
    <div class="tb-right">
      <span id="gpubadge">INIT…</span>
      <button class="iconbtn" id="undo" title="Undo (Ctrl+Z)">↶</button>
      <button class="iconbtn" id="redo" title="Redo (Ctrl+Y)">↷</button>
    </div>
  </div>

  <div id="main">
    <section id="left" style="flex:0 0 50%">
      <div id="tools"></div>
      <div id="stagewrap">
        <canvas id="stage"></canvas>
        <div class="hud">
          <button id="zoomout">−</button><span id="zlab">100%</span><button id="zoomin">+</button>
          <button id="fit">FIT</button><span id="hint" style="color:#5a5a63"></span>
        </div>
      </div>
      <aside id="side">
        <div class="tabs" id="ltabs">
          <button data-t="out" class="on">OUTLINER</button>
          <button data-t="prop">PROPERTIES</button>
          <button data-t="tile">TILE</button>
        </div>
        <div class="pane" id="lpane"></div>
      </aside>
    </section>

    <div id="divider"></div>

    <section id="right">
      <div id="vp">
        <canvas id="gpu"></canvas>
        <div id="vpinfo">PATTERN</div>
        <div id="vpbar">
          <button id="vzoomout" title="Zoom out">−</button>
          <button id="vzoomin" title="Zoom in">+</button>
          <button id="vfit" title="Reset view">⤢</button>
        </div>
      </div>
      <aside id="ppanel">
        <div class="tabs" id="rtabs">
          <button data-t="pat" class="on">PATTERN</button>
          <button data-t="fx">EFFECTS</button>
          <button data-t="exp">EXPORT</button>
        </div>
        <div class="pane" id="rpane"></div>
      </aside>
    </section>
  </div>
</div>

<div id="cp">
  <div style="position:relative"><canvas id="sv" width="216" height="130"></canvas><div id="svknob"></div></div>
  <div class="strip" id="hue"><div class="knob" id="hueknob"></div></div>
  <div class="strip" id="alp"><div class="knob" id="alpknob"></div></div>
  <input id="hex" value="#FFFFFF"/>
  <div class="swrow" id="swrow"></div>
</div>
<div id="toast"></div>
<input type="file" id="fileimg" accept="image/*" style="display:none"/>
<input type="file" id="filejson" accept=".json,application/json" style="display:none"/>

<script>
"use strict";
/* =======================================================================
   0. UTILITIES
======================================================================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const uid=()=>Math.random().toString(36).slice(2,9);
const DEG=Math.PI/180, K=0.5522847498307936;
const fmt=n=>Math.abs(n)>=100?Math.round(n):Math.round(n*100)/100;
function el(t,a={},...k){const e=document.createElement(t);
  for(const p in a){ if(p==='class')e.className=a[p]; else if(p==='html')e.innerHTML=a[p];
    else if(p.startsWith('on'))e.addEventListener(p.slice(2),a[p]); else e.setAttribute(p,a[p]); }
  for(const c of k.flat()) if(c!=null) e.append(c.nodeType?c:document.createTextNode(c));
  return e;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1900);}

/* colors: canonical form '#rrggbbaa' */
function normHex(c){ c=(c||'#000000').trim();
  if(c[0]!=='#') c='#'+c;
  if(c.length===4) c='#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
  if(c.length===7) c+='ff';
  if(c.length!==9) c='#000000ff';
  return c.toLowerCase(); }
function hex2rgba(c){c=normHex(c);return[parseInt(c.slice(1,3),16)/255,parseInt(c.slice(3,5),16)/255,parseInt(c.slice(5,7),16)/255,parseInt(c.slice(7,9),16)/255];}
function rgba2hex(r,g,b,a=1){const h=v=>Math.round(clamp(v,0,1)*255).toString(16).padStart(2,'0');return '#'+h(r)+h(g)+h(b)+h(a);}
function rgb2hsv(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360;}
  return[h,mx?d/mx:0,mx];}
function hsv2rgb(h,s,v){h=((h%360)+360)%360;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
  return[r+m,g+m,b+m];}

/* =======================================================================
   1. GEOMETRY  (nodes = cubic bezier anchors with absolute handles)
======================================================================= */
const nd=(x,y,ix,iy,ox,oy)=>({x,y,ix:ix??x,iy:iy??y,ox:ox??x,oy:oy??y});
const sp=(nodes,closed=true)=>({closed,nodes});
function tr(subs,dx,dy){return subs.map(s=>sp(s.nodes.map(n=>nd(n.x+dx,n.y+dy,n.ix+dx,n.iy+dy,n.ox+dx,n.oy+dy)),s.closed));}
function polyNodes(pts,r=0,closed=true){
  const n=pts.length,out=[];
  if(!(r>0)){for(const p of pts)out.push(nd(p[0],p[1]));return[sp(out,closed)];}
  for(let i=0;i<n;i++){
    const v=pts[i],pv=pts[(i-1+n)%n],nx=pts[(i+1)%n];
    const d1=[pv[0]-v[0],pv[1]-v[1]],d2=[nx[0]-v[0],nx[1]-v[1]];
    const l1=Math.hypot(d1[0],d1[1])||1,l2=Math.hypot(d2[0],d2[1])||1;
    const rr=Math.min(r,l1/2,l2/2);
    const a=[v[0]+d1[0]/l1*rr,v[1]+d1[1]/l1*rr], b=[v[0]+d2[0]/l2*rr,v[1]+d2[1]/l2*rr];
    out.push(nd(a[0],a[1],a[0],a[1],a[0]+(v[0]-a[0])*K,a[1]+(v[1]-a[1])*K));
    out.push(nd(b[0],b[1],b[0]+(v[0]-b[0])*K,b[1]+(v[1]-b[1])*K,b[0],b[1]));
  }
  return[sp(out,closed)];
}
function ellipseNodes(rx,ry){const kx=rx*K,ky=ry*K;
  return[sp([nd(0,-ry,-kx,-ry,kx,-ry),nd(rx,0,rx,-ky,rx,ky),nd(0,ry,kx,ry,-kx,ry),nd(-rx,0,-rx,ky,-rx,-ky)],true)];}
function smoothNodes(pts,closed=true,t=1){
  const n=pts.length,out=[];
  for(let i=0;i<n;i++){
    const p0=pts[closed?(i-1+n)%n:Math.max(i-1,0)],p1=pts[i],p2=pts[closed?(i+1)%n:Math.min(i+1,n-1)];
    const tx=(p2[0]-p0[0])/6*t,ty=(p2[1]-p0[1])/6*t;
    out.push(nd(p1[0],p1[1],p1[0]-tx,p1[1]-ty,p1[0]+tx,p1[1]+ty));
  }
  return[sp(out,closed)];
}
const pol=(r,a)=>[Math.cos(a)*r,Math.sin(a)*r];
function seedRnd(s){let x=s*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280;};}

/* ---- shape registry ---------------------------------------------------*/
const P=(k,label,def,min,max,step=1)=>({k,label,def,min,max,step});
const SHAPES={
 rect:{label:'Rectangle',params:[P('w','Width',180,1,2000),P('h','Height',180,1,2000),P('r','Corner',0,0,600)],
   path:p=>polyNodes([[-p.w/2,-p.h/2],[p.w/2,-p.h/2],[p.w/2,p.h/2],[-p.w/2,p.h/2]],p.r)},
 square:{label:'Square',params:[P('s','Size',180,1,2000),P('r','Corner',0,0,600)],
   path:p=>polyNodes([[-p.s/2,-p.s/2],[p.s/2,-p.s/2],[p.s/2,p.s/2],[-p.s/2,p.s/2]],p.r)},
 ellipse:{label:'Ellipse',params:[P('rx','Radius X',90,1,1000),P('ry','Radius Y',90,1,1000)],
   path:p=>ellipseNodes(p.rx,p.ry)},
 circle:{label:'Circle',params:[P('r','Radius',90,1,1000)],path:p=>ellipseNodes(p.r,p.r)},
 triangle:{label:'Triangle',params:[P('w','Width',180,1,2000),P('h','Height',160,1,2000),P('r','Corner',0,0,300)],
   path:p=>polyNodes([[0,-p.h/2],[p.w/2,p.h/2],[-p.w/2,p.h/2]],p.r)},
 diamond:{label:'Diamond',params:[P('w','Width',160,1,2000),P('h','Height',200,1,2000),P('r','Corner',0,0,300)],
   path:p=>polyNodes([[0,-p.h/2],[p.w/2,0],[0,p.h/2],[-p.w/2,0]],p.r)},
 polygon:{label:'Polygon',params:[P('n','Sides',6,3,24),P('r','Radius',100,1,1000),P('c','Corner',0,0,300),P('a','Angle',0,-180,180)],

function shapeSubpaths(s){
  if(s.type==='path') return s.nodes||[];
  const def=SHAPES[s.type]; if(!def||!def.path) return [];
  try{ return def.path(s.params)||[]; }catch(e){ return []; }
}
function buildPath2D(subs){
  const p=new Path2D();
  for(const s of subs){ const n=s.nodes; if(!n||!n.length)continue;
    p.moveTo(n[0].x,n[0].y);
    for(let i=0;i<n.length-1;i++)p.bezierCurveTo(n[i].ox,n[i].oy,n[i+1].ix,n[i+1].iy,n[i+1].x,n[i+1].y);
    if(s.closed){const a=n[n.length-1],b=n[0];p.bezierCurveTo(a.ox,a.oy,b.ix,b.iy,b.x,b.y);p.closePath();}
  } return p;
}
function subsToD(subs){
  let d='';
  for(const s of subs){const n=s.nodes;if(!n||!n.length)continue;
    d+=`M ${n[0].x.toFixed(2)} ${n[0].y.toFixed(2)} `;
    for(let i=0;i<n.length-1;i++)d+=`C ${n[i].ox.toFixed(2)} ${n[i].oy.toFixed(2)} ${n[i+1].ix.toFixed(2)} ${n[i+1].iy.toFixed(2)} ${n[i+1].x.toFixed(2)} ${n[i+1].y.toFixed(2)} `;
    if(s.closed){const a=n[n.length-1],b=n[0];d+=`C ${a.ox.toFixed(2)} ${a.oy.toFixed(2)} ${b.ix.toFixed(2)} ${b.iy.toFixed(2)} ${b.x.toFixed(2)} ${b.y.toFixed(2)} Z `;}
  } return d.trim();
}
function subsBBox(subs){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const s of subs)for(const n of s.nodes)for(const p of [[n.x,n.y],[n.ix,n.iy],[n.ox,n.oy]]){
    x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  if(x0>x1){x0=y0=-10;x1=y1=10;} return{x0,y0,x1,y1};
}
function shapeBBoxLocal(s){
  if(s.type==='text'){const w=(s.textValue||'Text').length*s.params.size*0.58,h=s.params.size;return{x0:-w/2,y0:-h*0.72,x1:w/2,y1:h*0.28};}
  const b=subsBBox(shapeSubpaths(s));
  if(s.stroke.on){const g=s.stroke.width/2;b.x0-=g;b.y0-=g;b.x1+=g;b.y1+=g;}
  return b;
}
function shapeBBoxWorld(s){
  const b=shapeBBoxLocal(s),c=Math.cos(s.rot*DEG),si=Math.sin(s.rot*DEG);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const[px,py]of[[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]]){
    const sx=px*s.sx,sy=py*s.sy,wx=s.x+sx*c-sy*si,wy=s.y+sx*si+sy*c;
    x0=Math.min(x0,wx);y0=Math.min(y0,wy);x1=Math.max(x1,wx);y1=Math.max(y1,wy);}
  return{x0,y0,x1,y1};
}

   3. SHAPE DRAWING (shared by tile raster + editor)
======================================================================= */
function fillStyleFor(ctx,s,bb){
  const f=s.fill;
  if(f.type==='solid')return f.color;
  const cx=(bb.x0+bb.x1)/2,cy=(bb.y0+bb.y1)/2,r=Math.max(4,Math.hypot(bb.x1-bb.x0,bb.y1-bb.y0)/2);
  if(f.type==='radial'){const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,f.color);g.addColorStop(1,f.color2);return g;}
  const a=(f.angle||0)*DEG;
  const g=ctx.createLinearGradient(cx-Math.cos(a)*r,cy-Math.sin(a)*r,cx+Math.cos(a)*r,cy+Math.sin(a)*r);
  g.addColorStop(0,f.color);g.addColorStop(1,f.color2);return g;
}
function drawShape(ctx,s,dx=0,dy=0){
  if(!s.visible)return;
  ctx.save();
  ctx.globalAlpha=clamp(s.opacity,0,1);
  try{ctx.globalCompositeOperation=s.blend||'source-over';}catch(e){}
  ctx.translate(s.x+dx,s.y+dy);ctx.rotate(s.rot*DEG);ctx.scale(s.sx||1e-4,s.sy||1e-4);
  if(s.type==='image'){
    const im=imgCache.get(s.id);
    if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,-s.params.w/2,-s.params.h/2,s.params.w,s.params.h);
    else{ctx.fillStyle='#2a2a30';ctx.fillRect(-s.params.w/2,-s.params.h/2,s.params.w,s.params.h);}
  }else if(s.type==='text'){
    ctx.font=`${s.params.weight} ${s.params.size}px ${s.font}`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(ctx.letterSpacing!==undefined)ctx.letterSpacing=(s.params.track||0)/10+'px';
    const bb=shapeBBoxLocal(s);
    if(s.fill.type!=='none'){ctx.fillStyle=fillStyleFor(ctx,s,bb);ctx.fillText(s.textValue||'',0,0);}
    if(s.stroke.on){ctx.lineWidth=s.stroke.width;ctx.strokeStyle=s.stroke.color;ctx.strokeText(s.textValue||'',0,0);}
  }else{
    const subs=shapeSubpaths(s);if(!subs.length){ctx.restore();return;}
    const p=buildPath2D(subs),bb=subsBBox(subs);
    if(s.fill.type!=='none'){ctx.fillStyle=fillStyleFor(ctx,s,bb);ctx.fill(p,s.fillRule||'nonzero');}
    if(s.stroke.on){
      ctx.lineWidth=Math.max(.01,s.stroke.width);ctx.strokeStyle=s.stroke.color;
      ctx.lineCap=s.stroke.cap;ctx.lineJoin=s.stroke.join;
      ctx.setLineDash(s.stroke.dash>0?[s.stroke.dash,s.stroke.dash*0.8]:[]);
      ctx.stroke(p);ctx.setLineDash([]);
    }
  }
  ctx.restore();
}

/* ---- tile rasterizer --------------------------------------------------*/
const tileCv=document.createElement('canvas');
function tileOffsets(s){
  const b=shapeBBoxWorld(s),W=doc.tile.w,H=doc.tile.h,out=[];
  for(const dx of[-W,0,W])for(const dy of[-H,0,H]){
    if(b.x1+dx>0&&b.x0+dx<W&&b.y1+dy>0&&b.y0+dy<H)out.push([dx,dy]);
  } return out.length?out:[];
}
function rasterizeTile(){
  const R=Math.round(doc.tile.res);
  const h=Math.max(4,Math.round(R*doc.tile.h/doc.tile.w));
  if(tileCv.width!==R||tileCv.height!==h){tileCv.width=R;tileCv.height=h;}
  const c=tileCv.getContext('2d');
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,R,h);
  c.fillStyle=doc.tile.bg;c.fillRect(0,0,R,h);
  const k=R/doc.tile.w;c.scale(k,k);
  for(const s of doc.shapes){ if(!s.visible)continue; for(const[dx,dy]of tileOffsets(s))drawShape(c,s,dx,dy); }
}

======================================================================= */
const stage=$('#stage'),sctx=stage.getContext('2d');
const view={x:0,y:0,z:1};
let dpr=Math.min(devicePixelRatio||1,2);
function resizeStage(){
  const r=stage.parentElement.getBoundingClientRect();
  dpr=Math.min(devicePixelRatio||1,2);
  stage.width=Math.max(1,r.width*dpr);stage.height=Math.max(1,r.height*dpr);
  drawStage();
}
const w2s=(x,y)=>[(x-view.x)*view.z,(y-view.y)*view.z];
const s2w=(x,y)=>[x/view.z+view.x,y/view.z+view.y];
function fitView(){
  const r=stage.parentElement.getBoundingClientRect();
  const z=Math.min(r.width/(doc.tile.w*1.35),r.height/(doc.tile.h*1.35));
  view.z=z;view.x=doc.tile.w/2-r.width/(2*z);view.y=doc.tile.h/2-r.height/(2*z);
  drawStage();
}
function drawStage(){
  const W=stage.width/dpr,H=stage.height/dpr;
  sctx.setTransform(dpr,0,0,dpr,0,0);
  sctx.clearRect(0,0,W,H);
  sctx.save();
  sctx.translate(-view.x*view.z,-view.y*view.z);sctx.scale(view.z,view.z);
  const T=doc.tile;
  /* ghosts */
  if(T.ghost){
    sctx.globalAlpha=.30;
    for(const dx of[-T.w,0,T.w])for(const dy of[-T.h,0,T.h]){
      if(!dx&&!dy)continue;
      sctx.save();sctx.beginPath();sctx.rect(dx,dy,T.w,T.h);sctx.clip();
      sctx.fillStyle=T.bg;sctx.fillRect(dx,dy,T.w,T.h);
      for(const s of doc.shapes)for(const[ox,oy]of tileOffsets(s))drawShape(sctx,s,ox+dx,oy+dy);
      sctx.restore();
    }
    sctx.globalAlpha=1;
  }
  /* tile */
  sctx.save();sctx.beginPath();sctx.rect(0,0,T.w,T.h);sctx.clip();
  sctx.fillStyle=T.bg;sctx.fillRect(0,0,T.w,T.h);
  for(const s of doc.shapes)for(const[dx,dy]of tileOffsets(s))drawShape(sctx,s,dx,dy);
  sctx.restore();
  /* grid */
  if(T.grid>0&&view.z>0.25){
    sctx.strokeStyle='rgba(255,255,255,.07)';sctx.lineWidth=1/view.z;sctx.beginPath();
    for(let x=0;x<=T.w+.5;x+=T.grid){sctx.moveTo(x,0);sctx.lineTo(x,T.h);}
    for(let y=0;y<=T.h+.5;y+=T.grid){sctx.moveTo(0,y);sctx.lineTo(T.w,y);}
    sctx.stroke();
  }
  sctx.strokeStyle='#8b5cf6';sctx.lineWidth=1.5/view.z;sctx.strokeRect(0,0,T.w,T.h);
  sctx.restore();
  drawOverlay();
}
function shapeMatrix(s){const c=Math.cos(s.rot*DEG),si=Math.sin(s.rot*DEG);
  return{a:c*s.sx,b:si*s.sx,c:-si*s.sy,d:c*s.sy,e:s.x,f:s.y};}
function localToWorld(s,lx,ly){const m=shapeMatrix(s);return[m.a*lx+m.c*ly+m.e,m.b*lx+m.d*ly+m.f];}
function worldToLocal(s,wx,wy){
  const c=Math.cos(-s.rot*DEG),si=Math.sin(-s.rot*DEG);
  const dx=wx-s.x,dy=wy-s.y,rx=dx*c-dy*si,ry=dx*si+dy*c;
  return[rx/(s.sx||1e-4),ry/(s.sy||1e-4)];
}
function drawOverlay(){
  const shapes=selShapes();if(!shapes.length&&!pen.active&&!marquee)return;
  sctx.save();sctx.translate(-view.x*view.z,-view.y*view.z);sctx.scale(view.z,view.z);
  const lw=1.3/view.z,hs=5/view.z;
  for(const s of shapes){
    const b=shapeBBoxLocal(s);
    const pts=[[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]].map(p=>localToWorld(s,p[0],p[1]));
    sctx.strokeStyle='#8b5cf6';sctx.lineWidth=lw;sctx.beginPath();
    sctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<4;i++)sctx.lineTo(pts[i][0],pts[i][1]);
    sctx.closePath();sctx.stroke();
    if(shapes.length===1&&tool==='select'){
      const hp=handlePoints(s);
      sctx.fillStyle='#fff';sctx.strokeStyle='#8b5cf6';
      for(const h of hp){sctx.beginPath();sctx.rect(h.p[0]-hs/2,h.p[1]-hs/2,hs,hs);sctx.fill();sctx.stroke();}
      const rp=rotHandle(s);
      sctx.beginPath();sctx.moveTo((pts[0][0]+pts[1][0])/2,(pts[0][1]+pts[1][1])/2);sctx.lineTo(rp[0],rp[1]);sctx.stroke();
      sctx.beginPath();sctx.arc(rp[0],rp[1],hs*0.7,0,7);sctx.fill();sctx.stroke();
    }
    if(tool==='node'&&s.type==='path')drawNodes(s,hs);
  }
  if(pen.active&&pen.nodes.length){
    sctx.strokeStyle='#22d3ee';sctx.lineWidth=lw;
    const p=buildPath2D([sp(pen.nodes,false)]);sctx.stroke(p);
    sctx.fillStyle='#22d3ee';
    for(const n of pen.nodes){sctx.beginPath();sctx.rect(n.x-hs/2,n.y-hs/2,hs,hs);sctx.fill();}
  }
  if(marquee){
    sctx.strokeStyle='#8b5cf6';sctx.setLineDash([4/view.z,3/view.z]);sctx.lineWidth=lw;
    sctx.strokeRect(marquee.x0,marquee.y0,marquee.x1-marquee.x0,marquee.y1-marquee.y0);sctx.setLineDash([]);

function drawNodes(s,hs){
  for(const subp of (s.nodes||[]))for(const n of subp.nodes){
    const P0=localToWorld(s,n.x,n.y),Pi=localToWorld(s,n.ix,n.iy),Po=localToWorld(s,n.ox,n.oy);
    sctx.strokeStyle='#22d3ee88';sctx.lineWidth=1/view.z;
    sctx.beginPath();sctx.moveTo(Pi[0],Pi[1]);sctx.lineTo(P0[0],P0[1]);sctx.lineTo(Po[0],Po[1]);sctx.stroke();
    sctx.fillStyle='#22d3ee';
    for(const H of[Pi,Po]){sctx.beginPath();sctx.arc(H[0],H[1],hs*0.45,0,7);sctx.fill();}
    sctx.fillStyle='#fff';sctx.strokeStyle='#8b5cf6';
    sctx.beginPath();sctx.rect(P0[0]-hs*0.55,P0[1]-hs*0.55,hs*1.1,hs*1.1);sctx.fill();sctx.stroke();
  }
}
function handlePoints(s){
  const b=shapeBBoxLocal(s),mx=(b.x0+b.x1)/2,my=(b.y0+b.y1)/2;
  return[['nw',b.x0,b.y0],['n',mx,b.y0],['ne',b.x1,b.y0],['e',b.x1,my],['se',b.x1,b.y1],['s',mx,b.y1],['sw',b.x0,b.y1],['w',b.x0,my]]
    .map(h=>({k:h[0],l:[h[1],h[2]],p:localToWorld(s,h[1],h[2])}));
}
function rotHandle(s){const b=shapeBBoxLocal(s);return localToWorld(s,(b.x0+b.x1)/2,b.y0-28/view.z/Math.abs(s.sy||1));}

/* ---- hit test ---------------------------------------------------------*/
const hitCv=document.createElement('canvas').getContext('2d');
function hitShape(s,wx,wy){
  if(!s.visible||s.locked)return false;
  const[lx,ly]=worldToLocal(s,wx,wy);
  if(s.type==='image'||s.type==='text'){const b=shapeBBoxLocal(s);return lx>=b.x0&&lx<=b.x1&&ly>=b.y0&&ly<=b.y1;}
  const subs=shapeSubpaths(s);if(!subs.length)return false;
  const p=buildPath2D(subs);
  if(s.fill.type!=='none'&&hitCv.isPointInPath(p,lx,ly,s.fillRule||'nonzero'))return true;
  hitCv.lineWidth=Math.max(6/view.z,(s.stroke.width||6));
  return hitCv.isPointInStroke(p,lx,ly);
}
function pickAt(wx,wy){for(let i=doc.shapes.length-1;i>=0;i--)if(hitShape(doc.shapes[i],wx,wy))return doc.shapes[i];return null;}
const snapV=v=>doc.tile.snap?Math.round(v/doc.tile.grid)*doc.tile.grid:v;

/* ---- interactions -----------------------------------------------------*/
let drag=null,marquee=null,pen={active:false,nodes:[],shape:null};
function evPos(e){const r=stage.getBoundingClientRect();return s2w(e.clientX-r.left,e.clientY-r.top);}
stage.addEventListener('pointerdown',e=>{
  stage.setPointerCapture(e.pointerId);
  const[wx,wy]=evPos(e);
  if(e.button===1||e.altKey||tool==='pan'){drag={t:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};return;}
  if(tool==='pen'){penClick(wx,wy,e);return;}
  if(TOOLSHAPES.includes(tool)||tool==='text'){
    const s=newShape(tool,{x:snapV(wx),y:snapV(wy)});
    if(tool==='text')s.textValue=prompt('Text:','TESSERA')||'TESSERA';
    doc.shapes.push(s);sel=[s.id];drag={t:'create',s,ox:wx,oy:wy};
    refreshAll();return;
  }
  const one=selShapes();
  if(tool==='select'&&one.length===1){
    const s=one[0],tol=8/view.z;
    const rp=rotHandle(s);
    if(Math.hypot(rp[0]-wx,rp[1]-wy)<tol){drag={t:'rot',s,a0:Math.atan2(wy-s.y,wx-s.x),r0:s.rot};return;}
    for(const h of handlePoints(s)) if(Math.hypot(h.p[0]-wx,h.p[1]-wy)<tol){
      drag={t:'scale',s,k:h.k,l:h.l,sx0:s.sx,sy0:s.sy};return;}
  }
  if(tool==='node'&&one.length===1&&one[0].type==='path'){
    const s=one[0],tol=8/view.z;
    for(const subp of s.nodes)for(const n of subp.nodes){
      for(const key of['','i','o']){
        const px=key===''?n.x:n[key+'x'],py=key===''?n.y:n[key+'y'];
        const W=localToWorld(s,px,py);
        if(Math.hypot(W[0]-wx,W[1]-wy)<tol){drag={t:'node',s,n,key,alt:e.altKey};return;}
      }}
  }
  const hit=pickAt(wx,wy);
  if(hit){
    if(e.shiftKey){ sel.includes(hit.id)?sel.splice(sel.indexOf(hit.id),1):sel.push(hit.id); }
    else if(!sel.includes(hit.id)) sel=[hit.id];
    drag={t:'move',start:{wx,wy},orig:selShapes().map(s=>({s,x:s.x,y:s.y}))};
  }else{ if(!e.shiftKey)sel=[]; marquee={x0:wx,y0:wy,x1:wx,y1:wy}; drag={t:'marquee'}; }
  refreshAll({pattern:false});
});
stage.addEventListener('pointermove',e=>{
  const[wx,wy]=evPos(e);
  if(!drag){ return; }
  if(drag.t==='pan'){view.x=drag.vx-(e.clientX-drag.sx)/view.z;view.y=drag.vy-(e.clientY-drag.sy)/view.z;drawStage();return;}
  if(drag.t==='create'){
    const s=drag.s,dx=Math.abs(wx-drag.ox),dy=Math.abs(wy-drag.oy),m=Math.max(dx,dy);
    const P=s.params;
    if('w'in P)P.w=Math.max(2,dx*2); if('h'in P)P.h=Math.max(2,dy*2);
    if('s'in P)P.s=Math.max(2,m*2); if('r'in P&&s.type!=='rect')P.r=Math.max(2,m);
    if('rx'in P){P.rx=Math.max(2,dx);P.ry=Math.max(2,dy);}
    refreshAll({props:false,out:false});return;
  }
  if(drag.t==='move'){
    let dx=wx-drag.start.wx,dy=wy-drag.start.wy;
    if(e.shiftKey){Math.abs(dx)>Math.abs(dy)?dy=0:dx=0;}
    for(const o of drag.orig){o.s.x=snapV(o.x+dx);o.s.y=snapV(o.y+dy);}
    refreshAll({props:false,out:false});return;
  }
  if(drag.t==='scale'){
    const s=drag.s,[lx,ly]=worldToLocal(s,wx,wy),h=drag.l;
    let nx=s.sx,ny=s.sy;
    if(Math.abs(h[0])>1)nx=clamp(lx/h[0]*drag.sx0/drag.sx0*(lx/h[0]),-40,40)*1;
    if(Math.abs(h[0])>1)nx=clamp(lx/h[0],-40,40);
    if(Math.abs(h[1])>1)ny=clamp(ly/h[1],-40,40);
    if(drag.k==='n'||drag.k==='s')nx=s.sx; if(drag.k==='e'||drag.k==='w')ny=s.sy;
    if(e.shiftKey){const k=Math.max(Math.abs(nx),Math.abs(ny));nx=Math.sign(nx||1)*k;ny=Math.sign(ny||1)*k;}
    s.sx=nx||1e-3;s.sy=ny||1e-3;refreshAll({props:false,out:false});return;
  }
  if(drag.t==='rot'){
    const s=drag.s;let r=drag.r0+(Math.atan2(wy-s.y,wx-s.x)-drag.a0)/DEG;
    if(e.shiftKey)r=Math.round(r/15)*15; s.rot=Math.round(r*10)/10;refreshAll({props:false,out:false});return;
  }
  if(drag.t==='node'){
    const s=drag.s,n=drag.n,[lx,ly]=worldToLocal(s,wx,wy);
    if(drag.key===''){const dx=lx-n.x,dy=ly-n.y;n.x=lx;n.y=ly;n.ix+=dx;n.iy+=dy;n.ox+=dx;n.oy+=dy;}
    else{ n[drag.key+'x']=lx;n[drag.key+'y']=ly;
      if(!drag.alt){const other=drag.key==='i'?'o':'i';const d=Math.hypot(n[other+'x']-n.x,n[other+'y']-n.y);
        const a=Math.atan2(ly-n.y,lx-n.x)+Math.PI;n[other+'x']=n.x+Math.cos(a)*d;n[other+'y']=n.y+Math.sin(a)*d;}}
    refreshAll({props:false,out:false});return;
  }
  if(drag.t==='marquee'&&marquee){marquee.x1=wx;marquee.y1=wy;
    const x0=Math.min(marquee.x0,wx),x1=Math.max(marquee.x0,wx),y0=Math.min(marquee.y0,wy),y1=Math.max(marquee.y0,wy);
    sel=doc.shapes.filter(s=>{const b=shapeBBoxWorld(s);return s.visible&&!s.locked&&b.x0<x1&&b.x1>x0&&b.y0<y1&&b.y1>y0;}).map(s=>s.id);
    drawStage();buildOutliner();return;}
});
addEventListener('pointerup',()=>{ if(drag&&drag.t!=='pan'&&drag.t!=='marquee')commit();
  if(drag&&drag.t==='create')commit();
  drag=null;marquee=null;refreshAll();});
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=stage.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const[wx,wy]=s2w(mx,my);
  view.z=clamp(view.z*(e.deltaY<0?1.12:1/1.12),.05,20);
  view.x=wx-mx/view.z;view.y=wy-my/view.z;

},{passive:false});
stage.addEventListener('dblclick',e=>{
  const[wx,wy]=evPos(e);const h=pickAt(wx,wy);
  if(h){ sel=[h.id]; if(h.type==='path')setTool('node'); else if(h.type==='text'){
      const v=prompt('Text:',h.textValue);if(v!=null){h.textValue=v;commit();} }
    refreshAll(); }
});
/* pen tool */
function penClick(wx,wy,e){
  if(!pen.active){pen={active:true,nodes:[],shape:null};}
  const n0=pen.nodes[0];
  if(n0&&Math.hypot(n0.x-wx,n0.y-wy)<10/view.z&&pen.nodes.length>2){finishPen(true);return;}
  const n=nd(snapV(wx),snapV(wy));pen.nodes.push(n);
  const mv=ev=>{const[mx,my]=evPos(ev);n.ox=mx;n.oy=my;n.ix=2*n.x-mx;n.iy=2*n.y-my;drawStage();};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
  drawStage();
}
function finishPen(closed){
  if(pen.nodes.length>1){
    const s=newShape('path',{x:0,y:0,nodes:[sp(pen.nodes,closed)],name:'Path'});
    s.fill.type=closed?'solid':'none';s.stroke.on=!closed;s.stroke.width=8;
    doc.shapes.push(s);sel=[s.id];commit();
  }
  pen={active:false,nodes:[],shape:null};setTool('select');refreshAll();
}
/* keyboard */
addEventListener('keydown',e=>{
  const t=e.target.tagName;
  if(t==='INPUT'||t==='SELECT'||e.target.isContentEditable){ if(e.key==='Escape')e.target.blur(); return; }
  const m=e.ctrlKey||e.metaKey;
  if(m&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(m&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
  if(m&&e.key.toLowerCase()==='d'){e.preventDefault();duplicateSel();return;}
  if(m&&e.key.toLowerCase()==='a'){e.preventDefault();sel=doc.shapes.map(s=>s.id);refreshAll();return;}
  if(e.key==='Delete'||e.key==='Backspace'){deleteSel();return;}
  if(e.key==='Escape'){ if(pen.active)finishPen(false); else {sel=[];refreshAll();} return;}
  if(e.key==='Enter'&&pen.active){finishPen(false);return;}
  const K2={v:'select',a:'node',p:'pen',r:'rect',o:'ellipse',s:'star',t:'triangle',l:'line',h:'pan'};
  if(K2[e.key.toLowerCase()]&&!m){setTool(K2[e.key.toLowerCase()]);return;}
  const step=e.shiftKey?10:1;
  const D={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]}[e.key];
  if(D){e.preventDefault();selShapes().forEach(s=>{s.x+=D[0];s.y+=D[1];});commit();refreshAll();}
});
function deleteSel(){ if(!sel.length)return; doc.shapes=doc.shapes.filter(s=>!sel.includes(s.id)); sel=[];commit();refreshAll(); }
function duplicateSel(){ const c=selShapes().map(s=>{const n=JSON.parse(JSON.stringify(s));n.id=uid();n.x+=16;n.y+=16;return n;});
  if(!c.length)return; doc.shapes.push(...c);sel=c.map(s=>s.id);commit();refreshAll(); }

function Section(title,openState=true){
  const b=el('div',{class:'body'});
  const s=el('div',{class:'sec'+(openState?'':' closed')},
    el('h4',{onclick:()=>s.classList.toggle('closed')},title,el('span',{class:'cv'},'⌄')),b);

function Slider(label,o){
  const inp=el('input',{type:'text',value:fmt(o.value)});
  const f=el('div',{class:'field'},inp,o.unit?el('span',{class:'u'},o.unit):null);
  const rng=el('input',{type:'range',min:o.min,max:o.max,step:o.step??1,value:o.value});
  const set=(v,fire=true)=>{v=clamp(parseFloat(v)||0,o.min,o.max);rng.value=v;inp.value=fmt(v);if(fire)o.onInput(v);};
  rng.addEventListener('input',()=>set(rng.value));
  rng.addEventListener('change',()=>o.onCommit&&o.onCommit());

}
function Toggle(label,val,on){

/* ---- color picker -----------------------------------------------------*/
const cp=$('#cp'),svc=$('#sv'),svx=svc.getContext('2d');
let cpState={h:0,s:1,v:1,a:1,cb:null};
function drawSV(){
  const w=svc.width,h=svc.height,im=svx.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const[r,g,b]=hsv2rgb(cpState.h,x/(w-1),1-y/(h-1));const i=(y*w+x)*4;
    im.data[i]=r*255;im.data[i+1]=g*255;im.data[i+2]=b*255;im.data[i+3]=255;}
  svx.putImageData(im,0,0);
  $('#svknob').style.left=cpState.s*w+'px';$('#svknob').style.top=(1-cpState.v)*h+'px';
  $('#hueknob').style.left=(cpState.h/360*100)+'%';
  $('#alpknob').style.left=(cpState.a*100)+'%';
  $('#alp').style.setProperty('background-image',
    `linear-gradient(90deg,transparent,${rgba2hex(...hsv2rgb(cpState.h,cpState.s,cpState.v),1).slice(0,7)}),
     linear-gradient(45deg,#555 25%,transparent 25%,transparent 75%,#555 75%),
     linear-gradient(45deg,#555 25%,#333 25%,#333 75%,#555 75%)`);
  const hex=rgba2hex(...hsv2rgb(cpState.h,cpState.s,cpState.v),cpState.a);
  $('#hex').value=hex.toUpperCase();
  return hex;
}
function emit(){const hex=drawSV();cpState.cb&&cpState.cb(hex);}
function openPicker(anchor,color,cb){
  const rgba=hex2rgba(normHex(rgbToHexAny(color)));
  const[h,s,v]=rgb2hsv(rgba[0],rgba[1],rgba[2]);
  cpState={h,s,v,a:rgba[3],cb};
  const r=anchor.getBoundingClientRect();
  cp.style.left=clamp(r.left-200,8,innerWidth-250)+'px';
  cp.style.top=clamp(r.bottom+6,8,innerHeight-330)+'px';
  cp.classList.add('open');drawSV();
}
function rgbToHexAny(c){
  if(!c)return '#000000ff';
  if(c[0]==='#')return c;
  const m=c.match(/[\d.]+/g);if(!m)return '#000000ff';
  return rgba2hex(m[0]/255,m[1]/255,m[2]/255,m[3]!==undefined?+m[3]:1);
}
document.addEventListener('pointerdown',e=>{if(cp.classList.contains('open')&&!cp.contains(e.target)&&!e.target.classList.contains('sw'))cp.classList.remove('open');},true);
function stripDrag(node,fn){
  const go=e=>{const r=node.getBoundingClientRect();fn(clamp((e.clientX-r.left)/r.width,0,1));emit();};
  node.addEventListener('pointerdown',e=>{node.setPointerCapture(e.pointerId);go(e);
    const mv=ev=>go(ev);const up=()=>{node.removeEventListener('pointermove',mv);removeEventListener('pointerup',up);commit();};
    node.addEventListener('pointermove',mv);addEventListener('pointerup',up);});
}
stripDrag($('#hue'),t=>cpState.h=t*360);
stripDrag($('#alp'),t=>cpState.a=t);
svc.addEventListener('pointerdown',e=>{
  svc.setPointerCapture(e.pointerId);
  const go=ev=>{const r=svc.getBoundingClientRect();
    cpState.s=clamp((ev.clientX-r.left)/r.width,0,1);cpState.v=1-clamp((ev.clientY-r.top)/r.height,0,1);emit();};
  go(e);const mv=ev=>go(ev);const up=()=>{svc.removeEventListener('pointermove',mv);removeEventListener('pointerup',up);commit();};
  svc.addEventListener('pointermove',mv);addEventListener('pointerup',up);
});
$('#hex').addEventListener('change',()=>{
  const c=normHex($('#hex').value),r=hex2rgba(c),[h,s,v]=rgb2hsv(r[0],r[1],r[2]);

  b.onclick=()=>{const r=hex2rgba(c),[h,s,v]=rgb2hsv(r[0],r[1],r[2]);cpState.h=h;cpState.s=s;cpState.v=v;emit();commit();};

function iconFor(type,size=17){
  const def=SHAPES[type];
  if(!def)return '';
  if(def.img)return `<svg viewBox="0 0 24 24"><path d="M3 5h18v14H3z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="10" r="1.8"/><path d="M4 18l5-5 3.5 3.5L16 13l4 5z"/></svg>`;
  if(def.text)return `<svg viewBox="0 0 24 24"><path d="M4 5h16v3h-6v11h-4V8H4z"/></svg>`;
  if(type==='path')return `<svg viewBox="0 0 24 24"><path d="M3 20c8 0 6-16 18-16" fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
  const params={};(def.params||[]).forEach(p=>params[p.k]=p.def);
  const subs=def.path(params);if(!subs.length)return '';
  const b=subsBBox(subs),w=b.x1-b.x0||1,h=b.y1-b.y0||1,k=20/Math.max(w,h);
  const open=!!def.open;
  return `<svg viewBox="0 0 24 24"><g transform="translate(12,12) scale(${k.toFixed(3)}) translate(${(-(b.x0+b.x1)/2).toFixed(1)},${(-(b.y0+b.y1)/2).toFixed(1)})">
    <path d="${subsToD(subs)}" ${open?`fill="none" stroke="currentColor" stroke-width="${(3/k).toFixed(1)}"`:`fill="currentColor" fill-rule="${def.rule||'nonzero'}"`}/></g></svg>`;
}

function buildOutliner(){

  const bar=el('div',{class:'btnrow',style:'margin:0 0 8px'},
    el('button',{class:'btn',onclick:duplicateSel},'Duplicate'),
    el('button',{class:'btn',onclick:deleteSel},'Delete'),
    el('button',{class:'btn',onclick:()=>{selShapes().forEach(s=>{const i=doc.shapes.indexOf(s);
      if(i<doc.shapes.length-1)doc.shapes.splice(i+1,0,doc.shapes.splice(i,1)[0]);});commit();refreshAll();}},'↑'),
    el('button',{class:'btn',onclick:()=>{selShapes().forEach(s=>{const i=doc.shapes.indexOf(s);
      if(i>0)doc.shapes.splice(i-1,0,doc.shapes.splice(i,1)[0]);});commit();refreshAll();}},'↓'));

    row.dataset.id=s.id;

    nm.onblur=()=>{nm.contentEditable=false;s.name=nm.textContent.trim()||SHAPES[s.type].label;commit();};
    nm.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();nm.blur();}};
    const eye=el('div',{class:'mini',html:s.visible?'👁':'⌀',onclick:ev=>{ev.stopPropagation();s.visible=!s.visible;commit();refreshAll();}});
    const lock=el('div',{class:'mini',html:s.locked?'🔒':'🔓',onclick:ev=>{ev.stopPropagation();s.locked=!s.locked;commit();refreshAll();}});
    const del=el('div',{class:'mini',html:'✕',onclick:ev=>{ev.stopPropagation();doc.shapes=doc.shapes.filter(x=>x!==s);sel=sel.filter(i=>i!==s.id);commit();refreshAll();}});
    row.append(ic,nm,eye,lock,del);
    row.onclick=ev=>{ if(ev.shiftKey){sel.includes(s.id)?sel.splice(sel.indexOf(s.id),1):sel.push(s.id);} else sel=[s.id];
      refreshAll({pattern:false}); };
    row.ondragstart=ev=>{ev.dataTransfer.setData('text/plain',s.id);};
    row.ondragover=ev=>{ev.preventDefault();row.classList.add('drop');};
    row.ondragleave=()=>row.classList.remove('drop');
    row.ondrop=ev=>{ev.preventDefault();row.classList.remove('drop');
      const id=ev.dataTransfer.getData('text/plain'),from=doc.shapes.findIndex(x=>x.id===id),to=doc.shapes.findIndex(x=>x.id===s.id);
      if(from<0||to<0||from===to)return;const[m]=doc.shapes.splice(from,1);doc.shapes.splice(to,0,m);commit();refreshAll();};
    list.append(row);
  });
  pane.append(list);
}

const WGSL=`
struct U{res:vec4f,pat:vec4f,view:vec4f,bg:vec4f,adj:vec4f,flg:vec4f,vig:vec4f,

@group(0) @binding(0) var<uniform> u:U;
@group(0) @binding(1) var samp:sampler;
@group(0) @binding(2) var tex:texture_2d<f32>;
@vertex fn vs(@builtin(vertex_index) i:u32)->@builtin(position) vec4f{
  var p=array<vec2f,3>(vec2f(-1.,-3.),vec2f(-1.,1.),vec2f(3.,1.));

fn rot2(a:f32)->mat2x2f{let c=cos(a);let s=sin(a);return mat2x2f(c,-s,s,c);}
fn hash(p:vec2f)->f32{return fract(sin(dot(p,vec2f(127.1,311.7)))*43758.5453);}
fn nz(p:vec2f)->f32{let i=floor(p);let f=fract(p);let w=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2f(1.,0.)),w.x),mix(hash(i+vec2f(0.,1.)),hash(i+vec2f(1.,1.)),w.x),w.y);}
fn fbm(p:vec2f)->f32{var v=0.;var a=0.5;var q=p;
 for(var i:i32=0;i<5;i=i+1){v=v+a*nz(q);q=q*2.03;a=a*0.5;} return v;}
fn mir(x:f32)->f32{let q=fract(x*0.5)*2.;return 1.-abs(q-1.);}
fn imod(a:i32,b:i32)->i32{return ((a%b)+b)%b;}
fn mapuv(p0:vec2f,m:f32)->vec2f{
 var p=p0;
 if(m<0.5){return fract(p);}
 if(m<1.5){p.x=p.x+0.5*floor(p.y);return fract(p);}
 if(m<2.5){p.y=p.y+0.5*floor(p.x);return fract(p);}
 if(m<3.5){return vec2f(mir(p.x),mir(p.y));}
 if(m<4.5){let c=floor(p);var f=fract(p);
   if(imod(i32(c.x)+i32(c.y),2)==1){f=vec2f(1.)-f;} return f;}
 if(m<5.5){return fract(rot2(0.7853982)*p);}
 if(m<6.5){let c=floor(p);var f=fract(p)-0.5;
   let k=imod(i32(c.x)+2*i32(c.y),4);
   f=rot2(f32(k)*1.5707963)*f;return f+0.5;}
 var q=p;q.x=q.x+0.5*floor(q.y);
 var f=fract(q)-0.5;
 let r=length(f);var a=atan2(f.y,f.x);
 let seg=1.0471976;
 a=a-seg*floor(a/seg);a=abs(a-seg*0.5);

fn blendf(b:vec3f,s:vec3f,m:f32)->vec3f{
 if(m<0.5){return s;}
 if(m<1.5){return b*s;}
 if(m<2.5){return 1.-(1.-b)*(1.-s);}
 if(m<3.5){return select(1.-2.*(1.-b)*(1.-s),2.*b*s,b<vec3f(0.5));}
 if(m<4.5){return select(1.-2.*(1.-b)*(1.-s),2.*b*s,s<vec3f(0.5));}
 if(m<5.5){return sqrt(clamp(b,vec3f(0.),vec3f(1.)))*(2.*s-1.)+2.*b*(1.-s);}

fn lum(c:vec3f)->f32{return dot(c,vec3f(0.2126,0.7152,0.0722));}
fn hue2rgb(h:f32)->vec3f{
 let k=vec3f(h*6.,h*6.+4.,h*6.+2.);

fn rgb2hsv(c:vec3f)->vec3f{
 let mx=max(c.r,max(c.g,c.b));let mn=min(c.r,min(c.g,c.b));let d=mx-mn;

 if(d>0.0001){
  if(mx==c.r){h=(c.g-c.b)/d;}else if(mx==c.g){h=(c.b-c.r)/d+2.;}else{h=(c.r-c.g)/d+4.;}
  h=fract(h/6.);}

fn hsv2rgb(c:vec3f)->vec3f{return c.z*mix(vec3f(1.),hue2rgb(c.x),c.y);}
@fragment fn fs(@builtin(position) fc:vec4f)->@location(0) vec4f{
 let res=u.res.xy;let t=u.res.z;
 var pix=(fc.xy-res*0.5)/u.view.z+u.view.xy;
 pix=rot2(u.pat.y)*pix;
 let ta=u.view.w;
 var uv=pix/vec2f(u.pat.x,u.pat.x/ta);
 if(u.meta.x>0.5){
  let w=vec2f(fbm(uv*u.meta.z+vec2f(t*u.meta.w,0.)),fbm(uv*u.meta.z+vec2f(5.2,1.3)-vec2f(0.,t*u.meta.w)));

 var tuv=mapuv(uv,u.pat.w);
 var col=u.bg.rgb;
 let g=u.pat.z;
 let q=(tuv-0.5)*(1.+g)+0.5;
 if(q.x>=0.&&q.x<=1.&&q.y>=0.&&q.y<=1.){
   let s=textureSample(tex,samp,q);
   col=mix(u.bg.rgb,s.rgb,s.a);}
 // adjustments
 if(u.adj.w>-900.){
  col=col+u.adj.x;
  col=(col-0.5)*(1.+u.adj.y)+0.5;
  let l=lum(col);col=mix(vec3f(l),col,1.+u.adj.z);
  if(abs(u.adj.w)>0.001){var h=rgb2hsv(clamp(col,vec3f(0.),vec3f(2.)));h.x=fract(h.x+u.adj.w);col=hsv2rgb(h);}}
 if(u.flg.x>0.){col=mix(col,vec3f(lum(col)),u.flg.x);}
 if(u.duo.x>0.5){
  let l=clamp(lum(col),0.,1.);
  col=mix(col,mix(u.d1.rgb,u.d2.rgb,l),u.duo.y);}
 if(u.flg.w>0.5){
  let a=u.hlf.y;let c=cos(a);let s2=sin(a);
  let rp=vec2f(fc.x*c-fc.y*s2,fc.x*s2+fc.y*c)/max(u.hlf.x,1.);
  let d=length(fract(rp)-0.5);
  let l=clamp(lum(col),0.,1.);
  let dot1=smoothstep(0.5*(1.-l)+0.02,0.5*(1.-l)-0.02,d);
  col=mix(col,mix(vec3f(0.),vec3f(1.),dot1),u.hlf.z);}
 if(u.flg.z>0.5){
  let a=radians(u.grd.z);
  let dir=vec2f(cos(a),sin(a));
  let p=(fc.xy/res)-0.5;
  let tg=clamp(dot(p,dir)+0.5,0.,1.);
  let gc=mix(u.g1.rgb,u.g2.rgb,tg);
  col=mix(col,blendf(col,gc,u.grd.x),u.grd.y);}
 if(u.flg.y>0.5){
  let p=(fc.xy/res-0.5)*vec2f(res.x/res.y,1.);
  let d=length(p)/0.7071;
  let v=1.-smoothstep(u.vig.y,u.vig.y+u.vig.z,d);
  col=mix(col,col*v,u.vig.x);}
 return vec4f(clamp(col,vec3f(0.),vec3f(1.)),1.);}
`;
let device=null,format=null,gctx=null,pipe=null,bind=null,ubuf=null,tex=null,samp=null,gpuOK=false;
const vview={x:0,y:0,z:1};
const gpuCv=$('#gpu');
async function initGPU(){
  try{
    if(!navigator.gpu)throw 0;
    const ad=await navigator.gpu.requestAdapter();if(!ad)throw 0;
    device=await ad.requestDevice();
    device.lost.then(()=>{gpuOK=false;});
    format=navigator.gpu.getPreferredCanvasFormat();
    gctx=gpuCv.getContext('webgpu');
    gctx.configure({device,format,alphaMode:'opaque'});
    const mod=device.createShaderModule({code:WGSL});
    pipe=device.createRenderPipeline({layout:'auto',vertex:{module:mod,entryPoint:'vs'},
      fragment:{module:mod,entryPoint:'fs',targets:[{format}]},primitive:{topology:'triangle-list'}});
    ubuf=device.createBuffer({size:256,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
    samp=device.createSampler({addressModeU:'repeat',addressModeV:'repeat',magFilter:'linear',minFilter:'linear'});
    gpuOK=true;
    $('#gpubadge').textContent='WEBGPU';$('#gpubadge').classList.add('ok');
    return true;
  }catch(e){
    gpuOK=false;$('#gpubadge').textContent='CANVAS2D';return false;
  }
}
function ensureTex(){
  if(!gpuOK)return;
  if(!tex||tex.width!==tileCv.width||tex.height!==tileCv.height){
    tex?.destroy?.();
    tex=device.createTexture({size:[tileCv.width,tileCv.height],format:'rgba8unorm',
      usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST|GPUTextureUsage.RENDER_ATTACHMENT});
    tex.width=tileCv.width;tex.height=tileCv.height;
    bind=device.createBindGroup({layout:pipe.getBindGroupLayout(0),
      entries:[{binding:0,resource:{buffer:ubuf}},{binding:1,resource:samp},{binding:2,resource:tex.createView()}]});
  }
  device.queue.copyExternalImageToTexture({source:tileCv},{texture:tex},[tileCv.width,tileCv.height]);
}
let t0=performance.now();
function uniforms(W,H,vw){
  const F=doc.fx,P=doc.pattern,a=new Float32Array(60);
  const time=(performance.now()-t0)/1000;
  const put=(i,...v)=>v.forEach((x,k)=>a[i*4+k]=x);
  put(0,W,H,time,W/H);
  put(1,P.scale,P.rot*DEG,P.gap/100,P.mode);
  put(2,vw.x,vw.y,vw.z,tileCv.width/tileCv.height);
  put(3,...hex2rgba(P.bg));
  if(F.adj.on)put(4,F.adj.brightness/100,F.adj.contrast/100,F.adj.saturation/100,F.adj.hue/360);
  else put(4,0,0,0,-1000);
  put(5,F.bw.on?F.bw.amount/100:0,F.vig.on?1:0,F.grad.on?1:0,F.half.on?1:0);
  put(6,F.vig.amount/100,F.vig.radius/100,F.vig.soft/100,0);
  put(7,F.grad.mode,F.grad.amount/100,F.grad.rot,0);
  put(8,...hex2rgba(F.grad.c1));put(9,...hex2rgba(F.grad.c2));
  put(10,F.half.size,F.half.angle*DEG,F.half.amount/100,0);
  put(11,F.duo.on?1:0,F.duo.amount/100,0,0);
  put(12,...hex2rgba(F.duo.c1));put(13,...hex2rgba(F.duo.c2));
  put(14,F.meta.on?1:0,F.meta.amount,F.meta.scale,F.meta.animate?F.meta.speed:0);
  return a;
}
function gpuFrame(target,W,H,vw){
  device.queue.writeBuffer(ubuf,0,uniforms(W,H,vw));
  const enc=device.createCommandEncoder();
  const pass=enc.beginRenderPass({colorAttachments:[{view:target.getCurrentTexture().createView(),
    clearValue:{r:0,g:0,b:0,a:1},loadOp:'clear',storeOp:'store'}]});
  pass.setPipeline(pipe);pass.setBindGroup(0,bind);pass.draw(3);pass.end();
  device.queue.submit([enc.finish()]);
}

/* ---- Canvas2D fallback / export renderer ------------------------------*/
function buildUnit(){
  const t=tileCv,w=t.width,h=t.height,m=doc.pattern.mode;
  const c=document.createElement('canvas');const x=c.getContext('2d');
  const put=(dx,dy,rot=0,fx=1,fy=1)=>{x.save();x.translate(dx+w/2,dy+h/2);x.rotate(rot);x.scale(fx,fy);x.drawImage(t,-w/2,-h/2);x.restore();};
  if(m===1){c.width=w;c.height=h*2;put(0,0);put(-w/2,h);put(w/2,h);}
  else if(m===2){c.width=w*2;c.height=h;put(0,0);put(w,-h/2);put(w,h/2);}
  else if(m===3){c.width=w*2;c.height=h*2;put(0,0);put(w,0,0,-1,1);put(0,h,0,1,-1);put(w,h,0,-1,-1);}
  else if(m===4){c.width=w*2;c.height=h*2;put(0,0);put(w,0,Math.PI);put(0,h,Math.PI);put(w,h);}
  else if(m===6){c.width=w*2;c.height=h*2;put(0,0);put(w,0,Math.PI/2);put(0,h,-Math.PI/2);put(w,h,Math.PI);}
  else if(m===7){c.width=w*2;c.height=h*2;put(0,0);put(w,0,0,-1,1);put(0,h,Math.PI,-1,1);put(w,h,Math.PI);}
  else{c.width=w;c.height=h;put(0,0);}
  return c;
}
function render2D(ctx,W,H,vw){

  const sc=(P.scale/tileCv.width)*vw.z*(1+P.gap/100);
  const pat=ctx.createPattern(unit,'repeat');
  const mtx=new DOMMatrix().translate(W/2-vw.x*vw.z,H/2-vw.y*vw.z).rotate(-P.rot).scale(sc,sc);
  pat.setTransform(mtx);
  const f=[];
  if(F.adj.on){f.push(`brightness(${1+F.adj.brightness/100})`,`contrast(${1+F.adj.contrast/100})`,
    `saturate(${1+F.adj.saturation/100})`,`hue-rotate(${F.adj.hue}deg)`);}
  if(F.bw.on)f.push(`grayscale(${F.bw.amount}%)`);

    const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,F.duo.c1);g.addColorStop(1,F.duo.c2);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();}

    const BM=['source-over','multiply','screen','overlay','hard-light','soft-light','difference'][F.grad.mode]||'source-over';
    ctx.save();ctx.globalAlpha=F.grad.amount/100;ctx.globalCompositeOperation=BM;
    const a=F.grad.rot*DEG,r=Math.hypot(W,H)/2;
    const g=ctx.createLinearGradient(W/2-Math.cos(a)*r,H/2-Math.sin(a)*r,W/2+Math.cos(a)*r,H/2+Math.sin(a)*r);
    g.addColorStop(0,F.grad.c1);g.addColorStop(1,F.grad.c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();}
  if(F.vig.on){ctx.save();ctx.globalAlpha=F.vig.amount/100;
    const r=Math.hypot(W,H)/2;
    const g=ctx.createRadialGradient(W/2,H/2,r*F.vig.radius/100*0.7,W/2,H/2,r*(F.vig.radius+F.vig.soft)/100);
    g.addColorStop(0,'#00000000');g.addColorStop(1,'#000000ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();}
}

/* ---- pattern viewport plumbing ---------------------------------------*/
let patPending=false;
function requestPattern(){
  if(patPending)return;patPending=true;
  requestAnimationFrame(()=>{patPending=false;renderPattern();});
}
function renderPattern(){
  const r=gpuCv.getBoundingClientRect();
  const W=Math.max(1,Math.round(r.width*dpr)),H=Math.max(1,Math.round(r.height*dpr));
  if(gpuCv.width!==W||gpuCv.height!==H){gpuCv.width=W;gpuCv.height=H;}
  rasterizeTile();
  if(gpuOK){
    try{ ensureTex(); gpuFrame(gctx,W,H,{x:vview.x*dpr,y:vview.y*dpr,z:vview.z*dpr}); }
    catch(e){ gpuOK=false;$('#gpubadge').textContent='CANVAS2D';renderPattern(); return; }
  }else{
    const c=gpuCv.getContext('2d');
    if(c)render2D(c,W,H,{x:vview.x*dpr,y:vview.y*dpr,z:vview.z*dpr});
  }
  $('#vpinfo').textContent=`${TILINGS[doc.pattern.mode][1].toUpperCase()}  ·  ${Math.round(doc.pattern.scale)}px  ·  ${Math.round(vview.z*100)}%`;
}
function animate(){
  if(!doc.fx.meta.on||!doc.fx.meta.animate)return;
  renderPattern();requestAnimationFrame(animate);
}
/* viewport nav */
let vdrag=null;
gpuCv.addEventListener('pointerdown',e=>{gpuCv.setPointerCapture(e.pointerId);
  vdrag={x:e.clientX,y:e.clientY,vx:vview.x,vy:vview.y};});
gpuCv.addEventListener('pointermove',e=>{if(!vdrag)return;
  vview.x=vdrag.vx-(e.clientX-vdrag.x)/vview.z;vview.y=vdrag.vy-(e.clientY-vdrag.y)/vview.z;requestPattern();});
addEventListener('pointerup',()=>vdrag=null);
gpuCv.addEventListener('wheel',e=>{e.preventDefault();
  vview.z=clamp(vview.z*(e.deltaY<0?1.1:1/1.1),.1,8);requestPattern();},{passive:false});
$('#vzoomin').onclick=()=>{vview.z=clamp(vview.z*1.2,.1,8);requestPattern();};
$('#vzoomout').onclick=()=>{vview.z=clamp(vview.z/1.2,.1,8);requestPattern();};
$('#vfit').onclick=()=>{vview.x=0;vview.y=0;vview.z=1;requestPattern();};

/* =======================================================================
   12. GLUE
======================================================================= */
function refreshAll(o={}){
  drawStage();
  if(o.out!==false)buildOutliner();
  if(o.props!==false)buildProps();
  requestPattern();
  if(rtab==='exp')buildExportPane();
}
$('#zoomin').onclick=()=>{view.z=clamp(view.z*1.2,.05,20);$('#zlab').textContent=Math.round(view.z*100)+'%';drawStage();};
$('#zoomout').onclick=()=>{view.z=clamp(view.z/1.2,.05,20);$('#zlab').textContent=Math.round(view.z*100)+'%';drawStage();};
$('#fit').onclick=fitView;
$('#undo').onclick=undo;$('#redo').onclick=redo;

$$('.modes button').forEach(b=>b.onclick=()=>{

  $$('.modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  document.body.classList.toggle('mode-preview',b.dataset.m==='preview');
  if(b.dataset.m==='export'){rtab='exp';$$('#rtabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==='exp'));buildRightPane();}
  requestAnimationFrame(()=>{resizeStage();renderPattern();});
});
/* splitter */
(function(){
  const d=$('#divider'),main=$('#main'),left=$('#left');
  d.addEventListener('pointerdown',e=>{d.setPointerCapture(e.pointerId);
    const mv=ev=>{const r=main.getBoundingClientRect();
      left.style.flex='0 0 '+clamp(((ev.clientX-r.left)/r.width)*100,22,78)+'%';
      resizeStage();requestPattern();};
    const up=()=>{d.removeEventListener('pointermove',mv);removeEventListener('pointerup',up);};
    d.addEventListener('pointermove',mv);addEventListener('pointerup',up);});
})();
addEventListener('resize',()=>{resizeStage();requestPattern();});
/* demo content */
function demoDoc(){
  doc.shapes=[];
  const W=doc.tile.w,H=doc.tile.h;
  const push=(t,o)=>{const s=newShape(t,o);doc.shapes.push(s);return s;};
  doc.tile.bg='#0f8a76ff';
  push('diamond',{x:W/2,y:H/2,name:'Diamond BG'});
  doc.shapes[0].params.w=W*0.9;doc.shapes[0].params.h=H*0.9;doc.shapes[0].fill.color='#ff5a1fff';
  const st=push('star',{x:W/2,y:H/2,name:'Star'});
  st.params.n=8;st.params.r=W*0.28;st.params.i=52;st.fill.color='#111111ff';
  const rg=push('ring',{x:W/2,y:H/2,name:'Ring'});
  rg.params.r=W*0.2;rg.params.t=10;rg.fill.color='#cfe3d8ff';
  const cr=push('cross',{x:W/2,y:H/2,name:'Cross'});
  cr.params.w=W*0.16;cr.params.h=W*0.16;cr.params.t=W*0.05;cr.fill.color='#ffffffff';
  for(const[cx,cy]of[[0,0],[W,0],[0,H],[W,H]]){
    const s=push('polygon',{x:cx,y:cy,name:'Corner'});
    s.params.n=4;s.params.r=W*0.14;s.fill.color='#e0301eff';s.rot=0;}
  const zz=push('zigzag',{x:W/2,y:8,name:'Border ▲'});
  zz.params.w=W;zz.params.h=26;zz.params.n=8;zz.params.t=8;zz.stroke.color='#111111ff';zz.stroke.width=8;
  const zz2=JSON.parse(JSON.stringify(zz));zz2.id=uid();zz2.y=H-8;zz2.name='Border ▼';doc.shapes.push(zz2);
  sel=[];commit();refreshAll();fitView();
}
/* boot */
(async function boot(){
  buildTools();
  buildLeftPane();buildRightPane();
  await initGPU();
  resizeStage();
  demoDoc();
  lastSnap=snap();
  fitView();
  requestPattern();
  toast(gpuOK?'WebGPU renderer active':'WebGPU unavailable — Canvas2D fallback');
})();
/* keep left tabs pane in sync when switching */
const _bo=buildOutliner,_bp=buildProps;
</script>
</body>
