<!DOCTYPE html>
<html lang="en" data-theme="dark" data-acccent="lime">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIFT · Asset Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ================= TOKENS ================= */
:root{
  --bg0:#08090B; --bg1:#0B0C0F; --bg2:#101216; --bg3:#14171C;
  --card:#121418; --card2:#171A20; --card3:#1D212A; --card4:#232834;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.13); --line3:rgba(255,255,255,.2);
  --tx:#EEF1F4; --tx2:#A7AEB8; --tx3:#68707C; --tx4:#454C57;
  --acc:#C8F751; --acc2:#7BE2A8; --acc-ink:#10140A;
  --acc-soft:rgba(200,247,81,.13); --acc-line:rgba(200,247,81,.42); --acc-glow:rgba(200,247,81,.24);
  --cyan:#5EE9D5; --blue:#7AC3FF; --violet:#B79CFF; --pink:#FF7AB8; --amber:#FFC46B; --red:#FF6B5E; --orange:#FFAB66; --mint:#7DEFC8;
  --ok:#5BE08C; --warn:#FFC46B; --err:#FF6B5E;
  --dock:#08090B; --dock-line:rgba(255,255,255,.09);
  --r-pill:999px; --r-l:22px; --r-m:16px; --r-s:11px;
  --sh1:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -18px rgba(0,0,0,.75);
  --sh2:0 24px 60px -24px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.4);
  --ease:cubic-bezier(.22,.9,.26,1); --ease2:cubic-bezier(.34,1.4,.3,1);
  --cs:150px; /* card size (zoom) */
  --fd:"Space Grotesk","Inter",system-ui,sans-serif;
  --fu:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
:root[data-theme="light"]{
  --bg0:#E7E9E1; --bg1:#EDEEE6; --bg2:#F4F5EE; --bg3:#FBFCF6;
  --card:#F7F8F1; --card2:#EFF0E8; --card3:#E6E8DD; --card4:#DDE0D2;
  --line:rgba(20,24,18,.09); --line2:rgba(20,24,18,.16); --line3:rgba(20,24,18,.28);
  --tx:#14171B; --tx2:#59605F; --tx3:#8E958E; --tx4:#B7BCB2;
  --acc:#7DB81F; --acc2:#3E9E6E; --acc-ink:#F4FBE2;
  --acc-soft:rgba(125,184,31,.12); --acc-line:rgba(125,184,31,.5); --acc-glow:rgba(125,184,31,.22);
  --dock:#0A0B0D;
  --sh1:0 1px 0 rgba(255,255,255,.7) inset,0 12px 26px -16px rgba(40,48,36,.35);
  --sh2:0 22px 48px -22px rgba(40,48,36,.4),0 2px 5px rgba(40,48,36,.12);
}
:root[data-accent="cyan"]{--acc:#5EE9D5;--acc2:#7AC3FF;--acc-soft:rgba(94,233,213,.12);--acc-line:rgba(94,233,213,.45);--acc-glow:rgba(94,233,213,.25)}
:root[data-accent="violet"]{--acc:#B79CFF;--acc2:#FF7AB8;--acc-soft:rgba(183,156,255,.13);--acc-line:rgba(183,156,255,.45);--acc-glow:rgba(183,156,255,.25)}
:root[data-accent="amber"]{--acc:#FFC46B;--acc2:#FF8F7A;--acc-soft:rgba(255,196,107,.13);--acc-line:rgba(255,196,107,.48);--acc-glow:rgba(255,196,107,.25)}
:root[data-accent="cyan"],:root[data-accent="violet"],:root[data-accent="amber"]{--acc-ink:#0A0D10}

/* ================= BASE ================= */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg0); color:var(--tx); font-family:var(--fu); font-size:13px; line-height:1.45;
  overflow:hidden; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
:root[data-theme="dark"] body{
  background:
    radial-gradient(1100px 600px at 82% -10%, rgba(200,247,81,.05), transparent 60%),
    radial-gradient(900px 640px at 6% 110%, rgba(94,233,213,.045), transparent 62%),
    var(--bg0);
}
:root[data-theme="light"] body{
  background:
    radial-gradient(1100px 600px at 82% -10%, rgba(125,184,31,.08), transparent 60%),
    radial-gradient(900px 640px at 6% 110%, rgba(94,160,180,.08), transparent 62%),
    var(--bg0);
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2000;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.013) 0 1px,transparent 1px 3px)}
::selection{background:var(--acc);color:var(--acc-ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
.i{display:inline-flex;align-items:center;justify-content:center;flex:none}
.i svg{width:100%;height:100%}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--card4);border-radius:8px;border:3px solid var(--bg1)}
::-webkit-scrollbar-thumb:hover{background:var(--tx4)}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--acc-line);outline-offset:2px;border-radius:6px}

/* ================= SHELL ================= */
#app{display:flex;height:100vh;overflow:hidden}

/* ================= RAIL ================= */
#rail{
  width:66px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 0 12px;background:var(--bg1);border-right:1px solid var(--line);z-index:60;
}
.rail-btn{
  position:relative;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;
  color:var(--tx3);transition:all .22s var(--ease);border:1px solid transparent;
}
.rail-btn .i{width:21px;height:21px}
.rail-btn:hover{color:var(--tx);background:var(--card2)}
.rail-btn.on{color:var(--acc-ink);background:var(--acc);box-shadow:0 6px 18px -6px var(--acc-glow),0 0 0 1px var(--acc-line)}
.rail-btn .tip{
  position:absolute;left:56px;top:50%;transform:translateY(-50%) translateX(-6px);opacity:0;pointer-events:none;
  background:var(--card3);border:1px solid var(--line2);color:var(--tx);font-size:11.5px;font-weight:600;
  padding:5px 11px;border-radius:9px;white-space:nowrap;transition:.18s var(--ease);z-index:80;box-shadow:var(--sh2)}
.rail-btn:hover .tip{opacity:1;transform:translateY(-50%) translateX(0)}
.rail-sep{width:26px;height:1px;background:var(--line2);margin:8px 0}
.rail-sp{flex:1}
.rail-badge{position:absolute;top:-4px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:var(--acc-ink);
  font-size:9.5px;font-weight:800;font-family:var(--fm);display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 3px var(--bg1)}

/* ================= MAIN / TOPBAR ================= */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{
  flex:none;height:60px;display:flex;align-items:center;gap:12px;padding:0 14px 0 16px;
  background:var(--bg1);border-bottom:1px solid var(--line);position:relative;z-index:50;
}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand .mark{width:30px;height:30px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.brand-name{font-family:var(--fd);font-weight:700;font-size:14.5px;letter-spacing:.06em;line-height:1.05}
.brand-name small{display:block;font-family:var(--fu);font-weight:500;font-size:9px;letter-spacing:.24em;color:var(--tx3)}
.ver{font-family:var(--fm);font-size:8.5px;font-weight:600;letter-spacing:.08em;color:var(--acc);
  background:var(--acc-soft);border:1px solid var(--acc-line);padding:2.5px 7px;border-radius:20px}
#crumbs{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden;flex:none;max-width:340px}
.crumb{
  display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--r-pill);color:var(--tx2);
  font-size:12px;font-weight:600;white-space:nowrap;transition:.15s;border:1px solid transparent}
.crumb .i{width:14px;height:14px}
.crumb:hover{color:var(--tx);background:var(--card2)}
.crumb.cur{color:var(--tx);background:var(--card2);border-color:var(--line)}
.crumb-sep{color:var(--tx4);flex:none}
.search{
  flex:1;max-width:430px;min-width:130px;display:flex;align-items:center;gap:9px;margin:0 auto;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:0 8px 0 14px;height:38px;
  transition:.2s var(--ease);cursor:text}
.search .i{width:15px;height:15px;color:var(--tx3);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:12.5px;font-weight:500;color:var(--tx)}
.search input::placeholder{color:var(--tx3)}
.search:focus-within{border-color:var(--line3);background:var(--card2);box-shadow:0 0 0 3px var(--acc-soft)}
.search kbd{
  flex:none;font-family:var(--fm);font-size:9.5px;font-weight:600;color:var(--tx3);background:var(--card3);
  border:1px solid var(--line2);border-bottom-width:2px;padding:2.5px 6px;border-radius:6px}
.tb{display:flex;align-items:center;gap:8px;flex:none}
.tb-sep{width:1px;height:22px;background:var(--line2);margin:0 3px;flex:none}
.ibtn{
  position:relative;height:34px;min-width:34px;padding:0 8px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  color:var(--tx2);border:1px solid transparent;transition:.18s var(--ease);font-size:12px;font-weight:600}
.ibtn .i{width:16px;height:16px}
.ibtn:hover{color:var(--tx);background:var(--card2)}
.ibtn.on{color:var(--acc);background:var(--acc-soft);border-color:var(--acc-line)}
.ibtn:disabled{opacity:.35;pointer-events:none}
.btn{
  display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--r-pill);
  font-size:12px;font-weight:700;letter-spacing:.015em;transition:.2s var(--ease);border:1px solid transparent;white-space:nowrap}
.btn .i{width:15px;height:15px}
.btn-acc{background:var(--acc);color:var(--acc-ink);box-shadow:0 8px 22px -8px var(--acc-glow)}
.btn-acc:hover{transform:translateY(-1px);box-shadow:0 12px 28px -8px var(--acc-glow),0 0 0 1px var(--acc-line)}
.btn-acc:active{transform:translateY(0) scale(.98)}
.btn-ghost{background:var(--card2);border-color:var(--line2);color:var(--tx)}
.btn-ghost:hover{background:var(--card3);border-color:var(--line3);transform:translateY(-1px)}
</style>
<style>
/* ================= SUBBAR ================= */
#subbar{
  flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);background:var(--bg1)}
.mounts{display:flex;gap:6px;flex:none}
.mount{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 13px;border-radius:var(--r-pill);
  font-size:11.5px;font-weight:700;color:var(--tx3);border:1px solid var(--line);background:var(--card);transition:.18s var(--ease)}
.mount .i{width:13px;height:13px}
.mount:hover{color:var(--tx);border-color:var(--line2)}
.mount.on{color:var(--tx);background:var(--card3);border-color:var(--line3);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.mount.on .i{color:var(--acc)}
.mount .lock{font-size:8.5px;font-family:var(--fm);padding:1.5px 5px;border-radius:8px;background:var(--card4);color:var(--tx3);font-weight:600}
.fpills{display:flex;gap:5px;flex:1;min-width:0;overflow-x:auto;padding:2px;scrollbar-width:none}
.fpills::-webkit-scrollbar{display:none}
.fpill{
  flex:none;display:flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:var(--r-pill);
  font-size:11px;font-weight:600;color:var(--tx3);transition:.16s;border:1px solid transparent}
.fpill .dot{width:6px;height:6px;border-radius:50%;background:var(--fg,var(--tx4))}
.fpill:hover{color:var(--tx);background:var(--card2)}
.fpill.on{color:var(--tx);background:var(--card2);border-color:var(--line2)}
.fpill.on .dot{box-shadow:0 0 8px var(--fg)}
.sub-right{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.count{font-family:var(--fm);font-size:10.5px;color:var(--tx3);letter-spacing:.03em;white-space:nowrap}
.count b{color:var(--tx);font-weight:600}
.zoom{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--line)}
.zoom .i{width:13px;height:13px;color:var(--tx3)}
.zoom input{-webkit-appearance:none;appearance:none;width:78px;height:3px;border-radius:2px;background:var(--card4);outline:none;cursor:pointer}
.zoom input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--acc);border:2.5px solid var(--bg1);box-shadow:0 0 0 1px var(--acc-line);transition:.15s}
.zoom input::-webkit-slider-thumb:hover{transform:scale(1.15)}
.zoom input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--bg1)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:2.5px;gap:2px}
.seg-btn{width:30px;height:25px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--tx3);transition:.16s}
.seg-btn .i{width:14px;height:14px}
.seg-btn:hover{color:var(--tx)}
.seg-btn.on{background:var(--card4);color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}

/* ================= DECK LAYOUT ================= */
#deck{flex:1;display:flex;min-height:0;position:relative}
#browserPane{flex:1;display:flex;flex-direction:column;min-width:0}
#viewport{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;position:relative;scroll-behavior:smooth}

/* ================= GRID CARDS ================= */
#gridAll{display:flex;flex-direction:column;gap:18px}
.sec-h{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
.sec-h .ln{flex:1;height:1px;background:var(--line)}
.sec-h .n{font-family:var(--fm);font-weight:500;color:var(--tx4);font-size:10px;letter-spacing:.05em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cs),1fr));gap:11px}
.cards.list{grid-template-columns:1fr;gap:5px}
.card{
  position:relative;border-radius:var(--r-l);background:var(--card);border:1px solid var(--line);
  padding:12px 10px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;
  transition:transform .24s var(--ease),border-color .18s,background .18s,box-shadow .24s,opacity .24s;
  animation:cardIn .5s var(--ease) backwards;user-select:none}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
.card:hover{transform:translateY(-3px);background:var(--card2);border-color:var(--line2);box-shadow:var(--sh1)}
.card.sel{border-color:var(--acc-line);background:var(--acc-soft);box-shadow:0 0 0 1px var(--acc-line),0 10px 26px -14px var(--acc-glow)}
.card.sel .c-name{color:var(--acc)}
:root[data-theme="light"] .card.sel .c-name{color:var(--tx)}
.card.focus{outline:2px solid var(--acc-line);outline-offset:2px}
.thumb{
  position:relative;width:100%;aspect-ratio:1;border-radius:15px;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 50% 0%,var(--card3),var(--bg2) 78%);border:1px solid var(--line)}
.thumb svg.ticon{width:72%;height:72%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));transition:transform .3s var(--ease2)}
.card:hover .thumb svg.ticon{transform:scale(1.06) translateY(-2px)}
.thumb canvas,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .scr{padding:6%}
.thumb-plus{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg1)}
.c-name{max-width:100%;font-size:12px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.c-sub{font-size:10px;color:var(--tx3);font-family:var(--fm);letter-spacing:.02em;display:flex;align-items:center;gap:5px;white-space:nowrap}
.c-sub .kd{width:5px;height:5px;border-radius:50%;background:var(--kh,var(--tx3));flex:none}
.card .star{
  position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  color:var(--tx3);opacity:0;transition:.18s;background:var(--bg1);border:1px solid var(--line);backdrop-filter:blur(6px);z-index:3}
.card:hover .star,.card .star.on{opacity:1}
.card .star .i{width:13px;height:13px}
.card .star:hover{color:var(--amber);transform:scale(1.1)}
.card .star.on{color:var(--amber);border-color:rgba(255,196,107,.4)}
.card .acts{
  position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:5px;opacity:0;transform:translateX(5px);
  transition:.2s var(--ease);z-index:3}
.card:hover .acts{opacity:1;transform:none}
.act-b{
  width:28px;height:28px;border-radius:10px;display:grid;place-items:center;color:var(--tx2);
  background:var(--bg1);border:1px solid var(--line);backdrop-filter:blur(6px);transition:.15s}
.act-b .i{width:14px;height:14px}
.act-b:hover{color:var(--acc-ink);background:var(--acc);border-color:var(--acc);transform:scale(1.08)}
.act-b.tip-wrap{position:relative}
/* list rows */
.cards.list .card{flex-direction:row;align-items:center;padding:7px 12px;gap:13px;border-radius:var(--r-m);text-align:left}
.cards.list .thumb{width:44px;height:44px;aspect-ratio:auto;flex:none;border-radius:11px}
.cards.list .thumb svg.ticon{width:70%;height:70%}
.cards.list .c-name{text-align:left;font-size:12.5px}
.cards.list .c-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cards.list .c-sub{justify-content:flex-start}
.cards.list .c-x{display:flex;gap:26px;align-items:center;font-family:var(--fm);font-size:10.5px;color:var(--tx3)}
.cards.list .c-x span{width:86px;text-align:right;white-space:nowrap}
.cards.list .c-x .kchip{width:auto;text-align:left}
.cards.list .acts{position:static;flex-direction:row;opacity:0;transform:none;margin-left:8px}
.cards.list .card:hover .acts{opacity:1}
.cards.list .star{position:static;opacity:1;background:none;border:0}
.kchip{flex:none;display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 8px;border-radius:20px;
  font-family:var(--fm);font-size:8.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--kh);background:color-mix(in srgb,var(--kh) 12%,transparent);border:1px solid color-mix(in srgb,var(--kh) 30%,transparent)}

/* bulk bar */
#bulkbar{
  position:absolute;left:50%;bottom:16px;transform:translate(-50%,14px);opacity:0;pointer-events:none;z-index:40;
  display:flex;align-items:center;gap:9px;background:var(--card3);border:1px solid var(--line2);border-radius:var(--r-pill);
  padding:7px 8px 7px 15px;box-shadow:var(--sh2);transition:.25s var(--ease)}
#bulkbar.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#bulkbar .n{font-size:12px;font-weight:700;white-space:nowrap}
#bulkbar .n b{color:var(--acc);font-family:var(--fm)}
#bulkbar .bb{display:flex;align-items:center;gap:6px;height:29px;padding:0 12px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;background:var(--card4);color:var(--tx);transition:.15s}
#bulkbar .bb .i{width:13px;height:13px}
#bulkbar .bb:hover{background:var(--tx);color:var(--bg0)}
#bulkbar .bb.prime{background:var(--acc);color:var(--acc-ink)}
#bulkbar .bb.prime:hover{filter:brightness(1.08)}
#bulkbar .bb.danger:hover{background:var(--red);color:#fff}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:70px 20px;text-align:center;animation:cardIn .4s var(--ease) backwards}
.empty .eico{width:104px;height:104px;opacity:.9;filter:drop-shadow(0 14px 24px rgba(0,0,0,.4))}
.empty h3{font-family:var(--fd);font-size:16px;font-weight:700;letter-spacing:-.01em}
.empty p{color:var(--tx3);font-size:12px;max-width:340px}
</style>
<style>
/* ================= OVERVIEW ================= */
.ov{display:flex;flex-direction:column;gap:13px;max-width:1180px;margin:0 auto;animation:cardIn .45s var(--ease) backwards}
.ov-hero{
  position:relative;overflow:hidden;border-radius:26px;border:1px solid var(--line);
  background:linear-gradient(135deg,var(--card2),var(--card) 55%),var(--card);padding:24px 26px;display:flex;gap:26px;align-items:stretch;flex-wrap:wrap}

  #inspector{position:absolute;right:0;top:0;bottom:0;z-index:45;box-shadow:var(--sh2)}
  #inspector.hide{margin-right:-320px}
}
@media (max-width:980px){ #crumbs{display:none} .ver{display:none} }
@media (max-width:860px){
  #app{flex-direction:column}
  #rail{width:100%;flex-direction:row;order:2;border-right:0;border-top:1px solid var(--line);padding:7px 14px;justify-content:center;height:60px}
  .rail-btn .tip{display:none} .rail-sep{width:1px;height:24px;margin:0 8px} .rail-sp{display:none}
  #toasts{bottom:150px}
}
@media (max-width:640px){
  :root{--cs:118px}
  .search{max-width:none}
  .tb .hide-s{display:none}
  .ov-row{grid-template-columns:1fr}
  .brand-name small{display:none}
  #topbar{gap:8px;padding:0 10px}
  #viewport{padding:12px}
  .dock-head .dstat{display:none}
  .chip .cn{max-width:84px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body.no-anim *{animation-duration:.01ms!important;transition-duration:.01ms!important}
</style>
</head>
<body>
<div id="app">

  <!-- ============ RAIL ============ -->
  <nav id="rail" aria-label="Sources"></nav>

  <!-- ============ MAIN ============ -->
  <div id="main">
    <header id="topbar">
      <div class="brand">
        <span class="mark i" id="brandMark"></span>
        <div class="brand-name">RIFT<small>ASSET&nbsp;DECK</small></div>
        <span class="ver">PROTO&nbsp;0.9</span>
      </div>
      <nav id="crumbs" aria-label="Path"></nav>
      <div class="search" id="searchBox" role="search">
        <span class="i" id="searchIco"></span>
        <input id="searchInput" type="text" placeholder="Filter current view…" autocomplete="off" spellcheck="false">
        <kbd>⌘K</kbd>
      </div>
      <div class="tb">
        <button class="ibtn hide-s" id="btnUp" title="Up one level (⌫)"></button>
        <button class="ibtn" id="btnInsp" title="Toggle inspector (I)"></button>
        <span class="tb-sep hide-s"></span>
        <button class="btn btn-ghost hide-s" id="btnImport"></button>
        <button class="btn btn-acc" id="btnCreate"></button>
        <button class="ibtn" id="btnTheme" title="Toggle theme (T)"></button>
      </div>
    </header>

    <div id="deck">
      <section id="browserPane">
        <div id="subbar">
          <div class="mounts" id="mounts"></div>
          <div class="fpills" id="fpills"></div>
          <div class="sub-right">
            <span class="count" id="countLbl"></span>
            <button class="ibtn" id="btnNewFolder" title="New folder (⇧N)"></button>
            <button class="ibtn" id="btnSort" title="Sort"></button>
            <div class="seg" id="viewSeg">
              <button class="seg-btn on" data-view="grid" title="Grid view (G)"></button>
              <button class="seg-btn" data-view="list" title="List view (L)"></button>
            </div>
            <div class="zoom"><span class="i" id="zoomIco"></span><input type="range" id="zoom" min="110" max="205" value="150" step="1"></div>
          </div>
        </div>
        <div id="viewport"><div id="gridAll"></div></div>
        <div id="bulkbar"></div>
      </section>
      <aside id="inspector"><div class="insp-empty" id="inspEmpty"></div><div class="insp" id="inspBody" style="display:none"></div></aside>
    </div>

    <!-- ============ SESSION DOCK ============ -->
    <footer id="dock">
      <div class="dock-head">
        <div class="dt"><span class="live-dot"></span><span id="dockIco" class="i"></span>LIVE&nbsp;SESSION</div>
        <div class="dstat" id="dockStat"></div>
      </div>
      <div class="dock-rail" id="dockRail"></div>
      <div class="dock-tail">
        <button class="btn btn-ghost" id="btnClearSession"></button>
        <button class="btn btn-acc" id="btnDeploy"></button>
      </div>
    </footer>
  </div>
</div>

<!-- ============ OVERLAYS ============ -->
<div class="scrim" id="scrim"></div>
<div id="palette"><div class="pal-in"><span class="i" id="palIco"></span><input id="palInput" placeholder="Search everything, run commands…" autocomplete="off" spellcheck="false"></div><div class="pal-list" id="palList"></div><div class="pal-foot"><span><b>↑↓</b>navigate</span><span><b>↵</b>run</span><span><b>esc</b>close</span></div></div>
<div id="ctx"></div>
<div id="quicklook"><div class="ql-card" id="qlCard"></div></div>
<div id="modal"><div class="mo-card" id="moCard"></div></div>
<div id="toasts"></div>
<div id="dz"><div class="dz-card"><span class="i" id="dzIco"></span><h3>Drop assets to import</h3><p>Files land in the active library folder — images, models, CAD, fonts, audio…</p></div></div>
<input type="file" id="fileInput" multiple hidden>
<input type="file" id="dirInput" webkitdirectory hidden>
<script>
/* ================================================================
   RIFT · ICON FOUNDRY — fully procedural dimensional SVG icon set
   (glass folders · keycap plates · shaded primitives · blueprint CAD)
   ================================================================ */
let __uid=0; const U=()=>'i'+(++__uid).toString(36);
const ST=(o,c,a=1)=>`<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`;
const LG=(id,stops,x1=0,y1=0,x2=0,y2=1)=>`<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stops}</linearGradient>`;
const RG=(id,stops,cx=.5,cy=.42,r=.62)=>`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${stops}</radialGradient>`;
const SVG96=(defs,body,cls='')=>`<svg viewBox="0 0 96 96" class="${cls}" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${body}</svg>`;
const DS='style="filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))"';
const metal=id=>LG(id,ST(0,'#F2F5F9')+ST(.52,'#C6CDD7')+ST(1,'#99A1AE'));
const metalD=id=>LG(id,ST(0,'#B9C0CB')+ST(1,'#6E7683'));
const darkF=id=>LG(id,ST(0,'#565D68')+ST(1,'#2E333B'));

/* ---------- keycap plate (command-key reference) ---------- */
function plate(o={}){
  const {a='#C8F751',b='#5EE9D5',inner='',ribbon=true,well=true,tint}=o;
  const g1=U(),g2=U(),g3=U(),g4=U(),cp=U(),bh=tint?`fill="${tint}" opacity=".28"`:'';
  const defs=LG(g1,ST(0,'#363941')+ST(.09,'#2C2F36')+ST(1,'#14161A'))
    +LG(g2,ST(0,'#0C0D10')+ST(1,'#1D2026'))
    +RG(g3,ST(0,'#FFF',.55)+ST(1,'#FFF',0),.5,.5,.5)
    +LG(g4,ST(0,a)+ST(1,b),0,0,0,1)
    +`<clipPath id="${cp}"><rect x="13" y="10" width="70" height="76" rx="22"/></clipPath>`;
  return {defs,frame:`
    <ellipse cx="48" cy="90" rx="29" ry="4.6" fill="#000" opacity=".4"/>
    <rect x="13" y="10" width="70" height="76" rx="22" fill="url(#${g1})" stroke="rgba(255,255,255,.09)"/>
    ${tint?`<rect x="13" y="10" width="70" height="76" rx="22" ${bh}/>`:''}
    ${well?`<rect x="19" y="16" width="58" height="64" rx="16.5" fill="url(#${g2})" stroke="rgba(0,0,0,.5)"/>
    <path d="M25 78.6h46" stroke="rgba(255,255,255,.06)" stroke-width="1" stroke-linecap="round"/>`:''}
    <path d="M25 11.4h46" stroke="rgba(255,255,255,.26)" stroke-width="1.3" stroke-linecap="round"/>
    <ellipse cx="48" cy="13" rx="33" ry="12" fill="url(#${g3})" opacity=".5" clip-path="url(#${cp})"/>
    ${ribbon?`<rect x="75.9" y="37.5" width="9" height="24" rx="4" fill="${a}" opacity=".16"/>
    <rect x="76.8" y="39" width="4.8" height="21" rx="2.4" fill="url(#${g4})"/>`:''}
    ${inner}`};
}
const plated=(o)=>{const p=plate(o);return SVG96(p.defs,p.frame)};

/* ---------- shaded primitive glyphs (in-well, center ~48,47) ---------- */
function primSphere(o={}){
  const g=o.g||'#C8D2DE'; const sS=U(),sH=U(),sA=U();
  const defs=RG(sS,ST(0,'#FBFDFF')+ST(.28,g)+ST(.78,'#59616D')+ST(1,'#252930'),.36,.32,.72)
    +RG(sH,ST(0,'#FFF',.95)+ST(1,'#FFF',0),.5,.5,.5)
    +LG(sA,ST(0,'#000',0)+ST(1,'#000',.4));
  return {defs,body:`<g ${DS}>
    <circle cx="48" cy="48" r="20.5" fill="url(#${sS})"/>
    <ellipse cx="41" cy="40" rx="8" ry="5" fill="url(#${sH})" opacity=".8" transform="rotate(-24 41 40)"/>
    <path d="M30.5 55a20.5 20.5 0 0 0 35 0 22.5 20.5 0 0 1-35 0z" fill="url(#${sA})" opacity=".5"/>
    ${o.geo?geoLines():''}
  </g>`};
}
function geoLines(){
  return `<g stroke="#FFF" stroke-opacity=".5" fill="none" stroke-width=".9">
    <ellipse cx="48" cy="48" rx="20.2" ry="6.4"/><ellipse cx="48" cy="48" rx="20.2" ry="13.4" opacity=".7"/>
    <ellipse cx="48" cy="48" rx="6.4" ry="20.2"/><ellipse cx="48" cy="48" rx="13.4" ry="20.2" opacity=".7"/>
    <circle cx="48" cy="48" r="20.5" stroke-opacity=".65"/>
  </g>`;
}
const CUBE={t:'48 26 67.5 37 48 48 28.5 37',l:'28.5 37 48 48 48 68 28.5 57',r:'67.5 37 48 48 48 68 67.5 57'};
function primCube(o={}){
  const c1=o.wire?null:(o.c||'#CBD4DF');
  const gT=U(),gL=U(),gR=U();
  const defs=LG(gT,ST(0,c1||'#fff')+ST(1,shadeC(c1||'#fff',-22)))+LG(gL,ST(0,shadeC(c1||'#fff',-38))+ST(1,shadeC(c1||'#fff',-62)))+LG(gR,ST(0,shadeC(c1||'#fff',-18))+ST(1,shadeC(c1||'#fff',-44)));
  const stroke=o.wire?`fill="none" stroke="${o.c||'#E8ECF2'}" stroke-width="1.6"`:'';
  return {defs,body:`<g ${DS} stroke-linejoin="round">
    <polygon points="${CUBE.t}" fill="url(#${gT})" ${stroke}/>
    <polygon points="${CUBE.l}" fill="url(#${gL})" ${stroke}/>
    <polygon points="${CUBE.r}" fill="url(#${gR})" ${stroke}/>
    ${o.wire?'':`<g stroke="#FFF" stroke-opacity=".55" stroke-width="1" fill="none">
      <path d="M48 26.5 67 37M48 26.5 29 37M48 47.5v20M29 37.5v19M67 37.5v19"/></g>`}
    ${o.nodes?`<g fill="#E9F2FB"><circle cx="48" cy="26" r="2.2"/><circle cx="67.5" cy="37" r="2.2"/><circle cx="28.5" cy="37" r="2.2"/><circle cx="48" cy="68" r="2.2"/></g>`:''}
  </g>`};
}
function shadeC(hex,amt){const n=parseInt(hex.slice(1),16);const r=Math.min(255,Math.max(0,(n>>16)+amt)),g=Math.min(255,Math.max(0,((n>>8)&255)+amt)),b=Math.min(255,Math.max(0,(n&255)+amt));return `#${((r<<16)|(g<<8)|b).toString(16).padStart(6,'0')}`}
function primPlane(){
  return {defs:'',body:`<g ${DS} stroke-linejoin="round">
    <polygon points="27,58 49,38 72,46 50,66" fill="rgba(226,232,240,.14)" stroke="#E4EAF2" stroke-width="1.6"/>
    <g stroke="#E4EAF2" stroke-width=".9" opacity=".55">
      <path d="M32.5 53.5 54.5 61M38 48.7 60 56.2M43.5 44 65.5 51.3"/>
      <path d="M34.6 62.4 56.6 42.4M42.7 66.6 64.6 44.6"/>
    </g>
    <g fill="#F2F6FB"><circle cx="27" cy="58" r="2"/><circle cx="49" cy="38" r="2"/><circle cx="72" cy="46" r="2"/><circle cx="50" cy="66" r="2"/></g>
  </g>`};
}
function primCylinder(){
  const gB=U();const defs=LG(gB,ST(0,'#DEE4EC')+ST(.5,'#9AA4B1')+ST(1,'#4C545F'),0,0,1,0);
  return {defs,body:`<g ${DS}>
    <path d="M31 33 v27 a17 6 0 0 0 34 0 V33" fill="url(#${gB})"/>
    <ellipse cx="48" cy="33" rx="17" ry="6" fill="#E9EEF5"/>
    <ellipse cx="48" cy="33" rx="17" ry="6" fill="none" stroke="#FFF" stroke-opacity=".6"/>
    <path d="M31.5 60.5a17 6 0 0 0 33 0" fill="none" stroke="#FFF" stroke-opacity=".35" stroke-width="1"/>
  </g>`};
}
function primCone(){
  const gB=U(),gT=U();const defs=LG(gB,ST(0,'#D5DCE5')+ST(.55,'#8B95A2')+ST(1,'#434A54'),0,0,1,0)+RG(gT,ST(0,'#FFF')+ST(1,'#FFF',0));
  return {defs,body:`<g ${DS}>
    <path d="M48 25 64.8 61.5a17 6 0 0 1-33.6 0 Z" fill="url(#${gB})" stroke-linejoin="round"/>
    <ellipse cx="48" cy="61" rx="16.8" ry="5.8" fill="none" stroke="#FFF" stroke-opacity=".3"/>
    <circle cx="48" cy="25" r="2.4" fill="url(#${gT})"/>
  </g>`};
}
function primTorus(){
  const gR=U();const defs=LG(gR,ST(0,'#E8EDF4')+ST(.5,'#96A0AD')+ST(1,'#3F4650'),0,0,0,1);
  return {defs,body:`<g ${DS}>
    <path d="M26 50a22 13.5 0 1 1 44 0 22 13.5 0 1 1-44 0 M39 50a9 4.6 0 1 0 18 0 9 4.6 0 1 0-18 0" fill-rule="evenodd" fill="url(#${gR})"/>
    <path d="M31 45.5a19 10.5 0 0 1 17-6.2" fill="none" stroke="#FFF" stroke-opacity=".75" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="48" cy="50" rx="9" ry="4.6" fill="#14161B"/>
  </g>`};
}
function primCapsule(){
  const gB=U();const defs=LG(gB,ST(0,'#DEE4EC')+ST(.5,'#95A0AD')+ST(1,'#454C56'),0,0,1,0);
  return {defs,body:`<g ${DS}>
    <path d="M38 30h20a0 0 0 0 1 0 0v27a10 10 0 0 1-20 0V30a0 0 0 0 1 0 0z" transform="translate(0,-1)" fill="url(#${gB})"/>
    <path d="M38 30a10 10 0 0 1 20 0" fill="#EDF2F8" opacity=".85"/>
    <path d="M41 63a7 6 0 0 0 14 0" fill="none" stroke="#FFF" stroke-opacity=".3" stroke-width="1"/>
    <path d="M38.6 41.5h18.8" stroke="#14161B" stroke-opacity=".35"/>
  </g>`};
}
/* camera — follows the glossy-lens reference */
function primCamera(){
  const gB=U(),gL=U(),gLi=U(),gS=U();
  const defs=LG(gB,ST(0,'#3B3F47')+ST(1,'#1A1C21'))
    +RG(gL,ST(0,'#454B56')+ST(.55,'#17191E')+ST(1,'#050608'),.42,.38,.7)
    +RG(gLi,ST(0,'#67f')+ST(.6,'#2A3242')+ST(1,'#07080B'),.35,.3,.8)
    +RG(gS,ST(0,'#FFF',.9)+ST(1,'#FFF',0));
  return {defs,body:`<g ${DS}>
    <rect x="22" y="30" width="52" height="37" rx="10" fill="url(#${gB})" stroke="rgba(255,255,255,.14)"/>
    <path d="M30 31h36" stroke="rgba(255,255,255,.25)" stroke-width="1.1" stroke-linecap="round"/>
    <rect x="62" y="35" width="7.5" height="5.5" rx="1.6" fill="#101216" stroke="rgba(255,255,255,.22)"/>
    <circle cx="47" cy="49" r="13.5" fill="url(#${gL})" stroke="#000" stroke-width="1.4"/>
    <circle cx="47" cy="49" r="9.5" fill="url(#${gLi})" stroke="rgba(255,255,255,.09)"/>
    <circle cx="47" cy="49" r="4.6" fill="#04050a"/>
    <ellipse cx="43.5" cy="45" rx="3.4" ry="2.2" fill="url(#${gS})" opacity=".85" transform="rotate(-20 43.5 45)"/>
    <circle cx="50.6" cy="52.6" r="1.1" fill="#7AC3FF" opacity=".8"/>
  </g>`};
}
function primLight(){
  const gB=U(),gBm=U();
  const defs=LG(gB,ST(0,'#E2E8F0')+ST(1,'#5C646F'),0,0,1,0)+LG(gBm,ST(0,'#FFE9A8',.85)+ST(1,'#FFE9A8',0));
  return {defs,body:`<g ${DS}>
    <path d="M35 28h20l4 14H31z" fill="url(#${gB})" stroke-linejoin="round"/>
    <circle cx="38" cy="24" r="3.4" fill="#8E98A5"/><circle cx="52" cy="24" r="3.4" fill="#8E98A5"/>
    <path d="M31 42 21 68h48L59 42z" fill="url(#${gBm})" opacity=".55"/>
    <ellipse cx="45" cy="68" rx="24" ry="4.6" fill="#FFE9A8" opacity=".22"/>
    <ellipse cx="45" cy="42.5" rx="14" ry="2.6" fill="#FFF3CF"/>
  </g>`};
}
function primEmpty(){
  const arr=(x1,y1,x2,y2,c)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/><path d="M${x2} ${y2} m-4 2 4-2.4-4-2.4" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
  return {defs:'',body:`<g ${DS}>
    ${arr(48,48,66,41,'#FF6B5E')}${arr(48,48,48,26,'#C8F751')}${arr(48,48,32,60,'#7AC3FF')}
    <circle cx="48" cy="48" r="4.6" fill="#0D0E11" stroke="#E8ECF2" stroke-width="1.8"/>
  </g>`};
}
</script>
<script>
/* ================= GLASS FOLDERS (onboarding/imported references) ================= */
const MICRO={ /* 24-grid stroke glyphs for folder badges */
  mesh:'<path d="M12 4 20 8.5v7L12 20l-8-4.5v-7z M12 4v8 M12 12l8-3.5 M12 12 4 8.5" fill="none"/>',
  cad:'<path d="M4 17 12 4l8 13z M8 20.5h8 M4 17v3.5 M20 17v3.5" fill="none"/>',
  image:'<path d="M3 18l5.5-7 4 5 3-3.5L21 18 M15.5 7.5h.01" fill="none"/><circle cx="15.8" cy="7.6" r="1.4" fill="none"/>',
  hdri:'<path d="M12 3v3 M5.6 5.6l2.1 2.1 M3 12h3 M18 12h3 M16.3 7.7l2.1-2.1 M4 18h16" fill="none"/><path d="M7 15a5 5 0 0 1 10 0" fill="none"/>',
  material:'<circle cx="12" cy="12" r="8" fill="none"/><path d="M12 4a8 8 0 0 1 0 16 M4.6 8.5h14.8 M4.6 15.5h14.8" fill="none"/>',
  font:'<path d="M6 19 12 5l6 14 M8.4 14.5h7.2 M4.5 19h4 M15.5 19h4" fill="none"/>',
  audio:'<path d="M5 10v4 M9 7v10 M13 4v16 M17 8v8 M21 11v2" fill="none"/>',
  video:'<path d="M4 6h16v12H4z M4 10l4-4 M9 10l4-4 M14 10l4-4" fill="none"/><path d="M10.5 13.2v4.6l4-2.3z" fill="currentColor" stroke="none"/>',
  script:'<path d="M6 8l4.5 4L6 16 M12 16.5h6" fill="none"/>',
  scene:'<path d="M12 3 3 8l9 5 9-5z M5 12.5 12 16l7-3.5 M5 16.5 12 20l7-3.5" fill="none"/>',
  archive:'<path d="M4 7h16v13H4z M4 7l2-3h12l2 3 M12 7v3 m0 2v1 m0 2v3" fill="none"/>',
  data:'<path d="M9 5C6 5 6 8 6 9.5S5 12 4 12c1 0 2 .5 2 2.5S6 19 9 19 M15 5c3 0 3 3 3 4.5s1 2.5 2 2.5c-1 0-2 .5-2 2.5S18 19 15 19" fill="none"/>',
  prefab:'<path d="M13 3 5 13h5l-1 8 8-10h-5z" fill="currentColor" stroke="none"/>',
  session:'<circle cx="12" cy="12" r="7" fill="none"/><path d="M12 8v4l3 2" fill="none"/>',
};
function icFolder(cat='generic'){
  const C=CAT(cat); const g1=U(),g2=U(),g3=U(),gP=U(),gG=U(),cp=U(),ga=U();
  const defs=LG(g1,ST(0,'#3A3E46')+ST(1,'#1E2126'))
    +LG(gP,ST(0,'#F1F3F7')+ST(1,'#C4C9D2'))
    +LG(g3,ST(0,'rgba(255,255,255,.16)')+ST(1,'rgba(255,255,255,.05)'))
    +LG(gG,ST(0,'#FFF',.75)+ST(1,'#FFF',0),0,0,1,0)
    +LG(ga,ST(0,C.a)+ST(1,C.b),0,0,1,0)
    +`<clipPath id="${cp}"><path d="M12 41a10 10 0 0 1 10-10h52a10 10 0 0 1 10 10v21a10 10 0 0 1-10 10H22a10 10 0 0 1-10-10Z"/></clipPath>`;
  const badge=MICRO[cat]?`
    <g ${DS}>
      <circle cx="26.5" cy="62.5" r="11" fill="#14171C" stroke="url(#${ga})" stroke-width="1.7"/>
      <g transform="translate(18.5,54.5) scale(.67)" style="color:${C.a}">
        <g stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${MICRO[cat]}</g>
      </g>
    </g>`:'';
  return SVG96(defs,`
    <ellipse cx="48" cy="84" rx="32" ry="4.6" fill="#000" opacity=".38"/>
    <g ${DS}>
      <g transform="rotate(-6 30 26)"><rect x="23" y="17" width="30" height="24" rx="3" fill="url(#${gP})" opacity=".92"/>
        <path d="M27 22.5h18M27 27h14M27 31.5h16" stroke="#959CA8" stroke-width="1.6" opacity=".8"/></g>
      <g transform="rotate(5 64 26)"><rect x="46" y="19" width="28" height="22" rx="3" fill="url(#${gP})" opacity=".96"/>
        <path d="M50 24.5h16M50 29h19M50 33.5h12" stroke="#959CA8" stroke-width="1.6" opacity=".8"/></g>

  },
  cad(x,s,r,C){
    bgfill(x,s,'#16334f','#0b1b2d');
    x.strokeStyle='rgba(140,190,255,.12)';x.lineWidth=1;
    for(let i=0;i<=s;i+=s/10){x.beginPath();x.moveTo(i,0);x.lineTo(i,s);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(s,i);x.stroke()}
    const cx=s/2,cy=s*.54,k=s*.2;
    x.strokeStyle='#ddeaff';x.lineWidth=s*.012;x.lineJoin='round';
    isoWire(x,cx,cy,k*1.15,k*.62);
    x.strokeStyle='#7ac3ff';x.lineWidth=1;
    x.beginPath();x.moveTo(cx-k*1.5,cy+k*.75);x.lineTo(cx+k*1.5,cy+k*.75);x.moveTo(cx-k*1.5,cy+k*.65);x.lineTo(cx-k*1.5,cy+k*.85);x.moveTo(cx+k*1.5,cy+k*.65);x.lineTo(cx+k*1.5,cy+k*.85);x.stroke();
    x.beginPath();x.arc(cx-k*1.1,cy-k*1.1,s*.03,0,7);x.stroke();
    x.beginPath();x.moveTo(cx-k*1.1-s*.05,cy-k*1.1);x.lineTo(cx-k*1.1+s*.05,cy-k*1.1);x.moveTo(cx-k*1.1,cy-k*1.1-s*.05);x.lineTo(cx-k*1.1,cy-k*1.1+s*.05);x.stroke();
    vignette(x,s);
  },
  mesh(x,s,r,C){
    bgfill(x,s,'#12161b','#0b0d10');
    x.strokeStyle='rgba(125,239,200,.10)';x.lineWidth=1;
    for(let i=0;i<=10;i++){const y=s*.62+i*(s*.045);x.beginPath();x.moveTo(0,y);x.lineTo(s,y);x.stroke()}
    for(let i=0;i<=10;i++){const xx=i*(s/10);x.beginPath();x.moveTo(s/2+(xx-s/2)*.4,s*.6);x.lineTo(xx,s*.95);x.stroke()}
    const n=1+Math.floor(r()*2);
    for(let i=0;i<n;i++){isoWire(x,s*(.34+r()*.32),s*(.4+r()*.22),s*(.11+r()*.1),s*(.06+r()*.05))}
    vignette(x,s);
  },
  scene(x,s,r,C){
    bgfill(x,s,'#151a26','#0a0c12');
    for(let i=0;i<26;i++){x.fillStyle=`rgba(255,255,255,${.1+r()*.5})`;x.fillRect(r()*s,r()*s*.5,1.3,1.3)}
    for(let l=0;l<3;l++){x.fillStyle=`rgba(${22+l*10},${26+l*10},${34+l*10},.9)`;
      for(let i=0;i<6;i++){const w=s*.09,h=s*(.14+r()*.24);x.fillRect((i*s*.18)+l*7,s*.78-h,w,h)}}
    x.fillStyle='rgba(200,247,81,.16)';x.fillRect(0,s*.78,s,2);
    vignette(x,s);
  },
  script(x,s,r,C){
    bgfill(x,s,'#0e1114','#0a0c0e');
    const cols=['#5ee9d5','#8fe06b','#e8ecf2','#7ac3ff','#b79cff'];
    x.font=`600 ${s*.055}px ui-monospace,monospace`;
    for(let i=0;i<9;i++){let xx=s*.16;const y=s*.14+i*(s*.085);
      x.fillStyle='rgba(255,255,255,.18)';x.fillText(String(i+1).padStart(2,'0'),s*.045,y+s*.02);
      for(let segI=0;segI<3;segI++){const w=s*(.06+r()*.18);x.fillStyle=cols[Math.floor(r()*cols.length)];x.globalAlpha=.4+r()*.6;
        x.beginPath();x.roundRect(xx,y,w,s*.028,s*.014);x.fill();xx+=w+s*.03}}
    x.globalAlpha=1;vignette(x,s);
  },
  font(x,s,r,C){
    bgfill(x,s,'#171522','#0d0b14');
    x.fillStyle='#f0eefb';x.font=`700 ${s*.52}px Georgia,'Times New Roman',serif`;x.textAlign='center';
    x.fillText('Ag',s/2,s*.62);
    x.fillStyle='rgba(240,238,251,.35)';x.font=`500 ${s*.075}px Georgia,serif`;
    x.fillText('AaBbXx · 0123456789',s/2,s*.78);
    x.strokeStyle='rgba(183,156,255,.5)';x.lineWidth=1.4;
    x.beginPath();x.moveTo(s*.12,s*.675);x.lineTo(s*.88,s*.675);x.stroke();
    x.textAlign='start';vignette(x,s);
  },
  video(x,s,r,C){
    bgfill(x,s,'#221410','#0f0a08');
    const g=x.createRadialGradient(s/2,s*.42,4,s/2,s*.42,s*.6);g.addColorStop(0,'rgba(255,170,120,.4)');g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g;x.fillRect(0,0,s,s);
    x.fillStyle='rgba(0,0,0,.55)';x.beginPath();x.arc(s/2,s/2,s*.19,0,7);x.fill();
    x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=2;x.beginPath();x.arc(s/2,s/2,s*.19,0,7);x.stroke();
    x.fillStyle='#fff';x.beginPath();x.moveTo(s*.46,s*.4);x.lineTo(s*.46,s*.6);x.lineTo(s*.62,s*.5);x.closePath();x.fill();
    vignette(x,s);
  },
};
function isoWire(x,cx,cy,w,h){
  x.save();x.strokeStyle=typeof accentWire!=='undefined'?accentWire:'#7defc8';x.lineWidth=1.4;x.lineJoin='round';
  const t=[[cx,cy-h],[cx+w,cy-h*.5],[cx,cy],[cx-w,cy-h*.5]];
  const b=t.map(p=>[p[0],p[1]+h*2*.8]);
  x.beginPath();x.moveTo(...t[0]);x.lineTo(...t[1]);x.lineTo(...t[2]);x.lineTo(...t[3]);x.closePath();x.stroke?.call(x);
  x.beginPath();[[0],[1],[2],[3]].forEach(([i])=>{x.moveTo(...t[i]);x.lineTo(...b[i])});
  x.moveTo(...b[0]);x.lineTo(...b[1]);x.lineTo(...b[2]);x.lineTo(...b[3]);x.closePath();x.stroke();
  x.fillStyle='#eafff6';t.forEach(p=>{x.beginPath();x.arc(p[0],p[1],1.6,0,7);x.fill()});
  x.restore();
  x.globalAlpha=1;
}
function textures(x,s,r,photo){
  const v=Math.floor(r()*6);
  bgfill(x,s,'#14171c','#0d0f13');
  const hue=pick([['#ffab66','#8a4a2a'],['#7ac3ff','#2a4a6a'],['#c8f751','#4a5a1a'],['#ffb66b','#6a3a1a'],['#9aa6b2','#3a3f46']],r);
  if(v===0){const c=14;for(let i=0;i<Math.ceil(s/c);i++)for(let j=0;j<Math.ceil(s/c);j++){x.fillStyle=(i+j)%2?hue[1]:hue[0];x.globalAlpha=.75;x.fillRect(i*c,j*c,c,c)}}
  else if(v===1){x.rotate(-.35);for(let i=-s;i<s*2;i+=16){x.fillStyle=i%32?hue[0]:hue[1];x.globalAlpha=.6;x.fillRect(i,-s,8,s*3)}x.setTransform(1,0,0,1,0,0)}
  else if(v===2){for(let i=0;i<900;i++){x.fillStyle=r()>.5?hue[0]:hue[1];x.globalAlpha=.15+r()*.5;x.fillRect(r()*s,r()*s,1.6,1.6)}}
  else if(v===3){x.lineWidth=3;for(let i=0;i<8;i++){x.strokeStyle=r()>.5?hue[0]:hue[1];x.globalAlpha=.7;x.beginPath();for(let px=0;px<=s;px+=6){x.lineTo(px,s*.14*i+s*.06+Math.sin(px*.05+i)*6)}x.stroke()}}
  else if(v===4){x.strokeStyle=hue[0];x.globalAlpha=.5;x.lineWidth=1.4;const hh=12;for(let row=0;row<s/hh+1;row++)for(let col=0;col<s/10+1;col++){const px=col*10.5+(row%2?5.2:0),py=row*hh;hexPath(x,px,py,6);x.stroke()}}
  else{for(let i=0;i<4;i++){const g=x.createRadialGradient(r()*s,r()*s,2,r()*s,r()*s,s*.4);g.addColorStop(0,hue[i%2]);g.addColorStop(1,'rgba(0,0,0,0)');x.globalAlpha=.5;x.fillStyle=g;x.fillRect(0,0,s,s)}}
  x.globalAlpha=1;vignette(x,s);
}
function hexPath(x,cx,cy,rad){x.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;x[i?'lineTo':'moveTo'](cx+rad*Math.cos(a),cy+rad*Math.sin(a))}x.closePath()}

/* ================= PRIMITIVE CATALOG (Create view) ================= */
const PRIMS=[
  {n:'Sphere',d:'UV sphere · 64×32',tris:'4,096'},
  {n:'IcoSphere',d:'Geodesic · subdiv 3',tris:'5,120'},
  {n:'Cube',d:'Unit cube · 1 m',tris:'12'},
  {n:'Plane',d:'Grid plane · 10×10 m',tris:'512'},
  {n:'Cylinder',d:'32-sided · capped',tris:'256'},
  {n:'Cone',d:'32-sided · apex',tris:'192'},
  {n:'Torus',d:'Major 1 m · minor .3 m',tris:'2,304'},
  {n:'Capsule',d:'r .5 · h 1 m',tris:'1,024'},
  {n:'Cloth',d:'Pinned drape sheet',tris:'2,048'},
  {n:'Knot',d:'Torus knot · p2 q3',tris:'5,760'},
  {n:'Camera',d:'Cine camera · 35 mm',tris:'—'},
  {n:'Light',d:'Spot · 1200 lm',tris:'—'},
  {n:'Empty',d:'Transform null',tris:'—'},
];
</script>
<script>
/* ================= STATE ================= */
const S={
  view:'overview', path:[],
  sel:new Set(), anchorId:null,
  layout:'grid', zoom:150, sortKey:'name', sortDir:1,
  filter:'all', q:'',
  favs:new Set(), recents:[],
  session:[], deploys:0,
  insp:true,
};
const $=id=>document.getElementById(id);
const on=(el,ev,fn,o)=>el.addEventListener(ev,fn,o);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const store={
  get(k,d){try{const v=localStorage.getItem('rift.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('rift.'+k,JSON.stringify(v))}catch(e){}},
};
S.layout=store.get('layout','grid'); S.zoom=store.get('zoom',150);

/* ================= FORMAT HELPERS ================= */
function fmtSize(b){if(b<1024)return Math.max(1,Math.round(b))+' B';if(b<MB)return (b/KB).toFixed(b<10*KB?1:0)+' KB';if(b<GB)return (b/MB).toFixed(b<10*MB?1:0)+' MB';return (b/GB).toFixed(2)+' GB'}
function fmtAgo(d){if(d<1)return'today';if(d===1)return'yesterday';if(d<14)return d+'d ago';if(d<60)return Math.round(d/7)+' wk ago';return Math.round(d/30)+' mo ago'}
const THUMB_CATS=new Set(['image','hdri','material']);
const metaLine=it=>{const k=CAT(it.cat).label.replace(/s$/,'');return it.kind==='folder'?'Folder':(it.ext||k).toUpperCase()};
function byId(id){for(const r of [LIB,ENGINE]){const all=walkDeep(r);const f=all.find(n=>n.id===id);if(f)return f}return null}
function currentRoot(){return S.view==='library'?LIB:S.view==='engine'?ENGINE:null}
function currentNode(){let n=currentRoot();for(const id of S.path){n=(n.children||[]).find(c=>c.id===id);if(!n)break}return n||currentRoot()}
function pathOf(n){const seg=[];let c=n;while(c&&c.parent){seg.unshift(c);c=c.parent}return seg}

/* filtering + sorting */
function currentItems(){
  const n=currentNode(); if(!n||!n.children)return[];
  let items=[...n.children];
  if(S.filter!=='all')items=items.filter(it=>it.cat===S.filter||(S.filter==='folder'&&it.kind==='folder'));
  if(S.q){const q=S.q.toLowerCase();items=items.filter(it=>it.name.toLowerCase().includes(q))}
  const k=S.sortKey;
  items.sort((a,b)=>{
    if(a.kind!==b.kind)return a.kind==='folder'?-1:1;
    let r=0;
    if(k==='name')r=a.name.localeCompare(b.name);
    else if(k==='size')r=(a.size||0)-(b.size||0);
    else if(k==='type')r=(a.ext||'').localeCompare(b.ext||'')||a.name.localeCompare(b.name);
    else if(k==='mod')r=(a.mod||0)-(b.mod||0);
    return r*S.sortDir;
  });
  return items;
}

/* ================= RENDER: RAIL ================= */
const RAIL=[
  {v:'overview',i:'gauge',t:'Overview'},
  {v:'library',i:'layers',t:'Local Library'},
  {v:'engine',i:'hex',t:'Engine Registry'},
  {v:'create',i:'plus',t:'Create Objects'},
];
function renderRail(){
  const rc=$('rail');
  rc.innerHTML=RAIL.map(b=>`<button class="rail-btn ${S.view===b.v?'on':''}" data-rail="${b.v}"><span class="i">${ic(b.i)}</span><span class="tip">${b.t}</span></button>`).join('')
   +`<span class="rail-sep"></span>`
   +`<button class="rail-btn" data-rail="session"><span class="i">${ic('bolt')}</span><span class="tip">Live Session</span>${S.session.length?`<span class="rail-badge">${S.session.length}</span>`:''}</button>`
   +`<span class="rail-sp"></span>`
   +`<button class="rail-btn" data-rail="settings"><span class="i">${ic('gear')}</span><span class="tip">Settings</span></button>`
   +`<button class="rail-btn" data-rail="about"><span class="i">${ic('info')}</span><span class="tip">About &amp; shortcuts</span></button>`;
}

/* ================= RENDER: CRUMBS / MOUNTS / PILLS ================= */
function renderCrumbs(){
  const el=$('crumbs');
  if(S.view==='overview'){el.innerHTML=`<button class="crumb cur">${ic('gauge')}<span>Overview</span></button>`;return}
  if(S.view==='create'){el.innerHTML=`<button class="crumb cur">${ic('plus')}<span>Create Objects</span></button>`;return}
  const root=currentRoot();
  let h=`<button class="crumb" data-nav="root">${ic(S.view==='engine'?'hex':'layers')}<span>${S.view==='engine'?'Engine':'Library'}</span></button>`;
  const node=currentNode();
  pathOf(node).forEach((p,idx,arr)=>{
    if(p===root)return;
    h+=`<span class="crumb-sep">›</span><button class="crumb ${idx===arr.length-1?'cur':''}" data-crumb="${p.id}">${p.kind==='folder'?ic('folderSm'):ic('fileSm')}<span>${esc(p.name)}</span></button>`;
  });
  el.innerHTML=h;
}
function renderMounts(){
  const m=$('mounts');
  const libI=countTree(LIB), engI=countTree(ENGINE);
  m.innerHTML=`
   <button class="mount ${S.view==='library'?'on':''}" data-nav-view="library"><span class="i">${ic('server')}</span>Local Library</button>
   <button class="mount ${S.view==='engine'?'on':''}" data-nav-view="engine"><span class="i">${ic('hex')}</span>Engine<span class="lock">${engI.f}</span></button>
   <button class="mount ${S.view==='create'?'on':''}" data-nav-view="create"><span class="i">${ic('spark')}</span>Create</button>`;
}
function renderFpills(){
  const wrap=$('fpills');
  if(S.view==='overview'||S.view==='create'){wrap.innerHTML='';return}
  const n=currentNode();const kids=(n&&n.children)||[];
  const counts={};kids.forEach(c=>{counts[c.cat]=(counts[c.cat]||0)+1});
  const order=['folder',...Object.keys(counts).filter(c=>c!=='folder')];
  wrap.innerHTML=[`<button class="fpill ${S.filter==='all'?'on':''}" data-f="all">All<span style="opacity:.55;font-family:var(--fm);font-size:9.5px">${kids.length}</span></button>`]
    .concat(order.filter(c=>c!=='folder').concat(kids.some(k=>k.kind==='folder')?['folder']:[]).map(c=>c==='folder'
      ?`<button class="fpill ${S.filter==='folder'?'on':''}" data-f="folder"><span class="dot" style="--fg:#B9C2CC"></span>Folders</button>`
      :`<button class="fpill ${S.filter===c?'on':''}" data-f="${c}"><span class="dot" style="--fg:${CAT(c).a}"></span>${CAT(c).label}</button>`)).join('');
}
function renderCount(){
  const items=currentItems();const files=items.filter(i=>i.kind==='file');
  const b=files.reduce((a,c)=>a+(c.size||0),0);
  $('countLbl').innerHTML=S.view==='overview'?'':S.view==='create'?`<b>${PRIMS.length}</b> object types`:`<b>${items.length}</b> items · ${fmtSize(b)}`;
}

/* ================= RENDER: CARDS ================= */
function cardHTML(it,i){
  const sel=S.sel.has(it.id),fav=S.favs.has(it.id);
  const sub=it.kind==='folder'
    ?`${it.children.length} item${it.children.length===1?'':'s'}`
    :`${it.ext?it.ext.toUpperCase():'FOLDER'} · ${fmtSize(it.size)}`;
  const thumb=THUMB_CATS.has(it.cat)&&it.kind==='file'
    ?`<img src="${thumbFor(it)}" alt="" loading="lazy">`
    :`<svg viewBox="0 0 96 96" class="ticon" xmlns="http://www.w3.org/2000/svg"></svg>`;
  if(S.layout==='list'){
    return `<div class="card ${sel?'sel':''}" data-id="${it.id}" style="animation-delay:${Math.min(i*22,300)}ms" tabindex="-1">
      <div class="thumb" data-ico="${it.id}"></div>
      <div class="c-l"><div class="c-name">${esc(it.name)}</div><div class="c-sub"><span class="kd" style="--kh:${CAT(it.kind==='folder'?'generic':it.cat).a}"></span>${sub}</div></div>
      <div class="c-x"><span class="kchip" style="--kh:${CAT(it.kind==='folder'?'generic':it.cat).a}">${it.kind==='folder'?'Folder':CAT(it.cat).label}</span>
        <span>${it.kind==='file'?fmtSize(it.size):'—'}</span><span>${fmtAgo(it.mod)}</span></div>
      <div class="acts">
        ${it.kind==='file'?`<button class="act-b" data-act="import" title="Import into live session"><span class="i">${ic('trayDown')}</span></button>`:''}
        <button class="act-b" data-act="look" title="Quick look (Space)"><span class="i">${ic('eye')}</span></button>
      </div>
      <button class="star ${fav?'on':''}" data-act="star" title="Favorite"><span class="i">${ic(fav?'starF':'star')}</span></button>
    </div>`;
  }
  return `<div class="card ${sel?'sel':''}" data-id="${it.id}" style="animation-delay:${Math.min(i*26,340)}ms" tabindex="-1">
    <button class="star ${fav?'on':''}" data-act="star" title="Favorite"><span class="i">${ic(fav?'starF':'star')}</span></button>
    <div class="acts">
      ${it.kind==='file'?`<button class="act-b" data-act="import" title="Import into live session"><span class="i">${ic('trayDown')}</span></button>`:''}
      <button class="act-b" data-act="look" title="Quick look (Space)"><span class="i">${ic('eye')}</span></button>
    </div>
    <div class="thumb" data-ico="${it.id}">${thumb}</div>
    <div class="c-name">${esc(it.name)}</div>
    <div class="c-sub"><span class="kd" style="--kh:${CAT(it.kind==='folder'?'generic':it.cat).a}"></span>${sub}</div>
  </div>`;
}
function hydrateIcons(scope){
  scope.querySelectorAll('.thumb[data-ico]').forEach(t=>{
    const it=byId(t.dataset.ico);if(!it)return;
    const card=t.closest('.card');if(card)card.setAttribute('draggable','true');
    if(t.querySelector('img,canvas'))return;
    if(THUMB_CATS.has(it.cat)&&it.kind==='file'){t.innerHTML=`<img src="${thumbFor(it,140)}" alt="">`}
    else t.innerHTML=iconForItem(it).replace('<svg','<svg class="ticon"');
  });
}
function renderViewport(){
  const host=$('gridAll');
  if(S.view==='overview'){host.innerHTML=overviewHTML();hydrateOverview();return}
  if(S.view==='create'){host.innerHTML=createHTML();hydrateCreate();return}
  const items=currentItems();
  if(!items.length){host.innerHTML=emptyHTML();hydrateIcons(host);return}
  const folders=items.filter(i=>i.kind==='folder'),files=items.filter(i=>i.kind==='file');
  let h='';
  if(folders.length)h+=`<div class="sec-h"><span>Folders</span><span class="ln"></span><span class="n">${folders.length}</span></div><div class="cards ${S.layout}" data-zone>${folders.map(cardHTML).join('')}</div>`;
  if(files.length)h+=`<div class="sec-h"><span>Assets</span><span class="ln"></span><span class="n">${files.length}</span></div><div class="cards ${S.layout}" data-zone>${files.map(cardHTML).join('')}</div>`;
  host.innerHTML=h;hydrateIcons(host);
}
function emptyHTML(){
  const q=S.q;
  return `<div class="empty">
    <div class="eico">${q?icTerminal():icFolder('generic')}</div>
    <h3>${q?`No matches for “${esc(q)}”`:'This folder is empty'}</h3>
    <p>${q?'Try a different term, or clear the active category filter — the filter bar sits under the path.':(S.view==='engine'?'This registry folder contains no entries.':'Drop files onto this window or use Import to stage real assets from disk.')}</p>
    ${q?'':`<button class="btn btn-ghost" data-act="empty-import" style="align-self:center"><span class="i">${ic('trayDown')}</span>Import files</button>`}
  </div>`;
}

/* ================= RENDER: OVERVIEW ================= */
function overviewHTML(){
  const lib=countTree(LIB),eng=countTree(ENGINE);
  const total=lib.f+eng.f;const bytes=lib.b;
  const foldN=walkDeep(LIB).filter(n=>n.kind==='folder').length;
  const cats={};ALL_LIBRARY.concat(ALL_ENGINE).forEach(n=>{if(n.kind==='file'){cats[n.cat]=cats[n.cat]||{n:0,b:0};cats[n.cat].n++;cats[n.cat].b+=n.size}});
  const top=Object.entries(cats).sort((a,b2)=>b2[1].b-a[1].b).slice(0,6);
  const maxB=top.length?top[0][1].b:1;
  const hr=new Date().getHours();const hello=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  return `<div class="ov">
  <div class="ov-hero">
    <div class="ov-ht">
      <div class="ov-hello"><span class="pulse"></span>${hello} · all systems nominal</div>
      <div class="ov-big" id="ovBig" data-n="${total}">0<small>&nbsp;assets indexed</small></div>
      <div class="ov-sub">${fmtSize(bytes)} across <b style="color:var(--tx2)">${foldN} library folders</b> and ${eng.f} engine registry entries — ready to stage.</div>
    </div>
    <div class="ov-bars">
      ${top.map(([c,v],i)=>`<div class="ov-bar" data-ovbar="${c}"><span class="bl">${CAT(c).label}</span><span class="tr"><span class="fl" style="--bh:${CAT(c).a}" data-w="${(v.b/maxB*100).toFixed(1)}"></span></span><span class="bv">${v.n} · ${fmtSize(v.b)}</span></div>`).join('')}
    </div>
  </div>
  <div class="ov-stats">
    <div class="stat" style="--shue:var(--acc)"><span class="sk"><span class="i">${ic('bolt')}</span>Session nodes</span><span class="sv" id="ovSess">${S.session.length}</span><span class="sd">${S.deploys} deploy${S.deploys===1?'':'s'} this run</span></div>
    <div class="stat" style="--shue:var(--amber)"><span class="sk"><span class="i">${ic('star')}</span>Favorites</span><span class="sv">${S.favs.size}</span><span class="sd">starred assets</span></div>
    <div class="stat" style="--shue:var(--cyan)"><span class="sk"><span class="i">${ic('server')}</span>Library volume</span><span class="sv">${fmtSize(lib.b)}</span><span class="sd">local mount</span></div>
    <div class="stat" style="--shue:var(--violet)"><span class="sk"><span class="i">${ic('hex')}</span>Engine registry</span><span class="sv">${eng.f}<em> entries</em></span><span class="sd">read-only · synced</span></div>
  </div>
  <div class="ov-row">
    <div class="ov-card">
      <div class="ov-card-h"><span class="i">${ic('spark')}</span><h4>Quick create</h4><span class="sp"></span><button class="mini" data-nav-view="create">All objects ${ic('arrowR')}</button></div>
      <div class="qcreate">${PRIMS.slice(0,8).map(p=>`<button class="qc" data-prim="${p.n}" title="Spawn ${p.n} into live session">${primIcon(p.n)}<span>${p.n}</span></button>`).join('')}</div>
    </div>
    <div class="ov-card">
      <div class="ov-card-h"><span class="i">${ic('history')}</span><h4>Recent activity</h4><span class="sp"></span><button class="mini" data-act="clear-recents">Clear</button></div>
      <div class="recents" id="ovRecents">${recentsHTML()}</div>
    </div>
  </div></div>`;
}
function recentsHTML(){
  if(!S.recents.length)return `<div style="color:var(--tx3);font-size:11.5px;padding:8px 4px">Nothing yet — spawn a primitive, open a folder, or import an asset and it will land here.</div>`;
  return S.recents.slice(0,6).map(rc=>{
    return `<div class="rec" data-rec="${rc.key}">
      <span class="ric">${rc.icon}</span>
      <span class="rn">${esc(rc.name)}<small>${rc.verb} · ${rc.where}</small></span>
      <span class="rt">${fmtAgo(rc.days)}</span>
    </div>`}).join('');
}
function hydrateOverview(){
  const big=$('ovBig');if(!big)return;
  const n=+big.dataset.n;const t0=performance.now();
  (function tick(t){const p=Math.min(1,(t-t0)/900);const e=1-Math.pow(1-p,3);
    big.innerHTML=Math.round(n*e).toLocaleString()+'<small>&nbsp;assets indexed</small>';
    if(p<1)requestAnimationFrame(tick)})(t0);
  requestAnimationFrame(()=>document.querySelectorAll('.ov-bar .fl').forEach(f=>f.style.width=f.dataset.w+'%'));
}
</script>
<script>
/* ================= RENDER: CREATE VIEW ================= */
function createHTML(){
  return `<div class="ov">
  <div class="ov-hero" style="flex-direction:column;align-items:flex-start;gap:6px">

  <div class="ov-card" style="flex-direction:row;align-items:center;gap:14px">
    <span class="i" style="width:34px;height:34px;color:var(--acc)">${ic('bolt')}</span>
    <div style="flex:1"><b style="font-size:13px">Spawned objects stream into the Live Session.</b><div style="color:var(--tx3);font-size:11.5px;margin-top:2px">They appear on the session line with a transfer ring, then go live. Deploy when your scene is staged.</div></div>
    <button class="btn btn-ghost" data-act="create-random"><span class="i">${ic('refresh')}</span>Surprise me</button>
  </div></div>`;
}
function hydrateCreate(){}

/* ================= RENDER: INSPECTOR ================= */
function renderInspector(){
  const wrap=$('inspector'), empty=$('inspEmpty'), body=$('inspBody');
  if(!S.insp){wrap.classList.add('hide')}else wrap.classList.remove('hide');
  const items=[...S.sel].map(byId).filter(Boolean);
  if(!items.length){
    empty.style.display='';body.style.display='none';
    empty.innerHTML=`<div class="eico">${icTerminal()}</div><h4 style="font-family:var(--fd)">Nothing selected</h4><p>Select any asset to inspect it. Double-click a file to stage it into the live session.</p>`;
    return;
  }
  empty.style.display='none';body.style.display='';
  if(items.length>1){
    body.innerHTML=`<div class="insp">
      <div class="insp-prev"><span class="picon" style="width:46%;height:46%">${icFolder('generic')}</span><span class="ptype kchip" style="--kh:var(--acc)">Multi</span></div>
      <div class="insp-h"><h3>${items.length} assets selected</h3><div class="path">${fmtSize(items.reduce((a,c)=>a+(c.size||0),0))} combined</div></div>
      <div class="insp-acts">
        <button class="btn btn-acc" data-ia="import-multi"><span class="i">${ic('trayDown')}</span>Import all</button>
        <button class="ibtn" data-ia="star-multi" title="Favorite all"><span class="i">${ic('star')}</span></button>
        <button class="ibtn" data-ia="del-multi" title="Delete"><span class="i">${ic('trash')}</span></button>
      </div></div>`;
    return;
  }
  const it=items[0];
  const isFav=S.favs.has(it.id);
  const inSession=S.session.some(s2=>s2.fromId===it.id);
  const painter=(it.kind==='file'&&thumbPainters[it.cat])?it.cat:null;
  const prev=it.objURL?`<img src="${it.objURL}">`
    :painter?`<img src="${thumbFor(it,320)}">`
    :`<span class="picon">${iconForItem(it)}</span>`;
  const rows=[];
  const kv=(k,icn,v)=>rows.push(`<div class="row"><span class="k"><span class="i">${ic(icn)}</span>${k}</span><span class="v">${esc(v)}</span></div>`);
  kv('Type','fileSm',it.kind==='folder'?'Folder · '+CAT(it.cat).label:CAT(it.cat).label+' · '+(it.ext||'').toUpperCase());
  if(it.kind==='file')kv('Size','server',fmtSize(it.size));
  if(it.kind==='folder')kv('Contains','folderSm',it.children.length+' items · '+fmtSize(countTree(it).b));
  if(it.res)kv('Resolution','grid',it.res);
  if(it.tris)kv('Triangles','cubeSm',it.tris.toLocaleString()+(it.verts?' · '+it.verts.toLocaleString()+' verts':''));
  if(it.dur)kv('Duration','clock',it.dur);
  if(it.fmt)kv('Format','info',it.fmt);
  if(it.glyphs)kv('Glyphs','tag',it.glyphs.toLocaleString());
  if(it.objects)kv('Objects','layers',String(it.objects));
  if(it.contains)kv('Entries','package',String(it.contains));
  kv('Modified','history',fmtAgo(it.mod));
  kv('Source',S.view==='engine'||it.src==='engine'?'hex':'server',it.src==='engine'?'Engine registry · read-only':'Local library');
  const path=(it.src==='engine'?'engine:/':'library:/')+pathOf(it).map(p=>p.name).join('/');
  const tags=it.tags.length?it.tags:defaultTags(it);
  body.innerHTML=`<div class="insp">
    <div class="insp-prev">${prev}<span class="ptype kchip" style="--kh:${CAT(it.kind==='folder'?'generic':it.cat).a}">${it.kind==='folder'?'Folder':(it.ext||'').toUpperCase()}</span></div>
    <div class="insp-h"><h3>${esc(it.name)}</h3><div class="path">${esc(path)}</div></div>
    <div class="insp-acts">
      ${it.kind==='file'
        ?`<button class="btn ${inSession?'btn-ghost':'btn-acc'}" data-ia="import"><span class="i">${ic(inSession?'check':'trayDown')}</span>${inSession?'Live in session':'Import to session'}</button>`
        :`<button class="btn btn-acc" data-ia="open"><span class="i">${ic('folderSm')}</span>Open folder</button>`}
      <button class="ibtn" data-ia="look" title="Quick look"><span class="i">${ic('eye')}</span></button>
      <button class="ibtn ${isFav?'on':''}" data-ia="star" title="Favorite" style="${isFav?'color:var(--amber)':''}"><span class="i">${ic(isFav?'starF':'star')}</span></button>
      <button class="ibtn" data-ia="rename" title="Rename (F2)"><span class="i">${ic('pencil')}</span></button>
    </div>
    <div class="insp-sec">Details</div>
    <div class="kv">${rows.join('')}</div>
    <div class="insp-sec">Tags</div>
    <div class="tags">${tags.map(t=>`<span class="tag"><span class="i">${ic('tag')}</span>${esc(t)}</span>`).join('')}<button class="tag" data-ia="addtag" style="cursor:pointer">+ add</button></div>
  </div>`;
}
function defaultTags(it){
  const r=rng(it.name+'tags');
  const pool={mesh:['game-ready','rigged','pbr','hero','kit'],cad:['machined','rev-a','tolerance','housing'],image:['seamless','4k','tiling','mask'],hdri:['night','urban','studio'],material:['procedural','metallic','clearcoat'],font:['display','ui','mono'],audio:['loop','one-shot','sfx'],video:['reference','turntable'],scene:['blockout','final'],script:['tooling','pipeline'],prefab:['kitbash','modular'],archive:['legacy','backup'],data:['config'],text:['docs']};
  const arr=pool[it.cat]||['asset'];
  return [arr[Math.floor(r()*arr.length)],arr[Math.floor(r()*arr.length)]].filter((v,i,a2)=>a2.indexOf(v)===i).slice(0,2);
}

/* ================= RENDER: DOCK ================= */
function renderDock(){
  const rail=$('dockRail');
  const items=S.session;
  let h='';
  items.forEach((s2,i)=>{
    const icon=s2.thumb?`<img src="${s2.thumb}">`:s2.icon;
    h+=`<div class="node ${s2.state==='imp'?'imp':'live'}" data-node="${s2.id}">
      <span class="linkw"></span><span class="dot"></span>
      <div class="chip" title="${esc(s2.name)}">
        ${s2.state==='imp'
          ?`<span class="ring" style="--p:${s2.prog}"><span>${Math.round(s2.prog*100)}</span></span>`
          :`<span class="cico">${icon}</span>`}
        <span class="cn"><span class="t">${esc(s2.name)}</span><span class="s">${s2.state==='imp'?'streaming…':s2.meta}</span></span>
        <button class="cx" data-sx="${s2.id}" title="Remove from session"><span class="i">${ic('x')}</span></button>
      </div>
    </div>`;
  });
  h+=`<div class="dock-ghost" id="dockGhost">${items.length?'':'Drop assets here — or double-click any file&nbsp;·&nbsp;'}<span class="i" style="width:13px;height:13px">${ic('trayDown')}</span>${items.length?'Drop to add more':''}</div>`;
  rail.innerHTML=h;
  rail.scrollLeft=rail.scrollWidth;
  const live=items.filter(s2=>s2.state==='live').length;
  const bytes=items.reduce((a,c)=>a+(c.size||0),0);
  $('dockStat').innerHTML=`<b>${items.length}</b> node${items.length===1?'':'s'} · <b>${fmtSize(bytes)}</b> · ${live} live`;
  $('btnDeploy').disabled=!items.length;
  $('btnClearSession').disabled=!items.length;
}
function renderBulk(){
  const b=$('bulkbar');const n=S.sel.size;
  if(S.view==='overview'||S.view==='create'||!n){b.classList.remove('on');return}
  b.innerHTML=`<span class="n"><b>${n}</b> selected</span>
    <button class="bb prime" data-bb="import"><span class="i">${ic('trayDown')}</span>Import</button>
    <button class="bb" data-bb="star"><span class="i">${ic('star')}</span>Star</button>
    <button class="bb danger" data-bb="del"><span class="i">${ic('trash')}</span>Delete</button>
    <button class="bb" data-bb="clear"><span class="i">${ic('x')}</span></button>`;
  b.classList.add('on');
}
function refreshSubChrome(){
  const browse=S.view==='library'||S.view==='engine';
  ['countLbl','btnNewFolder','btnSort','viewSeg'].forEach(id=>{$(id).style.display=browse?'':(id==='countLbl'?'':'none')});
  document.querySelector('.zoom').style.display=browse?'':'none';
  $('viewSeg').style.display=browse?'':'none';
  $('btnNewFolder').style.display=(browse&&S.view!=='engine')?'':'none';
  $('btnUp').disabled=!S.path.length;
  $('fpills').style.display=browse?'':'none';
}
function renderAll(keepScroll){
  const vp=$('viewport');const sc=vp.scrollTop;
  renderRail();renderCrumbs();renderMounts();renderFpills();renderCount();
  renderViewport();renderInspector();renderDock();renderBulk();refreshSubChrome();
  document.querySelectorAll('#viewSeg .seg-btn').forEach(b=>b.classList.toggle('on',b.dataset.view===S.layout));
  if(keepScroll)vp.scrollTop=sc;
}
</script>
<script>
/* ================= TOASTS ================= */
function toast(type,title,sub){
  const t=document.createElement('div');t.className='toast'+(type==='warn'?' warn':type==='err'?' err':'');
  t.innerHTML=`<span class="tic"><span class="i">${ic(type==='err'?'x':type==='warn'?'info':'check')}</span></span><span>${esc(title)}${sub?`<small>${esc(sub)}</small>`:''}</span>`;
  $('toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},3400);
}

/* ================= RECENTS ================= */
function addRecent(key,name,verb,where,icon,days=0){
  S.recents.unshift({key,name,verb,where,icon,days});
  S.recents=S.recents.filter((r,i,a)=>a.findIndex(x=>x.key===r.key&&x.verb===r.verb)===i).slice(0,8);
  const hr=$('ovRecents');if(S.view==='overview'&&hr)hr.innerHTML=recentsHTML();
}

/* ================= NAV ================= */
function setView(v){
  S.view=v;S.path=[];S.filter='all';S.q='';S.sel.clear();S.anchorId=null;
  $('searchInput').value='';renderAll();
  const vp=$('viewport');vp.scrollTop=0;
}
function cdTo(nodeOrId){
  const node=typeof nodeOrId==='string'?byId(nodeOrId):nodeOrId;if(!node||node.kind!=='folder')return;
  S.path=pathOf(node).map(n2=>n2.id);S.sel.clear();S.anchorId=null;S.filter='all';
  addRecent(node.id,node.name,'Opened',(node.src==='engine'?'Engine':'Library'),iconForItem(node).replace('<svg','<svg style="width:26px;height:26px"'));
  renderAll();
}
function upLevel(){if(!S.path.length)return;S.path.pop();S.sel.clear();renderAll()}

/* ================= SELECTION ================= */
function applySel(){document.querySelectorAll('.card[data-id]').forEach(c=>c.classList.toggle('sel',S.sel.has(c.dataset.id)));renderInspector();renderBulk()}
function selectOnly(id){S.sel.clear();S.sel.add(id);S.anchorId=id;applySel()}
function toggleSel(id){S.sel.has(id)?S.sel.delete(id):S.sel.add(id);S.anchorId=id;applySel()}
function rangeSel(id){
  const items=currentItems();const a=items.findIndex(i=>i.id===S.anchorId),b=items.findIndex(i=>i.id===id);
  if(a<0||b<0){selectOnly(id);return}
  S.sel.clear();const [s,e]=a<b?[a,b]:[b,a];for(let i=s;i<=e;i++)S.sel.add(items[i].id);applySel();
}
function selItems(){return [...S.sel].map(byId).filter(Boolean)}

/* ================= LIVE SESSION ENGINE ================= */
function sessionHas(fromId){return S.session.some(x=>x.fromId===fromId)}
function streamTick(s){
  if(s.state!=='imp')return;
  s.prog=Math.min(1,s.prog+.02+Math.random()*.05);
  const node=document.querySelector(`[data-node="${s.id}"]`);
  if(node){const ring=node.querySelector('.ring');if(ring){ring.style.setProperty('--p',s.prog);const lb=ring.querySelector('span');if(lb)lb.textContent=Math.round(s.prog*100)}}
  if(s.prog>=1){
    s.state='live';renderDock();renderRail();renderInspector();
    toast('ok',s.name+' is live',s.kind==='prim'?'Object streamed into the session':'Asset streamed into the session');
  } else requestAnimationFrame(()=>streamTick(s));
}
function stageSession(entry,delay=0){
  entry.id='s'+(++__nid);entry.state='imp';entry.prog=0;
  S.session.push(entry);renderDock();renderRail();
  setTimeout(()=>requestAnimationFrame(()=>streamTick(entry)),delay);
}
function importToSession(items){
  const files=items.filter(i=>i.kind==='file');
  if(items.some(i=>i.kind==='folder'))toast('warn','Folders are mounted, not streamed','Open the folder and import the files inside');
  let staged=0;
  files.forEach((it,i)=>{
    if(sessionHas(it.id))return;
    const thumb=it.objURL?it.objURL:(THUMB_CATS.has(it.cat)||thumbPainters[it.cat]?thumbFor(it,72):null);
    stageSession({fromId:it.id,kind:'file',cat:it.cat,name:it.name,ext:it.ext,size:it.size,
      thumb,icon:thumb?'':iconForItem(it),meta:`${(it.ext||'').toUpperCase()} · ${fmtSize(it.size)}`},i*140);
    staged++;
  });
  if(!staged){if(files.length)toast('warn','Already live','Every selected asset is already in the session');return}
  const first=files[0];
  addRecent(first.id,first.name,'Imported','Live session',first.objURL?`<img src="${first.objURL}" style="width:26px;height:26px;object-fit:cover;border-radius:6px">`:iconForItem(first).replace('<svg','<svg style="width:26px;height:26px"'));
  toast('ok',staged===1?'Streaming “'+first.name+'”':'Streaming '+staged+' assets','Watch the session line below');
}
function removeSession(id){S.session=S.session.filter(x=>x.id!==id);renderDock();renderRail();renderInspector()}
function clearSession(){if(!S.session.length)return;S.session=[];renderDock();renderRail();renderInspector();toast('ok','Session cleared','All nodes unmounted')}
function deploySession(){
  const live=S.session.filter(x=>x.state==='live');
  if(!S.session.length)return;
  const btn=$('btnDeploy');btn.disabled=true;btn.innerHTML=`<span class="i">${ic('refresh')}</span>Deploying…`;
  document.querySelectorAll('#dockRail .chip').forEach((c,i)=>setTimeout(()=>c.classList.add('deployed'),i*70));
  setTimeout(()=>{
    S.deploys++;
    btn.innerHTML=`<span class="i">${ic('bolt')}</span>Deploy`;
    btn.disabled=false;
    document.querySelectorAll('#dockRail .chip').forEach(c=>c.classList.remove('deployed'));
    toast('ok','Session snapshot deployed',S.session.length+' node'+(S.session.length===1?'':'s')+' committed to the runtime');
    addRecent('deploy'+Date.now(),'Session deploy #'+S.deploys,'Deployed','runtime',ic('bolt','width:26px;height:26px;color:var(--acc)'));
    renderDock();
  },600+S.session.length*80);
}
/* ================= CREATE ================= */
function createPrim(name){
  const p=PRIMS.find(x=>x.n===name);if(!p)return;
  const dupes=S.session.filter(x=>x.kind==='prim'&&x.base===name).length;
  const label=dupes?`${name} ${dupes+1}`:name;
  stageSession({kind:'prim',base:name,name:label,cat:'mesh',ext:'obj',size:80*KB+Math.floor(rng(name+dupes)()*2.4*MB),
    icon:primIcon(name),meta:`primitive · ${p.tris} tris`});
  addRecent('prim:'+label,name,'Created','Primitive spawner',primIcon(name).replace('<svg','<svg style="width:26px;height:26px"'));
}

/* ================= ITEM OPS ================= */
function deleteItems(items){
  const locked=items.filter(i=>i.src==='engine');
  if(locked.length){toast('err','Engine registry is read-only','Only local library items can be deleted');return}
  items.forEach(it=>{
    const p=it.parent;if(!p)return;
    p.children=p.children.filter(c=>c!==it);
    S.session=S.session.filter(x=>x.fromId!==it.id);
    S.sel.delete(it.id);S.favs.delete(it.id);
  });
  renderAll();toast('ok','Deleted '+items.length+' item'+(items.length===1?'':'s'),'Removed from the local library');
}
function duplicateItem(it){
  if(!it.parent||it.src==='engine')return;
  const base=it.name.replace(/(\.[^.]+)?$/,m=>m);
  const ext=it.kind==='file'?'.'+it.ext:'';
  const stem=it.kind==='file'?it.name.slice(0,it.name.length-ext.length):it.name;
  const names=new Set(it.parent.children.map(c=>c.name));
  let n=2,cand=`${stem} copy${ext}`;
  while(names.has(cand)){cand=`${stem} copy ${n++}${ext}`}
  const cp={...it,id:nid(),name:cand,mod:0};
  if(it.kind==='folder'){cp.children=[];toast('warn','Folder copied empty','Deep-copy is not part of this prototype')}
  it.parent.children.push(cp);
  renderAll();selectOnly(cp.id);
  toast('ok','Duplicated as “'+cand+'”');
}
function startRename(it){
  const card=document.querySelector(`.card[data-id="${it.id}"]`);if(!card)return;
  const nameEl=card.querySelector('.c-name');if(!nameEl)return;
  const ext=it.kind==='file'?'.'+it.ext:'';
  const stem=it.kind==='file'?it.name.slice(0,it.name.length-ext.length):it.name;
  const inp=document.createElement('input');
  inp.className='rn-input';inp.value=stem;inp.spellcheck=false;
  nameEl.replaceWith(inp);inp.focus();inp.select();
  inp.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Enter')inp.blur();
    if(e.key==='Escape'){inp.value=stem;inp.blur()}
  });
  inp.addEventListener('click',e=>e.stopPropagation());
  inp.addEventListener('blur',()=>{
    const v=inp.value.trim();
    if(v&&v!==stem){
      if(it.parent&&it.parent.children.some(c=>c!==it&&c.name===v+ext)){toast('err','Name already in use');renderAll();return}
      it.name=v+ext;it.mod=0;
      toast('ok','Renamed to “'+it.name+'”');
    }
    renderAll();const nid2=it.id;setTimeout(()=>selectOnly(nid2),0);
  },{once:true});
}
function newFolder(){
  const root=currentNode();
  if(!root||S.view==='engine'){toast('err','Read-only volume','Folders can only be created in the local library');return}
  const names=new Set(root.children.map(c=>c.name));
  let nm='New Folder',i=2;while(names.has(nm))nm='New Folder '+(i++);
  const f=F(nm,'generic',[]);f.parent=root;root.children.unshift(f);
  renderAll();selectOnly(f.id);setTimeout(()=>startRename(f),60);
}
function addTag(it){
  const t=prompt('Add tag to '+it.name+':');if(!t)return;
  it.tags=[...new Set([...it.tags,t.toLowerCase()])].slice(0,6);renderInspector();
}

/* ================= DISK IMPORT (real files) ================= */
function ingestFiles(fileList,target='folder'){
  const files=[...fileList];if(!files.length)return;
  let dest=currentNode();
  if(S.view!=='library'||!dest||dest.src==='engine'){
    dest=LIB.children.find(c=>c.name==='Imported');
    if(!dest){dest=F('Imported','generic',[]);dest.parent=LIB;LIB.children.unshift(dest)}
  }
  let routed=0;
  files.forEach((f,i)=>{
    const cat=catOf(f.name);
    const it={id:nid(),kind:'file',name:f.name,ext:extOf(f.name),cat,size:f.size||1024,mod:0,tags:['ingested'],src:'library',parent:dest,
      ...meta(f.name,cat,rng(f.name)),fmt:'Ingested · '+(f.type||'binary stream')};
    if((cat==='image'||cat==='hdri')&&/^image\//.test(f.type))it.objURL=URL.createObjectURL(f);
    dest.children.push(it);
    routed++;
    if(target==='session'){importToSession([it])}
  });
  if(target==='folder'){
    if(S.view!=='library'){S.view='library';S.path=pathOf(dest).map(n2=>n2.id)}
    renderAll();
    toast('ok','Ingested '+routed+' file'+(routed===1?'':'s'),'Added to '+(dest.name==='Local Library'?'library root':dest.name));
    addRecent(dest.id,dest.name,'Ingested '+routed+' files','Local library',icFolder('generic').replace('<svg','<svg style="width:26px;height:26px"'));
  }
  closeDZ();
}

function showCtx(x,y,items){
  const c=$('ctx');
  c.innerHTML=items.map(m=>m==='-'?'<div class="ctx-sep"></div>'
    :`<button class="ctx-it ${m.danger?'danger':''}" data-ci="${m.k}"><span class="i">${ic(m.icon)}</span>${m.label}${m.kb?`<span class="kb">${m.kb}</span>`:''}</button>`).join('');
  c.classList.add('on');
  const w=c.offsetWidth,h=c.offsetHeight;
  c.style.left=Math.min(x,innerWidth-w-10)+'px';c.style.top=Math.min(y,innerHeight-h-10)+'px';
  c.querySelectorAll('.ctx-it').forEach(b=>on(b,'click',()=>{const k=b.dataset.ci;closeOverlays();const m=items.find(m2=>m2!=='-'&&m2.k===k);m&&m.fn&&m.fn()}));
