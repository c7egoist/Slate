function ctxForItem(it,e){
  selectOnly(it.id);
  const isEng=it.src==='engine';
  const items=[];
  if(it.kind==='folder')items.push({k:'open',icon:'folderSm',label:'Open folder',kb:'↵',fn:()=>cdTo(it)});
  if(it.kind==='file')items.push({k:'import',icon:'trayDown',label:'Import to session',kb:'dbl-click',fn:()=>importToSession([it])});
  items.push({k:'look',icon:'eye',label:'Quick look',kb:'Space',fn:()=>quicklook(it)});
  items.push({k:'star',icon:S.favs.has(it.id)?'starF':'star',label:S.favs.has(it.id)?'Unstar':'Star',fn:()=>{toggleFav(it.id)}});
  items.push('-');
  items.push({k:'rename',icon:'pencil',label:'Rename',kb:'F2',fn:()=>startRename(it)});
  items.push({k:'dup',icon:'copy',label:'Duplicate',fn:()=>duplicateItem(it)});
  items.push({k:'cpath',icon:'link',label:'Copy asset path',fn:()=>{const p=(it.src==='engine'?'engine:/':'library:/')+pathOf(it).map(p2=>p2.name).join('/');(navigator.clipboard?navigator.clipboard.writeText(p):Promise.reject()).then(()=>toast('ok','Path copied',p)).catch(()=>toast('warn','Clipboard blocked',p))}});
  items.push('-');
  items.push({k:'del',icon:'trash',label:isEng?'Delete (locked)':'Delete',kb:'Del',danger:true,fn:()=>deleteItems([it])});
  showCtx(e.clientX,e.clientY,items);
}
function ctxBackground(e){
  const items=[];
  if(S.view==='library')items.push({k:'nf',icon:'folderPlus',label:'New folder',kb:'⇧N',fn:newFolder});
  if(S.view==='library')items.push({k:'imp',icon:'trayDown',label:'Import files…',fn:()=>$('fileInput').click()});
  items.push({k:'sa',icon:'check',label:'Select all',kb:'⌘A',fn:()=>{currentItems().forEach(i2=>S.sel.add(i2.id));applySel()}});
  items.push('-');
  items.push({k:'gv',icon:S.layout==='grid'?'list':'grid',label:S.layout==='grid'?'Switch to list':'Switch to grid',fn:()=>setLayout(S.layout==='grid'?'list':'grid')});
  showCtx(e.clientX,e.clientY,items);
}

/* ================= QUICKLOOK ================= */
function quicklook(it){
  const painter=it.kind==='file'&&thumbPainters[it.cat];
  const prev=it.objURL?`<img src="${it.objURL}">`:painter?`<img src="${thumbFor(it,344)}">`:iconForItem(it);
  const inSes=it.kind==='file'&&sessionHas(it.id);
  $('qlCard').innerHTML=`
    <div class="ql-prev">${prev}</div>
    <div><div class="ql-name">${esc(it.name)}</div>
    <div class="ql-sub"><span>${it.kind==='folder'?'FOLDER':(it.ext||'').toUpperCase()}</span>${it.kind==='file'?`<span>${fmtSize(it.size)}</span>`:''}<span>${fmtAgo(it.mod)}</span><span>${CAT(it.kind==='folder'?'generic':it.cat).label}</span></div></div>
    <div style="display:flex;gap:8px">
      ${it.kind==='file'
        ?`<button class="btn ${inSes?'btn-ghost':'btn-acc'}" data-ql="import" style="flex:1;justify-content:center"><span class="i">${ic(inSes?'check':'trayDown')}</span>${inSes?'Live in session':'Import to session'}</button>`
        :`<button class="btn btn-acc" data-ql="open" style="flex:1;justify-content:center"><span class="i">${ic('folderSm')}</span>Open</button>`}
      <button class="btn btn-ghost" data-ql="close"><span class="i">${ic('x')}</span></button>
    </div>`;
  $('qlCard').querySelectorAll('[data-ql]').forEach(b=>on(b,'click',()=>{
    const a=b.dataset.ql;
    if(a==='import'){importToSession([it]);closeOverlays()}
    if(a==='open'){closeOverlays();cdTo(it)}
    if(a==='close')closeOverlays();
  }));
  openOverlay('quicklook');
}

    <div class="mo-row"><div class="mr-t">Theme<small>Harbor dark or Orion light</small></div>

        <button class="seg-btn ${document.documentElement.dataset.theme==='light'?'on':''}" data-th="light" title="Light" style="width:34px"><span class="i">${ic('sun')}</span></button>
      </div></div>
    <div class="mo-row"><div class="mr-t">Accent signal<small>Category systems keep their own hues</small></div>
      <div class="swatches">${['lime','cyan','violet','amber'].map(a=>`<span class="sw ${cur===a?'on':''}" data-acc="${a}" style="background:${{lime:'linear-gradient(135deg,#C8F751,#7BE2A8)',cyan:'linear-gradient(135deg,#5EE9D5,#7AC3FF)',violet:'linear-gradient(135deg,#B79CFF,#FF7AB8)',amber:'linear-gradient(135deg,#FFC46B,#FF8F7A)'}[a]}"></span>`).join('')}</div></div>
    <div class="mo-row"><div class="mr-t">Motion<small>Entrance choreography &amp; springs</small></div><button class="tgl ${document.body.classList.contains('no-anim')?'':'on'}" data-tgl="anim"></button></div>

  if(rs)on(rs,'click',()=>{S.session=[];S.favs.clear();S.recents=[];S.deploys=0;closeOverlays();renderAll();toast('ok','Run state reset')});

function aboutModal(){
  const kbd=(a,b)=>`<div style="display:flex;justify-content:space-between;gap:16px;padding:6px 2px;border-bottom:1px dashed var(--line);font-size:11.5px"><span style="color:var(--tx2)">${a}</span><b style="font-family:var(--fm);font-weight:600;font-size:10px;color:var(--tx);background:var(--card3);border:1px solid var(--line);padding:2px 7px;border-radius:6px;white-space:nowrap">${b}</b></div>`;

    <div style="font-size:12px;color:var(--tx2);margin-bottom:12px">Every icon on this screen — glass folders, keycap plates, blueprint CAD sheets, shaded primitives — is drawn procedurally as SVG at runtime. No icon fonts, no images.</div>

    ${kbd('Navigate grid','← ↑ ↓ →')}${kbd('Select all','⌘ A')}${kbd('Rename','F2')}${kbd('Delete','Del')}${kbd('Toggle theme','T')}${kbd('Inspector','I')}${kbd('Grid / list','G / L')}
    <div style="font-size:10px;color:var(--tx4);margin-top:12px">Design refs: Harbor · Orion · Transit — icon refs: keycap, camera, terminal, glass folder systems.</div>`;

/* ================= COMMAND PALETTE ================= */
let palIdx=0,palItems=[];
function palCommands(q){
  const cmds=[];
  const add=(icon,title,sub,fn)=>cmds.push({icon,title,sub,fn,sec:'Commands'});
  if('import files from disk'.includes(q)||q.length<2)add('trayDown','Import files from disk','Pick any files — routed into the library',()=>$('fileInput').click());
  if('import folder from disk'.includes(q)||q.length<2)add('server','Import folder from disk','Recursively ingest a directory',()=>$('dirInput').click());
  if('new folder'.includes(q))add('folderPlus','New folder','In current library folder',newFolder);
  if('deploy session'.includes(q)||'deploy'.includes(q)&&q.length<3)add('bolt','Deploy session','Commit live nodes to the runtime',deploySession);
  if('clear session'.includes(q))add('trash','Clear session','Unmount every node',clearSession);
  if('theme'.includes(q))add('moon','Toggle theme','Dark ↔ light',()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light'));
  if('overview'.includes(q)||q==='go')add('gauge','Go to Overview','',()=>setView('overview'));
  if('library'.includes(q)||q==='go')add('layers','Go to Local Library','',()=>setView('library'));
  if('engine'.includes(q)||q==='go')add('hex','Go to Engine Registry','',()=>setView('engine'));
  if('create'.includes(q)||q==='go')add('plus','Go to Create','',()=>setView('create'));
  PRIMS.forEach(p=>{
    const key=('create '+p.n).toLowerCase();
    if(key.includes(q)||p.n.toLowerCase().startsWith(q)||q.length<2)
      add('plus','Create '+p.n,p.d+' · spawns live',()=>{createPrim(p.n)});
  });
  return cmds;
}
function palAssets(q){
  if(q.length<2)return[];
  const all=ALL_LIBRARY.concat(ALL_ENGINE).filter(n2=>n2.name.toLowerCase().includes(q));
  all.sort((a,b)=>{const sa=a.name.toLowerCase().startsWith(q)?0:1,sb=b.name.toLowerCase().startsWith(q)?0:1;return sa-sb||a.name.localeCompare(b.name)});
  return all.slice(0,9).map(n2=>({icon:null,item:true,title:n2.name,sub:(n2.src==='engine'?'engine:/':'library:/')+pathOf(n2).map(p=>p.name).join('/'),
    svg:n2.kind==='folder'?icFolder(n2.cat):iconForItem(n2),
    fn:()=>{
      if(n2.src==='engine'){S.view='engine'}else S.view='library';
      const par=n2.kind==='folder'?n2:n2.parent;
      S.path=par?pathOf(par).map(x=>x.id):[];
      S.filter='all';renderAll();
      requestAnimationFrame(()=>{selectOnly(n2.id);const el=document.querySelector(`.card[data-id="${n2.id}"]`);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('focus');setTimeout(()=>el.classList.remove('focus'),1400)}});
    }}));
}
function renderPal(){
  const q=$('palInput').value.trim().toLowerCase();
  const cmds=palCommands(q),assets=palAssets(q);
  palItems=[...cmds,...assets];palIdx=0;
  const L=$('palList');
  if(!palItems.length){L.innerHTML=`<div class="pal-none">No commands or assets match “${esc(q)}”.</div>`;return}
  let h='',lastSec='';
  palItems.forEach((p,i)=>{
    const sec=p.sec||'Assets';
    if(sec!==lastSec){h+=`<div class="pal-sec">${sec}</div>`;lastSec=sec}
    h+=`<div class="pal-it ${i===palIdx?'sel':''}" data-pi="${i}">
      <span class="pic ${p.item?'':'lm'}">${p.item?p.svg:ic(p.icon)}</span>
      <span class="pt">${esc(p.title)}<small>${esc(p.sub||'')}</small></span>${p.item?'<span class="ph">↵ open</span>':''}
    </div>`;
  });
  L.innerHTML=h;
  L.querySelectorAll('.pal-it').forEach(el=>{
    on(el,'click',()=>{const p=palItems[+el.dataset.pi];closeOverlays();p&&p.fn()});
    on(el,'mousemove',()=>{if(+el.dataset.pi!==palIdx){palIdx=+el.dataset.pi;L.querySelectorAll('.pal-it').forEach(e2=>e2.classList.toggle('sel',+e2.dataset.pi===palIdx))}});
  });
}
function openPalette(){renderPal();$('palInput').value='';openOverlay('palette');setTimeout(()=>$('palInput').focus(),30)}
on($('palInput'),'input',renderPal);
on($('palInput'),'keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();palIdx=(palIdx+(e.key==='ArrowDown'?1:-1)+palItems.length)%palItems.length;
    $('palList').querySelectorAll('.pal-it').forEach(el=>el.classList.toggle('sel',+el.dataset.pi===palIdx));
    const selEl=$('palList').querySelector('.pal-it.sel');selEl&&selEl.scrollIntoView({block:'nearest'})}
  if(e.key==='Enter'){const p=palItems[palIdx];closeOverlays();p&&p.fn()}
});

/* ================= THEME / LAYOUT ================= */
function setTheme(t){document.documentElement.dataset.theme=t;store.set('theme',t);
  $('btnTheme').innerHTML=`<span class="i">${ic(t==='light'?'moon':'sun')}</span>`;renderAll(true)}
function setAccent(a){document.documentElement.dataset.acccent=a;store.set('accent',a)}
function setLayout(v){S.layout=v;store.set('layout',v);renderAll(true)}

/* ================= GLOBAL EVENTS ================= */
function wireEvents(){
  /* rail */
  on($('rail'),'click',e=>{
    const b=e.target.closest('[data-rail]');if(!b)return;
    const v=b.dataset.rail;
    if(v==='settings')return settingsModal();
    if(v==='about')return aboutModal();
    if(v==='session'){document.getElementById('dock').scrollIntoView({behavior:'smooth'});return flashDock()}
    setView(v);
  });
  /* topbar */
  on($('btnUp'),'click',upLevel);
  on($('btnInsp'),'click',()=>{S.insp=!S.insp;renderInspector();$('btnInsp').classList.toggle('on',S.insp)});
  on($('btnTheme'),'click',()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light'));
  on($('btnCreate'),'click',()=>setView('create'));
  on($('btnImport'),'click',e=>{const r=e.currentTarget.getBoundingClientRect();showCtx(r.left,r.bottom+6,[
    {k:'f',icon:'fileSm',label:'Import files…',fn:()=>$('fileInput').click()},
    {k:'d',icon:'folderSm',label:'Import folder…',fn:()=>$('dirInput').click()},
    '-',{k:'dz',icon:'trayDown',label:'…or drag anything onto this window',fn:()=>toast('ok','Drag & drop ready','Release files anywhere to ingest')},
  ])});
  on($('searchBox'),'click',()=>$('searchInput').focus());
  on($('searchInput'),'input',e=>{S.q=e.target.value;renderViewport();renderCount()});
  on($('searchInput'),'keydown',e=>{if(e.key==='Escape'){e.target.value='';S.q='';renderViewport();e.target.blur()}});
  /* crumbs + mounts (delegated) */
  document.addEventListener('click',e=>{
    const nv=e.target.closest('[data-nav-view]');if(nv){setView(nv.dataset.navView);return}
    const cr=e.target.closest('[data-crumb]');if(cr){const n2=byId(cr.dataset.crumb);if(n2)cdTo(n2);return}
    const rt=e.target.closest('[data-nav="root"]');if(rt){S.path=[];S.sel.clear();renderAll();return}
    const fp=e.target.closest('[data-f]');if(fp){S.filter=fp.dataset.f;renderFpills();renderViewport();renderCount();return}
    const pr=e.target.closest('[data-prim]');if(pr){createPrim(pr.dataset.prim);return}
    const sp=e.target.closest('[data-spawn]');if(sp){createPrim(sp.dataset.spawn);return}
    const ob=e.target.closest('[data-ovbar]');if(ob){S.view='library';S.path=[];S.filter=ob.dataset.ovbar;S.sel.clear();renderAll();return}
    const ar=e.target.closest('[data-act="empty-import"]');if(ar){$('fileInput').click();return}
    const cr2=e.target.closest('[data-act="clear-recents"]');if(cr2){S.recents=[];renderViewport();return}
    const rd=e.target.closest('[data-act="create-random"]');if(rd){createPrim(pick(PRIMS,rng(Date.now()+'')).n);return}
    const rc=e.target.closest('[data-rec]');
    if(rc){const r0=S.recents.find(x=>x.key===rc.dataset.rec);if(r0&&byId(r0.key)){const it=byId(r0.key);
      S.view=it.src==='engine'?'engine':'library';const par=it.kind==='folder'?it:it.parent;
      if(it.kind==='folder'){cdTo(it)}else{S.path=par?pathOf(par).map(x=>x.id):[];S.filter='all';renderAll();requestAnimationFrame(()=>selectOnly(it.id))}}return}
  });
  /* subbar */
  on($('btnNewFolder'),'click',newFolder);
  on($('btnSort'),'click',e=>{
    const r=e.currentTarget.getBoundingClientRect();
    const opt=(k,l)=>S.sortKey===k?l+(S.sortDir===1?' ↑':' ↓'):l;
    showCtx(r.left-40,r.bottom+6,[
      {k:'name',icon:'sortUD',label:opt('name','Name'),fn:()=>setSort('name')},
      {k:'size',icon:'server',label:opt('size','Size'),fn:()=>setSort('size')},
      {k:'type',icon:'tag',label:opt('type','Type'),fn:()=>setSort('type')},
      {k:'mod',icon:'history',label:opt('mod','Modified'),fn:()=>setSort('mod')},
      '-',{k:'dir',icon:'refresh',label:'Reverse direction',fn:()=>{S.sortDir*=-1;renderViewport()}},
    ]);
  });
  function setSort(k){if(S.sortKey===k)S.sortDir*=-1;else{S.sortKey=k;S.sortDir=1}renderViewport()}
  document.querySelectorAll('#viewSeg .seg-btn').forEach(b=>on(b,'click',()=>setLayout(b.dataset.view)));
  on($('zoom'),'input',e=>{S.zoom=+e.target.value;document.documentElement.style.setProperty('--cs',S.zoom+'px');store.set('zoom',S.zoom)});
  /* dock */
  on($('btnDeploy'),'click',deploySession);
  on($('btnClearSession'),'click',clearSession);
  on($('dockRail'),'click',e=>{const x=e.target.closest('[data-sx]');if(x){removeSession(x.dataset.sx)}});
  /* viewport: select / open / actions / context / dnd */
  const vp=$('viewport');
  on(vp,'click',e=>{
    const act=e.target.closest('[data-act]');
    if(act){e.stopPropagation();
      const card=act.closest('.card');const it=card?byId(card.dataset.id):null;if(!it)return;
      if(act.dataset.act==='import')importToSession([it]);
      if(act.dataset.act==='look')quicklook(it);
      if(act.dataset.act==='star')toggleFav(it.id);
      return}
    const card=e.target.closest('.card[data-id]');
    if(card){
      const id=card.dataset.id;
      if(e.shiftKey)rangeSel(id);else if(e.ctrlKey||e.metaKey)toggleSel(id);else selectOnly(id);
      return}
    if(!e.target.closest('.qc')&&!e.target.closest('.ov-bar')&&S.sel.size){S.sel.clear();applySel()}
  });
  on(vp,'dblclick',e=>{
    const card=e.target.closest('.card[data-id]');if(!card)return;
    const it=byId(card.dataset.id);if(!it)return;
    if(it.kind==='folder')cdTo(it);else importToSession([it]);
  });
  on(vp,'contextmenu',e=>{
    const card=e.target.closest('.card[data-id]');
    e.preventDefault();
    if(card){ctxForItem(byId(card.dataset.id),e)}else if(S.view==='library'||S.view==='engine'){ctxBackground(e)}
  });
  on(vp,'dragstart',e=>{
    const card=e.target.closest('.card[data-id]');if(!card)return;
    e.dataTransfer.setData('text/rift-id',card.dataset.id);
    e.dataTransfer.effectAllowed='copy';
  });
  /* bulk bar */
  on($('bulkbar'),'click',e=>{
    const b=e.target.closest('[data-bb]');if(!b)return;
    const items=selItems();
    if(b.dataset.bb==='import'){importToSession(items)}
    if(b.dataset.bb==='star'){items.forEach(i2=>S.favs.add(i2.id));renderAll(true)}
    if(b.dataset.bb==='del'){deleteItems(items)}
    if(b.dataset.bb==='clear'){S.sel.clear();applySel()}
  });
  /* inspector actions (delegated) */
  on($('inspBody'),'click',e=>{
    const b=e.target.closest('[data-ia]');if(!b)return;
    const items=selItems();const it=items[0];const a=b.dataset.ia;
    if(a==='import'&&it)importToSession([it]);
    if(a==='open'&&it)cdTo(it);
    if(a==='look'&&it)quicklook(it);
    if(a==='star'&&it)toggleFav(it.id);
    if(a==='rename'&&it)startRename(it);
    if(a==='addtag'&&it)addTagInline(it);
    if(a==='import-multi')importToSession(items);
    if(a==='star-multi'){items.forEach(i2=>S.favs.add(i2.id));renderAll(true)}
    if(a==='del-multi')deleteItems(items);
  });
  /* disk inputs */
  on($('fileInput'),'change',e=>{ingestFiles(e.target.files);e.target.value=''});
  on($('dirInput'),'change',e=>{ingestFiles(e.target.files);e.target.value=''});
  /* window drag & drop */
  let dragDepth=0;
  window.addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dragDepth++;$('dz').classList.add('on')}});
  window.addEventListener('dragleave',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dragDepth=Math.max(0,--dragDepth);if(!dragDepth)closeDZ()}});
  window.addEventListener('dragover',e=>{
    const types=e.dataTransfer?[...e.dataTransfer.types]:[];
    const hasFiles=types.includes('Files'),hasRift=types.includes('text/rift-id');
    if(hasFiles)e.preventDefault();
    const overDock=e.target&&e.target.closest&&e.target.closest('#dock');
    if(hasRift&&overDock)e.preventDefault();
    $('dock').classList.toggle('dropover',!!overDock);
  });
  window.addEventListener('drop',e=>{
    e.preventDefault();dragDepth=0;closeDZ();
    const files=e.dataTransfer&&e.dataTransfer.files;
    const riftId=e.dataTransfer&&e.dataTransfer.getData('text/rift-id');
    const overDock=e.target.closest&&e.target.closest('#dock');
    if(riftId){const it=byId(riftId);if(it&&it.kind==='file')importToSession([it]);return}
    if(files&&files.length){overDock?ingestFiles(files,'session'):ingestFiles(files,'folder')}
  });
  /* esc & global keys */
  window.addEventListener('keydown',onKey);
  document.addEventListener('pointerdown',e=>{const c=$('ctx');if(c.classList.contains('on')&&!e.target.closest('#ctx'))c.classList.remove('on')});
}
function closeDZ(){$('dz').classList.remove('on');$('dock').classList.remove('dropover')}
function flashDock(){const d=$('dock');d.classList.add('dropover');setTimeout(()=>d.classList.remove('dropover'),700)}
function toggleFav(id){
  S.favs.has(id)?S.favs.delete(id):S.favs.add(id);
  document.querySelectorAll(`.card[data-id="${id}"] .star`).forEach(s=>{
    const onNow=S.favs.has(id);s.classList.toggle('on',onNow);s.innerHTML=`<span class="i">${ic(onNow?'starF':'star')}</span>`});
  renderInspector();
}
function addTagInline(it){
  const row=$('inspBody').querySelector('.tags');if(!row)return;
  const btn=row.querySelector('[data-ia="addtag"]');
  const inp=document.createElement('input');inp.className='tag';inp.style.cssText='background:var(--bg3);outline:0;border-color:var(--acc-line);color:var(--tx);width:110px;font:inherit;font-size:10px';
  inp.placeholder='tag name…';
  btn.replaceWith(inp);inp.focus();
  const done=commit=>{
    const v=inp.value.trim().toLowerCase();
    if(commit&&v){it.tags=[...new Set([...it.tags,...it.tags.length?[]:defaultTags(it),v])].slice(0,6);if(!it.tags.length)it.tags=[v]}
    renderInspector();};
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')done(true);if(e.key==='Escape')done(false)});
  inp.addEventListener('blur',()=>done(true));
}
/* ================= KEYBOARD ================= */
function onKey(e){
  const typing=/^(INPUT|TEXTAREA)/.test(e.target.tagName)||e.target.isContentEditable;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();overlay==='palette'?closeOverlays():openPalette();return}
  if(e.key==='Escape'){if(overlay){closeOverlays();return}if(S.sel.size){S.sel.clear();applySel();return}}
  if(overlay==='palette'||typing)return;
  if(overlay)return;
  const browse=S.view==='library'||S.view==='engine';
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='a'&&browse){e.preventDefault();currentItems().forEach(i2=>S.sel.add(i2.id));applySel();return}
  if(e.key==='Backspace'){e.preventDefault();upLevel();return}
  if(e.key==='Delete'&&S.sel.size){deleteItems(selItems());return}
  if(e.key==='F2'&&S.sel.size===1){e.preventDefault();startRename(selItems()[0]);return}
  if(e.key===' '&&S.sel.size===1){e.preventDefault();quicklook(selItems()[0]);return}
  if(e.key==='Enter'&&S.sel.size===1){const it=selItems()[0];it.kind==='folder'?cdTo(it):quicklook(it);return}
  if(e.key==='t'||e.key==='T'){setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');return}
  if(e.key==='i'||e.key==='I'){$('btnInsp').click();return}
  if((e.key==='g'||e.key==='G')&&browse){setLayout('grid');return}
  if((e.key==='l'||e.key==='L')&&browse){setLayout('list');return}
  if(e.key==='N'&&e.shiftKey){newFolder();return}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)&&browse){
    e.preventDefault();gridMove(e.key);return;
  }
}
function gridMove(key){
  const items=currentItems();if(!items.length)return;
  const sel=selItems()[0];
  let idx=sel?items.findIndex(i2=>i2.id===sel.id):-1;
  const zone=document.querySelector('[data-zone]');
  let cols=1;
  if(zone&&S.layout==='grid')cols=Math.max(1,getComputedStyle(zone).gridTemplateColumns.split(' ').length);
  if(S.layout==='list')cols=1;
  let foldersN=items.filter(i2=>i2.kind==='folder').length;
  if(idx<0){idx=0}else{
    if(key==='ArrowRight')idx=Math.min(items.length-1,idx+1);
    if(key==='ArrowLeft')idx=Math.max(0,idx-1);
    if(key==='ArrowDown')idx=Math.min(items.length-1,idx+cols);
    if(key==='ArrowUp')idx=Math.max(0,idx-cols);
  }
  selectOnly(items[idx].id);
  const el=document.querySelector(`.card[data-id="${items[idx].id}"]`);
  if(el)el.scrollIntoView({block:'nearest'});
}

/* ================= INIT ================= */
function init(){
  document.documentElement.dataset.theme=store.get('theme','dark');
  document.documentElement.dataset.acccent=store.get('accent','lime');
  document.documentElement.style.setProperty('--cs',S.zoom+'px');
  $('brandMark').innerHTML=logoSVG();
  $('searchIco').innerHTML=ic('search');
  $('btnUp').innerHTML=`<span class="i">${ic('arrowUp')}</span>`;
  $('btnInsp').innerHTML=`<span class="i">${ic('panelR')}</span>`;
  $('btnInsp').classList.add('on');
  $('btnImport').innerHTML=`<span class="i">${ic('trayDown')}</span>Import`;
  $('btnCreate').innerHTML=`<span class="i">${ic('plus')}</span>Create`;
  $('btnTheme').innerHTML=`<span class="i">${ic(document.documentElement.dataset.theme==='light'?'moon':'sun')}</span>`;
  $('btnNewFolder').innerHTML=`<span class="i">${ic('folderPlus')}</span>`;
  $('btnSort').innerHTML=`<span class="i">${ic('sortUD')}</span>`;
  document.querySelector('#viewSeg [data-view="grid"]').innerHTML=`<span class="i">${ic('grid')}</span>`;
  document.querySelector('#viewSeg [data-view="list"]').innerHTML=`<span class="i">${ic('list')}</span>`;
  $('zoomIco').innerHTML=ic('search');$('zoom').value=S.zoom;
  $('dockIco').innerHTML=ic('bolt');
  $('palIco').innerHTML=ic('cmd');
  $('dzIco').innerHTML=ic('trayDown');
  $('btnClearSession').innerHTML=`<span class="i">${ic('trash')}</span>Clear`;
  $('btnDeploy').innerHTML=`<span class="i">${ic('bolt')}</span>Deploy`;
  wireEvents();
  renderAll();
  setTimeout(()=>toast('ok','RIFT Asset Deck ready','Press ⌘K to command · double-click any asset to stream it live'),450);
}
init();
</script>
