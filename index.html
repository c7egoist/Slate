<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLATE — Procedural Architecture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="grain"></div>

    <header class="topbar">
      <div class="brand">
        <div class="mark">SLATE</div>
        <div class="sub">Procedural Architecture Studio</div>
      </div>
      <div class="top-actions">
        <label class="seed-field">
          <span>Seed</span>
          <input id="seed" type="text" spellcheck="false" maxlength="12" />
          <button id="seedRand" class="icon-btn" title="New seed" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M5 8h9a4 4 0 0 1 0 8H9" />
              <path d="M5 8l3-3M5 8l3 3" />
              <path d="M19 16H10a4 4 0 0 1 0-8h5" />
              <path d="M19 16l-3 3M19 16l-3-3" />
            </svg>
          </button>
        </label>
        <button id="shot" class="icon-btn" title="Screenshot" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M4 8h3l1.5-2h7L17 8h3v11H4V8z" />
            <circle cx="12" cy="13.5" r="3.2" />
          </svg>
        </button>
      </div>
    </header>

    <aside class="panel">
      <section>
        <div class="sec-label">Typology</div>
        <div id="styles" class="style-list"></div>
      </section>

      <section>
        <div class="sec-label">Massing</div>
        <label class="slider">
          <div class="slider-head"><span>Storeys</span><b id="floorsVal">3</b></div>
          <input id="floors" type="range" min="1" max="8" step="1" value="3" />
        </label>
        <label class="slider">
          <div class="slider-head"><span>Front bays</span><b id="baysXVal">5</b></div>
          <input id="baysX" type="range" min="3" max="7" step="1" value="5" />
        </label>
        <label class="slider">
          <div class="slider-head"><span>Depth bays</span><b id="baysZVal">3</b></div>
          <input id="baysZ" type="range" min="2" max="5" step="1" value="3" />
        </label>
      </section>

      <section>
        <div class="sec-label">Openings</div>
        <label class="slider">
          <div class="slider-head"><span>Window height</span><b id="winHVal">1.00</b></div>
          <input id="winH" type="range" min="0.7" max="1.3" step="0.05" value="1" />
        </label>
        <label class="slider">
          <div class="slider-head"><span>Muntin density</span><b id="muntinVal">2</b></div>
          <input id="muntins" type="range" min="1" max="4" step="1" value="2" />
        </label>
      </section>

      <section>
        <div class="sec-label">Orders &amp; elements</div>
        <label class="check">
          <input id="columns" type="checkbox" checked />
          <span>Columns / portico</span>
        </label>
        <label class="select">
          <span>Column order</span>
          <select id="order">
            <option value="style">Style default</option>
            <option value="tuscan">Tuscan</option>
            <option value="doric">Doric</option>
            <option value="ionic">Ionic</option>
            <option value="corinthian">Corinthian</option>
            <option value="square">Square pier</option>
          </select>
        </label>
        <label class="check">
          <input id="balconies" type="checkbox" checked />
          <span>Balconies</span>
        </label>
        <label class="check">
          <input id="dormers" type="checkbox" checked />
          <span>Dormers / chimneys</span>
        </label>
        <label class="select">
          <span>Roof</span>
          <select id="roof">
            <option value="style">Style default</option>
            <option value="hip">Hip</option>
            <option value="gable">Gable</option>
            <option value="mansard">Mansard</option>
            <option value="flat">Flat / parapet</option>
          </select>
        </label>
      </section>

      <section>
        <div class="sec-label">Light</div>
        <label class="slider">
          <div class="slider-head"><span>Time of day</span><b id="timeVal">Afternoon</b></div>
          <input id="time" type="range" min="0" max="100" step="1" value="32" />
        </label>
        <label class="check">
          <input id="autorotate" type="checkbox" />
          <span>Auto-orbit</span>
        </label>
      </section>

      <div class="panel-actions">
        <button id="randomize" type="button" class="primary">Randomize design</button>
      </div>
    </aside>

    <footer class="specs">
      <div id="specSheet" class="spec-sheet"></div>
      <div class="hint">Drag to orbit · Scroll to dolly · Right-drag to pan</div>
    </footer>

    <div id="styleCaption" class="caption"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
