# Slate — the standing appearance.
# Written by the Control Centre. Edit freely; every colour is #RRGGBB or #RRGGBBAA.
# A key removed here falls back to the appearance compiled into the build.

[selection]
theme       = "oled"
primary     = "blue"
secondary   = "violet"
information = "cyan"
warning     = "amber"
alert       = "rose"

[theme.oled]
caption               = "OLED"
ground                = "#000000"
panel                 = "#09090BF2"
primary               = "#F4F4F5"
secondary             = "#71717A"
edge                  = "#27272ACC"
card                  = "#121214"
previewground         = "#000000"
previewwindow         = "#121214"
previewsidebar        = "#09090B"
previewsidebarquiet   = "#151517"
previewsidebarstrong  = "#222223"
previewquiet          = "#1E1E20"
previewstrong         = "#2A2A2C"

